version: 2
updates:
  - package-ecosystem: pip
    directory: /services
    schedule:
      interval: weekly
      day: monday
    # Wait 7 days after a release before proposing it — lets freshly-published
    # (possibly compromised or broken) versions be caught/yanked upstream first.
    cooldown:
      default-days: 7
    labels: [dependencies, python]
    commit-message:
      prefix: "deps(python):"
    ignore:
      # fastapi 0.137 pulls starlette 1.x (major) — it refactors
      # include_router (the new _IncludedRouter matcher) and shifts
      # several Starlette behaviours. Hold until a dedicated migration
      # PR with a full smoke pass; revisit then.
      - dependency-name: fastapi
        versions: [">=0.137"]
      # starlette is the other half of that same hold. pyproject caps it
      # `<1.4.0` deliberately: fastapi declares only a FLOOR for it, so our cap
      # is the only thing stopping starlette floating to latest on every build.
      # Dependabot's proposal was to WIDEN the cap to `<1.7.0` — which is not
      # "take starlette 1.4", it is "allow anything below 1.7", i.e. precisely
      # the drift the pin exists to prevent (#1355, closed unmerged).
      #
      # Version-scoped rather than a blanket ignore so 1.3.x patches — security
      # fixes inside our supported range — still come through.
      #
      # Worth knowing: tests/test_dependency_pins.py only asserts that SOME
      # upper bound exists, so a widened cap passes CI. Review was the only
      # gate that caught this, hence holding it here instead.
      #
      # Lift together with the fastapi hold above, as one migration.
      - dependency-name: starlette
        versions: [">=1.4"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    # Wait 7 days after a release before proposing it — lets freshly-published
    # (possibly compromised or broken) versions be caught/yanked upstream first.
    cooldown:
      default-days: 7
    labels: [dependencies, web]
    commit-message:
      prefix: "deps(web):"
    ignore:
      # eslint-plugin-react (via eslint-config-next) doesn't support ESLint 10 yet
      - dependency-name: eslint
        versions: [">=10"]
      # The @zxcvbn-ts v4 line ships compressed dictionaries and must move
      # as a SET (core + language-common + dictionary-compression) with
      # code changes in admin/users; core is pinned at ^3.0.4. Ignore the
      # whole scope at v4 — a per-package ignore just lets dependabot
      # propose the other halves separately (it split this into
      # language-common and core PRs). Lift when doing the coordinated v4 upgrade.
      - dependency-name: "@zxcvbn-ts/*"
        versions: [">=4"]
      # TypeScript 7 (the native/Go compiler rewrite) breaks `next build`
      # under Next.js 16 — `tsc --noEmit` passes but the Next build worker
      # crashes ("The 'id' argument must be of type string", exit 1). Verified
      # on a spike; see #816. Hold the major until Next.js supports the TS 7
      # toolchain; lift then.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    # Wait 7 days after a release before proposing it — lets freshly-published
    # (possibly compromised or broken) versions be caught/yanked upstream first.
    cooldown:
      default-days: 7
    labels: [dependencies, docker]
    commit-message:
      prefix: "deps(docker):"
    ignore:
      - dependency-name: node
        versions: ["23.x", "25.x", "27.x", "29.x", "31.x"]
      # Python 3.14+ — pinned at 3.13 deliberately (v0.32.0 downgrade
      # cleared CVEs and several runtime deps aren't 3.14-ready). Until
      # the ecosystem catches up we don't want dependabot re-suggesting
      # the bump every week.
      - dependency-name: python
        versions: ["3.14.x", "3.15.x"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait 7 days after a release before proposing it — lets freshly-published
    # (possibly compromised or broken) versions be caught/yanked upstream first.
    cooldown:
      default-days: 7
    labels: [dependencies, ci]
    commit-message:
      prefix: "deps(ci):"

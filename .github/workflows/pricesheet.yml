name: Pricesheet

# Weekly regeneration of the self-generated cost pricesheet (#893, #1025) from the
# official cloud pricing APIs, published to a rolling GitHub Release. Runs ONLY
# on a schedule (or manual dispatch) — never on PRs — because it fetches live
# pricing data and publishes an artifact.
#
# MULTI-REGION via fan-out (#1025). The sheet covers EVERY region. Doing that on
# one runner is disk-/bandwidth-bound (the AmazonEC2 offer is ≈458 MB per
# region), so the work is sharded: one job per AWS region + an AWS-global shard
# (Route53/CloudFront) + one Azure shard (all regions in one paginated pass) +
# one GCP shard (its catalog is already all-region). Each shard fetches only its
# slice at flat RAM/disk and emits a PARTIAL sheet; the `merge` job combines the
# partials into the published `prices.yaml.gz`. The drift guardrail (#922) then
# diffs this run's manifest against the last published one and REFUSES to publish
# a collapsed sheet, opening an issue instead.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write # publish the rolling release
  issues: write # open/refresh the drift issue

env:
  RELEASE_TAG: pricesheet
  DRIFT_TITLE: "pricegen: pricesheet drift detected"

jobs:
  # Build the shard matrix: one shard per AWS region (discovered live from the
  # AmazonEC2 region index, so it's literally every region AWS offers, self-
  # updating) + fixed AWS-global / Azure / GCP shards. Each shard is {name, args}
  # where args are the pricegen.shard CLI flags fetch_offers + publish both read.
  shards:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - id: build
        name: Discover AWS regions + assemble the shard matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, urllib.request
          BULK = "https://pricing.us-east-1.amazonaws.com"
          # region_index.json is the small (~19 KB) index — region -> offer URL,
          # NOT the ~458 MB offer itself. We only read it to enumerate region
          # names for the matrix; the big offer is fetched (stream-filtered) only
          # inside each region shard.
          req = urllib.request.Request(
              f"{BULK}/offers/v1.0/aws/AmazonEC2/current/region_index.json",
              headers={"User-Agent": "terrapod-pricegen/0.1"},
          )
          with urllib.request.urlopen(req) as r:  # noqa: S310 trusted host
              index = json.load(r)["regions"]
          # The index also lists Local Zones / Wavelength zones as pseudo-regions
          # (us-east-1-atl-1, eu-west-2-wl1-lon1, ...). A Terraform resource's
          # `region` attribute is always a standard region (Local Zones are picked
          # via AZ/subnet, not the provider region), so a row keyed on a local
          # zone would never resolve — keep only canonical regions (incl GovCloud).
          std = re.compile(r"^[a-z]{2}(-gov)?-[a-z]+-\d+$")
          regions = sorted(r for r in index if std.match(r))
          shards = [
              {"name": f"aws-{reg}", "args": f"--only aws --region {reg}"}
              for reg in regions
          ]
          shards += [
              {"name": "aws-global", "args": "--only aws --global-only"},
              {"name": "azure", "args": "--only azure --all-regions"},
              # --all-regions so the computed compute recipe enumerates EVERY
              # region its units serve, not the recipes.yaml curated set.
              {"name": "gcp", "args": "--only gcp --all-regions"},
          ]
          print(f"matrix={json.dumps({'include': shards})}")
          print(f"{len(shards)} shards ({len(regions)} AWS regions + 3)", file=__import__('sys').stderr)
          PY

  # Fan out: each shard fetches only its slice and emits a partial sheet + manifest.
  generate:
    needs: shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one region hiccuping must not sink the rest of the sheet
      max-parallel: 10 # be a good citizen to the pricing endpoints
      matrix: ${{ fromJSON(needs.shards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install pyyaml ijson # ijson stream-filters the large AmazonEC2 offer
      - name: Fetch this shard's offers
        env:
          GCP_BILLING_API_KEY: ${{ secrets.GCP_BILLING_API_KEY }}
        run: python -m pricegen.fetch_offers ${{ matrix.args }}
      - name: Generate this shard's partial sheet + manifest
        run: |
          python -m pricegen.publish ${{ matrix.args }} \
            --out "partial-${{ matrix.name }}.prices.yaml.gz" \
            --manifest "partial-${{ matrix.name }}.manifest.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: partial-${{ matrix.name }}
          path: |
            partial-${{ matrix.name }}.prices.yaml.gz
            partial-${{ matrix.name }}.manifest.json
          retention-days: 3

  # Merge every partial into the published sheet, run the drift guardrail, publish.
  publish:
    needs: [shards, generate]
    # Publish whatever regions succeeded — a single failed region shouldn't block
    # the weekly sheet (the drift guardrail still catches a genuinely collapsed
    # sheet). Requires at least the matrix to have been built.
    if: ${{ always() && needs.shards.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install pyyaml

      - name: Download all shard partials
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: partial-*
          path: partials
          merge-multiple: true

      - name: Merge partials → published sheet + aggregated manifest
        run: |
          python -m pricegen.merge \
            --sheets 'partials/*.prices.yaml.gz' \
            --manifests 'partials/*.manifest.json' \
            --out prices.yaml.gz --manifest manifest.json

      - name: Download the last published manifest (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p prev
          if gh release download "$RELEASE_TAG" --pattern manifest.json --dir prev 2>/dev/null; then
            echo "have_prev=true" >> "$GITHUB_ENV"
          else
            echo "have_prev=false" >> "$GITHUB_ENV"
            echo "No previous release — first publish, skipping drift check."
          fi

      - name: Drift guardrail
        id: drift
        if: env.have_prev == 'true'
        run: |
          set +e
          python -m pricegen.drift --prev prev/manifest.json --curr manifest.json \
            --issue-body drift-body.md
          echo "blocked=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Open/refresh drift issue and fail (blocking drift)
        if: steps.drift.outputs.blocked == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --state open --search "$DRIFT_TITLE in:title" \
            --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file drift-body.md
            echo "Refreshed drift issue #$existing"
          else
            gh issue create --title "$DRIFT_TITLE" --body-file drift-body.md
          fi
          echo "::error::Pricesheet drift is blocking — the collapsed sheet was NOT published."
          exit 1

      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Terrapod cost pricesheet (rolling)" \
              --notes "Auto-generated weekly from official cloud pricing APIs (#893), multi-region (#1025). The \`prices.yaml.gz\` asset is a stable URL for \`cost_estimation.prices_url\`; \`manifest.json\` is the drift manifest." \
              --latest=false
          fi
          gh release upload "$RELEASE_TAG" prices.yaml.gz manifest.json --clobber
          echo "Published $(du -h prices.yaml.gz | cut -f1) pricesheet to the '$RELEASE_TAG' release."

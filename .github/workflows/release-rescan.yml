name: Release Re-scan

# Re-scans the releases we still support against *current* advisory data and
# *current* rules, and raises an issue when something actionable appears (#1212).
#
# The release-time gate in ci.yml uses `ignore-unfixed`, so a vulnerability
# becomes visible to it only once upstream publishes a fix. A released image is
# immutable and nothing re-checks it, so without this the first we hear about a
# newly-fixable CVE in a shipped release is when an operator scans it and opens
# an issue — which is exactly how #1206 reached us.
#
# It also makes an existing promise operable: SECURITY.md offers "security fixes
# only" for the previous minor, and until now nothing told us a fix was needed.
#
# Two scan families:
#   artifacts — Trivy against the published images, per architecture
#   source    — pip-audit, npm audit and Semgrep against the source at the tag
#
# Both apply TODAY'S suppressions and TODAY'S rules deliberately. The current
# accepted-risk register is the reasoning we stand behind now: an entry we have
# since dropped must not go on suppressing a finding in a version we still
# support, and a rule we have since added is the entire point of re-scanning.
#
# This is a reporter, not a gate. It does not fail on findings — the release-time
# `scan-images` job is the gate, and a permanently red scheduled job is the same
# failure mode as a noisy one: muted, then ignored when it matters.

on:
  schedule:
    # Wednesdays, offset from pricesheet.yml (Mondays 06:17) so two scheduled
    # jobs are not competing for runners or attention on the same morning.
    - cron: "23 5 * * 3"
  workflow_dispatch:
    inputs:
      tags:
        description: "Comma-separated tags to scan (blank = latest patch of the supported minors)"
        required: false
        default: ""
      minors:
        description: "How many recent minors to cover when tags is blank"
        required: false
        default: "2"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/mattrobinsonsre
  SEMGREP_IMAGE: semgrep/semgrep:1.117

jobs:
  discover:
    name: Discover supported releases
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.pick.outputs.tags }}
      list: ${{ steps.pick.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pick the latest patch of each supported minor
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAGS: ${{ inputs.tags }}
          INPUT_MINORS: ${{ inputs.minors || '2' }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq '.[] | select(.draft == false) | .tag_name' > all-tags.txt || true
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re

          explicit = [t.strip() for t in os.environ.get("INPUT_TAGS", "").split(",") if t.strip()]
          if explicit:
              tags = explicit
          else:
              # Group semver release tags by minor, keep the highest patch in
              # each, then take the N most recent minors. Non-semver tags (the
              # rolling `pricesheet` release) are skipped rather than sorted.
              latest: dict[tuple[int, int], tuple[int, str]] = {}
              for line in open("all-tags.txt"):
                  m = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", line.strip())
                  if not m:
                      continue
                  major, minor, patch = (int(g) for g in m.groups())
                  key = (major, minor)
                  if key not in latest or patch > latest[key][0]:
                      latest[key] = (patch, line.strip())
              n = int(os.environ.get("INPUT_MINORS") or 2)
              ordered = sorted(latest, reverse=True)[:n]
              tags = [latest[k][1] for k in ordered]

          print(f"tags={json.dumps(tags)}")
          print(f"list={' '.join(tags)}")
          PY
          echo "Selected: $(grep '^list=' "$GITHUB_OUTPUT" | tail -1)"

  artifacts:
    name: Scan ${{ matrix.image }} ${{ matrix.tag }} (${{ matrix.arch }})
    needs: discover
    if: needs.discover.outputs.tags != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.discover.outputs.tags) }}
        image: [terrapod-api, terrapod-web, terrapod-runner, terrapod-listener, terrapod-migrations]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}

      - name: Trivy
        continue-on-error: true   # a missing image for an older tag must not sink the run
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # A released tag is a multi-arch manifest; without this Trivy resolves
          # to the runner's own platform and the arm64 leg scans amd64.
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ matrix.tag }}
          format: json
          output: raw.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: pentest/trivy/.trivyignore
          exit-code: '0'          # reporter, not a gate

      - name: Normalise
        run: |
          python3 scripts/rescan_normalise.py trivy raw.json \
            "${{ matrix.tag }}" "image:${{ matrix.image }} (${{ matrix.arch }})" \
            "finding.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rescan-${{ matrix.tag }}-${{ matrix.image }}-${{ matrix.arch }}
          path: finding.json
          retention-days: 7

  source:
    name: Scan source ${{ matrix.tag }}
    needs: discover
    if: needs.discover.outputs.tags != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to upload SARIF. Its absence is why code findings never
      # reached code scanning: the step "succeeded" and warned in its log,
      # because continue-on-error swallowed the failure.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.discover.outputs.tags) }}
    steps:
      # The released source...
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.tag }}
          path: release
      # ...scanned with current rules and current suppressions. Two checkouts
      # rather than one, because "old code, today's opinion of it" is the whole
      # point and conflating them would silently scan old code with old rules.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: current

      # The tag's OWN commit. Passing github.sha (main's HEAD) with a tag ref
      # is a mismatched pair: GitHub accepts the upload, reports success, and
      # discards the analysis. Nothing ever reached code scanning.
      - name: Resolve the tag's commit
        id: tagsha
        run: echo "sha=$(git -C release rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: pip-audit
        continue-on-error: true
        working-directory: release/services
        run: |
          set -uo pipefail
          pip install --quiet poetry poetry-plugin-export pip-audit
          poetry export -f requirements.txt -o requirements.txt --without-hashes
          # Same POSIX form as the ci.yml gate — one shape to reason about,
          # and it does not depend on which shell the runner resolves.
          ignores=""
          while read -r line; do
            line="${line%%#*}"
            line="$(echo "$line" | tr -d '[:space:]')"
            [ -n "$line" ] && ignores="$ignores --ignore-vuln $line"
          done < "$GITHUB_WORKSPACE/current/pentest/pip-audit-ignore.txt"
          # shellcheck disable=SC2086
          pip-audit -r requirements.txt --format json \
            --output "$GITHUB_WORKSPACE/pip.json" $ignores || true

      # No setup-node: the runner's preinstalled Node is sufficient. `npm audit`
      # resolves the lockfile and queries the advisory API — it does not build
      # anything, so pinning a major here would add an action dependency for no
      # behavioural difference.
      - name: npm audit
        continue-on-error: true
        working-directory: release/web
        run: |
          set -uo pipefail
          # --ignore-scripts: we only need the resolved tree, not a working
          # build, and native postinstalls on an older lockfile are a slow way
          # to fail for reasons that have nothing to do with security.
          npm ci --ignore-scripts --no-audit --no-fund > /dev/null 2>&1 || true
          npm audit --audit-level=high --json > "$GITHUB_WORKSPACE/npm.json" || true

      - name: Semgrep
        continue-on-error: true
        run: |
          set -uo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE/release:/src" \
            -v "$GITHUB_WORKSPACE/current/pentest:/rules" \
            -v "$GITHUB_WORKSPACE:/out" \
            "${SEMGREP_IMAGE}" \
            semgrep scan /src \
              --config "p/python" \
              --config "p/owasp-top-ten" \
              --config "p/secrets" \
              --config "/rules/semgrep/.semgrep.yml" \
              --exclude "web/node_modules" \
              --exclude ".next" \
              --exclude "dist" \
              --exclude "alembic/versions" \
              --exclude "reports" \
              --exclude "services/ai_eval" \
              --exclude-rule "python.lang.security.insecure-hash-algorithms-md5.insecure-hash-algorithm-md5" \
              --exclude-rule "python.lang.security.audit.logging.logger-credential-leak.python-logger-credential-disclosure" \
              --exclude-rule "python.flask.security.audit.directly-returned-format-string.directly-returned-format-string" \
              --sarif --output /out/semgrep.sarif || true

      # Code findings go to code scanning, NOT to the report. A Semgrep hit in
      # Terrapod's own source is a potential undisclosed vulnerability in
      # Terrapod, and the report is published as a public issue — auto-posting
      # one there would breach the private-disclosure process SECURITY.md sets
      # out, on a schedule, for a release people are running. Code scanning
      # alerts are visible only to write-access users, which is the correct
      # audience. This is also why Semgrep emits SARIF above and is never
      # uploaded as a workflow artifact: on a public repository, artifacts and
      # job logs are world-readable.
      - name: Upload code findings to code scanning (private)
        id: sarif
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: semgrep.sarif
          category: release-rescan-${{ matrix.tag }}
          ref: refs/tags/${{ matrix.tag }}
          sha: ${{ steps.tagsha.outputs.sha }}

      - name: Normalise
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 current/scripts/rescan_normalise.py pip-audit pip.json \
            "${{ matrix.tag }}" "source:python" "finding-pip.json"
          python3 current/scripts/rescan_normalise.py npm-audit npm.json \
            "${{ matrix.tag }}" "source:frontend" "finding-npm.json" \
            current/pentest/npm-audit-allow.txt
          # Count only — so the public report can say code findings exist and
          # point at code scanning, without publishing what they are.
          python3 current/scripts/rescan_normalise.py semgrep-count semgrep.sarif \
            "${{ matrix.tag }}" "source:semgrep" "codecount.json"

      # A silent upload failure is how this went unnoticed for three runs.
      # continue-on-error stays — one broken scanner must not sink the run —
      # but the outcome is now stated rather than buried in a warning.
      - name: Fail visibly if code findings could not be recorded
        if: always() && steps.sarif.outcome == 'failure'
        run: |
          echo "::error::SARIF upload FAILED for ${{ matrix.tag }}. Code findings" \
               "were found but are NOT in code scanning. The advisory and issue" \
               "will point at a page that does not have them."
          exit 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: rescan-${{ matrix.tag }}-source
          # finding-pip / finding-npm only. Never semgrep.sarif — see above.
          path: |
            finding-pip.json
            finding-npm.json
            codecount.json
          retention-days: 7

  # ── Accepted-risk register review (#1255) ────────────────────────────
  #
  # Different question from everything above, and a different issue. The jobs
  # above ask "is there anything wrong with a release we support"; this one asks
  # "is anything in our accepted-risk register no longer worth accepting".
  #
  # Every entry in the register exists because there was no fix to take, and the
  # release gate agrees by construction: it runs `ignore-unfixed` alongside the
  # register. So re-running each scanner with the register DISABLED and fix-only
  # KEPT reports exactly the entries upstream has since fixed. No advisory API,
  # no version arithmetic of our own.
  #
  # It targets `main` rather than the released tags above: the register lives on
  # main, and what we act on is a bump there.
  register-scan:
    name: Scan ${{ matrix.image }} without the register
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # amd64 only, deliberately. A suppression is per-package and the
        # register has never carried an arch-specific entry, so scanning both
        # would double the work to re-confirm the same package list.
        image: [terrapod-api, terrapod-web, terrapod-runner, terrapod-listener, terrapod-migrations]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}

      - name: Trivy
        continue-on-error: true
        env:
          TRIVY_PLATFORM: linux/amd64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.image }}:latest
          format: json
          output: trivy-${{ matrix.image }}.json
          severity: HIGH,CRITICAL
          # Both `trivyignores` and `ignore-unfixed` are deliberately ABSENT,
          # and the second one is the correction from #1257.
          #
          # Carrying `ignore-unfixed` over from the gate looked right — the gate
          # only reports fixable findings, so surely the review should too. It
          # is exactly wrong. An entry is in the register BECAUSE it is unfixed,
          # so fix-only scanning renders every legitimate entry invisible, and
          # the review then reports it as matching nothing — telling you to
          # delete a live suppression.
          #
          # Scanning everything gives both signals from one pass, the way
          # pip-audit already worked: present with a `FixedVersion` means take
          # the fix, present without one means the entry is still doing its
          # job, and absent means genuinely stale.
          exit-code: '0'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: register-${{ matrix.image }}
          path: trivy-${{ matrix.image }}.json
          retention-days: 7

  register:
    name: Review the accepted-risk register
    needs: register-scan
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: scans
          pattern: register-*

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # No --ignore-vuln, and `-r requirements.txt` rather than the ambient
      # environment: the gate audits what we ship, and auditing the runner's own
      # toolchain would report dev-only packages as accepted risks of ours.
      - name: pip-audit without the register
        continue-on-error: true
        working-directory: services
        run: |
          set -uo pipefail
          pip install --quiet poetry poetry-plugin-export pip-audit
          poetry export -f requirements.txt -o requirements.txt --without-hashes
          pip-audit -r requirements.txt --format json \
            --output "$GITHUB_WORKSPACE/scans/pip-audit.json" || true

      - name: npm audit without the allowlist
        continue-on-error: true
        working-directory: web
        run: |
          set -uo pipefail
          npm ci --ignore-scripts --no-audit --no-fund > /dev/null 2>&1 || true
          npm audit --audit-level=high --json > "$GITHUB_WORKSPACE/scans/npm-audit.json" || true

      - name: Compare against the register
        id: review
        run: python3 scripts/register_review.py scans body.md >> "$GITHUB_OUTPUT"

      # Unlike the report job below, this issue carries full detail. Every id in
      # it is already committed in the register files, whose headers say the
      # reasoning is written to be read from outside the project — so listing
      # them discloses nothing, and the detail is the actionable part.
      - name: Open or refresh the register issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Security: accepted risks that can now be resolved"
          HAS_FINDINGS: ${{ steps.review.outputs.has_findings }}
          FINGERPRINT: ${{ steps.review.outputs.fingerprint }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,body --jq '.[0] // empty')

          if [ "$HAS_FINDINGS" != "true" ]; then
            # An empty register review is the goal, not an event. Any open issue
            # is left alone: someone may be mid-bump on it, and a list that
            # empties because a scan leg was skipped must not read as "done".
            echo "Register is clean. Nothing to raise."
            exit 0
          fi

          if [ -n "$existing" ]; then
            number=$(echo "$existing" | jq -r '.number')
            # Refresh the body every run; comment only when the set changed.
            # Two decisions — conflating them leaves stale content on the issue.
            gh issue edit "$number" --body-file body.md
            if echo "$existing" | jq -r '.body' | grep -q "terrapod-register-review:$FINGERPRINT"; then
              echo "Issue #$number refreshed; entry set unchanged, not re-notifying."
            else
              gh issue comment "$number" --body \
                "The register review changed: an accepted risk became resolvable, or an entry stopped matching."
              echo "Refreshed issue #$number and notified"
            fi
          else
            gh issue create --title "$TITLE" --body-file body.md --label security 2>/dev/null \
              || gh issue create --title "$TITLE" --body-file body.md
          fi

  report:
    name: Report
    needs: [discover, artifacts, source]
    if: always() && needs.discover.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      # Read the triage state of the code findings uploaded above. Counting
      # raw SARIF results instead meant a DISMISSED alert kept re-raising the
      # issue forever, with nothing a maintainer could do to discharge it
      # (#1375).
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: findings
          pattern: rescan-*

      # Replace each release's SARIF-derived code count with the number of
      # alerts still OPEN for that tag. Dismissal is how a code finding is
      # accepted -- the counterpart of .trivyignore for dependencies -- so it
      # has to be what the report reads.
      #
      # Fails CLOSED: on any API error the SARIF count is left in place, so a
      # broken query produces a spurious issue rather than a silent miss.
      - name: Count open code-scanning alerts per release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ needs.discover.outputs.tags }}
        run: python3 scripts/rescan_open_alerts.py findings "$TAGS"

      # Findings go into a DRAFT advisory per release — private to
      # maintainers. Never published: publishing is irreversible and would make
      # an unfixed vulnerability public, so it stays a human act at patch time.
      - name: Record findings in draft advisories
        env:
          ADVISORY_TOKEN: ${{ secrets.SECURITY_ADVISORY_AUTH }}
        run: python3 scripts/rescan_advisory.py findings advisory-urls.json

      - name: Build the public notification
        id: build
        run: |
          python3 scripts/rescan_report.py findings body.md advisory-urls.json \
            >> "$GITHUB_OUTPUT"

      - name: Open or refresh the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Security: findings in supported releases"
          HAS_FINDINGS: ${{ steps.build.outputs.has_findings }}
          FINGERPRINT: ${{ steps.build.outputs.fingerprint }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,body --jq '.[0] // empty')

          if [ "$HAS_FINDINGS" != "true" ]; then
            # Nothing actionable. Leave any open issue alone rather than
            # auto-closing it: a human may still be mid-patch-release on it, and
            # a findings list that empties because a scan leg was skipped should
            # not read as "resolved".
            echo "No findings. Nothing to raise."
            exit 0
          fi

          if [ -n "$existing" ]; then
            number=$(echo "$existing" | jq -r '.number')
            # Always refresh the body; only COMMENT when the set changed. These
            # are two decisions, and gating both on the fingerprint once left
            # the issue showing stale content after the tooling improved.
            gh issue edit "$number" --body-file body.md
            if echo "$existing" | jq -r '.body' | grep -q "terrapod-release-rescan:$FINGERPRINT"; then
              echo "Issue #$number refreshed; finding set unchanged, not re-notifying."
            else
              gh issue comment "$number" --body \
                "The finding set changed on the latest re-scan. Details are in the draft advisories."
              echo "Refreshed issue #$number and notified"
            fi
          else
            gh issue create --title "$TITLE" --body-file body.md --label security 2>/dev/null \
              || gh issue create --title "$TITLE" --body-file body.md
          fi

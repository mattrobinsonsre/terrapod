            echo "FAIL: a join token rendered as a literal value instead of a secretKeyRef (#1411)"; exit 1
          fi
          echo "Multi-pool bootstrap renders with tokens by secretKeyRef OK"

      - name: (helm-smoke) Capability flags render, including false (#1986)
        run: |
          # There is no engine on/off switch any more (#1986) — these per-capability
          # flags are what survived, and they are the half that was load-bearing: the
          # OCI registry originally shipped a flag NOTHING read, so `enabled: false`
          # stopped two scheduled tasks while /v2/ went on serving push, pull and
          # mirror. A missing render line reinstates exactly that.
          out=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
              --namespace terrapod \
              --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
              --set redis.url=redis://redis:6379)
          echo "$out" | grep -q "oci:" || { echo "FAIL: registry.oci did not render into config.yaml (#1986)"; exit 1; }
          echo "$out" | grep -q "package_cache:" || { echo "FAIL: registry.package_cache did not render into config.yaml (#1986)"; exit 1; }
          # `false` is the whole point of these keys, and Helm's `with` treats it as
          # empty — a template using it drops the key silently, the code default
          # (true) wins, and a capability an operator switched off still serves.
          off=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
              --namespace terrapod \
              --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
              --set redis.url=redis://redis:6379 \
              --set api.config.registry.oci.enabled=false \
              --set api.config.registry.package_cache.pypi.enabled=false \
              --set api.config.registry.package_cache.npm.enabled=false \
              --set api.config.registry.package_cache.galaxy.enabled=false \
              --set api.config.registry.package_cache.pulumi.enabled=false \
              --set api.config.registry.package_cache.go.enabled=false \
              --set api.config.registry.package_cache.nuget.enabled=false)
          # Counted, not grepped one at a time: `enabled: false` occurs elsewhere in
          # the document, so the count within the registry block is what proves all
          # seven arrived. None of the seven is false by default, so the delta is
          # unambiguous and a single dropped flag fails this.
          got=$(echo "$off" | sed -n '/^    registry:/,/^      provider_cache:/p' | grep -c "enabled: false")
          [ "$got" = "7" ] || { echo "FAIL: $got of 7 capability flags rendered as false — a flag Helm dropped silently means the capability still serves (#1986)"; echo "$off" | sed -n '/^    registry:/,/^      provider_cache:/p'; exit 1; }
          echo "Capability flags render OK, including false"


      - name: (helm-smoke) OCI garbage collection renders into config.yaml (#1419)
        run: |
          out=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
              --namespace terrapod \
              --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
              --set redis.url=redis://redis:6379 \
              --set api.config.registry.oci.gc.grace_hours=48)
          echo "$out" | grep -q "grace_hours: 48" || { echo "FAIL: registry.oci.gc.grace_hours not rendered — the collector would use the code default and could sweep a push in flight in an environment with slower pushes (#1419)"; exit 1; }
          # Nothing expires by age, so there is no retention key to assert. What
          # must hold is the opposite: a mirrored image is NOT expired on a
          # schedule, because it is the copy that keeps this cache answering when
          # upstream is unreachable (#1419).
          if echo "$out" | grep -q "oci_mirror_retention_days"; then
            echo "FAIL: a scheduled mirror-expiry key is back. Deleting a cached image on a timer cannot make it fresher and discards the fallback needed when upstream is down (#1419)"; exit 1
          fi
          echo "OCI GC config renders OK"

      - name: (helm-smoke) The cached-image staleness threshold is operator-settable (#1425)
        run: |
          out=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
              --namespace terrapod \
              --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
              --set redis.url=redis://redis:6379 \
              --set api.config.registry.oci.mirror_tag_ttl_hours=24)
          echo "$out" | grep -q "mirror_tag_ttl_hours: 24" || { echo "FAIL: registry.oci.mirror_tag_ttl_hours not rendered — an operator lowering the staleness window for a fast-moving tag would be silently ignored and the code default would win (#1425)"; exit 1; }
          # 0 means "never re-check", and Helm's `with` treats 0 as empty — so a
          # template using it drops the key and the code default wins, turning
          # "never expire" into "expire daily". Asserted because it is silent.
          zero=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
              --namespace terrapod \
              --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
              --set redis.url=redis://redis:6379 \
              --set api.config.registry.oci.mirror_tag_ttl_hours=0)
          echo "$zero" | grep -q "mirror_tag_ttl_hours: 0" || { echo "FAIL: mirror_tag_ttl_hours=0 did not render — 'never re-check' would silently become the code default (#1425)"; exit 1; }
          echo "Cached-image staleness threshold renders OK, including 0"

      - name: (helm-smoke) Local dev values render
        run: |
          out=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
              --values helm/terrapod/values.yaml \
              --values helm/terrapod/values-local.yaml)
          # Slack config-channel: non-secret settings render into config.yaml,
          # secret tokens arrive via secretKeyRef env (never the ConfigMap).
          echo "$out" | grep -q "socket_mode: true" || { echo "FAIL: slack config not rendered into config.yaml"; exit 1; }
          echo "$out" | grep -q 'command: "/terrapod"' || { echo "FAIL: slack command not rendered into config.yaml (#691)"; exit 1; }
          echo "$out" | grep -q 'label: ""' || { echo "FAIL: slack label not rendered into config.yaml (#691)"; exit 1; }
          echo "$out" | grep -q "TERRAPOD_SLACK__BOT_TOKEN" || { echo "FAIL: slack bot-token secretKeyRef env missing"; exit 1; }
          # Cost estimation (#871): non-secret config renders into config.yaml.
          echo "$out" | grep -q "cost_estimation:" || { echo "FAIL: cost_estimation config not rendered into config.yaml (#871)"; exit 1; }
          echo "$out" | grep -q "prices_url:" || { echo "FAIL: cost_estimation.prices_url not rendered (#871)"; exit 1; }
          echo "$out" | grep -q "default_region:" || { echo "FAIL: cost_estimation.default_region not rendered (#871)"; exit 1; }
          # SSO callback prefix (#1529): the switch that decides which prefix the
          # IdP-facing callback/ACS URLs are built on. A missing render line leaves
          # it inert — and because those URLs are validated by the IdP against its
          # own allow-list, an operator who set it to false would keep sending the
          # old URL and never learn the value was dropped.
          echo "$out" | grep -q "legacy_callback_url:" || { echo "FAIL: auth.legacy_callback_url not rendered into config.yaml (#1529)"; exit 1; }
          # Post-plan decisions (#1704): the switch whose default flips at 2.0. A
          # missing render line would leave an operator who set it true on the
          # 1.x behaviour, with the CLI never offered an override.
          echo "$out" | grep -q "tfe_post_plan_decisions:" || { echo "FAIL: runs.tfe_post_plan_decisions not rendered into config.yaml (#1704)"; exit 1; }
          # AI policy gate (#1766) reaches config.yaml. Grepping the RENDERED
          # output, not the template: a values key with no render line is
          # silently inert -- the operator sets it, the pod never sees it, and
          # the code default wins with nothing anywhere to say so.
          echo "$out" | grep -q "enforcement_level:" || { echo "FAIL: ai_summary.policy not rendered into config.yaml (#1766)"; exit 1; }
          echo "$out" | grep -q "risk_threshold:" || { echo "FAIL: ai_summary.policy.risk_threshold not rendered into config.yaml (#1766)"; exit 1; }
          # Split webhook Ingress (#1529): its `paths` is an ALLOW-LIST, and
          # run-task callback URLs are generated on the canonical prefix. If the
          # default stops covering both, an operator on the default silently loses
          # either already-registered webhooks or every run-task callback — a 404 at
          # the sender, never in Terrapod's logs.
          hook=$(helm template ./helm/terrapod --set webhookIngress.enabled=true --set webhookIngress.hostname=hooks.example.com)
          echo "$hook" | grep -q "path: /api/v1/vcs-events" || { echo "FAIL: webhookIngress missing canonical vcs-events path (#1529)"; exit 1; }
          echo "$hook" | grep -q "path: /api/v1/task-stage-results" || { echo "FAIL: webhookIngress missing canonical task-stage-results path (#1529)"; exit 1; }
          echo "$hook" | grep -q "path: /api/terrapod/v1/vcs-events" || { echo "FAIL: webhookIngress dropped the deprecated alias path — already-registered webhooks would stop routing (#1529)"; exit 1; }
          # Capability flags (#1986): there is no engine switch, but each optional
          # surface keeps its own flag and those must reach the pod — a flag nothing
          # delivers is the defect the OCI registry shipped with, where
          # `enabled: false` stopped the scheduled tasks and /v2/ served on.
          echo "$out" | grep -q "oci:" || { echo "FAIL: registry.oci not rendered into config.yaml (#1986)"; exit 1; }
          echo "$out" | grep -q "package_cache:" || { echo "FAIL: registry.package_cache not rendered into config.yaml (#1986)"; exit 1; }
          off=$(helm template ./helm/terrapod --set api.config.registry.package_cache.pulumi.enabled=false)
          echo "$off" | sed -n '/        pulumi:/,/        go:/p' | grep -q "enabled: false" || { echo "FAIL: package_cache.pulumi.enabled=false did not render — the proxy would go on serving (#1986)"; exit 1; }
          # The Pulumi CLI is a platform tool, not a baked-in binary (#1523): a
          # Terraform-only deployment should not carry another engine's binary, and
          # a missing render line leaves the version inert with the code default
          # silently winning.
          echo "$out" | grep -q "default_pulumi_version:" || { echo "FAIL: default_pulumi_version not rendered — a Pulumi workspace that pins no version would get none (#1559)"; exit 1; }
          echo "$out" | grep -q "pulumi_version_index_url:" || { echo "FAIL: binary_cache.pulumi_version_index_url not rendered — partial Pulumi versions would not resolve (#1559)"; exit 1; }
          # Platform tools (#1208): opa/trivy/checkov are no longer baked into the
          # images, so these versions are the ONLY thing telling a runner what to
          # fetch. A missing render line leaves the value inert and the code default
          # silently wins — which for the policy gate means a run that cannot be
          # evaluated. Assert the block and every version reaches the ConfigMap.
          echo "$out" | grep -q "platform_tools:" || { echo "FAIL: platform_tools config not rendered into config.yaml (#1208)"; exit 1; }
          echo "$out" | grep -q "opa_version:" || { echo "FAIL: platform_tools.opa_version not rendered — the policy gate would have no binary to fetch (#1208)"; exit 1; }
          echo "$out" | grep -q "trivy_version:" || { echo "FAIL: platform_tools.trivy_version not rendered (#1208)"; exit 1; }
          echo "$out" | grep -q "checkov_version:" || { echo "FAIL: platform_tools.checkov_version not rendered — checkov is the default scan engine (#1208)"; exit 1; }
          # Org-wide module autodiscovery limits (#1620): without the render line
          # an operator's caps are silently inert and the code defaults win.
          echo "$out" | grep -q "module_autodiscovery:" || { echo "FAIL: registry.module_autodiscovery not rendered into config.yaml (#1620)"; exit 1; }
          echo "$out" | grep -q "tree_listings_per_cycle: 50" || { echo "FAIL: module_autodiscovery.tree_listings_per_cycle not rendered (#1620)"; exit 1; }
          echo "$out" | grep -q "enumeration_quota_floor_percent: 5" || { echo "FAIL: module_autodiscovery.enumeration_quota_floor_percent not rendered (#1620)"; exit 1; }
          echo "$out" | grep -q "time_budget_seconds: 60" || { echo "FAIL: module_autodiscovery.time_budget_seconds not rendered (#1620)"; exit 1; }
          # Asserting the defaults only proves the block renders, not that an
          # operator's value survives. Three of these take 0 as a real setting
          # (stop listing trees; never skip on quota), and Go templates treat 0
          # as falsy — so a `| default` on the line silently substituted the
          # chart default and the operator's cap never reached the pod.
          zeros=$(helm template ./helm/terrapod \
            --set api.config.registry.module_autodiscovery.tree_listings_per_cycle=0 \
            --set api.config.registry.module_autodiscovery.tree_quota_floor_percent=0 \
            --set api.config.registry.module_autodiscovery.enumeration_quota_floor_percent=0)
          echo "$zeros" | grep -q "tree_listings_per_cycle: 0" || { echo "FAIL: module_autodiscovery.tree_listings_per_cycle=0 was replaced by the chart default (#1620)"; exit 1; }
          echo "$zeros" | grep -q "tree_quota_floor_percent: 0" || { echo "FAIL: module_autodiscovery.tree_quota_floor_percent=0 was replaced by the chart default (#1620)"; exit 1; }
          echo "$zeros" | grep -q "enumeration_quota_floor_percent: 0" || { echo "FAIL: module_autodiscovery.enumeration_quota_floor_percent=0 was replaced by the chart default (#1620)"; exit 1; }
          # And a non-default non-zero still lands, so the block is not pinned.
          echo "$zeros" | grep -q "max_repositories: 5000" || { echo "FAIL: module_autodiscovery.max_repositories default lost (#1620)"; exit 1; }
          echo "$out" | grep -q "ha:" || { echo "FAIL: ha config not rendered into config.yaml (#960)"; exit 1; }
          echo "$out" | grep -q 'role: "leader"' || { echo "FAIL: ha.role must default to leader — an auto default takes single-node installs inert (#960)"; exit 1; }
          echo "$out" | grep -q "replication:" || { echo "FAIL: ha.replication not rendered into config.yaml (#1110)"; exit 1; }
          echo "$out" | grep -A2 "replication:" | grep -q "enabled: false" || { echo "FAIL: ha.replication.enabled must default to false — replication is meaningless without a peer (#1110)"; exit 1; }
          if echo "$out" | grep -q "client_secret"; then echo "FAIL: the peer client secret must never reach the ConfigMap — it is a credential (#1110)"; exit 1; fi

          # Peering is Helm-seeded and database-persisted (#1169): the inbound
          # client id must reach the ConfigMap (or the reconcile has nothing to
          # act on and the operator's values are silently inert), while its
          # secret must arrive by secretKeyRef like every other credential.
          inbound=$(helm template ./helm/terrapod \
            --set api.config.ha.peer.inbound.client_id=peer-b \
            --set api.config.ha.peer.inbound.name="Node B" \
            --set api.config.ha.peer.inbound.existingSecret=tp-peer)
          echo "$inbound" | grep -q "inbound:" || { echo "FAIL: ha.peer.inbound not rendered into config.yaml (#1169)"; exit 1; }
          echo "$inbound" | grep -q 'client_id: "peer-b"' || { echo "FAIL: ha.peer.inbound.client_id not rendered — the reconcile would have nothing to act on (#1169)"; exit 1; }
          echo "$inbound" | grep -q "TERRAPOD_HA__PEER__INBOUND__CLIENT_SECRET" || { echo "FAIL: the inbound secret must reach the pod by secretKeyRef, or declarative setup is impossible (#1169)"; exit 1; }
          if echo "$inbound" | grep -A6 "inbound:" | grep -q "client_secret"; then echo "FAIL: the inbound secret must never reach the ConfigMap — it is a credential (#1169)"; exit 1; fi
          # OCI registry pull-through (#1408). Upstream credentials are per
          # registry — registries are independent trust domains, so one shared
          # Secret would hand every upstream's credential to whichever the client
          # happens to name. Hosts and username belong in the ConfigMap; the
          # password must only ever arrive by secretKeyRef.
          oci=$(helm template ./helm/terrapod \
            --set api.config.registry.oci.upstreams[0].host=quay.io \
            --set api.config.registry.oci.upstreams[1].host=registry.example.com \
            --set api.config.registry.oci.upstreams[1].username=robot \
            --set api.config.registry.oci.upstreams[1].existingSecret=tp-upstream)
          echo "$oci" | grep -q "oci:" || { echo "FAIL: registry.oci not rendered into config.yaml — the operator's values would be silently inert (#1408)"; exit 1; }
          echo "$oci" | grep -q 'host: "quay.io"' || { echo "FAIL: registry.oci.upstreams not rendered — pull-through is an allow-list, so an unrendered entry means the upstream is unreachable (#1408)"; exit 1; }
          echo "$oci" | grep -q "TERRAPOD_OCI_UPSTREAM_REGISTRY_EXAMPLE_COM_PASSWORD" || { echo "FAIL: the per-upstream password must reach the pod by secretKeyRef, or an authenticated upstream silently falls back to anonymous (#1408)"; exit 1; }
          if echo "$oci" | grep -A12 "^ *oci:" | grep -qi "password"; then echo "FAIL: an upstream password must never reach the ConfigMap — it is a credential (#1408)"; exit 1; fi
          if echo "$oci" | grep -q "TERRAPOD_OCI_UPSTREAM_QUAY_IO_PASSWORD"; then echo "FAIL: an anonymous upstream must not get a password env var (#1408)"; exit 1; fi
          echo "$oci" | grep -q "upload_session_timeout_hours:" || { echo "FAIL: registry.oci.upload_session_timeout_hours not rendered — the abandoned-upload reaper would silently use the code default and an operator's longer window would be ignored (#1408)"; exit 1; }
          echo "$out" | grep -q "package_cache:" || { echo "FAIL: registry.package_cache not rendered into config.yaml — PIP_INDEX_URL/NPM_CONFIG_REGISTRY would point at a proxy running on code defaults, ignoring the operator's upstream (#1417)"; exit 1; }
          echo "$out" | grep -q 'upstream: "https://pypi.org"' || { echo "FAIL: package_cache.pypi.upstream not rendered — an internal-mirror upstream would be silently ignored (#1417)"; exit 1; }
          echo "$out" | grep -q 'upstream: "https://galaxy.ansible.com"' || { echo "FAIL: package_cache.galaxy.upstream not rendered — ansible-galaxy would resolve against the code default, ignoring the operator's internal mirror (#1482)"; exit 1; }
          echo "$out" | grep -q 'upstream: "https://get.pulumi.com/releases/plugins"' || { echo "FAIL: package_cache.pulumi.upstream not rendered — pulumi would resolve plugins against the code default, ignoring the operator's internal mirror (#1483)"; exit 1; }
          echo "$out" | grep -q 'upstream: "https://proxy.golang.org"' || { echo "FAIL: package_cache.go.upstream not rendered — GOPROXY would resolve against the code default, ignoring the operator's internal mirror (#1484)"; exit 1; }
          echo "$out" | grep -q 'upstream: "https://api.nuget.org/v3-flatcontainer"' || { echo "FAIL: package_cache.nuget.upstream not rendered (#1484)"; exit 1; }
          echo "$out" | grep -q "package_cache_retention_days:" || { echo "FAIL: artifact_retention.package_cache_retention_days not rendered — cached packages would expire on the code default (#1417)"; exit 1; }
          echo "$out" | grep -q "component_status:" || { echo "FAIL: ha.component_status not rendered into config.yaml (#1122)"; exit 1; }
          echo "$out" | grep -q "kind: Role" || { echo "FAIL: the API component-status Role must render when enabled (#1122)"; exit 1; }
          echo "$out" | grep -A16 "name: .*-component-status" | grep -q 'resources: \["deployments"\]' || { echo "FAIL: the component-status Role needs Deployments for ready-vs-desired, not just pods (#1122)"; exit 1; }
          echo "$out" | grep -A20 "name: .*-component-status" | grep -q 'resources: \["poddisruptionbudgets"\]' || { echo "FAIL: the component-status Role needs PDBs — a PDB that permits no eviction stalls node drains, and that is unreadable without it (#1128)"; exit 1; }
          # Node read is on by default: it is what tells an AVOIDABLE placement
          # concentration from an inevitable one, so without it every finding
          # would have to be suppressed to stay honest.
          echo "$out" | grep -q "read_nodes: true" || { echo "FAIL: ha.component_status.read_nodes must render and default to true (#1128)"; exit 1; }
          echo "$out" | grep -q "kind: ClusterRole" || { echo "FAIL: the node-reader ClusterRole must render when read_nodes is on (#1128)"; exit 1; }
          echo "$out" | grep -A14 "name: .*-node-reader" | grep -q 'resources: \["nodes"\]' || { echo "FAIL: the node-reader ClusterRole must grant nodes (#1128)"; exit 1; }
          echo "$out" | grep -A14 "name: .*-node-reader" | grep -qE 'verbs: \["get", "list"\]' || { echo "FAIL: the node-reader ClusterRole must stay READ-ONLY (#1128)"; exit 1; }
          # Module repos poll on their own, longer interval (#1149). Both legs
          # must render: a missing render line makes the value silently inert.
          echo "$out" | grep -q "poll_interval_seconds: 60" || { echo "FAIL: vcs.poll_interval_seconds must render and default to 60 — the workspace interval is the latency-sensitive one (#1149)"; exit 1; }
          echo "$out" | grep -q "module_poll_interval_seconds: 300" || { echo "FAIL: vcs.module_poll_interval_seconds must render and default to 300 (#1149)"; exit 1; }
          # Per-class object-store policy (#1151). `verify` observes the whole
          # store and commits the operator to nothing, so it is the default; a
          # missing render line would make the whole block silently inert.
          echo "$out" | grep -q "blobs:" || { echo "FAIL: ha.blobs not rendered into config.yaml (#1151)"; exit 1; }
          echo "$out" | grep -A2 "blobs:" | grep -q 'mode: "verify"' || { echo "FAIL: ha.blobs.mode must render and default to verify (#1151)"; exit 1; }
          # The copy budget (#1159). `| int64` in the template is load-bearing:
          # Helm renders 25000000 as 2.5e+07 without it, which is a float and not
          # the int the config model wants — the v0.30.1 hotfix all over again.
          echo "$out" | grep -q "max_bytes_per_second: 25000000" || { echo "FAIL: ha.blobs.max_bytes_per_second must render as an INTEGER, not scientific notation (#1159)"; exit 1; }
          echo "$out" | grep -q "max_bytes_per_cycle: 0" || { echo "FAIL: ha.blobs.max_bytes_per_cycle must render, and 0 must survive (0 = no cap) (#1159)"; exit 1; }
          echo "$out" | grep -q "interval_seconds: 300" || { echo "FAIL: ha.blobs.interval_seconds must render (#1159)"; exit 1; }
          echo "$out" | grep -q "probe_interval_seconds:" || { echo "FAIL: ha.probe_interval_seconds not rendered (#960)"; exit 1; }
          echo "$out" | grep -q "probe_threshold:" || { echo "FAIL: ha.probe_threshold not rendered (#960)"; exit 1; }
          # AI architecture critic (#1036 Part 2): non-secret config renders into
          # config.yaml; the auth api_key is NEVER rendered (secret via env only).
          echo "$out" | grep -q "ai_architecture:" || { echo "FAIL: ai_architecture config not rendered into config.yaml (#1036)"; exit 1; }
          echo "$out" | grep -q 'aws_session_name: "terrapod-ai-architecture"' || { echo "FAIL: ai_architecture auth not rendered (#1036)"; exit 1; }
          # The auth api_key must never render as a config KEY (it arrives via env
          # only). Match `api_key:` specifically — the block's explanatory comment
          # mentions "api_key" in prose, which is not a leak.
          echo "$out" | grep -qE '^\s*api_key:' && { echo "FAIL: api_key rendered as a config key in the ConfigMap"; exit 1; } || true
          echo "values-local renders OK (incl. Slack config + secretKeyRef)"

      - name: (helm-smoke) Declining the node read is supported (#1128)
        run: |
          out=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
              --values helm/terrapod/values.yaml \
              --values helm/terrapod/values-local.yaml \
              --set api.config.ha.component_status.read_nodes=false)
          if echo "$out" | grep -q "kind: ClusterRole"; then echo "FAIL: read_nodes=false must create no ClusterRole — an install that forbids cluster scope has to be able to opt out (#1128)"; exit 1; fi
          # The namespace-scoped half must survive the opt-out: placement is
          # still reported from our own pods, only zone spread goes unknown.
          echo "$out" | grep -q "name: .*-component-status" || { echo "FAIL: declining the node read must not disable component status (#1128)"; exit 1; }
          echo "read_nodes opt-out renders OK"

      - name: (helm-smoke) Per-class object-store policy renders, and a typo is refused (#1151)
        run: |
          out=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
              --values helm/terrapod/values.yaml \
              --set api.config.ha.blobs.classes.state=copy \
              --set api.config.ha.blobs.classes.run_logs=off)
          # The -A window must clear every scalar BETWEEN `blobs:` and `classes:`
          # (mode + the four copy-budget keys), so it is generous on purpose:
          # a window sized to today's block silently stops reaching the thing it
          # asserts the moment a key is added above it.
          echo "$out" | grep -A12 "blobs:" | grep -q "state: copy" || { echo "FAIL: a per-class override must reach the ConfigMap (#1151)"; exit 1; }
          # The selectivity #1114 asks for: copy what cannot be regenerated,
          # ignore the history. Both halves have to survive the render.
          echo "$out" | grep -A12 "blobs:" | grep -q "run_logs:" || { echo "FAIL: an 'off' class must reach the ConfigMap too (#1151)"; exit 1; }
          # A typo'd class name is the worst outcome available — a class the
          # operator believes they configured, silently on the default. The
          # schema refuses it here; HABlobsConfig refuses it again at startup for
          # the paths the chart never sees.
          if docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
               template terrapod helm/terrapod \
                 --values helm/terrapod/values.yaml \
                 --set api.config.ha.blobs.classes.stat=copy >/dev/null 2>&1; then
            echo "FAIL: an unknown blob class name must be rejected by values.schema.json (#1151)"; exit 1
          fi
          echo "per-class blob policy renders OK, unknown class refused"


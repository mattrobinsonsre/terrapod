name: CI

on:
  push:
    # Release branches build images on merge, exactly as main does. A squash
    # merge creates a NEW commit sha, so the images built during a PR never
    # match it -- which is why a post-merge build is needed at all, and why
    # without this a release-branch tag had to rebuild everything from scratch.
    #
    # It moves the verification EARLIER rather than removing it. Before this,
    # the tag push was the gate for a patch: no `sha-` images existed for a
    # cherry-picked commit, so the tag workflow ran the full set before
    # publishing. Now `images_exist` is true by tag time and the tests and
    # builds skip, so the release-branch run IS the gate and must be green
    # before anyone tags. That is the discipline main already has, and the
    # feedback arrives at merge instead of after a tag `Cleanup Tag` then
    # deletes.
    #
    # Safe to share the trigger: nothing here is conditioned on being main
    # (the only `github.ref` use is the concurrency group, which is per-ref),
    # and every release and publish job is gated on `is_tag`, computed from
    # GITHUB_REF matching a version tag. A branch push is not a tag, so none of
    # them can fire. `build-query` and `build-ee-agent` still run on a tag even
    # when images exist, deliberately, so the Release attaches the same
    # binaries.
    #
    # And the skip is EARNED rather than assumed: `create-manifests` requires
    # every lint, test and scan to be success-or-skipped, so a red run leaves no
    # `sha-` manifest, `images_exist` is false, and a tag on that commit
    # rebuilds and re-tests from scratch as it used to.
    branches: [main, 'release/**']
    # Two forms, because a pre-release tag matched NEITHER until #2277: these
    # patterns are full-match, so `v2.0.0-alpha.1` fell through and the push
    # started no pipeline AND no failure -- nothing published, nothing to clean
    # up, and no signal that anything had gone wrong.
    #
    # The second is `vN.0.0-*` and NOT `vN.N.N-*` deliberately: a pre-release is
    # for a MAJOR only. A `v2.1.0-alpha.1` is not a thing we cut, and admitting
    # one would let it publish and take the "Latest" badge off a stable 2.0.0 --
    # which matters because this workflow deliberately does not flag a
    # pre-release, so the badge follows publish order (see `release-create`).
    # Refusing the pattern makes an accidental minor pre-release fail at the
    # push instead, which is the loud direction.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.0.0-*'
  pull_request:
    # Release branches too, not just main. A release line is where patches and
    # release-targeted features land, and those are the changes people are
    # about to run — a PR into one arriving with no checks at all is the wrong
    # way round. The tag push still runs the full set; this makes the failure
    # visible at review time rather than at release time.
    branches: [main, 'release/**']
    # Include `ready_for_review` so a PR opened in draft (which suppresses
    # the default `opened`/`synchronize` events) starts CI when it's
    # marked ready. Without this, draft-first PRs need a close+reopen to
    # get any CI run at all — caught while bringing up #371.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/mattrobinsonsre

  # Third-party images, pulled from our GHCR mirror rather than Docker Hub,
  # whose anonymous pull limit is shared across GitHub runners and turned four
  # unrelated PRs red in one morning (#1186). Every consuming script and
  # Dockerfile keeps its Docker Hub reference as the default, so a local build
  # is unaffected and needs no access to these packages; only CI overrides.
  # Refreshed by .github/workflows/mirror-images.yml from .github/mirror-images.txt.
  MIRROR: ghcr.io/mattrobinsonsre/mirror
  PYTHON_BASE_IMAGE: ghcr.io/mattrobinsonsre/mirror/python:3.14-slim
  NODE_BASE_IMAGE: ghcr.io/mattrobinsonsre/mirror/node:26-alpine
  NODE_IMAGE: ghcr.io/mattrobinsonsre/mirror/node:24-alpine
  POSTGRES_IMAGE: ghcr.io/mattrobinsonsre/mirror/postgres:16-alpine
  REDIS_IMAGE: ghcr.io/mattrobinsonsre/mirror/redis:7-alpine
  # The largest single thing CI pulls: 0.91GB compressed, fetched by each of the
  # five E2E shards. Mirrored in #1475 for the same reason as the rest — CI
  # should not depend on a third-party registry being reachable.
  #
  # This tag must stay in step with e2e/package-lock.json, which pins
  # @playwright/test to the version these browsers belong to. A mismatch fails
  # loudly (Playwright refuses a browser revision it does not expect) rather
  # than silently, but the two are still written down twice and that is the
  # thing to watch when bumping either.
  PLAYWRIGHT_IMAGE: ghcr.io/mattrobinsonsre/mirror/mcr.microsoft.com-playwright:v1.58.2-noble
  LOCALSTACK_IMAGE: ghcr.io/mattrobinsonsre/mirror/localstack-localstack:4
  HELM_IMAGE: ghcr.io/mattrobinsonsre/mirror/alpine-helm:3.17.2
  PY_IMAGE: ghcr.io/mattrobinsonsre/mirror/python:3.14-slim
  SEMGREP_IMAGE: ghcr.io/mattrobinsonsre/mirror/semgrep-semgrep:1.117
  BUILDKIT_IMAGE: ghcr.io/mattrobinsonsre/mirror/moby-buildkit:buildx-stable-1
  K3D_REGISTRY_IMAGE: ghcr.io/mattrobinsonsre/mirror/registry:2
  # The chart's declared floor (Chart.yaml kubeVersion). The eval-boot kind leg
  # boots exactly this, so the floor is tested rather than asserted — move the two
  # together.
  KIND_NODE_IMAGE_TAG: v1.29.14

jobs:
  # ── Prepare ────────────────────────────────────────────
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      sha_short: ${{ steps.meta.outputs.sha_short }}
      images_exist: ${{ steps.check.outputs.images_exist }}
      is_tag: ${{ steps.meta.outputs.is_tag }}
      is_pr: ${{ steps.meta.outputs.is_pr }}
      version: ${{ steps.meta.outputs.version }}
      pkg_refresh: ${{ steps.meta.outputs.pkg_refresh }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute metadata
        id: meta
        run: |
          sha_short="${GITHUB_SHA::7}"
          echo "sha_short=$sha_short" >> "$GITHUB_OUTPUT"

          # Busts the images' apt-upgrade layer once a day, so Debian security
          # patches published since the last build actually land. The Dockerfiles
          # carry a hardcoded default for local builds; leaving CI on that default
          # meant the layer stayed cached from whenever a human last bumped it,
          # and the upgrade silently stopped upgrading (#1177).
          #
          # Daily rather than per-run deliberately: $GITHUB_RUN_ID would rebuild
          # every image on every build and throw the cache away entirely.
          echo "pkg_refresh=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

          is_tag=false
          is_pr=false
          version=""

          # MUST admit the same tag shapes as `on.push.tags` above. They are
          # written in two different languages -- an Actions filter pattern and a
          # bash regex -- so nothing makes them agree except this comment and the
          # gate that runs both over the same fixtures
          # (scripts/docs-audit/check_release_tag_triggers.py).
          #
          # Divergence fails SILENTLY and in the worst direction: a tag the filter
          # admits but this rejects starts a pipeline with `is_tag=false`, so every
          # release job is skipped, nothing is published, nothing fails, and
          # `Cleanup Tag` never fires -- leaving a tag that looks released and is
          # not. Two alternatives rather than one optional group, because a
          # pre-release suffix is admitted on a MAJOR only (`vN.0.0-...`), which
          # a single pattern with an optional suffix cannot express (#2277).
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ || "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.0\.0-[0-9A-Za-z.-]+$ ]]; then
            is_tag=true
            version="${GITHUB_REF#refs/tags/}"
          fi

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            is_pr=true
          fi

          echo "is_tag=$is_tag" >> "$GITHUB_OUTPUT"
          echo "is_pr=$is_pr" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}

      - name: Check if images exist
        id: check
        run: |
          sha_short="${GITHUB_SHA::7}"
          images_exist=true

          for image in terrapod-api terrapod-web terrapod-runner terrapod-listener terrapod-migrations; do
            if ! docker manifest inspect "$REGISTRY/$image:sha-$sha_short" > /dev/null 2>&1; then
              echo "$image:sha-$sha_short not found"
              images_exist=false
              break
            fi
          done

          echo "images_exist=$images_exist" >> "$GITHUB_OUTPUT"
          echo "Images exist: $images_exist"

  # ── Python Lint ────────────────────────────────────────
  python-checks:
    name: Python checks
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: scripts/lint.sh python

  # ── Frontend Lint ─────────────────────────────────────

      - name: (docs-audit) Cross-references resolve
        run: python3 scripts/docs-audit/check_links.py

      - name: (docs-audit) Countable claims match the code
        run: python3 scripts/docs-audit/check_counts.py

      - name: (docs-audit) Named targets, values and paths exist
        run: python3 scripts/docs-audit/check_references.py
      # The provider hard-codes copies of server defaults, and schema.golden
      # records types rather than defaults -- so a drift is invisible to every
      # other gate. It happened: the provider sat a minor behind for a release.

      - name: (docs-audit) Provider defaults agree with the server's
        run: python3 scripts/docs-audit/check_provider_defaults.py
      # Not a docs gate, but it belongs to a job that sees the whole checkout:
      # the pytest tiers run in an image that does not ship `scripts/`, and the
      # two mints that regressed live there (GHSA-3m8x-ff8g-7x8c).

      - name: (docs-audit) Every token mint names its identity provider
        run: python3 scripts/docs-audit/check_token_mints.py
      # Also not a docs gate, and here for the same reason: this job sees the
      # whole checkout, including the workflows. A package published with
      # nothing reaping it fails SILENTLY -- no check turns red, the versions
      # just pile up -- and that has now happened twice. The second time, the
      # chart package held 408 versions and `mirror/python` 330.

      - name: (docs-audit) Every published GHCR package is reaped
        run: python3 scripts/docs-audit/check_ghcr_cleanup.py
      # Also not a docs gate, and also here because this job sees the whole
      # checkout. Every `uses:` is SHA-pinned, so the trailing `# vN` comment is
      # the only human-readable statement of what is pinned -- and dependabot
      # rewrites the comment per OCCURRENCE, so a file whose comment was already
      # stale keeps it through a bump. Four of twenty pins disagreed with
      # themselves when #2161 landed; `actions/checkout` was labelled v4, v5.0.0
      # and v7 at once, and is v7.

      - name: (docs-audit) Pinned actions agree on their version comments
        run: python3 scripts/docs-audit/check_action_pins.py
      # A job that downloads an artifact must depend on the job producing it.
      # Without that the two are only ordered by the scheduler, so the job is
      # green until the ordering goes the other way -- which is how the runner
      # image build failed on arm64 and passed on amd64 in the same run.
      # The only gate here with a dependency. Installed explicitly rather
      # than assumed: every other job in this file that needs PyYAML installs
      # it, which is evidence enough that the runner image is not relied on to
      # carry it.
      - run: pip install pyyaml
      # Checks itself along with the rest, which is what makes the set closed
      # rather than merely one longer.

      - name: (docs-audit) Every docs-audit gate is run by this job
        run: python3 scripts/docs-audit/check_docs_audit_wiring.py

      - name: (docs-audit) Downloaded artifacts come from a declared dependency
        run: python3 scripts/docs-audit/check_artifact_deps.py
      # The EE contract is asserted twice on purpose -- at build time and
      # against the pushed digest -- and dropping either half leaves the other
      # green. Stdlib only, so it needs nothing installed above.

      - name: (docs-audit) The EE contract still has both its readers
        run: python3 scripts/docs-audit/check_ee_contract.py
      # Wired in here because nothing auto-discovers these scripts, and this
      # one had been sitting in the directory unrun -- the same shape as a flag
      # nothing reads, with the gate itself as the thing nobody was reading.

      - name: (docs-audit) No forward-looking issue references
        run: python3 scripts/docs-audit/check_issue_refs.py
      # Advisory: prints for human review, never fails. Telling a factual
      # boundary from a put-down is a judgement call.

      - name: (docs-audit) Peer-fairness review list
        run: python3 scripts/docs-audit/check_peer_fairness.py

      # A machine credential's `key` is its NAME, and where it applies is said
      # in the inventory by a `${terrapod:<name>.<field>}` placeholder. An
      # earlier design scoped it to `all` or a group; seven prose surfaces kept
      # that account after the code moved, and `all` is a valid credential name
      # so following them is accepted and then silently does nothing.
      - name: (docs-audit) A machine credential's key is described with its mechanism
        run: python3 scripts/docs-audit/check_credential_key_prose.py

      # Both halves of this one fail SILENTLY, which is the whole reason it is
      # gated: a tag pattern that stops matching starts no pipeline and reports
      # nothing, and a `--prerelease` flag reintroduced anywhere would decline the
      # Latest badge without erroring, so the alpha would quietly stop being what
      # the repo front page points at.
      - name: (docs-audit) The release trigger admits a pre-release, and lets it hold the badge
        run: python3 scripts/docs-audit/check_release_tag_triggers.py

      # The support window in SECURITY.md is version-relative, so at a MAJOR
      # boundary a line can leave support on a date nobody chose. A line held
      # beyond it is a line plus a SUNSET DATE in `extended-support.json`, and a
      # date in a committed file is exactly the kind of claim that goes stale in
      # silence -- so this drives the re-scan's OWN discovery code over fixture
      # dates rather than reimplementing it, and proves the entry is
      # self-expiring. Needs PyYAML, installed above, because it reads the
      # workflow rather than grepping it.
      - name: (docs-audit) A held release line is honoured by the re-scan and expires by itself
        run: python3 scripts/docs-audit/check_extended_support.py

      # The `go-modules` job below reads its toolchain from ONE module's
      # directive, and its own comment said the modules "are kept in step by
      # `check_go_directives.py`" for years before that script existed. Nine
      # modules happened to agree, so the claim was true by luck. Stdlib only.
      - name: (docs-audit) Every Go module declares the same toolchain
        run: python3 scripts/docs-audit/check_go_directives.py

      # Needs only PyYAML, installed above: the parser's regex is extracted from
      # `pulumi_plugins.py` by `ast` rather than imported, because importing it
      # drags in `settings` and so SQLAlchemy and the rest of the API closure --
      # which this job does not install, and which is exactly how the first
      # version of this step failed in CI while passing locally.
      - name: (docs-audit) The Pulumi plugin name the cache parses is the one published
        run: python3 scripts/docs-audit/check_pulumi_plugin_naming.py

  # ── Platform-tool artifacts (#2066) ───────────────
  # `platform_tools.py` holds a static table of the platforms each publisher
  # ships, and the table cannot express the thing that actually varies:
  # availability is a property of a (version, platform) pair. Checkov stopped
  # publishing its linux/arm64 asset at 3.3.21 while the table went on claiming
  # it, so from v1.9.0 every security scan on an arm64 agent pool recorded
  # `errored` — and on an enforced workspace that blocks every run. Nothing in
  # CI contradicted the claim, because nothing asked the publisher.
  #
  # This asks. Network-bound, so it is its own job rather than a pytest tier,
  # and it needs the real `download_url()` rather than a copy of its rules —
  # hence the slim install plus PYTHONPATH rather than a dependency-free script.
  # It gates a release through `quality-gate`: shipping a version whose artifact
  # does not exist is the failure this exists to prevent.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install pytest

      - name: (rescan-test) Run the re-scan and register-review script tests
        run: python -m pytest scripts/tests -v

  # ── Migration smoke (#544) ────────────────────────────
  # The Python test tiers build the schema with `Base.metadata.create_all`, so
  # the migration files are never executed by any test. This one-shot job runs
  # the REAL `alembic upgrade head` against a Postgres, then seeds + queries
  # representative rows — catching a bad backfill / NOT-NULL-without-default on a
  # populated table that create_all would never exercise. Always-on (cheap,
  # ~2 min) rather than path-gated, so a models.py change that needs a migration
  # can't slip through by touching a file the filter missed.
      - run: pip install httpx pydantic pydantic-settings pyyaml structlog pgpy standard-imghdr

      - name: (platform-tool-artifacts) Every artifact the platform tables claim exists
        env:
          PYTHONPATH: services
        run: python3 scripts/check-platform-tool-artifacts.py


  # ── Helm Lint ──────────────────────────────────────────
      - run: pip install pyyaml ijson pytest

      - name: (pricegen-test) Run pricegen unit tests
        run: python -m pytest pricegen/tests -v

  # ── Release re-scan script tests (#1212) ──────────────
  # The three `scripts/rescan_*.py` decide what a security channel says, and
  # their failure mode is silence rather than a crash: a normaliser reading the
  # wrong field reports zero findings and the run goes green. They are plain
  # stdlib files invoked by path (deliberately dependency-free, so the scheduled
  # workflow needs no install step), which also means they are not in the
  # services test image — so they run here, next to pricegen, for the same
  # reason. Pinned here: the two bugs that shipped, and the privacy split
  # (dependency findings may be public, code findings and per-release detail may
  # not).

  node-checks:
    name: Node checks
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest

    container: ghcr.io/mattrobinsonsre/mirror/node:24-alpine

    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: (frontend-lint) Install dependencies
        run: npm ci

      - name: (frontend-lint) ESLint
        run: npm run lint

      - name: (frontend-lint) TypeScript type-check
        run: npm run type-check

      - name: (frontend-lint) i18n completeness (every offered locale is 100% or it is not offered — #767)
        run: npm run i18n:check

      - name: (frontend-lint) i18n no-hardcoded-strings (no new untranslated JSX literals — #767)
        run: npm run i18n:lint

      - name: (frontend-lint) Phase vocabulary (no engine's verb hardcoded in a component — #1521)
        run: npm run i18n:phases

      - name: (frontend-lint) Unit tests (node:test — no test framework dependency)
        run: npm run test:unit

  # ── Provider Lint ─────────────────────────────────────

      - name: (npm-audit) Install dependencies
        run: npm ci

      - name: (npm-audit) Run npm audit
        # Fail on any high/critical advisory except those allowlisted in
        # pentest/npm-audit-allow.txt, which carries the reasoning and exit
        # condition for each (mirrors pip-audit's ignore file and trivy's
        # .trivyignore). Shared with release-rescan.yml so the two cannot drift.
        run: |
          npm audit --audit-level=high --json > audit.json || true
          node -e '
            const a = require("./audit.json");
            const allow = new Set(
              require("fs").readFileSync("../pentest/npm-audit-allow.txt", "utf8")
                .split("\n").map((l) => l.split("#")[0].trim()).filter(Boolean),
            );
            const bad = [];
            for (const [name, v] of Object.entries(a.vulnerabilities || {})) {
              if (!["high", "critical"].includes(v.severity)) continue;
              const ids = (v.via || [])
                .filter((x) => x && typeof x === "object" && x.url)
                .map((x) => x.url.split("/").pop());
              const unhandled = ids.filter((id) => !allow.has(id));
              if (unhandled.length) bad.push(`${name} [${v.severity}]: ${unhandled.join(", ")}`);
            }
            if (bad.length) {
              console.error("Non-allowlisted high/critical npm advisories:\n" + bad.join("\n"));
              process.exit(1);
            }
            console.log("npm audit: clean (only allowlisted advisories remain — see step comment).");
          '

  # ── Go dependency audit (#1542) ───────────────────────

  go-modules:
    name: Go modules
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Any module's directive will do -- they are kept in step by
          # `check_go_directives.py` -- but the CACHE key must cover every
          # module's `go.sum`, or a lockfile change in one leaves the others
          # restoring a stale module cache. The two jobs this replaced each
          # keyed on one module's sum and so cached six modules under the
          # seventh's key.
          go-version-file: go-terrapod/go.mod
          cache-dependency-path: |
            go-terrapod/go.sum
            provider/go.sum
            migrate/go.sum
            publish/go.sum
            query/go.sum
            mcp/go.sum
            ee-agent/go.sum
            pulumi-provider/go.sum

  # ── go-terrapod Lint ──────────────────────────────────
  # The public Go SDK lives in go-terrapod/ with its own go.mod (no
  # provider/migrate-specific deps). Both terraform-provider-terrapod
  # and terrapod-migrate import from here.

      - name: (go-terrapod-lint) Vet
        run: go vet ./...
        working-directory: go-terrapod

      - name: (go-terrapod-lint) Build
        run: go build ./...
        working-directory: go-terrapod

      - name: (go-terrapod-lint) golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: go-terrapod
          args: --config=../.golangci.yml

  # ── go-terrapod Test ──────────────────────────────────

      - name: (go-terrapod-test) Test
        run: go test ./... -v -count=1 -timeout 120s
        working-directory: go-terrapod

  # ── Provider Lint ─────────────────────────────────────
  # terraform-provider-terrapod lives in provider/ and is a thin, typed wrapper
  # over the SDK above -- no JSON:API marshaling of its own.

      - name: (provider-lint) Vet
        run: go vet ./...
        working-directory: provider

      - name: (provider-lint) Build
        run: go build ./...
        working-directory: provider

      - name: (provider-lint) golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: provider
          args: --config=../.golangci.yml

  # ── Provider Test ────────────────────────────────────

      - name: (provider-test) Test
        run: go test ./... -v -count=1 -timeout 120s
        working-directory: provider

  # ── Pulumi Provider Lint ──────────────────────────────
  # The bridged Pulumi provider lives in pulumi-provider/ with its own go.mod,
  # deliberately: `pulumi-terraform-bridge` pulls in a large dependency tree and
  # the Terraform provider above is meant to stay thin. It sits here rather than
  # at the end because it is derived from that provider -- a resource added
  # there appears in Pulumi with no edit, which `schema_test.go` enforces by
  # counting rather than trusting.

      - name: (pulumi-provider-lint) Vet
        run: go vet ./...
        working-directory: pulumi-provider

      - name: (pulumi-provider-lint) Build
        run: go build ./...
        working-directory: pulumi-provider

      - name: (pulumi-provider-lint) golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: pulumi-provider
          args: --config=../.golangci.yml

  # ── Pulumi Provider Test ──────────────────────────────
  # These tests read the COMMITTED `schema.json`, so they fail when it is stale
  # against the Terraform provider -- which is the whole contract. Regenerate
  # with `go run ./cmd/pulumi-tfgen-terrapod schema --out cmd/pulumi-resource-terrapod`.

      - name: (pulumi-provider-test) Test
        run: go test ./... -v -count=1 -timeout 120s
        working-directory: pulumi-provider

  # ── Migrate Lint ──────────────────────────────────────
  # The terrapod-migrate binary lives in migrate/ with its own go.mod
  # (the provider doesn't carry go-tfe or the HCL libs). Mirrors the
  # provider-lint shape so failures look the same to operators.

      - name: (migrate-lint) Vet
        run: go vet ./...
        working-directory: migrate

      - name: (migrate-lint) Build
        run: go build ./...
        working-directory: migrate

      - name: (migrate-lint) golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: migrate
          args: --config=../.golangci.yml

  # ── Migrate Test ──────────────────────────────────────

      - name: (migrate-test) Test
        run: go test ./... -v -count=1 -timeout 120s
        working-directory: migrate

  # ── Publish Lint ──────────────────────────────────────
  # terrapod-publish lives in publish/ with its own go.mod (pulls the
  # ProtonMail OpenPGP libs that the SDK doesn't). Mirrors migrate's shape.
      - name: (publish-lint) Vet
        run: go vet ./...
        working-directory: publish

      - name: (publish-lint) Build
        run: go build ./...
        working-directory: publish

      - name: (publish-lint) golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: publish
          args: --config=../.golangci.yml

  # ── Publish Test ──────────────────────────────────────

      - name: (publish-test) Test
        run: go test ./... -v -count=1 -timeout 120s
        working-directory: publish

  # ── Query Lint ────────────────────────────────────────

      - name: (query-lint) Vet
        run: go vet ./...
        working-directory: query

      - name: (query-lint) Build
        run: go build ./...
        working-directory: query

      - name: (query-lint) golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: query
          args: --config=../.golangci.yml

  # ── Query Test ────────────────────────────────────────

      - name: (query-test) Test
        run: go test ./... -v -count=1 -timeout 120s
        working-directory: query

  # ── MCP Lint ──────────────────────────────────────────

      - name: (mcp-lint) Vet
        run: go vet ./...
        working-directory: mcp

      - name: (mcp-lint) Build
        run: go build ./...
        working-directory: mcp

      - name: (mcp-lint) golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: mcp
          args: --config=../.golangci.yml

  # ── MCP Test ──────────────────────────────────────────
  # Includes the tool-catalogue contract gate (TestToolCatalogue) — a
  # removed/renamed/retyped tool fails here (breaking; #550).

      - name: (mcp-test) Test
        run: go test ./... -v -count=1 -timeout 120s
        working-directory: mcp

  # ── EE Agent Lint ─────────────────────────────────────
  # The agent that drives ansible inside an execution-environment container
  # (#2154). Its own module, stdlib-only, so it can be injected into an EE
  # without dragging a dependency surface in with it — which is what keeps an EE
  # free of Terrapod code and therefore insensitive to Terrapod releases.

      - name: (ee-agent-lint) Vet
        run: go vet ./...
        working-directory: ee-agent

      - name: (ee-agent-lint) Build
        run: go build ./...
        working-directory: ee-agent

      - name: (ee-agent-lint) golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: ee-agent
          args: --config=../.golangci.yml

  # ── EE Agent Test ─────────────────────────────────────

      - name: (ee-agent-test) Test
        # Longer than the other modules': several tests start a real child and
        # wait for it to be signalled, because cancellation is a property you
        # cannot assert without one.
        run: go test ./... -v -count=1 -timeout 300s
        working-directory: ee-agent

  # ── Build terrapod-ee-agent binary (baked into the runner image) ──────
  # Static and stdlib-only, so the initContainer can copy it onto a shared
  # volume and the EE can run it with no interpreter and no libraries of ours.

  build-ee-agent:
    name: Build terrapod-ee-agent (${{ matrix.goarch }})
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true' || needs.prepare.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ee-agent/go.mod
          cache: false
      - name: Build linux/${{ matrix.goarch }}
        working-directory: ee-agent
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          # CGO off is not an optimisation here: the binary runs inside an
          # arbitrary EE whose libc we do not choose, so it must not link one.
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o "terrapod-ee-agent-linux-${{ matrix.goarch }}" .
      - name: Confirm it is actually static
        working-directory: ee-agent
        run: |
          set -euo pipefail
          file "terrapod-ee-agent-linux-${{ matrix.goarch }}"
          file "terrapod-ee-agent-linux-${{ matrix.goarch }}" | grep -q 'statically linked'
      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: terrapod-ee-agent-linux-${{ matrix.goarch }}
          path: ee-agent/terrapod-ee-agent-linux-${{ matrix.goarch }}
          retention-days: 1

  # ── Build terrapod-query binary (baked into api + runner images) ──────
  build-query:
    name: Build terrapod-query (${{ matrix.goarch }})
    needs: prepare
    # Runs whenever images will be built (to bake the binary in) OR on a tag
    # (so release-query can attach the SAME linux binaries to the Release —
    # built once here, reused by both the image bake and the release, never
    # compiled twice).
    if: needs.prepare.outputs.images_exist != 'true' || needs.prepare.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: query/go.mod
          cache: false
      - name: Build linux/${{ matrix.goarch }}
        working-directory: query
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o "terrapod-query-linux-${{ matrix.goarch }}" ./cmd/terrapod-query
      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: terrapod-query-linux-${{ matrix.goarch }}
          path: query/terrapod-query-linux-${{ matrix.goarch }}
          retention-days: 1

  # ── Python Test ────────────────────────────────────────
  python-test:
    # Sharded by directory so each shard gets its own Postgres /
    # Redis / LocalStack stack via docker-compose.test.yml. Integration
    # tests hit a real DB and are race-prone under pytest-xdist within
    # one job; runner-level shards avoid that.
    #
    # Slice 1 — fast unit-ish (mock-based; no DB)
    # Slice 2 — services + api (mock-based; the bulk)
    # Slice 3 — integration (real Postgres; the slowest 12s tests live here)
    #
    # On a v0.35.0 main-run reference: combined 310s serial →
    # split slowest-shard ~75s (integration), others sub-60s.
    name: Python Test (${{ matrix.slice.name }})
    needs: [prepare, build-test-base]
    # **Depends on the base publish, which is the whole point of it.** Without
    # the dependency the publish and these fifteen slices start together, so on
    # any run with a new hash every slice misses the pull and builds the base
    # itself -- sixteen builds of one image, worse than the fifteen this set out
    # to remove, with the publish only ever helping the NEXT run.
    #
    # It costs little, because `build-test-base` has no `needs` and so starts at
    # t=0: on a warm run it finds the tag published and exits in seconds, and on
    # a cold one these slices wait once for a build that otherwise happens
    # fifteen times. Under a twenty-job concurrency ceiling that trade is not
    # close -- the ceiling turns saved runner-minutes into wall-clock for
    # whatever is queued behind them.
    #
    # `!cancelled()` rather than the default, and load-bearing twice. A SKIPPED
    # dependency skips its dependents, so on a fork PR -- where the publish
    # cannot run -- the default would skip every Python slice and the required
    # check would pass having tested nothing. And if the publish FAILS these
    # must still run: `ensure_test_image` falls back to building the base
    # locally, so a broken publish costs speed rather than coverage.
    if: ${{ !cancelled() && needs.prepare.outputs.images_exist != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice:
          # pytest-xdist `-n auto` is enabled for the two mock-heavy
          # shards. Local bench (Apple M-series; CI ~50-60% of this):
          #   unit         90s serial → 13s parallel (1495 → 492 tests)
          #   services-api 138s serial → 30s parallel
          # The integration shards stay serial WITHIN a job: the
          # session-scoped Postgres table-creation fixture races
          # under xdist workers, which share one database. That
          # objection does not apply ACROSS runners — each shard
          # gets its own compose stack, exactly as the two slices
          # above already do — so the split is runner-level.
          - name: unit
            # Root-level tests/*.py are NOT auto-collected by the directory
            # shards below — each must be listed here explicitly, or it silently
            # never runs in CI. All of these are pure-unit (no Postgres/Redis/S3).
            paths: tests/auth tests/meta tests/runner tests/storage tests/ai_eval tests/config tests/db tests/helm tests/oci tests/test_logging_config.py tests/test_dependency_pins.py tests/test_ansible_is_baked.py tests/test_ee_image_resolution.py tests/test_api_sdk_contract.py tests/test_schema_version.py tests/test_gpg_verify.py tests/test_http_retry.py tests/test_db_iam_auth.py tests/test_redis_iam_auth.py tests/crypto tests/test_ha_config.py
            pytest_args: -n auto
          # services-api is sharded across FOUR runners as well as run under
          # xdist within each. One job took ~8.5 min (#1555): ~6 min of pytest
          # on a 4-vCPU runner, which `-n auto` cannot widen, most of it
          # building the FastAPI app ~1000 times. Split by file on collected
          # test count, the same way as integration below.
          #
          # Three became six on 2026-10-26, because three was still leaving one
          # job on the critical path at 8.7 min: measured on run 40316874372,
          # 94s of setup (64s image build, 28s compose and collection) plus 422s
          # of pytest for 2714 tests, against a 10.1 min run span. The three
          # shards were also badly unbalanced at 8.7 / 7.0 / 5.3 min despite
          # being balanced on collected test count, so per-test cost is NOT
          # uniform for this tier -- that is why splitting the slice is worth
          # more here than the arithmetic suggests, and why rebalancing alone
          # would not have been enough.
          #
          # Six then came back to FOUR the same day, in two steps. At six the
          # shards ran 3.0-5.5 min (run 40333801771) -- so the longest had
          # stopped deciding the run span, and from there every extra shard pays
          # the ~95s of fixed setup again for a slot the 20-job ceiling is short
          # of. Subtracting the fixed cost leaves ~966s of pytest, so four
          # shards is ~340s each and, at the 1.3x imbalance measured at six,
          # ~410s for the worst. That is the deliberate trade: this tier becomes
          # the longest job in the gating wave again, in exchange for two slots
          # for the jobs queueing behind it. If the span goes up rather than
          # down, this is the change to put back first.
          - name: services-api-1
            paths: tests/services tests/api
            pytest_args: -n auto --shard 1/4
          - name: services-api-2
            paths: tests/services tests/api
            pytest_args: -n auto --shard 2/4
          - name: services-api-3
            paths: tests/services tests/api
            pytest_args: -n auto --shard 3/4
          - name: services-api-4
            paths: tests/services tests/api
            pytest_args: -n auto --shard 4/4
          # FIVE runner-level shards, balanced on collected test count by
          # `--shard` (services/tests/shard_plan.py). Measured across five CI
          # runs: per-test cost is uniform at 0.58-1.07s — the work is fixture
          # setup and teardown, which every test pays equally — so a file's
          # duration is its test count times a constant, and counting balances it.
          #
          # ~100s of every job is fixed cost (checkout, image, compose stack,
          # collection), measured at 95s and 112s on real runs, so each further
          # shard buys less wall-clock for the same ~100s of runner time. Three
          # became four once the suite grew to ~400 tests, and four became eight
          # on 2026-10-26 because every shard was still over five minutes
          # (measured 7.2 / 5.9 / 7.6 / 7.2 on run 40316874372). Eight then came
          # back to FIVE the same day, in two steps: at eight the shards ran
          # 3.2-4.2 min (run 40333801771), so the tier had stopped being the
          # critical path and the freed slots were worth more to the jobs
          # queueing behind it. Net of the ~95s fixed cost that is ~981s of
          # pytest, so five shards is ~200s each and ~320s for the worst at the
          # 1.15x imbalance measured at eight -- still inside the e2e/scan
          # wave's own tail, which is what makes this tier the cheaper of the
          # two to take slots back from.
          #
          # This tier CANNOT use xdist -- the session-scoped table-creation
          # fixture races under workers -- so runner-level shards are the only
          # parallelism it has, which is what makes sharding it the right lever
          # here even though the fixed cost is paid once per shard.
          #
          # The split happens after collection, so a new test file is assigned
          # automatically and cannot be silently missed (#1468).
          - name: integration-1
            paths: tests/integration
            pytest_args: "--shard 1/5"
          - name: integration-2
            paths: tests/integration
            pytest_args: "--shard 2/5"
          - name: integration-3
            paths: tests/integration
            pytest_args: "--shard 3/5"
          - name: integration-4
            paths: tests/integration
            pytest_args: "--shard 4/5"
          - name: integration-5
            paths: tests/integration
            pytest_args: "--shard 5/5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}

      # The expensive half of `terrapod-test:local` is published as
      # `terrapod-test-base:sha-<input hash>` and PULLED here rather than built
      # in each of the fifteen slices (#2248). `scripts/lib.sh` resolves it:
      # local store, then this registry, then a local build -- so a fork PR with
      # no package access, and a PR that changes the lock, both still work and
      # simply pay what every job used to pay.
      #
      # A pull rather than a layer cache, measured: `cache-from: type=gha` with
      # buildx made it WORSE (91-93s against 64s), because the container driver
      # has to hand the image back to the daemon and that export cost 23.5s of
      # layers plus a 23.4s tarball send, warm or cold. A pull writes straight
      # into the daemon and pays none of it.
      - run: scripts/test.sh python -- ${{ matrix.slice.pytest_args }} ${{ matrix.slice.paths }}
        env:
          TEST_BASE_REGISTRY: ${{ env.REGISTRY }}

  # ── Test base image (#2248) ────────────────────────────
  # Publishes the dependency half of the Python test image so the fifteen
  # python-test slices can PULL it instead of each building it. 64s per job,
  # measured on run 40316874372, for an image whose contents change only when
  # `Dockerfile.test-base` or the lock does.
  #
  # **`python-test` DEPENDS on this, and must.** Without the dependency the
  # publish and the fifteen slices start together, so on any run whose base is
  # not already published every slice misses the pull and builds the base
  # itself -- sixteen builds of one image, worse than the fifteen this set out
  # to remove, with the publish only ever helping the NEXT run.
  #
  # **But it is NOT part of the `CI` verdict.** This is a performance
  # optimisation with a correct fallback: `ensure_test_image` builds the base
  # locally when it cannot pull one, so a failed publish costs speed and not a
  # red build, and gating the required check on it would let an optimisation
  # fail an otherwise-correct change. The ordering it exists for is unaffected,
  # because `python-test` still waits for it and `python-test` IS in the
  # verdict.
  #
  # Skipped only for a FORK PR, whose token has no `packages: write`. Not for
  # PRs in general: a same-repo PR's token does have it, and gating on `is_pr`
  # meant a PR could never publish the base -- so a change to this machinery
  # could not demonstrate its own effect, and a PR that bumps the lock would
  # rebuild the base in every slice on every push until it merged. A fork PR
  # still falls through to building it locally, which is what every run did
  # before this existed.
  #
  # A same-repo PR publishing a base is no new trust boundary: it already has
  # write access to the repository, and the tag is a hash of the base's own
  # inputs, so what it publishes is exactly what that hash describes.
  build-test-base:
    # NO `needs`, deliberately. It reads nothing `prepare` produces -- its
    # condition is context (`github.event_name`, the PR's head repo), its
    # registry is a workflow env, and its tag comes from files in the checkout
    # -- so depending on `prepare` would only delay it, and being EARLY is the
    # whole point: the slices look for this image when they start, so every
    # second it is published sooner is a slice that pulls instead of building.
    #
    # The cost of not gating on `prepare.outputs.images_exist` is that this also
    # runs on a re-tag run where the test matrix is skipped. It then finds the
    # tag present and exits in seconds, which is cheaper than the delay gating
    # on it would add to every other run.
    name: Test Base Image
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}

      - name: Build and push when the tag is absent
        env:
          REGISTRY: ${{ env.REGISTRY }}
        run: |
          # The tag comes from `lib.sh` rather than being recomputed here: two
          # implementations of a content hash is two things to get wrong, and a
          # tag that disagrees with the one the test jobs look for would publish
          # an image nothing ever pulls -- silently, and looking like a success.
          source scripts/lib.sh
          tag="$(test_base_tag)"
          remote="${REGISTRY}/${tag}"
          if docker manifest inspect "$remote" >/dev/null 2>&1; then
            echo "Already published, nothing to do: $remote"
            exit 0
          fi
          echo "Publishing $remote"
          docker build -f docker/Dockerfile.test-base -t "$remote" .
          docker push "$remote"

  # ── pricegen unit tests (#1025) ───────────────────────
  # The pricegen package (self-generated cost pricesheet, #893) is a standalone
  # pure-Python tool — it isn't copied into the services test image, so its unit
  # tests (adapters, engine, computed path, multi-region fetch/merge) run here.
  # Deps are just pyyaml + ijson (the same the weekly Pricesheet workflow uses);
  # no DB/Redis/network — the fetch tests monkeypatch the HTTP layer.
  python-audit:
    name: Python Audit
    # In the lint/test wave, and the measurement that put it BACK there is worth
    # keeping, because the reasoning for deferring it was not wrong so much as
    # aimed at the wrong scarcity. It cannot be combined with the other short
    # jobs the way the rest were -- each of these two runs in its own
    # `container:`, which is job-level, so a containerised job can only merge
    # with one using the identical image and no other short job uses either --
    # and on 2026-10-26 it was deferred past the image build on the grounds that
    # the slot it holds in the gating wave is therefore bought for nothing.
    #
    # Measured, that trade loses. These two are 62s and 24s, so deferring them
    # yielded the gating wave 86 slot-seconds; in the later wave they joined 19
    # jobs competing for ~11 free slots, and `python-audit` QUEUED 76s to run
    # 62s of work (run 40336816248). A job that waits longer than it runs is the
    # signature of the contended wave, and the later wave is the contended one:
    # almost everything in it depends on the amd64 images, so a slot denied
    # there is paid by the whole wave, which is not true of a short job here
    # that finishes long before this wave's own ~400s tail.
    #
    # The lint/test wave's width still matters -- it is what decides how fast
    # the image builds get their slots (median queue 143s at 28 jobs, 48s at 19)
    # -- but the lever for that is removing jobs with no successor, not moving
    # cheap ones downstream onto the critical path.
    #
    # Nothing is delayed by this. `create-manifests` is the only consumer and it
    # already needs `scan-images`, a wave further on, so its own depth is
    # unchanged.
    #
    # `!cancelled()` keeps the signal independent of the ordering: a bare
    # `needs` edge SKIPS this when an image build fails, which would hide an
    # audit result behind an unrelated failure.
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    # Literal, not ${{ env.* }}: the env context is NOT available in a job's
    # `container:` or in `services:` — using it there makes the whole workflow
    # invalid, which GitHub reports as NO checks rather than a failing one.
    container: ghcr.io/mattrobinsonsre/mirror/python:3.14-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Poetry
        # Pinned to the SAME version the images build with (see the `poetry==`
        # pins in docker/Dockerfile.api and docker/Dockerfile.test). Two reasons,
        # and the second is the point of GHSA-rgvw-c74c-h75w: the lock format is
        # version-specific (Poetry 2.x writes lock-version 2.1, which 1.8.4
        # refuses to read), and the set audited here has to be the same
        # projection of the same lock that the api image installs — otherwise
        # this job is once again auditing a resolution nothing ships.
        #
        # `export` is built into 1.8.4, so poetry-plugin-export is not needed.
        run: pip install 'poetry==1.8.4'
      - name: Check the lock is current
        # Load-bearing, not belt-and-braces. Measured against Poetry 1.8.4:
        # `export` against a lock that no longer matches pyproject.toml prints a
        # warning and exits 0, so without this the job would audit the stale
        # closure and report it clean. The api image build runs the same check
        # immediately before its own export, for the same reason.
        run: poetry check --lock --no-interaction --no-ansi
        working-directory: services
      - name: Export the api image's requirement set from the lock
        # `--only main` and WITH hashes: exactly what docker/Dockerfile.api does,
        # so the file audited below is byte-for-byte the file that image
        # installs. (`--only main` is also the default here — measured, 126
        # packages either way — but being explicit is what keeps it true if the
        # default ever moves.)
        run: poetry export --only main -f requirements.txt -o requirements.txt
        working-directory: services
      - name: Run pip-audit
        # Accepted advisories live in pentest/pip-audit-ignore.txt, each with
        # its reasoning and exit condition. Read from the file rather than
        # inlined here so that release-rescan.yml — which re-checks supported
        # releases against current reasoning — cannot drift from this gate.
        #
        # All FOUR shipped Python dependency sets, not just the api image's. The
        # three minimal images install committed hash-pinned requirements, and
        # before this only trivy's image scan saw them — so an advisory against a
        # migrations-only dependency (Mako, botocore, google-auth) was never
        # weighed against the reasoning in the ignore file.
        run: |
          pip install pip-audit
          # POSIX sh, not bash: this job runs in a slim container whose shell
          # has no arrays. $ignores is intentionally unquoted below so the
          # accumulated flags word-split into separate arguments.
          ignores=""
          while read -r line; do
            line="${line%%#*}"
            line="$(echo "$line" | tr -d '[:space:]')"
            [ -n "$line" ] && ignores="$ignores --ignore-vuln $line"
          done < pentest/pip-audit-ignore.txt
          fail=0
          for req in services/requirements.txt \
                     services/requirements-listener.txt \
                     services/requirements-migrations.txt \
                     services/requirements-runner.txt; do
            echo "── $req"
            # shellcheck disable=SC2086
            pip-audit -r "$req" --strict --desc $ignores || fail=1
          done
          if [ "$fail" != "0" ]; then
            echo
            echo "An advisory affects a set that ships. Bump the floor in the"
            echo "matching services/pyproject*.toml, re-run scripts/lock-python-deps.sh,"
            echo "and commit the regenerated lock — or add the id to"
            echo "pentest/pip-audit-ignore.txt with its reasoning and exit condition."
            exit 1
          fi

  # ── Dependency Audit (npm) ────────────────────────────
  secret-scan:
    name: Secret Scan
    # In the lint/test wave, and the measurement that put it BACK there is worth
    # keeping, because the reasoning for deferring it was not wrong so much as
    # aimed at the wrong scarcity. It cannot be combined with the other short
    # jobs the way the rest were -- each of these two runs in its own
    # `container:`, which is job-level, so a containerised job can only merge
    # with one using the identical image and no other short job uses either --
    # and on 2026-10-26 it was deferred past the image build on the grounds that
    # the slot it holds in the gating wave is therefore bought for nothing.
    #
    # Measured, that trade loses. These two are 62s and 24s, so deferring them
    # yielded the gating wave 86 slot-seconds; in the later wave they joined 19
    # jobs competing for ~11 free slots, and `python-audit` QUEUED 76s to run
    # 62s of work (run 40336816248). A job that waits longer than it runs is the
    # signature of the contended wave, and the later wave is the contended one:
    # almost everything in it depends on the amd64 images, so a slot denied
    # there is paid by the whole wave, which is not true of a short job here
    # that finishes long before this wave's own ~400s tail.
    #
    # The lint/test wave's width still matters -- it is what decides how fast
    # the image builds get their slots (median queue 143s at 28 jobs, 48s at 19)
    # -- but the lever for that is removing jobs with no successor, not moving
    # cheap ones downstream onto the critical path.
    #
    # Nothing is delayed by this. `create-manifests` is the only consumer and it
    # already needs `scan-images`, a wave further on, so its own depth is
    # unchanged.
    #
    # `!cancelled()` keeps the signal independent of the ordering: a bare
    # `needs` edge SKIPS this when an image build fails, which would hide an
    # audit result behind an unrelated failure.
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    container: zricethezav/gitleaks:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run gitleaks
        run: gitleaks detect --source . --no-git --config .gitleaks.toml

  # ── CodeQL (GitHub Advanced Security) ──────────────────
  #
  # DELIBERATELY after the image build, with `python-audit` and `secret-scan`,
  # and it is the one deferral that needs justifying -- the others are seconds
  # long and this holds three slots for 1.5-3.5 min (89/137/194s measured on run
  # 40333801771) in the wave where the 20-job ceiling actually binds.
  #
  # Deferring a job that finds code defects would normally be the wrong trade.
  # It is not here, because `analyze` does not fail on findings: an alert goes to
  # code scanning and is dismissed per alert (see codeql-config.yml), and the
  # only required check is the `CI` aggregate. So this job's own red is never a
  # security finding -- it is a Go module that will not compile, the module-count
  # floor below, or an extractor failure. Moving it therefore changes WHEN the
  # alerts appear, not whether a defect can reach `main`.
  #
  # The one thing it uniquely compiles is `loadtest`, the only Go module with no
  # lint or test job of its own -- which is how it was caught broken in the first
  # place. A broken `loadtest` is now found after the images build rather than
  # before, costing those builds and nothing else, because it ships in no image.
  #
  # It is also SKIPPED when the commit's images already exist, which it shares with
  # most of this file -- and `create-manifests` allows `codeql` to be `skipped` as
  # well as `success`. That pair looks like a hole and is not: images only exist
  # because a prior run on the SAME sha wrote the `sha-` manifest, and that run's
  # own `create-manifests` required `codeql == success`. So a `sha-` manifest implies
  # some run analysed that commit, and nothing reaches a published artifact
  # unanalysed -- including on a tag, which only retags what a branch push built.
  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: [prepare, build-images-amd64]
    if: ${{ !cancelled() && needs.prepare.outputs.images_exist != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Go needs `build-mode: manual` (#1963). `none` fails Initialize CodeQL
        # for Go, and autobuild has nothing to work from: there is no go.mod at
        # the repository root, every module is one level down. So the build step
        # below enumerates them.
        language: [python, javascript-typescript, go]
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: go-terrapod/go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          config-file: .github/codeql/codeql-config.yml

      # The manual build for Go. Every module is built, because CodeQL's Go
      # extractor only sees what the build compiles -- a module left out is
      # silently unanalysed, which is the failure this whole job exists to avoid.
      #
      # The module list is DERIVED from the tree rather than maintained here, so a
      # new module is covered the day it appears. Two sources of go.mod are not
      # ours and must not be built: the vendored OCI distribution-spec under
      # `.conformance/`, and any local `.claude/worktrees/*` copies (absent from a
      # CI checkout, excluded so the same command works on a laptop).
      #
      # `go build ./...` rather than `go vet` or a test build: it compiles every
      # package without needing test fixtures or network services.
      - name: Build the Go modules
        if: matrix.language == 'go'
        run: |
          set -euo pipefail
          mapfile -t mods < <(
            find . -name go.mod \
              -not -path './.conformance/*' \
              -not -path './.claude/*' \
              -not -path './node_modules/*' \
              -printf '%h\n' | sort
          )
          # The floor EQUALS the module count, and `check_go_directives.py` keeps
          # it that way -- it reads this number out of this job and fails when the
          # two disagree. Slack here is the hole rather than a convenience: this
          # floor is the only thing between a finder that stopped matching and a
          # green run over a fraction of the Go code. It sat at 7 against nine
          # modules (#2275), so two could have vanished unnoticed.
          if [ "${#mods[@]}" -lt 9 ]; then
            echo "Found only ${#mods[@]} Go module(s): ${mods[*]}"
            echo "Expected at least 9. The finder has probably stopped matching"
            echo "rather than the modules having gone away — failing rather than"
            echo "analysing a fraction of the Go code and reporting success."
            exit 1
          fi
          echo "Building ${#mods[@]} module(s): ${mods[*]}"
          for m in "${mods[@]}"; do
            echo "::group::go build $m"
            (cd "$m" && go build ./...)
            echo "::endgroup::"
          done

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: codeql-${{ matrix.language }}

  # ── Dependency Review (PR only) ───────────────────────
  # Requires "Dependency graph" enabled in repo Settings > Code security
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ── Docs Audit ─────────────────────────────────────────
  host-checks:
    name: Repo and chart checks
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        # Literal for the same reason as `container:` above.
        image: ghcr.io/mattrobinsonsre/mirror/postgres:16-alpine
        env:
          POSTGRES_USER: terrapod
          POSTGRES_PASSWORD: terrapod
          POSTGRES_DB: terrapod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U terrapod"
          --health-interval 3s --health-timeout 3s --health-retries 20

    env:
      DATABASE_URL: postgresql+asyncpg://terrapod:terrapod@localhost:5432/terrapod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: (helm-lint) Helm lint (default values)
        run: |
          docker run --rm -v "$PWD:/chart" -w /chart \
            "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            lint helm/terrapod --values helm/terrapod/values.yaml

      - name: (helm-lint) Helm lint (local dev values)
        run: |
          docker run --rm -v "$PWD:/chart" -w /chart \
            "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            lint helm/terrapod --values helm/terrapod/values.yaml --values helm/terrapod/values-local.yaml

  # ── Helm Smoke (render assertions) ─────────────────────
  # Catches broken chart DEFAULTS that `helm lint` does not — e.g. a stock
  # install that renders no working stack because a component default is off.
  # (Directly targets the web.enabled=false class of bug that shipped a
  # non-working chart: lint passed, but `helm install` produced no web/Ingress.)
      - run: scripts/helm-config-contract.sh

  # ── Eval quickstart boot (kind + k3d) ──────────────────
  # Proves `make eval` actually stands up a complete stack (embedded
  # Postgres/Redis + migrations + API + web) on a throwaway cluster, on both
  # supported cluster tools. Uses released images, so it exercises the eval
  # mechanism + chart, not the PR's app code (that's covered by the test job).

      - name: (helm-smoke) No third-party image is pulled straight from Docker Hub
        run: |
          # The first pass at the mirror MISSED e2e/docker-compose.e2e.yml, which
          # duly failed a docs-only PR an hour later on a postgres pull. Grepping
          # for the shape is cheaper than remembering (#1186).
          #
          # The rule is OVERRIDABLE, not mirrored: every call site keeps its
          # Docker Hub reference as the default so a local run is unaffected and
          # needs no access to our packages. Only CI sets the override.
          third_party='postgres|redis|localstack/localstack|node|python|alpine/helm|semgrep/semgrep|aquasec/trivy|registry|moby/buildkit'
          files=$(git ls-files 'docker-compose*.yml' '*/docker-compose*.yml')
          if [ -z "$files" ]; then echo "no compose files found — the guard is not looking anywhere"; exit 1; fi
          echo "checking: $files"
          bad=$(grep -HnE "^[[:space:]]*image:[[:space:]]*($third_party)[:@]" $files || true)
          if [ -n "$bad" ]; then
            echo "These pull straight from Docker Hub, whose anonymous rate limit"
            echo "turns unrelated PRs red:"
            echo "$bad"
            echo
            echo 'Wrap as ${VAR:-upstream-ref} and add VAR to the env block in'
            echo "ci.yml. See .github/mirror-images.txt."
            exit 1
          fi
          # And every mirror image ci.yml names must actually be on the list, or
          # the copy never happens and CI asks GHCR for something absent.
          listed=$(grep -vE '^\s*(#|$)' .github/mirror-images.txt | sed 's|/|-|g; s|:.*||' | sort -u)
          used=$(grep -oE 'ghcr\.io/[^/]+/mirror/[a-z0-9-]+:' .github/workflows/ci.yml \
                 | sed 's|.*/mirror/||; s|:$||' | sort -u)
          missing=$(comm -13 <(echo "$listed") <(echo "$used"))
          if [ -n "$missing" ]; then
            echo "ci.yml points at mirror images not in the list: $missing"; exit 1
          fi
          echo "all third-party images are overridable, and every mirror ref is listed"


      - name: (helm-smoke) The chart never mints a token signing key, and yields to a supplied one
        run: |
          # GHSA-hc47-q72v-4vcm, #1994. The chart used to generate this key, which
          # put a random value in a rendered manifest -- not a pure function of its
          # inputs. Under `helm install` a cluster `lookup` for the existing Secret
          # covered that; under `helm template`, which is what Argo CD and Flux run,
          # `lookup` returns nothing and `.Release.IsInstall` is ALWAYS true, so the
          # generating branch minted a fresh key on every render and rotated it under
          # the running fleet. The API generates and stores its own key now, so the
          # property to hold is simply that no manifest ever carries one.
          # One function per render, with helm's exit status checked. Looping over a
          # string of flags and letting the shell split it looks tidier and is a gate
          # that cannot fail: a mis-split flag makes helm error, `grep -c` then counts
          # zero matches in empty output, and the assertion passes for the wrong reason.
          check_no_key () {
            out=$(helm template tp ./helm/terrapod "$@") \
              || { echo "render failed for: $*"; exit 1; }
            n=$(printf '%s' "$out" | grep -c 'token_signing_key:' || true)
            [ "$n" = "0" ] \
              || { echo "a render ($*) carries a signing key (got $n) -- the chart must not hold it"; exit 1; }
          }
          check_no_key
          check_no_key --is-upgrade
          check_no_key --set api.enabled=false --set web.enabled=false

          # And no template declares one, which is what a render alone cannot tell
          # you: a template gated off today is a template someone ungates tomorrow.
          decl=$(grep -rl '^[[:space:]]*token_signing_key:' ./helm/terrapod/templates/ || true)
          [ -z "$decl" ] \
            || { echo "these templates declare a signing key: $decl"; exit 1; }

          # A supplied key is referenced, never copied. It wins on every startup and
          # the API does not read its stored key at all, so this is the whole of the
          # bring-your-own path.
          own=$(helm template tp ./helm/terrapod --set api.tokenSigningKey.existingSecret=mine --set api.tokenSigningKey.existingSecretKey=sk)
          echo "$own" | grep -q 'name: mine' \
            || { echo "an operator-supplied secret must be referenced"; exit 1; }
          echo "$own" | grep -q 'key: sk' \
            || { echo "the supplied secret key name must be honoured"; exit 1; }
          echo "$own" | grep -q 'token_signing_key:' \
            && { echo "a supplied key must be referenced, not copied into a Secret"; exit 1; }

          # Rotating a SUPPLIED key must roll the API pods: env from a secretKeyRef is
          # snapshotted at pod start and never refreshes, and the key is a per-process
          # global, so without this a changed Secret leaves older pods on the old key
          # and half of every run's calls 401 (v1.7.3). Asserted against the template,
          # because the annotation is computed from a cluster lookup that a renderer
          # cannot do -- which is also why the docs tell a GitOps operator to restart
          # the API themselves after rotating.
          grep -q 'checksum/token-signing' ./helm/terrapod/templates/deployment-api.yaml \
            || { echo "the API pod template has no checksum for a supplied signing key"; exit 1; }

          # With no key supplied there is nothing to checksum and nothing to inject.
          plain=$(helm template tp ./helm/terrapod)
          echo "$plain" | grep -q 'checksum/token-signing' \
            && { echo "a default render carries a signing-key checksum; nothing supplies one"; exit 1; }
          echo "$plain" | grep -q 'TERRAPOD_TOKEN_SIGNING_KEY' \
            && { echo "a default render injects a signing key env var; the API stores its own"; exit 1; }
          echo "signing key: never minted by the chart, referenced when supplied, absent otherwise"


      - name: (helm-smoke) The strong-secrets switch reaches the pod and stays off by default
        run: |
          # Config-channel contract for GHSA-hc47-q72v-4vcm. The switch decides
          # whether the API refuses to start on a weak signing key or a
          # passphrase KEK, so a render line that goes missing is not cosmetic:
          # an operator sets it, the pod never sees it, and the code default
          # (off) silently wins while they believe enforcement is on.
          out=$(helm template ./helm/terrapod -f helm/terrapod/values.yaml)
          echo "$out" | grep -q 'require_strong_secrets:' \
            || { echo "require_strong_secrets is not rendered into the ConfigMap"; exit 1; }
          # Default must stay OFF on this line: a deployment already running on a
          # weak secret has its data encrypted under that key, so refusing to boot
          # on a patch upgrade is worse than the weakness it reports.
          echo "$out" | grep -q 'require_strong_secrets: false' \
            || { echo "require_strong_secrets must default to false here"; exit 1; }
          # And turning it on must actually reach the pod.
          on=$(helm template ./helm/terrapod --set api.config.require_strong_secrets=true)
          echo "$on" | grep -q 'require_strong_secrets: true' \
            || { echo "setting it true does not reach the ConfigMap"; exit 1; }
          # It is policy, not a credential -- it belongs in the ConfigMap and
          # must never be smuggled in as a TERRAPOD_* env var (house rule).
          echo "$out" | grep -q 'TERRAPOD_REQUIRE_STRONG_SECRETS' \
            && { echo "must not be set via env; it is non-sensitive config"; exit 1; }
          echo "the strong-secrets switch renders, defaults off, and is ConfigMap-only"


      - name: (helm-smoke) The GitLab git-credential switch renders, on every profile, and stays off
        run: |
          # Config-channel contract for the GitLab half of the VCS-connection
          # git credential. A GitLab connection holds an access token that
          # cannot be narrowed, so the switch decides whether a runner Job --
          # chosen by whoever set a workspace variable -- receives it whole.
          #
          # A missing render line here is the worst shape this contract takes:
          # the key would look configurable in values.yaml, the pod would never
          # see it, and the CODE default (off) would quietly win. That fails
          # safe, so nothing breaks and nobody notices -- until an operator who
          # deliberately turned it ON finds their runs refused with a message
          # telling them to set a key they already set.
          #
          # Asserted on all three profiles, because the eval and local profiles
          # are where a `with`-style guard would silently drop a false.
          for f in values.yaml values-local.yaml values-eval.yaml; do
            out=$(helm template ./helm/terrapod -f "helm/terrapod/$f")
            echo "$out" | grep -q 'allow_token_delivery_to_runners: false' \
              || { echo "$f: the GitLab git-credential switch must render, and render false"; exit 1; }
          done
          # Turning it on must actually reach the pod.
          on=$(helm template ./helm/terrapod --set api.config.vcs.gitlab.allow_token_delivery_to_runners=true)
          echo "$on" | grep -q 'allow_token_delivery_to_runners: true' \
            || { echo "setting it true does not reach the ConfigMap"; exit 1; }
          # Policy, not a credential: ConfigMap only, never a TERRAPOD_* env var.
          helm template ./helm/terrapod -f helm/terrapod/values.yaml \
            | grep -q 'TERRAPOD_VCS__GITLAB__ALLOW_TOKEN_DELIVERY_TO_RUNNERS' \
            && { echo "must not be set via env; it is non-sensitive config"; exit 1; }
          echo "the GitLab git-credential switch renders off on every profile and is ConfigMap-only"


      - name: (helm-smoke) An explicit false reaches the pod, and nothing unmodelled is rendered
        run: |
          # The config CHANNEL contract, both directions, in the job that has a helm
          # binary. There is an equivalent pytest (tests/helm/
          # test_rendered_config_matches_settings.py) and it can only ever SKIP in
          # CI, because docker/Dockerfile.test deliberately ships no helm — so this
          # is the leg that actually runs. Both failures it exists for have happened
          # in one release:
          #
          #  - a `| default true` cleanup deleted the render line for
          #    vcs.require_connection_authorization as collateral. The key stayed in
          #    values.yaml and in the values snapshot, so every gate stayed green
          #    while an operator's explicit `false` silently stopped reaching the pod
          #    -- and they would then have met a 403 whose own text told them to set
          #    the key that had stopped working.
          #  - four keys carried in from the 2.0 line were rendered to every
          #    deployment while `Settings` modelled none of them, and
          #    values.schema.json is additionalProperties:false, so an operator could
          #    not even override one.
          #
          # Direction 1: a deliberate `false` survives. Go templates treat false as
          # empty, so this is the half `| default true` and `with` silently break.
          for k in \
            vcs.require_connection_authorization \
            vcs.require_push_permission_for_commands \
            database.pool_pre_ping \
            notifications.smtp.use_tls
          do
            leaf="${k##*.}"
            helm template ./helm/terrapod --set "api.config.${k}=false" \
              | grep -q "${leaf}: false" \
              || { echo "setting ${k}=false does not reach the ConfigMap"; exit 1; }
          done
          echo "an explicit false reaches the pod for all four keys"

          # Direction 2: every key rendered into config.yaml is one Settings accepts,
          # on all three profiles -- the eval profile included, because a key behind
          # a `with` block only appears when a profile sets it.
          for f in values.yaml values-local.yaml values-eval.yaml; do
            helm template ./helm/terrapod -f "helm/terrapod/$f" \
              | python3 scripts/ci/check_rendered_config_keys.py \
              || { echo "rendered config disagrees with Settings on $f"; exit 1; }
          done


      - name: (helm-smoke) The comment-command push gate reaches the pod and stays on by default
        run: |
          # Config-channel contract for the PR-comment authorization gate. The
          # switch decides whether `terrapod apply` from a pull-request comment
          # requires the author to have push access, so a render line that goes
          # missing is not cosmetic: an operator who turns it off still gets it
          # on, or -- the direction that matters -- a chart that stops rendering
          # it silently falls back to the code default and nobody finds out
          # which way round it was.
          out=$(helm template ./helm/terrapod -f helm/terrapod/values.yaml)
          echo "$out" | grep -q 'require_push_permission_for_commands:' \
            || { echo "require_push_permission_for_commands is not rendered into the ConfigMap"; exit 1; }
          # Default ON: commenting is not authorization.
          echo "$out" | grep -q 'require_push_permission_for_commands: true' \
            || { echo "the push gate must default to true"; exit 1; }
          # And turning it OFF must actually reach the pod. This is the half a
          # `| default true` or a `with` block silently breaks, because Go
          # templates treat false as empty -- the operator asks for off and the
          # chart renders on.
          off=$(helm template ./helm/terrapod --set api.config.vcs.require_push_permission_for_commands=false)
          echo "$off" | grep -q 'require_push_permission_for_commands: false' \
            || { echo "setting it false does not reach the ConfigMap"; exit 1; }
          # It is policy, not a credential -- ConfigMap only (house rule).
          echo "$out" | grep -q 'TERRAPOD_VCS__REQUIRE_PUSH_PERMISSION' \
            && { echo "must not be set via env; it is non-sensitive config"; exit 1; }
          echo "the comment-command push gate renders, defaults on, and honours false"


      - name: (helm-smoke) The Vault value source reaches the pod, and its credential never does
        run: |
          # Two halves of the config-channel contract for #1439.
          #
          # First: the instance list must render into the ConfigMap. A Vault an
          # operator configures but the pod never sees is a variable that fails
          # its first run, with nothing to explain why.
          #
          # Second, and specific to this feature: the approle/token credential
          # must reach the pod as a secretKeyRef and must NEVER appear in the
          # ConfigMap. It is a credential; a ConfigMap is world-readable to
          # anything with namespace read.
          cat > /tmp/vault-values.yaml <<'EOF'
          api:
            config:
              vault:
                enabled: true
                instances:
                  - name: with-approle
                    address: https://vault.example:8200
                    auth: { method: approle, mount: approle, role: rid }
                    existingSecret: vault-approle
                    existingSecretKey: secret_id
                  - name: kube
                    default: true
                    address: https://vault2.example:8200
                    auth: { method: kubernetes, mount: kubernetes, role: terrapod }
                    paths: ["secret/apps"]
                    revoke_leases: true
          EOF
          docker run --rm -v "$PWD:/chart" -v /tmp:/tmp -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
            --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
            --set redis.url=redis://redis:6379 \
            -f /tmp/vault-values.yaml > /tmp/rendered-vault.yaml

          for want in 'vault:' 'with-approle' 'kube' 'secret/apps' 'mount: "approle"' 'role: "terrapod"'; do
            grep -q "$want" /tmp/rendered-vault.yaml || {
              echo "vault config never reaches the pod — missing from the rendered ConfigMap: $want"
              echo "add a render line to templates/configmap-api.yaml"
              exit 1
            }
          done

          # The env var name is a contract between the chart and
          # vault_source_service._secret_for(). If they disagree the credential
          # is silently absent and approle auth fails with a confusing error.
          grep -q 'TERRAPOD_VAULT_WITH_APPROLE_SECRET' /tmp/rendered-vault.yaml || {
            echo "the approle credential is not injected, or the env var name changed."
            echo "the chart and vault_source_service._secret_for() must derive the same name."
            exit 1
          }
          # Kubernetes auth stores no credential, so it must mint no env var.
          grep -q 'TERRAPOD_VAULT_KUBE_SECRET' /tmp/rendered-vault.yaml && {
            echo "kubernetes auth needs no stored credential but an env var was rendered"
            exit 1
          }
          # And the credential itself must never be in the ConfigMap.
          awk '/^kind: ConfigMap/,/^---/' /tmp/rendered-vault.yaml | grep -q 'existingSecret\|secret_id' && {
            echo "a Vault credential reference leaked into the ConfigMap"
            exit 1
          }
          # Lease revocation (#1649) is per instance: the one that sets it must
          # render true, and the one that does not must render the false default
          # (not be omitted), or an operator's opt-in is silently inert.
          cm=$(awk '/^kind: ConfigMap/,/^---/' /tmp/rendered-vault.yaml)
          echo "$cm" | grep -q 'revoke_leases: true' || {
            echo "vault.instances[].revoke_leases never reaches the rendered ConfigMap"
            echo "add a render line to templates/configmap-api.yaml"
            exit 1
          }
          echo "$cm" | grep -q 'revoke_leases: false' || {
            echo "an instance without revoke_leases must render the false default"
            exit 1
          }
          echo "vault config renders; credential is secretKeyRef-only"


      - name: (helm-smoke) Vault jwt auth projects its token, and a custom CA reaches the pod
        run: |
          # #1650. jwt auth reads an audience-scoped projected ServiceAccount
          # token; a per-instance CA is a Secret key mounted as a file. Both are
          # paths the ConfigMap tells the client to read, so the Deployment must
          # put a real file at exactly that path — or the first login fails with
          # "no such file" and nothing in the chart explains why.
          cat > /tmp/vault-jwt-values.yaml <<'EOF'
          api:
            config:
              vault:
                enabled: true
                instances:
                  - name: hcp
                    default: true
                    address: https://vault.example.com:8200
                    namespace: admin
                    auth: { method: jwt, role: terrapod }
                    tls: { ca_secret: vault-ca, ca_key: ca.pem }
                  - name: kube
                    address: https://vault2.example.com:8200
                    auth: { method: kubernetes, mount: kubernetes, role: terrapod }
          EOF
          render() {
            docker run --rm -v "$PWD:/chart" -v /tmp:/tmp -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
              template terrapod helm/terrapod \
              --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
              --set redis.url=redis://redis:6379 "$@"
          }
          render -f /tmp/vault-jwt-values.yaml > /tmp/rendered-vault-jwt.yaml
          cm=$(awk '/^kind: ConfigMap/,/^---/' /tmp/rendered-vault-jwt.yaml)
          dep=$(awk '/^kind: Deployment/,/^---/' /tmp/rendered-vault-jwt.yaml)

          # The ConfigMap carries the new keys, with the jwt defaults filled in.
          for want in 'method: "jwt"' 'mount: "jwt"' 'audience: "vault"' \
                      'token_path: "/var/run/secrets/terrapod/vault/hcp/token"' \
                      'ca_file: "/etc/terrapod/vault-ca/hcp/ca.crt"' \
                      'token_path: "/var/run/secrets/kubernetes.io/serviceaccount/token"'; do
            echo "$cm" | grep -qF "$want" || {
              echo "missing from the rendered ConfigMap: $want"
              echo "add a render line to templates/configmap-api.yaml"
              exit 1
            }
          done

          # The Deployment projects exactly the token the ConfigMap points at.
          echo "$dep" | grep -q 'serviceAccountToken:' || { echo "FAIL: no projected token for jwt"; exit 1; }
          echo "$dep" | grep -q 'audience: "vault"' || { echo "FAIL: projected token lacks the audience"; exit 1; }
          echo "$dep" | grep -q 'expirationSeconds: 600' || { echo "FAIL: projected token lifetime not 600s"; exit 1; }
          echo "$dep" | grep -q 'path: "hcp/token"' || { echo "FAIL: token not projected at <name>/token"; exit 1; }
          echo "$dep" | grep -q 'mountPath: /var/run/secrets/terrapod/vault' || { echo "FAIL: token volume not mounted"; exit 1; }
          # The kubernetes instance without an audience uses the standard SA
          # token, so it must add no projection of its own.
          echo "$dep" | grep -q 'path: "kube/token"' && { echo "FAIL: kubernetes without an audience was projected"; exit 1; }

          # The CA Secret key is mounted where ca_file says.
          echo "$dep" | grep -q 'name: "vault-ca"' || { echo "FAIL: CA Secret not mounted"; exit 1; }
          echo "$dep" | grep -q 'key: "ca.pem"' || { echo "FAIL: ca_key not honoured"; exit 1; }
          echo "$dep" | grep -q 'path: "hcp/ca.crt"' || { echo "FAIL: CA not mounted at <name>/ca.crt"; exit 1; }
          echo "$dep" | grep -q 'mountPath: /etc/terrapod/vault-ca' || { echo "FAIL: CA volume not mounted"; exit 1; }

          # jwt stores no credential, so it mints no Vault env var at all...
          echo "$dep" | grep -q 'TERRAPOD_VAULT_' && { echo "FAIL: jwt/kubernetes minted a Vault env var"; exit 1; }
          # ...and adds no plain-value TERRAPOD_* env: the set of those is the
          # same as a render with no Vault configured.
          plain_env() {
            awk '/^kind: Deployment/,/^---/' "$1" | grep -E -A1 -- '- name: TERRAPOD_' \
              | grep -E -B1 '^[[:space:]]+value:' | grep -oE 'TERRAPOD_[A-Z0-9_]+' | sort -u
          }
          render > /tmp/rendered-novault.yaml
          if [ "$(plain_env /tmp/rendered-vault-jwt.yaml)" != "$(plain_env /tmp/rendered-novault.yaml)" ]; then
            echo "FAIL: Vault config added a non-secret TERRAPOD_* env var to a Deployment:"
            diff <(plain_env /tmp/rendered-novault.yaml) <(plain_env /tmp/rendered-vault-jwt.yaml) || true
            exit 1
          fi

          # Without jwt (or an audience) there is nothing to project: the
          # approle/kubernetes render from the step above carries none.
          grep -q 'serviceAccountToken:\|vault-tokens' /tmp/rendered-vault.yaml && {
            echo "FAIL: a projected token rendered with no jwt instance"; exit 1
          }
          # Nor when the value source is off, even with a jwt instance listed:
          # a disabled block must not make the pod wait on a Secret.
          # Deployments only, and volume names only: the ConfigMap still carries
          # the ca_file path, which is harmless while the source is off.
          render -f /tmp/vault-jwt-values.yaml --set api.config.vault.enabled=false > /tmp/rendered-vault-off.yaml
          awk '/^kind: Deployment/,/^---/' /tmp/rendered-vault-off.yaml | grep -qE 'name: vault-(tokens|ca)$' && {
            echo "FAIL: Vault volumes rendered while api.config.vault.enabled is false"; exit 1
          }
          echo "vault jwt projects its token; the custom CA is mounted at ca_file"


      - name: (helm-smoke) Every SAML assertion check reaches the pod, in both positions
        run: |
          # The config-channel contract for the SAML hardening switches.
          #
          # These default to FALSE in the code (config.py: `Field(default=False)`
          # on all five), so the operator's action is to turn them ON, and the
          # render line is the part that can silently fail: `{{ if .want_assertions_signed }}`
          # would drop the key for an operator who set it, the code default would
          # stand, and their deliberate opt-IN would be inert — a deployment less
          # protected than its own values.yaml says. The opposite position is
          # asserted too, because `| default` treats false as empty and would
          # render the wrong value for someone who has deliberately written one:
          # harmless while the default is false, a lockout the moment it is not.
          #
          # (The carried version of this comment said these default to TRUE, which
          # contradicted the loop below it and is not what the code does.)
          #
          # Both halves matter for a different reason too: `validate_destination`
          # is what makes an assertion's Destination and Recipient mean anything,
          # and an IDP that cannot satisfy one of these checks needs the opt-out
          # to work or its operator cannot log in at all.
          cat > /tmp/saml-values.yaml <<'EOF'
          api:
            config:
              auth:
                callback_base_url: "https://terrapod.example.com"
                sso:
                  saml:
                    - name: strict-idp
                      metadata_url: https://idp.example.com/metadata
                      entity_id: "https://terrapod.example.com"
                      acs_url: "https://terrapod.example.com/api/terrapod/v1/auth/saml/acs"
                      validate_destination: true
                      validate_in_response_to: true
                      reject_replayed_assertions: true
                      want_assertions_signed: true
                      reject_deprecated_algorithm: true
                    - name: legacy-idp
                      metadata_url: https://old-idp.example.com/metadata
                      validate_destination: false
                      validate_in_response_to: false
                      reject_replayed_assertions: false
                      want_assertions_signed: false
                      reject_deprecated_algorithm: false
                    - name: silent-idp
                      metadata_url: https://quiet-idp.example.com/metadata
          EOF
          docker run --rm -v "$PWD:/chart" -v /tmp:/tmp -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
            --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
            --set redis.url=redis://redis:6379 \
            -f /tmp/saml-values.yaml > /tmp/rendered-saml.yaml

          cm=$(awk '/^kind: ConfigMap/,/^---/' /tmp/rendered-saml.yaml)

          # The ACS URL is what an assertion's Destination is checked against.
          echo "$cm" | grep -q 'acs_url: "https://terrapod.example.com/api/terrapod/v1/auth/saml/acs"' || {
            echo "auth.sso.saml[].acs_url never reaches the rendered ConfigMap"
            echo "add a render line to templates/configmap-api.yaml"
            exit 1
          }

          for key in validate_destination validate_in_response_to \
                     reject_replayed_assertions want_assertions_signed \
                     reject_deprecated_algorithm; do
            # On this release line these default to FALSE in code, so the
            # operator's action is to turn them ON. A swallowed `true` would
            # leave that opt-in inert and the deployment less protected than its
            # values.yaml says — the direction that matters here.
            echo "$cm" | grep -q "$key: true" || {
              echo "an operator's explicit true for $key never reaches the pod."
              echo "add a render line to templates/configmap-api.yaml; the code"
              echo "default on this line is false, so the opt-in would be inert."
              exit 1
            }
            # The opposite position too. `| default` treats false as empty, so a
            # template written that way renders the wrong value for an operator
            # who has deliberately written one — harmless while the code default
            # is false, and a lockout the moment it is not.
            echo "$cm" | grep -q "$key: false" || {
              echo "an operator's explicit false for $key is swallowed by the template."
              echo "use hasKey, not '| default'."
              exit 1
            }
            # And a provider that sets nothing renders nothing, so the code
            # default applies rather than a value the chart invented.
            count=$(echo "$cm" | grep -c "$key:" || true)
            [ "$count" = "2" ] || {
              echo "$key rendered $count times for three providers, two of which set it."
              echo "an unset switch must render no line at all."
              exit 1
            }
          done
          echo "the SAML assertion checks render in both positions, and an unset one does not"


      - name: (helm-smoke) Every retention key in values.yaml reaches the rendered ConfigMap
        run: |
          # Leg 3 of the config-channel contract. A key can be in values.yaml
          # and in values.schema.json and still be inert, because the operator
          # sets it, it never reaches the pod, and the code default silently
          # wins — the failure is invisible until someone notices retention
          # didn't do what they configured. Grep the RENDERED output, not the
          # template text, which is what catches a missing render line.
          docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
            --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
            --set redis.url=redis://redis:6379 > /tmp/rendered.yaml
          keys=$(awk '/^    artifact_retention:/{f=1;next} f&&/^      [a-z_]+:/{gsub(/:.*/,"");gsub(/ /,"");print} f&&/^    [a-z]/{exit}' helm/terrapod/values.yaml)
          if [ -z "$keys" ]; then echo "no artifact_retention keys found — check the awk filter"; exit 1; fi
          missing=""
          for k in $keys; do
            grep -q "^ *$k:" /tmp/rendered.yaml || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "These retention values never reach the pod — add a render line"
            echo "to templates/configmap-api.yaml:$missing"
            exit 1
          fi
          echo "all retention keys render:" $keys


      - name: (helm-smoke) The outbound-URL guard's settings reach the pod
        run: |
          # #1541. The guard decides where a user-supplied webhook may point, so
          # a value that never reaches the ConfigMap means an operator who
          # allow-lists their internal endpoint is silently ignored and their
          # webhooks stay broken — or, with block_private_addresses, that they
          # believe they tightened something they did not.
          #
          # Greps the RENDERED output, not the template, which is what catches a
          # missing render line.
          for k in block_private_addresses allowed_hosts allowed_cidrs; do
            grep -q "^ *$k:" /tmp/rendered.yaml || {
              echo "outbound_requests.$k never reaches the pod — add a render"
              echo "line to templates/configmap-api.yaml"
              exit 1
            }
          done
          # And the shipped default stays permissive: refusing private space by
          # default would break in-cluster webhook receivers, which is the
          # ordinary self-hosted case.
          grep -q "block_private_addresses: false" /tmp/rendered.yaml || {
            echo "the shipped default for block_private_addresses is no longer"
            echo "false — that breaks webhooks to in-cluster receivers"
            exit 1
          }
          echo "outbound_requests renders, and stays permissive by default"
          # It renders on its own, not under notifications: run-task callbacks
          # use it too, so an operator who nulls out notifications must keep a
          # tightened guard rather than silently fall back to the default.
          docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
            --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
            --set redis.url=redis://redis:6379 \
            --set api.config.notifications=null \
            --set api.config.outbound_requests.block_private_addresses=true > /tmp/rendered-no-notif.yaml
          grep -q "block_private_addresses: true" /tmp/rendered-no-notif.yaml || {
            echo "outbound_requests drops out of the ConfigMap when notifications is null"
            exit 1
          }
          echo "outbound_requests still renders with notifications null"


      - name: (helm-smoke) Two installs in one cluster cannot collide on a cluster-scoped name
        run: |
          # Terrapod is single-organization, so separating business units means
          # running an instance per tenant — two in one cluster is a topology we
          # recommend. A cluster-scoped object has no namespace to disambiguate
          # it, so the SAME release name in two namespaces must still render
          # distinct names, or one install silently breaks the other (#1181).
          render() {
            docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
              template terrapod helm/terrapod --namespace "$1" \
              --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
              --set redis.url=redis://redis:6379 \
            | awk '/^kind: Cluster|^kind: PriorityClass|^kind: .*WebhookConfiguration/ {k=1}
                   k && /^  name:/ {print $2; k=0}'
          }
          a=$(render bu-alpha)
          b=$(render bu-beta)
          echo "bu-alpha: $a"
          echo "bu-beta:  $b"
          if [ -z "$a" ]; then echo "no cluster-scoped objects found — check the awk filter"; exit 1; fi
          if [ -n "$(comm -12 <(echo "$a" | sort) <(echo "$b" | sort))" ]; then
            echo "FAIL: a cluster-scoped name is identical across namespaces."
            echo "Use the terrapod.clusterScopedName helper, not terrapod.fullname."
            exit 1
          fi


      - name: (helm-smoke) No config value renders in scientific notation (#1426)
        run: |
          # A values FILE yields float64, and Go renders a large float64 as
          # `1e+06` — which Pydantic refuses as an integer, so the API will not
          # boot. `--set` produces an int64 and cannot reproduce it, so this must
          # go through a file.
          #
          # Asserted as a CLASS rather than per key: any numeric setting added
          # later is covered without anyone remembering to extend this.
          cat > /tmp/big-values.yaml <<'YAML'
          api:
            config:
              artifact_retention:
                binary_cache_retention_days: 1000000
                provider_cache_retention_days: 1000000
              auth:
                api_token_max_ttl_hours: 1000000
              agent_pools:
                listener_cert_ttl_seconds: 1000000
              registry:
                oci:
                  upload_session_timeout_hours: 1000000
          YAML
          out=$(docker run --rm -v "$PWD:/chart" -v /tmp/big-values.yaml:/tmp/big-values.yaml -w /chart \
            "${HELM_IMAGE:-alpine/helm:3.17.2}" template terrapod helm/terrapod \
              --namespace terrapod \
              --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
              --set redis.url=redis://redis:6379 \
              -f /tmp/big-values.yaml)
          if echo "$out" | grep -vE '^\s*#' | grep -qE ':\s*[0-9]+(\.[0-9]+)?e\+[0-9]+\s*$'; then
            echo "FAIL: a config value rendered in scientific notation — the API will refuse it as an integer at startup. Wrap the render in | int64 (#1426):"
            echo "$out" | grep -E ':\s*[0-9]+(\.[0-9]+)?e\+[0-9]+\s*$'
            exit 1
          fi
          echo "No config value renders in scientific notation OK"

      - name: (helm-smoke) Stock install renders a working stack (web + Ingress + bootstrap)
        run: |
          out=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
              --namespace terrapod \
              --set ingress.enabled=true \
              --set ingress.hostname=terrapod.example.com \
              --set ingress.className=traefik \
              --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
              --set redis.url=redis://redis:6379 \
              --set bootstrap.adminEmail=admin@example.com \
              --set bootstrap.adminPassword=changeme)
          echo "$out" | grep -q "kind: Ingress" || { echo "FAIL: stock install rendered no Ingress"; exit 1; }
          echo "$out" | grep -q "app.kubernetes.io/component: web" || { echo "FAIL: web Deployment not rendered (broken default?)"; exit 1; }
          echo "$out" | grep -q "app.kubernetes.io/component: bootstrap" || { echo "FAIL: bootstrap Job not rendered"; exit 1; }
          # Execution-hooks kill-switch (#619) renders into runners.yaml on by
          # default (config-channel contract).
          echo "$out" | grep -q "hooks_enabled: true" || { echo "FAIL: runners.yaml hooks_enabled not rendered"; exit 1; }
          # Debug linger (#1764) reaches runners.yaml. Grepping the RENDERED
          # output, not the template: a values key with no render line is
          # silently inert, and the code default wins with nothing to show it.
          echo "$out" | grep -q "debug_linger_seconds: 1800" || { echo "FAIL: runners.yaml debug_linger_seconds not rendered"; exit 1; }
          # The Ansible execution environment's config, both halves (#2154).
          # Each is a values key whose only proof of reaching a pod is the
          # rendered output: the API resolves the default size, the listener
          # bounds how long a sidecar has to become ready, and a missing render
          # line on either leaves the code default winning silently.
          echo "$out" | grep -q "ee_startup_timeout_seconds: 600" || { echo "FAIL: runners.yaml ee_startup_timeout_seconds not rendered — a stalled execution environment would hang to the stale timeout with the operator's window ignored"; exit 1; }
          # #1977. Leg 3 of the config-channel contract: miss the render line
          # and the operator sets the value, it never reaches the pod, and the
          # code default wins silently. Greps the RENDERED output, not the
          # template, which is the only thing that catches it.
          echo "$out" | grep -q "configure_timeout_minutes: 180" || { echo "FAIL: runners.yaml configure_timeout_minutes not rendered — a configure would be killed at the builder's 60 minutes with the operator's ceiling ignored"; exit 1; }
          echo "$out" | grep -q "configure_no_progress_seconds: 1800" || { echo "FAIL: runners.yaml configure_no_progress_seconds not rendered — a wedged configure would burn its whole ceiling with nothing noticing"; exit 1; }
          echo "$out" | grep -q 'default_ee_resource_cpu: "500m"' || { echo "FAIL: config.yaml default_ee_resource_cpu not rendered — a workspace that sizes no EE would take the code default, ignoring the operator's"; exit 1; }
          echo "$out" | grep -q 'default_ee_resource_memory: "1Gi"' || { echo "FAIL: config.yaml default_ee_resource_memory not rendered"; exit 1; }
          # Which environments are selectable (#2154). The repository is what a
          # kubelet pulls and what the availability read lists, so a missing
          # render line leaves the code default winning while the operator's
          # own mirror is ignored -- and in a restricted network that means
          # every configure fails on an image it cannot reach. The TTL bounds a
          # mutable tag listing; without it a newly published line could never
          # be selected.
          echo "$out" | grep -q 'ee_repository: "ghcr.io/mattrobinsonsre/terrapod-ee"' || { echo "FAIL: config.yaml ansible.ee_repository not rendered — an operator pointing at their own mirror would be silently ignored"; exit 1; }
          echo "$out" | grep -q "availability_ttl_seconds: 300" || { echo "FAIL: config.yaml ansible.availability_ttl_seconds not rendered"; exit 1; }
          # Empty by default, so nothing should render -- an operator-supplied
          # environment is opt-in and must not appear from nowhere.
          echo "$out" | grep -q "execution_environments:" && { echo "FAIL: ansible.execution_environments rendered while empty"; exit 1; }
          # Slack integration (#556) is OFF by default: config renders but no
          # secret env is injected (no existingSecret) — config-channel contract.
          echo "$out" | grep -q "TERRAPOD_SLACK__" && { echo "FAIL: Slack secret env injected when disabled"; exit 1; }
          echo "Stock install renders web + Ingress + bootstrap + hooks_enabled OK"

      - name: (helm-smoke) Bootstrap seeds several agent pools without exposing a token (#1411)
        run: |
          out=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
              --namespace terrapod \
              --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
              --set redis.url=redis://redis:6379 \
              --set bootstrap.adminEmail=admin@example.com \
              --set bootstrap.adminPassword=changeme \
              --set 'bootstrap.pools[0].name=pool-a' \
              --set 'bootstrap.pools[0].existingSecret=pool-a-token' \
              --set 'bootstrap.pools[1].name=pool-b' \
              --set 'bootstrap.pools[1].existingSecret=pool-b-token' \
              --set 'bootstrap.pools[1].tokenKey=custom_key')
          echo "$out" | grep -q 'TERRAPOD_BOOTSTRAP_POOL_COUNT' || { echo "FAIL: pool count not rendered — the CLI would seed nothing (#1411)"; exit 1; }
          echo "$out" | grep -q 'TERRAPOD_BOOTSTRAP_POOL_1_NAME' || { echo "FAIL: only one pool rendered (#1411)"; exit 1; }
          echo "$out" | grep -q 'name: "pool-b-token"' || { echo "FAIL: the second pool's Secret is not referenced (#1411)"; exit 1; }
          echo "$out" | grep -q 'key: "custom_key"' || { echo "FAIL: per-pool tokenKey ignored (#1411)"; exit 1; }

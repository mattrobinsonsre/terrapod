name: CI

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]
    # Include `ready_for_review` so a PR opened in draft (which suppresses
    # the default `opened`/`synchronize` events) starts CI when it's
    # marked ready. Without this, draft-first PRs need a close+reopen to
    # get any CI run at all — caught while bringing up #371.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/mattrobinsonsre

  # Third-party images, pulled from our GHCR mirror rather than Docker Hub,
  # whose anonymous pull limit is shared across GitHub runners and turned four
  # unrelated PRs red in one morning (#1186). Every consuming script and
  # Dockerfile keeps its Docker Hub reference as the default, so a local build
  # is unaffected and needs no access to these packages; only CI overrides.
  # Refreshed by .github/workflows/mirror-images.yml from .github/mirror-images.txt.
  MIRROR: ghcr.io/mattrobinsonsre/mirror
  PYTHON_BASE_IMAGE: ghcr.io/mattrobinsonsre/mirror/python:3.13-slim
  NODE_BASE_IMAGE: ghcr.io/mattrobinsonsre/mirror/node:26-alpine
  NODE_IMAGE: ghcr.io/mattrobinsonsre/mirror/node:24-alpine
  POSTGRES_IMAGE: ghcr.io/mattrobinsonsre/mirror/postgres:16-alpine
  REDIS_IMAGE: ghcr.io/mattrobinsonsre/mirror/redis:7-alpine
  LOCALSTACK_IMAGE: ghcr.io/mattrobinsonsre/mirror/localstack-localstack:4
  HELM_IMAGE: ghcr.io/mattrobinsonsre/mirror/alpine-helm:3.17.2
  PY_IMAGE: ghcr.io/mattrobinsonsre/mirror/python:3.13-slim
  SEMGREP_IMAGE: ghcr.io/mattrobinsonsre/mirror/semgrep-semgrep:1.117
  BUILDKIT_IMAGE: ghcr.io/mattrobinsonsre/mirror/moby-buildkit:buildx-stable-1
  K3D_REGISTRY_IMAGE: ghcr.io/mattrobinsonsre/mirror/registry:2

jobs:
  # ── Prepare ────────────────────────────────────────────
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      sha_short: ${{ steps.meta.outputs.sha_short }}
      images_exist: ${{ steps.check.outputs.images_exist }}
      is_tag: ${{ steps.meta.outputs.is_tag }}
      is_pr: ${{ steps.meta.outputs.is_pr }}
      version: ${{ steps.meta.outputs.version }}
      pkg_refresh: ${{ steps.meta.outputs.pkg_refresh }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute metadata
        id: meta
        run: |
          sha_short="${GITHUB_SHA::7}"
          echo "sha_short=$sha_short" >> "$GITHUB_OUTPUT"

          # Busts the images' apt-upgrade layer once a day, so Debian security
          # patches published since the last build actually land. The Dockerfiles
          # carry a hardcoded default for local builds; leaving CI on that default
          # meant the layer stayed cached from whenever a human last bumped it,
          # and the upgrade silently stopped upgrading (#1177).
          #
          # Daily rather than per-run deliberately: $GITHUB_RUN_ID would rebuild
          # every image on every build and throw the cache away entirely.
          echo "pkg_refresh=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

          is_tag=false
          is_pr=false
          version=""

          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            is_tag=true
            version="${GITHUB_REF#refs/tags/}"
          fi

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            is_pr=true
          fi

          echo "is_tag=$is_tag" >> "$GITHUB_OUTPUT"
          echo "is_pr=$is_pr" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}

      - name: Check if images exist
        id: check
        run: |
          sha_short="${GITHUB_SHA::7}"
          images_exist=true

          for image in terrapod-api terrapod-web terrapod-runner terrapod-listener terrapod-migrations; do
            if ! docker manifest inspect "$REGISTRY/$image:sha-$sha_short" > /dev/null 2>&1; then
              echo "$image:sha-$sha_short not found"
              images_exist=false
              break
            fi
          done

          echo "images_exist=$images_exist" >> "$GITHUB_OUTPUT"
          echo "Images exist: $images_exist"

  # ── Python Lint ────────────────────────────────────────
  python-lint:
    name: Python Lint
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: scripts/lint.sh python

  # ── Frontend Lint ─────────────────────────────────────
  frontend-lint:
    name: Frontend Lint
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    # Literal, not ${{ env.* }}: the env context is NOT available in a job's
    # `container:` or in `services:` — using it there makes the whole workflow
    # invalid, which GitHub reports as NO checks rather than a failing one.
    container: ghcr.io/mattrobinsonsre/mirror/node:24-alpine
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript type-check
        run: npm run type-check
      - name: i18n completeness (every offered locale is 100% or it is not offered — #767)
        run: npm run i18n:check
      - name: i18n no-hardcoded-strings (no new untranslated JSX literals — #767)
        run: npm run i18n:lint
      - name: Unit tests (node:test — no test framework dependency)
        run: npm run test:unit

  # ── Provider Lint ─────────────────────────────────────
  provider-lint:
    name: Provider Lint
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      - name: Vet
        run: go vet ./...
        working-directory: provider
      - name: Build
        run: go build ./...
        working-directory: provider
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: provider
          args: --config=../.golangci.yml

  # ── Provider Test ────────────────────────────────────
  provider-test:
    name: Provider Test
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      - name: Test
        run: go test ./... -v -count=1 -timeout 120s
        working-directory: provider

  # ── go-terrapod Lint ──────────────────────────────────
  # The public Go SDK lives in go-terrapod/ with its own go.mod (no
  # provider/migrate-specific deps). Both terraform-provider-terrapod
  # and terrapod-migrate import from here.
  go-terrapod-lint:
    name: go-terrapod Lint
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-terrapod/go.mod
          cache-dependency-path: go-terrapod/go.sum
      - name: Vet
        run: go vet ./...
        working-directory: go-terrapod
      - name: Build
        run: go build ./...
        working-directory: go-terrapod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: go-terrapod
          args: --config=../.golangci.yml

  # ── go-terrapod Test ──────────────────────────────────
  go-terrapod-test:
    name: go-terrapod Test
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-terrapod/go.mod
          cache-dependency-path: go-terrapod/go.sum
      - name: Test
        run: go test ./... -v -count=1 -timeout 120s
        working-directory: go-terrapod

  # ── Migrate Lint ──────────────────────────────────────
  # The terrapod-migrate binary lives in migrate/ with its own go.mod
  # (the provider doesn't carry go-tfe or the HCL libs). Mirrors the
  # provider-lint shape so failures look the same to operators.
  migrate-lint:
    name: Migrate Lint
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: migrate/go.mod
          cache-dependency-path: migrate/go.sum
      - name: Vet
        run: go vet ./...
        working-directory: migrate
      - name: Build
        run: go build ./...
        working-directory: migrate
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: migrate
          args: --config=../.golangci.yml

  # ── Migrate Test ──────────────────────────────────────
  migrate-test:
    name: Migrate Test
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: migrate/go.mod
          cache-dependency-path: migrate/go.sum
      - name: Test
        run: go test ./... -v -count=1 -timeout 120s
        working-directory: migrate

  # ── Publish Lint ──────────────────────────────────────
  # terrapod-publish lives in publish/ with its own go.mod (pulls the
  # ProtonMail OpenPGP libs that the SDK doesn't). Mirrors migrate's shape.
  publish-lint:
    name: Publish Lint
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: publish/go.mod
          cache-dependency-path: publish/go.sum
      - name: Vet
        run: go vet ./...
        working-directory: publish
      - name: Build
        run: go build ./...
        working-directory: publish
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: publish
          args: --config=../.golangci.yml

  # ── Publish Test ──────────────────────────────────────
  publish-test:
    name: Publish Test
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: publish/go.mod
          cache-dependency-path: publish/go.sum
      - name: Test
        run: go test ./... -v -count=1 -timeout 120s
        working-directory: publish

  # ── Query Lint ────────────────────────────────────────
  query-lint:
    name: Query Lint
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: query/go.mod
          # Stdlib-only module — no go.sum, so nothing to cache.
          cache: false
      - name: Vet
        run: go vet ./...
        working-directory: query
      - name: Build
        run: go build ./...
        working-directory: query
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: query
          args: --config=../.golangci.yml

  # ── Query Test ────────────────────────────────────────
  query-test:
    name: Query Test
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: query/go.mod
          cache: false
      - name: Test
        run: go test ./... -v -count=1 -timeout 120s
        working-directory: query

  # ── MCP Lint ──────────────────────────────────────────
  mcp-lint:
    name: MCP Lint
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: mcp/go.mod
          cache: false
      - name: Vet
        run: go vet ./...
        working-directory: mcp
      - name: Build
        run: go build ./...
        working-directory: mcp
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: mcp
          args: --config=../.golangci.yml

  # ── MCP Test ──────────────────────────────────────────
  # Includes the tool-catalogue contract gate (TestToolCatalogue) — a
  # removed/renamed/retyped tool fails here (breaking; #550).
  mcp-test:
    name: MCP Test
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: mcp/go.mod
          cache: false
      - name: Test
        run: go test ./... -v -count=1 -timeout 120s
        working-directory: mcp

  # ── Build terrapod-query binary (baked into api + runner images) ──────
  build-query:
    name: Build terrapod-query (${{ matrix.goarch }})
    needs: prepare
    # Runs whenever images will be built (to bake the binary in) OR on a tag
    # (so release-query can attach the SAME linux binaries to the Release —
    # built once here, reused by both the image bake and the release, never
    # compiled twice).
    if: needs.prepare.outputs.images_exist != 'true' || needs.prepare.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: query/go.mod
          cache: false
      - name: Build linux/${{ matrix.goarch }}
        working-directory: query
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o "terrapod-query-linux-${{ matrix.goarch }}" ./cmd/terrapod-query
      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: terrapod-query-linux-${{ matrix.goarch }}
          path: query/terrapod-query-linux-${{ matrix.goarch }}
          retention-days: 1

  # ── Python Test ────────────────────────────────────────
  python-test:
    # Sharded by directory so each shard gets its own Postgres /
    # Redis / LocalStack stack via docker-compose.test.yml. Integration
    # tests hit a real DB and are race-prone under pytest-xdist within
    # one job; runner-level shards avoid that.
    #
    # Slice 1 — fast unit-ish (mock-based; no DB)
    # Slice 2 — services + api (mock-based; the bulk)
    # Slice 3 — integration (real Postgres; the slowest 12s tests live here)
    #
    # On a v0.35.0 main-run reference: combined 310s serial →
    # split slowest-shard ~75s (integration), others sub-60s.
    name: Python Test (${{ matrix.slice.name }})
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice:
          # pytest-xdist `-n auto` is enabled for the two mock-heavy
          # shards. Local bench (Apple M-series; CI ~50-60% of this):
          #   unit         90s serial → 13s parallel (1495 → 492 tests)
          #   services-api 138s serial → 30s parallel
          # The integration shard stays serial — its
          # session-scoped Postgres table-creation fixture races
          # under xdist workers (each worker would try to create
          # the same tables) and the suite is small enough that
          # serial is fine.
          - name: unit
            # Root-level tests/*.py are NOT auto-collected by the directory
            # shards below — each must be listed here explicitly, or it silently
            # never runs in CI. All of these are pure-unit (no Postgres/Redis/S3).
            paths: tests/auth tests/runner tests/storage tests/ai_eval tests/config tests/db tests/helm tests/oci tests/test_logging_config.py tests/test_dependency_pins.py tests/test_api_sdk_contract.py tests/test_schema_version.py tests/test_gpg_verify.py tests/test_http_retry.py tests/test_db_iam_auth.py tests/test_redis_iam_auth.py
            pytest_args: -n auto
          - name: services-api
            paths: tests/services tests/api
            pytest_args: -n auto
          - name: integration
            paths: tests/integration
            pytest_args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: scripts/test.sh python -- ${{ matrix.slice.pytest_args }} ${{ matrix.slice.paths }}

  # ── pricegen unit tests (#1025) ───────────────────────
  # The pricegen package (self-generated cost pricesheet, #893) is a standalone
  # pure-Python tool — it isn't copied into the services test image, so its unit
  # tests (adapters, engine, computed path, multi-region fetch/merge) run here.
  # Deps are just pyyaml + ijson (the same the weekly Pricesheet workflow uses);
  # no DB/Redis/network — the fetch tests monkeypatch the HTTP layer.
  pricegen-test:
    name: pricegen Test
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install pyyaml ijson pytest
      - name: Run pricegen unit tests
        run: python -m pytest pricegen/tests -v

  # ── Release re-scan script tests (#1212) ──────────────
  # The three `scripts/rescan_*.py` decide what a security channel says, and
  # their failure mode is silence rather than a crash: a normaliser reading the
  # wrong field reports zero findings and the run goes green. They are plain
  # stdlib files invoked by path (deliberately dependency-free, so the scheduled
  # workflow needs no install step), which also means they are not in the
  # services test image — so they run here, next to pricegen, for the same
  # reason. Pinned here: the two bugs that shipped, and the privacy split
  # (dependency findings may be public, code findings and per-release detail may
  # not).
  rescan-test:
    name: Security Scripts Test
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install pytest
      - name: Run the re-scan and register-review script tests
        run: python -m pytest scripts/tests -v

  # ── Migration smoke (#544) ────────────────────────────
  # The Python test tiers build the schema with `Base.metadata.create_all`, so
  # the migration files are never executed by any test. This one-shot job runs
  # the REAL `alembic upgrade head` against a Postgres, then seeds + queries
  # representative rows — catching a bad backfill / NOT-NULL-without-default on a
  # populated table that create_all would never exercise. Always-on (cheap,
  # ~2 min) rather than path-gated, so a models.py change that needs a migration
  # can't slip through by touching a file the filter missed.
  migration-check:
    name: Migration Smoke
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        # Literal for the same reason as `container:` above.
        image: ghcr.io/mattrobinsonsre/mirror/postgres:16-alpine
        env:
          POSTGRES_USER: terrapod
          POSTGRES_PASSWORD: terrapod
          POSTGRES_DB: terrapod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U terrapod"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://terrapod:terrapod@localhost:5432/terrapod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build migrations image
        run: docker build -f docker/Dockerfile.migrations -t tp-migrations:ci .
      - name: Run migrations (alembic upgrade head — the real migration files)
        run: docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" tp-migrations:ci
      - name: Seed representative rows + query the migrated schema
        run: |
          docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" \
            -v "$PWD/scripts/migration_smoke.py:/app/scripts/migration_smoke.py:ro" \
            --entrypoint python tp-migrations:ci scripts/migration_smoke.py

  # ── Dependency Audit (Python) ─────────────────────────
  python-audit:
    name: Python Audit
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    # Literal, not ${{ env.* }}: the env context is NOT available in a job's
    # `container:` or in `services:` — using it there makes the whole workflow
    # invalid, which GitHub reports as NO checks rather than a failing one.
    container: ghcr.io/mattrobinsonsre/mirror/python:3.13-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Poetry and export plugin
        run: pip install poetry poetry-plugin-export
      - name: Export requirements
        run: poetry export -f requirements.txt -o requirements.txt --without-hashes
        working-directory: services
      - name: Run pip-audit
        # Accepted advisories live in pentest/pip-audit-ignore.txt, each with
        # its reasoning and exit condition. Read from the file rather than
        # inlined here so that release-rescan.yml — which re-checks supported
        # releases against current reasoning — cannot drift from this gate.
        run: |
          pip install pip-audit
          # POSIX sh, not bash: this job runs in a slim container whose shell
          # has no arrays. $ignores is intentionally unquoted below so the
          # accumulated flags word-split into separate arguments.
          ignores=""
          while read -r line; do
            line="${line%%#*}"
            line="$(echo "$line" | tr -d '[:space:]')"
            [ -n "$line" ] && ignores="$ignores --ignore-vuln $line"
          done < pentest/pip-audit-ignore.txt
          # shellcheck disable=SC2086
          pip-audit -r services/requirements.txt --strict --desc $ignores

  # ── Dependency Audit (npm) ────────────────────────────
  npm-audit:
    name: npm Audit
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    # Literal, not ${{ env.* }}: the env context is NOT available in a job's
    # `container:` or in `services:` — using it there makes the whole workflow
    # invalid, which GitHub reports as NO checks rather than a failing one.
    container: ghcr.io/mattrobinsonsre/mirror/node:24-alpine
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install dependencies
        run: npm ci
      - name: Run npm audit
        # Fail on any high/critical advisory except those allowlisted in
        # pentest/npm-audit-allow.txt, which carries the reasoning and exit
        # condition for each (mirrors pip-audit's ignore file and trivy's
        # .trivyignore). Shared with release-rescan.yml so the two cannot drift.
        run: |
          npm audit --audit-level=high --json > audit.json || true
          node -e '
            const a = require("./audit.json");
            const allow = new Set(
              require("fs").readFileSync("../pentest/npm-audit-allow.txt", "utf8")
                .split("\n").map((l) => l.split("#")[0].trim()).filter(Boolean),
            );
            const bad = [];
            for (const [name, v] of Object.entries(a.vulnerabilities || {})) {
              if (!["high", "critical"].includes(v.severity)) continue;
              const ids = (v.via || [])
                .filter((x) => x && typeof x === "object" && x.url)
                .map((x) => x.url.split("/").pop());
              const unhandled = ids.filter((id) => !allow.has(id));
              if (unhandled.length) bad.push(`${name} [${v.severity}]: ${unhandled.join(", ")}`);
            }
            if (bad.length) {
              console.error("Non-allowlisted high/critical npm advisories:\n" + bad.join("\n"));
              process.exit(1);
            }
            console.log("npm audit: clean (only allowlisted advisories remain — see step comment).");
          '

  # ── Secret Scanning (gitleaks) ────────────────────────
  secret-scan:
    name: Secret Scan
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    container: zricethezav/gitleaks:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run gitleaks
        run: gitleaks detect --source . --no-git --config .gitleaks.toml

  # ── CodeQL (GitHub Advanced Security) ──────────────────
  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          config-file: .github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: codeql-${{ matrix.language }}

  # ── Dependency Review (PR only) ───────────────────────
  # Requires "Dependency graph" enabled in repo Settings > Code security
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ── Docs Audit ─────────────────────────────────────────
  docs-audit:
    name: Docs Audit
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pure-mechanism doc gates (#1389). No judgement, no network: a link
      # either resolves or it does not, a count either matches the code or it
      # does not. The failure mode they exist for is silent — a renamed heading
      # or a grown registry leaves the docs confidently wrong.
      - name: Cross-references resolve
        run: python3 scripts/docs-audit/check_links.py
      - name: Countable claims match the code
        run: python3 scripts/docs-audit/check_counts.py
      - name: Named targets, values and paths exist
        run: python3 scripts/docs-audit/check_references.py
      # Advisory: prints for human review, never fails. Telling a factual
      # boundary from a put-down is a judgement call.
      - name: Peer-fairness review list
        run: python3 scripts/docs-audit/check_peer_fairness.py

  # ── Helm Lint ──────────────────────────────────────────
  helm-lint:
    name: Helm Lint
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Helm lint (default values)
        run: |
          docker run --rm -v "$PWD:/chart" -w /chart \
            "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            lint helm/terrapod --values helm/terrapod/values.yaml
      - name: Helm lint (local dev values)
        run: |
          docker run --rm -v "$PWD:/chart" -w /chart \
            "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            lint helm/terrapod --values helm/terrapod/values.yaml --values helm/terrapod/values-local.yaml

  # ── Helm Smoke (render assertions) ─────────────────────
  # Catches broken chart DEFAULTS that `helm lint` does not — e.g. a stock
  # install that renders no working stack because a component default is off.
  # (Directly targets the web.enabled=false class of bug that shipped a
  # non-working chart: lint passed, but `helm install` produced no web/Ingress.)
  helm-smoke:
    name: Helm Smoke
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: No third-party image is pulled straight from Docker Hub
        run: |
          # The first pass at the mirror MISSED e2e/docker-compose.e2e.yml, which
          # duly failed a docs-only PR an hour later on a postgres pull. Grepping
          # for the shape is cheaper than remembering (#1186).
          #
          # The rule is OVERRIDABLE, not mirrored: every call site keeps its
          # Docker Hub reference as the default so a local run is unaffected and
          # needs no access to our packages. Only CI sets the override.
          third_party='postgres|redis|localstack/localstack|node|python|alpine/helm|semgrep/semgrep|aquasec/trivy|registry|moby/buildkit'
          files=$(git ls-files 'docker-compose*.yml' '*/docker-compose*.yml')
          if [ -z "$files" ]; then echo "no compose files found — the guard is not looking anywhere"; exit 1; fi
          echo "checking: $files"
          bad=$(grep -HnE "^[[:space:]]*image:[[:space:]]*($third_party)[:@]" $files || true)
          if [ -n "$bad" ]; then
            echo "These pull straight from Docker Hub, whose anonymous rate limit"
            echo "turns unrelated PRs red:"
            echo "$bad"
            echo
            echo 'Wrap as ${VAR:-upstream-ref} and add VAR to the env block in'
            echo "ci.yml. See .github/mirror-images.txt."
            exit 1
          fi
          # And every mirror image ci.yml names must actually be on the list, or
          # the copy never happens and CI asks GHCR for something absent.
          listed=$(grep -vE '^\s*(#|$)' .github/mirror-images.txt | sed 's|/|-|g; s|:.*||' | sort -u)
          used=$(grep -oE 'ghcr\.io/[^/]+/mirror/[a-z0-9-]+:' .github/workflows/ci.yml \
                 | sed 's|.*/mirror/||; s|:$||' | sort -u)
          missing=$(comm -13 <(echo "$listed") <(echo "$used"))
          if [ -n "$missing" ]; then
            echo "ci.yml points at mirror images not in the list: $missing"; exit 1
          fi
          echo "all third-party images are overridable, and every mirror ref is listed"

      - name: Every retention key in values.yaml reaches the rendered ConfigMap
        run: |
          # Leg 3 of the config-channel contract. A key can be in values.yaml
          # and in values.schema.json and still be inert, because the operator
          # sets it, it never reaches the pod, and the code default silently
          # wins — the failure is invisible until someone notices retention
          # didn't do what they configured. Grep the RENDERED output, not the
          # template text, which is what catches a missing render line.
          docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
            --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
            --set redis.url=redis://redis:6379 > /tmp/rendered.yaml
          keys=$(awk '/^    artifact_retention:/{f=1;next} f&&/^      [a-z_]+:/{gsub(/:.*/,"");gsub(/ /,"");print} f&&/^    [a-z]/{exit}' helm/terrapod/values.yaml)
          if [ -z "$keys" ]; then echo "no artifact_retention keys found — check the awk filter"; exit 1; fi
          missing=""
          for k in $keys; do
            grep -q "^ *$k:" /tmp/rendered.yaml || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "These retention values never reach the pod — add a render line"
            echo "to templates/configmap-api.yaml:$missing"
            exit 1
          fi
          echo "all retention keys render:" $keys

      - name: Two installs in one cluster cannot collide on a cluster-scoped name
        run: |
          # Terrapod is single-organization, so separating business units means
          # running an instance per tenant — two in one cluster is a topology we
          # recommend. A cluster-scoped object has no namespace to disambiguate
          # it, so the SAME release name in two namespaces must still render
          # distinct names, or one install silently breaks the other (#1181).
          render() {
            docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
              template terrapod helm/terrapod --namespace "$1" \
              --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
              --set redis.url=redis://redis:6379 \
            | awk '/^kind: Cluster|^kind: PriorityClass|^kind: .*WebhookConfiguration/ {k=1}
                   k && /^  name:/ {print $2; k=0}'
          }
          a=$(render bu-alpha)
          b=$(render bu-beta)
          echo "bu-alpha: $a"
          echo "bu-beta:  $b"
          if [ -z "$a" ]; then echo "no cluster-scoped objects found — check the awk filter"; exit 1; fi
          if [ -n "$(comm -12 <(echo "$a" | sort) <(echo "$b" | sort))" ]; then
            echo "FAIL: a cluster-scoped name is identical across namespaces."
            echo "Use the terrapod.clusterScopedName helper, not terrapod.fullname."
            exit 1
          fi

      - name: Stock install renders a working stack (web + Ingress + bootstrap)
        run: |
          out=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
              --namespace terrapod \
              --set ingress.enabled=true \
              --set ingress.hostname=terrapod.example.com \
              --set ingress.className=traefik \
              --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
              --set redis.url=redis://redis:6379 \
              --set bootstrap.adminEmail=admin@example.com \
              --set bootstrap.adminPassword=changeme)
          echo "$out" | grep -q "kind: Ingress" || { echo "FAIL: stock install rendered no Ingress"; exit 1; }
          echo "$out" | grep -q "app.kubernetes.io/component: web" || { echo "FAIL: web Deployment not rendered (broken default?)"; exit 1; }
          echo "$out" | grep -q "app.kubernetes.io/component: bootstrap" || { echo "FAIL: bootstrap Job not rendered"; exit 1; }
          # Execution-hooks kill-switch (#619) renders into runners.yaml on by
          # default (config-channel contract).
          echo "$out" | grep -q "hooks_enabled: true" || { echo "FAIL: runners.yaml hooks_enabled not rendered"; exit 1; }
          # Slack integration (#556) is OFF by default: config renders but no
          # secret env is injected (no existingSecret) — config-channel contract.
          echo "$out" | grep -q "TERRAPOD_SLACK__" && { echo "FAIL: Slack secret env injected when disabled"; exit 1; }
          echo "Stock install renders web + Ingress + bootstrap + hooks_enabled OK"
      - name: Bootstrap seeds several agent pools without exposing a token (#1411)
        run: |
          out=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
              --namespace terrapod \
              --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
              --set redis.url=redis://redis:6379 \
              --set bootstrap.adminEmail=admin@example.com \
              --set bootstrap.adminPassword=changeme \
              --set 'bootstrap.pools[0].name=pool-a' \
              --set 'bootstrap.pools[0].existingSecret=pool-a-token' \
              --set 'bootstrap.pools[1].name=pool-b' \
              --set 'bootstrap.pools[1].existingSecret=pool-b-token' \
              --set 'bootstrap.pools[1].tokenKey=custom_key')
          echo "$out" | grep -q 'TERRAPOD_BOOTSTRAP_POOL_COUNT' || { echo "FAIL: pool count not rendered — the CLI would seed nothing (#1411)"; exit 1; }
          echo "$out" | grep -q 'TERRAPOD_BOOTSTRAP_POOL_1_NAME' || { echo "FAIL: only one pool rendered (#1411)"; exit 1; }
          echo "$out" | grep -q 'name: "pool-b-token"' || { echo "FAIL: the second pool's Secret is not referenced (#1411)"; exit 1; }
          echo "$out" | grep -q 'key: "custom_key"' || { echo "FAIL: per-pool tokenKey ignored (#1411)"; exit 1; }
          # The point of secretKeyRef: no join token may appear as a literal in
          # the rendered Job, or it lands in the Helm release and in state.
          if echo "$out" | grep -E 'TERRAPOD_BOOTSTRAP_POOL_[0-9]+_TOKEN' -A 1 | grep -q 'value:'; then
            echo "FAIL: a join token rendered as a literal value instead of a secretKeyRef (#1411)"; exit 1
          fi
          echo "Multi-pool bootstrap renders with tokens by secretKeyRef OK"
      - name: Local dev values render
        run: |
          out=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
              --values helm/terrapod/values.yaml \
              --values helm/terrapod/values-local.yaml)
          # Slack config-channel: non-secret settings render into config.yaml,
          # secret tokens arrive via secretKeyRef env (never the ConfigMap).
          echo "$out" | grep -q "socket_mode: true" || { echo "FAIL: slack config not rendered into config.yaml"; exit 1; }
          echo "$out" | grep -q 'command: "/terrapod"' || { echo "FAIL: slack command not rendered into config.yaml (#691)"; exit 1; }
          echo "$out" | grep -q 'label: ""' || { echo "FAIL: slack label not rendered into config.yaml (#691)"; exit 1; }
          echo "$out" | grep -q "TERRAPOD_SLACK__BOT_TOKEN" || { echo "FAIL: slack bot-token secretKeyRef env missing"; exit 1; }
          # Cost estimation (#871): non-secret config renders into config.yaml.
          echo "$out" | grep -q "cost_estimation:" || { echo "FAIL: cost_estimation config not rendered into config.yaml (#871)"; exit 1; }
          echo "$out" | grep -q "prices_url:" || { echo "FAIL: cost_estimation.prices_url not rendered (#871)"; exit 1; }
          echo "$out" | grep -q "default_region:" || { echo "FAIL: cost_estimation.default_region not rendered (#871)"; exit 1; }
          # Platform tools (#1208): opa/trivy/checkov are no longer baked into the
          # images, so these versions are the ONLY thing telling a runner what to
          # fetch. A missing render line leaves the value inert and the code default
          # silently wins — which for the policy gate means a run that cannot be
          # evaluated. Assert the block and every version reaches the ConfigMap.
          echo "$out" | grep -q "platform_tools:" || { echo "FAIL: platform_tools config not rendered into config.yaml (#1208)"; exit 1; }
          echo "$out" | grep -q "opa_version:" || { echo "FAIL: platform_tools.opa_version not rendered — the policy gate would have no binary to fetch (#1208)"; exit 1; }
          echo "$out" | grep -q "trivy_version:" || { echo "FAIL: platform_tools.trivy_version not rendered (#1208)"; exit 1; }
          echo "$out" | grep -q "checkov_version:" || { echo "FAIL: platform_tools.checkov_version not rendered — checkov is the default scan engine (#1208)"; exit 1; }
          echo "$out" | grep -q "ha:" || { echo "FAIL: ha config not rendered into config.yaml (#960)"; exit 1; }
          echo "$out" | grep -q 'role: "leader"' || { echo "FAIL: ha.role must default to leader — an auto default takes single-node installs inert (#960)"; exit 1; }
          echo "$out" | grep -q "replication:" || { echo "FAIL: ha.replication not rendered into config.yaml (#1110)"; exit 1; }
          echo "$out" | grep -A2 "replication:" | grep -q "enabled: false" || { echo "FAIL: ha.replication.enabled must default to false — replication is meaningless without a peer (#1110)"; exit 1; }
          if echo "$out" | grep -q "client_secret"; then echo "FAIL: the peer client secret must never reach the ConfigMap — it is a credential (#1110)"; exit 1; fi

          # Peering is Helm-seeded and database-persisted (#1169): the inbound
          # client id must reach the ConfigMap (or the reconcile has nothing to
          # act on and the operator's values are silently inert), while its
          # secret must arrive by secretKeyRef like every other credential.
          inbound=$(helm template ./helm/terrapod \
            --set api.config.ha.peer.inbound.client_id=peer-b \
            --set api.config.ha.peer.inbound.name="Node B" \
            --set api.config.ha.peer.inbound.existingSecret=tp-peer)
          echo "$inbound" | grep -q "inbound:" || { echo "FAIL: ha.peer.inbound not rendered into config.yaml (#1169)"; exit 1; }
          echo "$inbound" | grep -q 'client_id: "peer-b"' || { echo "FAIL: ha.peer.inbound.client_id not rendered — the reconcile would have nothing to act on (#1169)"; exit 1; }
          echo "$inbound" | grep -q "TERRAPOD_HA__PEER__INBOUND__CLIENT_SECRET" || { echo "FAIL: the inbound secret must reach the pod by secretKeyRef, or declarative setup is impossible (#1169)"; exit 1; }
          if echo "$inbound" | grep -A6 "inbound:" | grep -q "client_secret"; then echo "FAIL: the inbound secret must never reach the ConfigMap — it is a credential (#1169)"; exit 1; fi
          # OCI registry pull-through (#1408). Upstream credentials are per
          # registry — registries are independent trust domains, so one shared
          # Secret would hand every upstream's credential to whichever the client
          # happens to name. Hosts and username belong in the ConfigMap; the
          # password must only ever arrive by secretKeyRef.
          oci=$(helm template ./helm/terrapod \
            --set api.config.registry.oci.upstreams[0].host=quay.io \
            --set api.config.registry.oci.upstreams[1].host=registry.example.com \
            --set api.config.registry.oci.upstreams[1].username=robot \
            --set api.config.registry.oci.upstreams[1].existingSecret=tp-upstream)
          echo "$oci" | grep -q "oci:" || { echo "FAIL: registry.oci not rendered into config.yaml — the operator's values would be silently inert (#1408)"; exit 1; }
          echo "$oci" | grep -q 'host: "quay.io"' || { echo "FAIL: registry.oci.upstreams not rendered — pull-through is an allow-list, so an unrendered entry means the upstream is unreachable (#1408)"; exit 1; }
          echo "$oci" | grep -q "TERRAPOD_OCI_UPSTREAM_REGISTRY_EXAMPLE_COM_PASSWORD" || { echo "FAIL: the per-upstream password must reach the pod by secretKeyRef, or an authenticated upstream silently falls back to anonymous (#1408)"; exit 1; }
          if echo "$oci" | grep -A12 "^ *oci:" | grep -qi "password"; then echo "FAIL: an upstream password must never reach the ConfigMap — it is a credential (#1408)"; exit 1; fi
          if echo "$oci" | grep -q "TERRAPOD_OCI_UPSTREAM_QUAY_IO_PASSWORD"; then echo "FAIL: an anonymous upstream must not get a password env var (#1408)"; exit 1; fi
          echo "$oci" | grep -q "upload_session_timeout_hours:" || { echo "FAIL: registry.oci.upload_session_timeout_hours not rendered — the abandoned-upload reaper would silently use the code default and an operator's longer window would be ignored (#1408)"; exit 1; }
          echo "$out" | grep -q "component_status:" || { echo "FAIL: ha.component_status not rendered into config.yaml (#1122)"; exit 1; }
          echo "$out" | grep -q "kind: Role" || { echo "FAIL: the API component-status Role must render when enabled (#1122)"; exit 1; }
          echo "$out" | grep -A16 "name: .*-component-status" | grep -q 'resources: \["deployments"\]' || { echo "FAIL: the component-status Role needs Deployments for ready-vs-desired, not just pods (#1122)"; exit 1; }
          echo "$out" | grep -A20 "name: .*-component-status" | grep -q 'resources: \["poddisruptionbudgets"\]' || { echo "FAIL: the component-status Role needs PDBs — a PDB that permits no eviction stalls node drains, and that is unreadable without it (#1128)"; exit 1; }
          # Node read is on by default: it is what tells an AVOIDABLE placement
          # concentration from an inevitable one, so without it every finding
          # would have to be suppressed to stay honest.
          echo "$out" | grep -q "read_nodes: true" || { echo "FAIL: ha.component_status.read_nodes must render and default to true (#1128)"; exit 1; }
          echo "$out" | grep -q "kind: ClusterRole" || { echo "FAIL: the node-reader ClusterRole must render when read_nodes is on (#1128)"; exit 1; }
          echo "$out" | grep -A14 "name: .*-node-reader" | grep -q 'resources: \["nodes"\]' || { echo "FAIL: the node-reader ClusterRole must grant nodes (#1128)"; exit 1; }
          echo "$out" | grep -A14 "name: .*-node-reader" | grep -qE 'verbs: \["get", "list"\]' || { echo "FAIL: the node-reader ClusterRole must stay READ-ONLY (#1128)"; exit 1; }
          # Module repos poll on their own, longer interval (#1149). Both legs
          # must render: a missing render line makes the value silently inert.
          echo "$out" | grep -q "poll_interval_seconds: 60" || { echo "FAIL: vcs.poll_interval_seconds must render and default to 60 — the workspace interval is the latency-sensitive one (#1149)"; exit 1; }
          echo "$out" | grep -q "module_poll_interval_seconds: 300" || { echo "FAIL: vcs.module_poll_interval_seconds must render and default to 300 (#1149)"; exit 1; }
          # Per-class object-store policy (#1151). `verify` observes the whole
          # store and commits the operator to nothing, so it is the default; a
          # missing render line would make the whole block silently inert.
          echo "$out" | grep -q "blobs:" || { echo "FAIL: ha.blobs not rendered into config.yaml (#1151)"; exit 1; }
          echo "$out" | grep -A2 "blobs:" | grep -q 'mode: "verify"' || { echo "FAIL: ha.blobs.mode must render and default to verify (#1151)"; exit 1; }
          # The copy budget (#1159). `| int64` in the template is load-bearing:
          # Helm renders 25000000 as 2.5e+07 without it, which is a float and not
          # the int the config model wants — the v0.30.1 hotfix all over again.
          echo "$out" | grep -q "max_bytes_per_second: 25000000" || { echo "FAIL: ha.blobs.max_bytes_per_second must render as an INTEGER, not scientific notation (#1159)"; exit 1; }
          echo "$out" | grep -q "max_bytes_per_cycle: 0" || { echo "FAIL: ha.blobs.max_bytes_per_cycle must render, and 0 must survive (0 = no cap) (#1159)"; exit 1; }
          echo "$out" | grep -q "interval_seconds: 300" || { echo "FAIL: ha.blobs.interval_seconds must render (#1159)"; exit 1; }
          echo "$out" | grep -q "probe_interval_seconds:" || { echo "FAIL: ha.probe_interval_seconds not rendered (#960)"; exit 1; }
          echo "$out" | grep -q "probe_threshold:" || { echo "FAIL: ha.probe_threshold not rendered (#960)"; exit 1; }
          # AI architecture critic (#1036 Part 2): non-secret config renders into
          # config.yaml; the auth api_key is NEVER rendered (secret via env only).
          echo "$out" | grep -q "ai_architecture:" || { echo "FAIL: ai_architecture config not rendered into config.yaml (#1036)"; exit 1; }
          echo "$out" | grep -q 'aws_session_name: "terrapod-ai-architecture"' || { echo "FAIL: ai_architecture auth not rendered (#1036)"; exit 1; }
          # The auth api_key must never render as a config KEY (it arrives via env
          # only). Match `api_key:` specifically — the block's explanatory comment
          # mentions "api_key" in prose, which is not a leak.
          echo "$out" | grep -qE '^\s*api_key:' && { echo "FAIL: api_key rendered as a config key in the ConfigMap"; exit 1; } || true
          echo "values-local renders OK (incl. Slack config + secretKeyRef)"
      - name: Declining the node read is supported (#1128)
        run: |
          out=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
              --values helm/terrapod/values.yaml \
              --values helm/terrapod/values-local.yaml \
              --set api.config.ha.component_status.read_nodes=false)
          if echo "$out" | grep -q "kind: ClusterRole"; then echo "FAIL: read_nodes=false must create no ClusterRole — an install that forbids cluster scope has to be able to opt out (#1128)"; exit 1; fi
          # The namespace-scoped half must survive the opt-out: placement is
          # still reported from our own pods, only zone spread goes unknown.
          echo "$out" | grep -q "name: .*-component-status" || { echo "FAIL: declining the node read must not disable component status (#1128)"; exit 1; }
          echo "read_nodes opt-out renders OK"
      - name: Per-class object-store policy renders, and a typo is refused (#1151)
        run: |
          out=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
              --values helm/terrapod/values.yaml \
              --set api.config.ha.blobs.classes.state=copy \
              --set api.config.ha.blobs.classes.run_logs=off)
          # The -A window must clear every scalar BETWEEN `blobs:` and `classes:`
          # (mode + the four copy-budget keys), so it is generous on purpose:
          # a window sized to today's block silently stops reaching the thing it
          # asserts the moment a key is added above it.
          echo "$out" | grep -A12 "blobs:" | grep -q "state: copy" || { echo "FAIL: a per-class override must reach the ConfigMap (#1151)"; exit 1; }
          # The selectivity #1114 asks for: copy what cannot be regenerated,
          # ignore the history. Both halves have to survive the render.
          echo "$out" | grep -A12 "blobs:" | grep -q "run_logs:" || { echo "FAIL: an 'off' class must reach the ConfigMap too (#1151)"; exit 1; }
          # A typo'd class name is the worst outcome available — a class the
          # operator believes they configured, silently on the default. The
          # schema refuses it here; HABlobsConfig refuses it again at startup for
          # the paths the chart never sees.
          if docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
               template terrapod helm/terrapod \
                 --values helm/terrapod/values.yaml \
                 --set api.config.ha.blobs.classes.stat=copy >/dev/null 2>&1; then
            echo "FAIL: an unknown blob class name must be rejected by values.schema.json (#1151)"; exit 1
          fi
          echo "per-class blob policy renders OK, unknown class refused"
      - name: Eval values render (embedded Postgres/Redis)
        run: |
          out=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
              --values helm/terrapod/values-eval.yaml)
          echo "$out" | grep -q "component: postgresql" || { echo "FAIL: values-eval did not render embedded Postgres"; exit 1; }
          echo "$out" | grep -q "component: redis" || { echo "FAIL: values-eval did not render embedded Redis"; exit 1; }
          echo "$out" | grep -q "kind: PersistentVolumeClaim" || { echo "FAIL: embedded Postgres PVC missing"; exit 1; }
          # Platform tools (#1208): the eval profile must still pin opa/trivy/checkov,
          # or a one-command eval silently loses policy evaluation and security
          # scanning the moment someone tries them. The eval stack fetches them on
          # first use — the same egress it already needs for the provider and
          # binary caches — so what has to hold here is that it knows WHAT to fetch.
          echo "$out" | grep -q "opa_version:" || { echo "FAIL: values-eval renders no opa_version — eval would lose policy evaluation (#1208)"; exit 1; }
          echo "$out" | grep -q "checkov_version:" || { echo "FAIL: values-eval renders no checkov_version — eval would lose security scanning (#1208)"; exit 1; }
          echo "values-eval renders embedded datastores + platform-tool versions OK"
      - name: Forward proxy + custom CA bundle render (#592)
        run: |
          out=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
              --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
              --set redis.url=redis://redis:6379 \
              --set listener.enabled=true \
              --set listener.joinToken=tok \
              --set proxy.enabled=true \
              --set proxy.httpProxy=http://proxy.example.com:3128 \
              --set proxy.httpsProxy=http://proxy.example.com:3128 \
              --set caBundle.enabled=true \
              --set-string caBundle.inline="dummy-ca-pem")
          # Proxy env reaches API + listener.
          echo "$out" | grep -q "HTTPS_PROXY" || { echo "FAIL: HTTPS_PROXY not injected"; exit 1; }
          # The custom CA ConfigMap is created from inline.
          echo "$out" | grep -q "name: terrapod-ca-bundle" || { echo "FAIL: CA bundle ConfigMap missing"; exit 1; }
          # API/listener get the merge init container + merged SSL_CERT_FILE.
          echo "$out" | grep -q "name: ca-merge" || { echo "FAIL: ca-merge init container missing"; exit 1; }
          echo "$out" | grep -q "/etc/terrapod-ca/ca-bundle.crt" || { echo "FAIL: SSL_CERT_FILE not pointed at merged bundle"; exit 1; }
          # Web (Node) trusts the raw source via NODE_EXTRA_CA_CERTS.
          echo "$out" | grep -q "NODE_EXTRA_CA_CERTS" || { echo "FAIL: web NODE_EXTRA_CA_CERTS missing"; exit 1; }
          # runners.yaml carries the proxy + CA source path for the listener to
          # forward into runner Jobs.
          echo "$out" | grep -q "ca_bundle_source_path" || { echo "FAIL: runners.yaml CA source path missing"; exit 1; }
          echo "$out" | grep -q "http_proxy: \"http://proxy.example.com:3128\"" || { echo "FAIL: runners.yaml proxy missing"; exit 1; }
          echo "proxy + CA bundle render OK (#592)"
      - name: Observability bundle render — PrometheusRule + Grafana dashboards (#546)
        run: |
          # Every bundled dashboard JSON is valid JSON before it's embedded.
          # (jq is preinstalled on GitHub ubuntu-latest runners.)
          for f in helm/terrapod/dashboards/*.json; do
            jq -e . "$f" > /dev/null || { echo "FAIL: invalid dashboard JSON: $f"; exit 1; }
          done
          out=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
              --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
              --set redis.url=redis://redis:6379 \
              --set api.config.metrics.prometheusRule.enabled=true \
              --set api.config.metrics.grafanaDashboards.enabled=true)
          echo "$out" | grep -q "kind: PrometheusRule" || { echo "FAIL: PrometheusRule not rendered"; exit 1; }
          echo "$out" | grep -q "alert: TerrapodAPIDown" || { echo "FAIL: bundled alert rules missing"; exit 1; }
          echo "$out" | grep -q "runbook_url:" || { echo "FAIL: alerts missing runbook_url annotation"; exit 1; }
          echo "$out" | grep -q "grafana_dashboard:" || { echo "FAIL: Grafana dashboard sidecar label missing"; exit 1; }
          echo "$out" | grep -q "terrapod-overview.json:" || { echo "FAIL: dashboard ConfigMap key missing"; exit 1; }
          # Off by default: a stock render emits neither.
          stock=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
              --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
              --set redis.url=redis://redis:6379)
          echo "$stock" | grep -q "kind: PrometheusRule" && { echo "FAIL: PrometheusRule rendered by default (should be opt-in)"; exit 1; }
          echo "observability bundle renders OK and is off by default (#546)"
      - name: Backup + DR-drill CronJobs render and are off by default (#545)
        run: |
          out=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
              --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
              --set redis.url=redis://redis:6379 \
              --set backup.enabled=true \
              --set backup.restoreVerify.enabled=true)
          echo "$out" | grep -q "kind: CronJob" || { echo "FAIL: backup CronJob not rendered"; exit 1; }
          echo "$out" | grep -q "terrapod.cli.backup" || { echo "FAIL: backup entrypoint missing"; exit 1; }
          echo "$out" | grep -q "terrapod.cli.restore_verify" || { echo "FAIL: restore-verify entrypoint missing"; exit 1; }
          echo "$out" | grep -q "restartPolicy: Always" || { echo "FAIL: throwaway-postgres native sidecar missing"; exit 1; }
          echo "$out" | grep -q "component: backup" || { echo "FAIL: backup component label missing"; exit 1; }
          # config.yaml carries the backup settings (config-channel contract).
          echo "$out" | grep -q "retention_keep:" || { echo "FAIL: backup config not rendered into config.yaml"; exit 1; }
          # Off by default.
          stock=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
              --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
              --set redis.url=redis://redis:6379)
          echo "$stock" | grep -q "component: backup" && { echo "FAIL: backup CronJob rendered by default (should be opt-in)"; exit 1; }
          echo "backup + DR-drill CronJobs render OK and are off by default (#545)"
      - name: Preflight identity-doctor Jobs render and are off by default (#571)
        run: |
          out=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
              --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
              --set redis.url=redis://redis:6379 \
              --set api.config.storage.backend=s3 --set api.config.storage.s3.bucket=b \
              --set preflight.enabled=true)
          echo "$out" | grep -q "terrapod.cli.preflight" || { echo "FAIL: preflight entrypoint missing"; exit 1; }
          echo "$out" | grep -q "component: preflight" || { echo "FAIL: preflight component label missing"; exit 1; }
          echo "$out" | grep -q "preflight-runner" || { echo "FAIL: runner-SA preflight Job missing (s3 backend)"; exit 1; }
          echo "$out" | grep -q 'helm.sh/hook' || { echo "FAIL: preflight not a Helm hook"; exit 1; }
          # Off by default.
          stock=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
              --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
              --set redis.url=redis://redis:6379)
          echo "$stock" | grep -q "component: preflight" && { echo "FAIL: preflight rendered by default (should be opt-in)"; exit 1; }
          echo "preflight Jobs render OK and are off by default (#571)"
      - name: Encryption-at-rest config + secret wiring (#553)
        run: |
          out=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
              --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
              --set redis.url=redis://redis:6379 \
              --set api.config.encryption.enabled=true \
              --set api.config.encryption.existingSecret=tp-enc)
          echo "$out" | grep -q "encryption:" || { echo "FAIL: encryption block not in config.yaml"; exit 1; }
          echo "$out" | grep -q "TERRAPOD_ENCRYPTION__STATIC_KEY" || { echo "FAIL: static-key secretKeyRef missing"; exit 1; }
          echo "$out" | grep -q "TERRAPOD_ENCRYPTION__VAULT_TOKEN" || { echo "FAIL: vault-token secretKeyRef missing"; exit 1; }
          # Secret values never rendered into a ConfigMap.
          echo "$out" | awk '/kind: ConfigMap/,/^---/' | grep -q "static_key\|vault_token" && { echo "FAIL: secret key leaked into ConfigMap"; exit 1; }
          # Off by default — no encryption block enabled.
          stock=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
              --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
              --set redis.url=redis://redis:6379)
          echo "$stock" | grep -A1 "encryption:" | grep -q "enabled: true" && { echo "FAIL: encryption enabled by default"; exit 1; }
          echo "encryption-at-rest config + secret wiring OK and off by default (#553)"
      - name: Control-plane PriorityClasses render and are off by default (#751)
        run: |
          out=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
              --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
              --set redis.url=redis://redis:6379 \
              --set priorityClasses.create=true)
          echo "$out" | grep -q "kind: PriorityClass" || { echo "FAIL: PriorityClass not rendered when create=true"; exit 1; }
          echo "$out" | grep -q "name: terrapod-control-plane" || { echo "FAIL: control-plane PriorityClass missing"; exit 1; }
          echo "$out" | grep -q "name: terrapod-runner" || { echo "FAIL: runner PriorityClass missing"; exit 1; }
          # api/listener/web default their priorityClassName to the control-plane class.
          n=$(echo "$out" | grep -c 'priorityClassName: "terrapod-control-plane"')
          [ "$n" -eq 3 ] || { echo "FAIL: expected 3 control-plane priorityClassName (got $n)"; exit 1; }
          # runner config carries the runner class (config-channel contract).
          echo "$out" | grep -q 'priority_class_name: "terrapod-runner"' || { echo "FAIL: runner priority_class_name not rendered"; exit 1; }
          # Off by default — no PriorityClass object, no priorityClassName default.
          stock=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
              --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
              --set redis.url=redis://redis:6379)
          echo "$stock" | grep -q "kind: PriorityClass" && { echo "FAIL: PriorityClass rendered by default (should be opt-in)"; exit 1; }
          echo "$stock" | grep -q "priorityClassName:" && { echo "FAIL: priorityClassName set by default"; exit 1; }
          echo "control-plane PriorityClasses render OK and are off by default (#751)"

  # ── Config-channel contract (#617) ────────────────────
  # Renders the chart (every values profile) and parses the rendered ConfigMaps
  # THROUGH the real Pydantic config models (Settings / RunnerConfig), asserting
  # the chart ↔ code ↔ chart-test contract: no drift (every rendered key is a
  # real model field), contract-spine keys present, and no non-sensitive
  # TERRAPOD_* env on any Deployment. See AGENTS.md → "The config-channel
  # contract" and scripts/check_helm_config_contract.py.
  helm-config-contract:
    name: Helm Config Contract
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: scripts/helm-config-contract.sh

  # ── Eval quickstart boot (kind + k3d) ──────────────────
  # Proves `make eval` actually stands up a complete stack (embedded
  # Postgres/Redis + migrations + API + web) on a throwaway cluster, on both
  # supported cluster tools. Uses released images, so it exercises the eval
  # mechanism + chart, not the PR's app code (that's covered by the test job).
  helm-eval-boot:
    name: Eval Boot (${{ matrix.tool }})
    # Depend on the amd64 build so the eval boots the images BUILT FROM THIS PR
    # (loaded into the cluster), not published `:latest`. That's what makes the
    # plan-through-listener smoke test the PR's actual code (e.g. the binary-cache
    # version-resolution path), and keeps it from depending on whatever is live.
    needs: [prepare, build-images-amd64]
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    # `helm --wait` blocks on the full stack (incl. the listener joining the
    # bootstrapped pool) and the plan-smoke launches a runner Job — so cap the
    # job at a sensible ceiling rather than the 6h default, in case an install or
    # the run ever hangs.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        tool: [kind, k3d]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install ${{ matrix.tool }}
        run: |
          if [ "${{ matrix.tool }}" = "kind" ]; then
            curl -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
            sudo install -m 0755 ./kind /usr/local/bin/kind && rm -f ./kind
          else
            # Download the pinned k3d release binary directly (no curl|bash).
            curl -fsSLo ./k3d https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
            sudo install -m 0755 ./k3d /usr/local/bin/k3d && rm -f ./k3d
          fi
      # ── Get the amd64 images built by this run ───────────────────────────────
      # PR builds load them from the build-images-amd64 artifacts (no GHCR push on
      # PRs); branch/tag builds pull them from GHCR. Either way they end up in the
      # local docker daemon under their canonical sha-<short>-amd64 tag, which is
      # what eval.sh resolves below (chart pullPolicy is IfNotPresent, so the
      # loaded images are used without a registry round-trip).
      - name: Log in to GHCR (branch/tag)
        if: needs.prepare.outputs.is_pr != 'true'
        uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}
      - name: Pull images (branch/tag)
        if: needs.prepare.outputs.is_pr != 'true'
        run: |
          sha="${{ needs.prepare.outputs.sha_short }}"
          for i in terrapod-api terrapod-web terrapod-migrations terrapod-listener terrapod-runner; do
            docker pull "$REGISTRY/$i:sha-${sha}-amd64"
          done
      - name: Download image artifacts (PR)
        if: needs.prepare.outputs.is_pr == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: image-*-amd64
          path: /tmp/images
          merge-multiple: true
      - name: Load images into docker (PR)
        if: needs.prepare.outputs.is_pr == 'true'
        run: |
          for i in terrapod-api terrapod-web terrapod-migrations terrapod-listener terrapod-runner; do
            gunzip -c "/tmp/images/$i-amd64.tar.gz" | docker load
          done
      # ── Create the cluster + load the images into it, then install ───────────
      # eval.sh reuses an existing cluster, so we create it here (kind load /
      # k3d image import need the cluster to exist first) and let eval.sh install.
      - name: Create cluster + load images
        run: |
          sha="${{ needs.prepare.outputs.sha_short }}"
          imgs=""
          for i in terrapod-api terrapod-web terrapod-migrations terrapod-listener terrapod-runner; do
            imgs="$imgs $REGISTRY/$i:sha-${sha}-amd64"
          done
          if [ "${{ matrix.tool }}" = "kind" ]; then
            kind create cluster --name terrapod-eval --wait 120s
            for img in $imgs; do kind load docker-image "$img" --name terrapod-eval; done
          else
            # A k3d-managed local registry, NOT `k3d image import`. The import
            # reports "Successfully imported" but leaves images unresolvable by
            # the kubelet under their own ref, so pods fall back to pulling from
            # ghcr.io (nothing pushed there on PRs) → ImagePullBackOff → the
            # pre-install migration hook hangs the whole boot for 10 min. A real
            # registry pull is deterministic and works identically on PR + branch
            # builds. #975.
            reg_port=5111
            k3d registry create eval-registry.localhost --port "$reg_port" \
              --image "${K3D_REGISTRY_IMAGE}"
            k3d cluster create terrapod-eval \
              --registry-use "k3d-eval-registry.localhost:${reg_port}" \
              --wait --timeout 120s
            for i in terrapod-api terrapod-web terrapod-migrations terrapod-listener terrapod-runner; do
              # Push over localhost:PORT (docker auto-treats localhost as an
              # insecure registry — no daemon config needed); pods pull the same
              # repo path in-cluster via k3d-eval-registry.localhost:PORT, which
              # the chart's global.imageRegistry override points them at.
              dst="localhost:${reg_port}/mattrobinsonsre/${i}:sha-${sha}-amd64"
              docker tag "$REGISTRY/${i}:sha-${sha}-amd64" "$dst"
              docker push "$dst"
            done
          fi
      - name: make eval (install into the cluster)
        # Bounded below the job's own timeout so an install that will not
        # converge FAILS this step — leaving budget for diagnostics and
        # teardown — instead of cancelling the job and skipping both.
        timeout-minutes: 12
        env:
          CI: "1"
          EVAL_NO_PORT_FORWARD: "1"
          # Use the images built + loaded above (NOT :latest).
          TERRAPOD_VERSION: sha-${{ needs.prepare.outputs.sha_short }}-amd64
          # Pin the tool — the runner ships a pre-installed `kind`, so without
          # this the k3d matrix job would auto-detect kind and the smoke step's
          # k3d-pinned context lookup would miss.
          TERRAPOD_EVAL_TOOL: ${{ matrix.tool }}
          # k3d pulls every image from the local registry created above (kind
          # loads images straight into the node, so it needs no override). #975.
          TERRAPOD_EVAL_IMAGE_REGISTRY: ${{ matrix.tool == 'k3d' && 'k3d-eval-registry.localhost:5111' || '' }}
          # Fail fast: a healthy boot is ~50s, so cap the install wait at 5 min so
          # a genuine image/scheduling problem surfaces quickly with pod
          # diagnostics instead of a ~10-min silent hang. #975.
          TERRAPOD_EVAL_HELM_TIMEOUT: 300s
        run: scripts/eval.sh up
      - name: Smoke the running stack
        run: |
          ctx=$([ "${{ matrix.tool }}" = "kind" ] && echo kind-terrapod-eval || echo k3d-terrapod-eval)
          ns=terrapod-eval
          # eval.sh installs with `helm --wait`, so these are already satisfied;
          # assert them explicitly anyway as the smoke contract.
          kubectl --context "$ctx" -n "$ns" wait --for=condition=available deploy/terrapod-web --timeout=150s
          kubectl --context "$ctx" -n "$ns" wait --for=condition=available deploy/terrapod-api --timeout=150s
          # The listener only reports Available once it has JOINED the bootstrapped
          # eval-pool — so this proves the agent-execution wiring end-to-end, not
          # just that a pod started.
          kubectl --context "$ctx" -n "$ns" wait --for=condition=available deploy/terrapod-listener --timeout=180s
          kubectl --context "$ctx" -n "$ns" port-forward svc/terrapod-web 18080:3000 >/dev/null 2>&1 &
          sleep 6
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 8 --retry-delay 3 --retry-all-errors http://localhost:18080/login)
          echo "GET /login -> $code"
          [ "$code" = "200" ] || { echo "FAIL: UI did not serve /login"; exit 1; }
          echo "Eval stack booted + UI served on ${{ matrix.tool }}"
      - name: Plan through the listener
        # Prove the listener actually EXECUTES runs: create an agent workspace on
        # the bootstrapped eval-pool, upload a config, queue a plan, and assert it
        # reaches `planned` on a real Kubernetes Job. This is the difference
        # between "a listener pod exists" and "server-side runs work".
        run: |
          ctx=$([ "${{ matrix.tool }}" = "kind" ] && echo kind-terrapod-eval || echo k3d-terrapod-eval)
          scripts/eval-smoke-plan.sh "$ctx" terrapod-eval
      - name: Diagnostics on failure
        # `failure()` alone does NOT run when the job is cancelled by its own
        # timeout-minutes — only `always()`/`cancelled()` do. A hung boot is
        # exactly the case we most want diagnostics for, and it is the case
        # this condition used to skip.
        if: failure() || cancelled()
        timeout-minutes: 3
        run: |
          ctx=$([ "${{ matrix.tool }}" = "kind" ] && echo kind-terrapod-eval || echo k3d-terrapod-eval)
          kubectl --context "$ctx" -n terrapod-eval get pods,jobs || true
          kubectl --context "$ctx" -n terrapod-eval logs deploy/terrapod-listener --tail=80 || true
          kubectl --context "$ctx" -n terrapod-eval logs -l app.kubernetes.io/name=terrapod-runner --tail=120 --prefix || true
      - name: Teardown
        # `k3d cluster delete` has hung for 23 minutes here, consuming the rest
        # of the job budget and turning "one step failed" into "the whole job
        # was killed" — which is a much harder thing to read. A cluster delete
        # that cannot finish in 3 minutes is not going to.
        if: always()
        timeout-minutes: 3
        env:
          TERRAPOD_EVAL_TOOL: ${{ matrix.tool }}
        run: scripts/eval.sh down

  # ── SAST (Semgrep) ─────────────────────────────────────
  sast:
    name: SAST
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            "${SEMGREP_IMAGE:-semgrep/semgrep:1.117}" \
            semgrep scan /src \
              --config "p/python" \
              --config "p/owasp-top-ten" \
              --config "p/secrets" \
              --config "/src/pentest/semgrep/.semgrep.yml" \
              --exclude "web/node_modules" \
              --exclude ".next" \
              --exclude "dist" \
              --exclude "alembic/versions" \
              --exclude "reports" \
              --exclude "services/ai_eval" \
              --exclude-rule "python.lang.security.insecure-hash-algorithms-md5.insecure-hash-algorithm-md5" \
              --exclude-rule "python.lang.security.audit.logging.logger-credential-leak.python-logger-credential-disclosure" \
              --exclude-rule "python.flask.security.audit.directly-returned-format-string.directly-returned-format-string" \
              --sarif \
              --output "/src/semgrep-results.sarif"

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

  # ── Build Images ───────────────────────────────────────
  # Built per-arch in SEPARATE jobs (not one arch×image matrix) so the
  # latency-sensitive consumers can depend on only the arch they need:
  # e2e-test + scan-images run on amd64 and must NOT wait on the slow arm64
  # web build. Splitting also gives each arch its own fail-fast scope, so a
  # failing arm64 leg no longer cancels the amd64 images e2e needs. arm64
  # still runs (build-validation + release manifests) and is now also
  # artifacted on PRs so scan-images can scan it.
  build-images-amd64:
    name: Build ${{ matrix.image }} (amd64)
    needs: [prepare, build-query]
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [terrapod-api, terrapod-web, terrapod-runner, terrapod-listener, terrapod-migrations]
        include:
          - image: terrapod-api
            dockerfile: docker/Dockerfile.api
          - image: terrapod-web
            dockerfile: docker/Dockerfile.web
          - image: terrapod-runner
            dockerfile: docker/Dockerfile.runner
          - image: terrapod-listener
            dockerfile: docker/Dockerfile.listener
          - image: terrapod-migrations
            dockerfile: docker/Dockerfile.migrations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to GHCR
        uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}

      # terrapod-query is baked into api + runner (#823) from the binary the
      # build-query job compiled once — staged into the build context here.
      - name: Stage terrapod-query binary (api/runner only)
        if: matrix.image == 'terrapod-api' || matrix.image == 'terrapod-runner'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: terrapod-query-linux-amd64
          path: docker/query-bin
      - name: Normalise terrapod-query binary
        if: matrix.image == 'terrapod-api' || matrix.image == 'terrapod-runner'
        run: |
          mv docker/query-bin/terrapod-query-linux-amd64 docker/query-bin/terrapod-query
          chmod 0755 docker/query-bin/terrapod-query

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          # On PRs we do NOT push to GHCR (fork PRs lack package:write; even
          # same-repo PRs gain nothing from a round-trip). The image is loaded
          # into the local daemon and handed to scan/e2e as an artifact.
          push: ${{ needs.prepare.outputs.is_pr != 'true' }}
          load: ${{ needs.prepare.outputs.is_pr == 'true' }}
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:sha-${{ needs.prepare.outputs.sha_short }}-amd64
          build-args: |
            PKG_REFRESH=${{ needs.prepare.outputs.pkg_refresh }}
            BASE_IMAGE=${{ matrix.image == 'terrapod-web' && env.NODE_BASE_IMAGE || env.PYTHON_BASE_IMAGE }}
          cache-from: type=gha,scope=${{ matrix.image }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-amd64

      - name: Export image artifact
        if: needs.prepare.outputs.is_pr == 'true'
        run: |
          docker save "$REGISTRY/${{ matrix.image }}:sha-${{ needs.prepare.outputs.sha_short }}-amd64" \
            | gzip > "/tmp/${{ matrix.image }}-amd64.tar.gz"

      - name: Upload image artifact
        if: needs.prepare.outputs.is_pr == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-${{ matrix.image }}-amd64
          path: /tmp/${{ matrix.image }}-amd64.tar.gz
          retention-days: 1

  build-images-arm64:
    name: Build ${{ matrix.image }} (arm64)
    needs: [prepare, build-query]
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [terrapod-api, terrapod-web, terrapod-runner, terrapod-listener, terrapod-migrations]
        include:
          - image: terrapod-api
            dockerfile: docker/Dockerfile.api
          - image: terrapod-web
            dockerfile: docker/Dockerfile.web
          - image: terrapod-runner
            dockerfile: docker/Dockerfile.runner
          - image: terrapod-listener
            dockerfile: docker/Dockerfile.listener
          - image: terrapod-migrations
            dockerfile: docker/Dockerfile.migrations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to GHCR
        uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}

      # terrapod-query is baked into api + runner (#823) from the binary the
      # build-query job compiled once — staged into the build context here.
      - name: Stage terrapod-query binary (api/runner only)
        if: matrix.image == 'terrapod-api' || matrix.image == 'terrapod-runner'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: terrapod-query-linux-arm64
          path: docker/query-bin
      - name: Normalise terrapod-query binary
        if: matrix.image == 'terrapod-api' || matrix.image == 'terrapod-runner'
        run: |
          mv docker/query-bin/terrapod-query-linux-arm64 docker/query-bin/terrapod-query
          chmod 0755 docker/query-bin/terrapod-query

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: ${{ needs.prepare.outputs.is_pr != 'true' }}
          load: ${{ needs.prepare.outputs.is_pr == 'true' }}
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:sha-${{ needs.prepare.outputs.sha_short }}-arm64
          build-args: |
            PKG_REFRESH=${{ needs.prepare.outputs.pkg_refresh }}
            BASE_IMAGE=${{ matrix.image == 'terrapod-web' && env.NODE_BASE_IMAGE || env.PYTHON_BASE_IMAGE }}
          cache-from: type=gha,scope=${{ matrix.image }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-arm64

      # arm64 is now artifacted on PRs too — scan-images scans it as well.
      - name: Export image artifact
        if: needs.prepare.outputs.is_pr == 'true'
        run: |
          docker save "$REGISTRY/${{ matrix.image }}:sha-${{ needs.prepare.outputs.sha_short }}-arm64" \
            | gzip > "/tmp/${{ matrix.image }}-arm64.tar.gz"

      - name: Upload image artifact
        if: needs.prepare.outputs.is_pr == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-${{ matrix.image }}-arm64
          path: /tmp/${{ matrix.image }}-arm64.tar.gz
          retention-days: 1

  # ── E2E Tests (Playwright) ─────────────────────────────
  e2e-test:
    # Sharded across N GitHub runners using Playwright's built-in --shard=k/N.
    # Each shard boots its own docker-compose stack in PARALLEL, so stack-boot
    # wall-clock is ~constant regardless of shard count — adding shards lowers
    # the per-shard TEST time without raising boot wall-clock (the cost is
    # runner-minutes). Grow the `shard:` list as the suite grows so total
    # wall-clock stays flat. Per-shard blob reports are merged into one HTML
    # report by the `e2e-report` job.
    name: E2E Tests (${{ matrix.shard }}/${{ strategy.job-total }})
    # amd64 only — e2e loads the amd64 images and must not wait on the
    # slower arm64 builds (they run in parallel as a build-validation gate).
    needs: [prepare, build-images-amd64]
    if: |
      always()
      && needs.build-images-amd64.result == 'success'
      && needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    # Whole-job upper bound. Default is GitHub's 360 min, which lets a
    # wedged step run for six hours before anyone notices. 15 min covers
    # a cold-runner worst-case (image pull + stack boot + test suite)
    # with headroom; anything past that is genuinely broken, not slow.
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Branch/tag builds pull the images from GHCR; PR builds load them
      # from the build-images-amd64 artifacts (no registry push on PRs).
      # Either way the stack runs off the `<image>:local` tags.
      - name: Log in to GHCR
        if: needs.prepare.outputs.is_pr != 'true'
        uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}

      - name: Pull images (branch/tag)
        if: needs.prepare.outputs.is_pr != 'true'
        run: |
          sha_short="${{ needs.prepare.outputs.sha_short }}"
          for image in terrapod-api terrapod-web terrapod-migrations; do
            docker pull "$REGISTRY/$image:sha-${sha_short}-amd64"
            docker tag "$REGISTRY/$image:sha-${sha_short}-amd64" "$image:local"
          done

      - name: Download image artifacts (PR)
        if: needs.prepare.outputs.is_pr == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: image-*-amd64
          path: /tmp/images
          merge-multiple: true

      - name: Load images (PR)
        if: needs.prepare.outputs.is_pr == 'true'
        run: |
          sha_short="${{ needs.prepare.outputs.sha_short }}"
          for image in terrapod-api terrapod-web terrapod-migrations; do
            gunzip -c "/tmp/images/$image-amd64.tar.gz" | docker load
            docker tag "$REGISTRY/$image:sha-${sha_short}-amd64" "$image:local"
          done

      - name: Start E2E stack
        run: docker compose -f e2e/docker-compose.e2e.yml up -d

      - name: Wait for stack health
        run: |
          timeout=120
          elapsed=0
          while ! curl -sf http://localhost:3000/ > /dev/null 2>&1; do
            if (( elapsed >= timeout )); then
              echo "Stack not healthy after ${timeout}s"
              docker compose -f e2e/docker-compose.e2e.yml logs
              exit 1
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done
          echo "Stack healthy (${elapsed}s)"

      # Run npm ci + tests inside the official Playwright image. The
      # image bundles Node + Chromium + all OS deps, eliminating the
      # `playwright install` step that has repeatedly wedged at the
      # extract phase on the Azure-backed runner disk (167 MiB → ~600
      # MiB unpack across many small files takes >5 min consistently).
      #
      # `--network host` lets the container reach the docker-compose
      # stack on localhost. `--ipc=host` is the Playwright-recommended
      # setting to avoid Chromium running out of memory in shared /dev/shm.
      # Image tag MUST track the pinned `@playwright/test` version in
      # e2e/package-lock.json — version skew between client and bundled
      # browsers causes runtime failures.
      - name: Run Playwright tests
        run: |
          docker run --rm \
            --network=host \
            --ipc=host \
            -v "${{ github.workspace }}/e2e:/work" \
            -w /work \
            -e CI=true \
            -e HOME=/tmp \
            mcr.microsoft.com/playwright:v1.58.2-noble \
            sh -c "npm ci --ignore-scripts && npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}"
        # Playwright has per-test timeouts of its own; this is the
        # outer safety net. npm ci inside the container is ~10 s for
        # this tree (only @playwright/test + typescript).
        timeout-minutes: 10

      # Per-shard blob report → merged into one HTML report by `e2e-report`.
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose -f e2e/docker-compose.e2e.yml down -v

  # ── OCI conformance ────────────────────────────────────
  # The registry checked against the distribution spec rather than against the
  # one client we happened to try. That distinction earned its place: every
  # finding this suite produced during #1408 — a hardcoded digest algorithm, a
  # missing OCI-Subject echo, foreign layers treated as missing blobs, referrers
  # answering 404 instead of an empty index, and no Range support at all — left
  # `docker push` and `docker pull` working perfectly.
  #
  # Run against the BFF, not the API, because that is the only address a
  # deployment exposes. Testing the API directly skips a hop that has already
  # broken pulls once (Content-Length stripped from a blob HEAD).
  oci-conformance:
    name: OCI Conformance
    needs: [prepare, build-images-amd64]
    if: |
      always()
      && needs.build-images-amd64.result == 'success'
      && needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        if: needs.prepare.outputs.is_pr != 'true'
        uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}

      - name: Pull images (branch/tag)
        if: needs.prepare.outputs.is_pr != 'true'
        run: |
          sha_short="${{ needs.prepare.outputs.sha_short }}"
          for image in terrapod-api terrapod-web terrapod-migrations; do
            docker pull "$REGISTRY/$image:sha-${sha_short}-amd64"
            docker tag "$REGISTRY/$image:sha-${sha_short}-amd64" "$image:local"
          done

      - name: Download image artifacts (PR)
        if: needs.prepare.outputs.is_pr == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: image-*-amd64
          path: /tmp/images
          merge-multiple: true

      - name: Load images (PR)
        if: needs.prepare.outputs.is_pr == 'true'
        run: |
          sha_short="${{ needs.prepare.outputs.sha_short }}"
          for image in terrapod-api terrapod-web terrapod-migrations; do
            gunzip -c "/tmp/images/$image-amd64.tar.gz" | docker load
            docker tag "$REGISTRY/$image:sha-${sha_short}-amd64" "$image:local"
          done

      - name: Start stack
        run: docker compose -f e2e/docker-compose.e2e.yml up -d

      - name: Wait for stack health
        run: |
          timeout=120
          elapsed=0
          while ! curl -sf http://localhost:3000/ > /dev/null 2>&1; do
            if (( elapsed >= timeout )); then
              echo "Stack not healthy after ${timeout}s"
              docker compose -f e2e/docker-compose.e2e.yml logs
              exit 1
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done
          echo "Stack healthy (${elapsed}s)"

      - name: Run the conformance suite
        run: scripts/oci-conformance.sh http://localhost:3000

      # The three clients most people actually use. They exercise different
      # parts of the protocol from each other and from the conformance suite —
      # the Content-Length regression above was invisible to the suite and fatal
      # to docker.
      - name: Push and pull with real clients
        run: |
          set -euo pipefail
          TOKEN="$(python3 scripts/mint-token.py --url http://localhost:3000 \
                   --email admin@terrapod.local --password 'TestPassword123!')"
          echo "$TOKEN" | docker login localhost:3000 -u tp --password-stdin

          docker pull -q alpine:3.20
          docker tag alpine:3.20 localhost:3000/smoke/app:v1
          docker push -q localhost:3000/smoke/app:v1

          # Remove every local copy, so the pull genuinely comes from Terrapod.
          docker rmi -f localhost:3000/smoke/app:v1 alpine:3.20
          docker pull -q localhost:3000/smoke/app:v1
          # The strongest assertion available: the pulled image runs.
          docker run --rm localhost:3000/smoke/app:v1 cat /etc/alpine-release

          # crane and skopeo are stricter than docker about parts of the spec,
          # and skopeo copy exercises pull and push in one operation.
          crane_url=https://github.com/google/go-containerregistry/releases/download/v0.20.3/go-containerregistry_Linux_x86_64.tar.gz
          curl -fsSL "$crane_url" | tar -xz -C /tmp crane
          /tmp/crane auth login localhost:3000 -u tp -p "$TOKEN"
          test "$(/tmp/crane ls localhost:3000/smoke/app)" = "v1"
          /tmp/crane digest localhost:3000/smoke/app:v1

          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          skopeo copy --src-tls-verify=false --dest-tls-verify=false \
            --src-creds "tp:$TOKEN" --dest-creds "tp:$TOKEN" \
            docker://localhost:3000/smoke/app:v1 \
            docker://localhost:3000/smoke/copied:v2

      - name: Registry rejects anonymous access
        run: |
          # A registry that mirrors upstreams must never be an open relay for
          # anyone who finds it. Checked here rather than only in unit tests
          # because this is the deployed path, through the real ingress.
          status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/v2/)"
          test "$status" = "401" || { echo "FAIL: /v2/ answered $status anonymously, expected 401"; exit 1; }

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f e2e/docker-compose.e2e.yml logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f e2e/docker-compose.e2e.yml down -v

  # ── E2E Report (merge shard blob reports) ──────────────
  # Merges the per-shard Playwright blob reports into a single HTML report,
  # so a failure across 8 shards is triaged from one artifact. Runs even when
  # shards fail (always()) — that's exactly when the merged report is needed.
  # Merges the shard blob reports into one HTML report for a human to read.
  #
  # Deliberately NOT part of `ci-pass`: it asserts nothing about the product. The
  # test verdict lives in the eight `e2e-test` shards, which are gated. Having
  # this in the gate meant a GitHub artifact-storage failure — no Terrapod code
  # involved, artifacts intact per the API, `download-artifact` exhausting its own
  # retries — could fail a release that was otherwise complete and correct, with
  # no rerun able to clear it. That happened on v1.5.3.
  #
  # Losing the merge costs the pretty report and nothing else.
  e2e-report:
    name: E2E Report
    needs: [prepare, e2e-test]
    if: always() && needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download blob reports
        # Keep going if a shard's report cannot be fetched: a partial report is
        # more useful than none, and this job is not a gate.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge into HTML report
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/e2e:/work" \
            -v "${{ github.workspace }}/all-blob-reports:/work/all-blob-reports" \
            -w /work \
            -e HOME=/tmp \
            mcr.microsoft.com/playwright:v1.58.2-noble \
            sh -c "npm ci --ignore-scripts && npx playwright merge-reports --reporter html ./all-blob-reports"
      - name: Upload merged HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-html-report
          path: e2e/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  # ── Scan Images (Trivy) ────────────────────────────────
  # Both architectures are scanned (image × arch matrix): arm64 images ship
  # in the release manifest too, and arch-specific base layers can differ.
  # Trivy reads image layers/package DBs without executing the binary, so an
  # arm64 image scans fine on an amd64 runner.
  # ── Image CVE gate ─────────────────────────────────────
  #
  # This job BLOCKS PUBLICATION. `create-manifests` requires it to
  # succeed, so an image carrying a fixable HIGH/CRITICAL never becomes
  # a multi-arch tag and never reaches a release. It is a gate, not a
  # report. Policy: docs/cve-policy.md.
  #
  # Two settings decide what "fixable" means, and both are deliberate:
  #
  #   ignore-unfixed: true — a vulnerability with no patched version
  #     available anywhere cannot be actioned by a build. Failing on it
  #     would only teach people to bypass the gate. Note the
  #     consequence, because it is the honest cost of this choice: a
  #     CVE becomes visible to us on the *day upstream publishes a fix*,
  #     which may be well after disclosure. Our answer to that window is
  #     release cadence (roughly weekly), not a lower gate.
  #
  #   trivyignores: pentest/trivy/.trivyignore — the accepted-risk
  #     register. Every entry states why the vulnerable code is
  #     unreachable in Terrapod and the exact condition that removes it,
  #     and the pre-release audit re-checks all of them each
  #     release. Preferring an upstream bump over a new entry is the
  #     rule; entries are deleted in the same PR as the bump.
  #
  # Operators run their own scanners and will still see whatever is in
  # that register — it suppresses nothing outside this pipeline, which
  # is why each entry is written to be read by someone outside the
  # project.
  scan-images:
    name: Scan ${{ matrix.image }} (${{ matrix.arch }})
    needs: [prepare, build-images-amd64, build-images-arm64]
    if: |
      always()
      && needs.build-images-amd64.result == 'success'
      && needs.build-images-arm64.result == 'success'
      && needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: [terrapod-api, terrapod-web, terrapod-runner, terrapod-listener, terrapod-migrations]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # On branch/tag builds the image lives in GHCR — log in and let Trivy
      # pull the per-arch tag. On PRs nothing was pushed; the image arrives as
      # a per-arch artifact from build-images-<arch> and is loaded into the
      # local daemon below, where Trivy finds it by the same tag.
      - name: Log in to GHCR
        if: needs.prepare.outputs.is_pr != 'true'
        uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}

      - name: Download image artifact (PR)
        if: needs.prepare.outputs.is_pr == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: image-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp

      - name: Load image (PR)
        if: needs.prepare.outputs.is_pr == 'true'
        run: gunzip -c "/tmp/${{ matrix.image }}-${{ matrix.arch }}.tar.gz" | docker load

      # Human-readable findings step. Always prints the table of CVEs
      # Trivy would gate on to the action log — so a failure in the
      # gating step below can be diagnosed without downloading SARIF or
      # re-running Trivy locally. exit-code: '0' keeps this informational.
      - name: Trivy findings (table, informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # The per-arch tag (sha-XXX-arm64) is an OCI index whose only child
          # is the matrix arch. Without this, Trivy defaults to the runner's
          # platform (linux/amd64) when pulling the image from GHCR on branch/
          # tag builds and fails with "no child with platform linux/amd64".
          # (PR builds load the image into the local daemon, so they never hit
          # the remote-pull default — which is why this only broke on main.)
          # Trivy reads TRIVY_PLATFORM as the --platform flag.
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
        with:
          image-ref: ghcr.io/mattrobinsonsre/${{ matrix.image }}:sha-${{ needs.prepare.outputs.sha_short }}-${{ matrix.arch }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: pentest/trivy/.trivyignore
          exit-code: '0'

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # See the note on the informational step above — pin the pulled
          # platform to the matrix arch so the arm64 scan resolves its child.
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
        with:
          image-ref: ghcr.io/mattrobinsonsre/${{ matrix.image }}:sha-${{ needs.prepare.outputs.sha_short }}-${{ matrix.arch }}
          format: sarif
          output: trivy-${{ matrix.image }}-${{ matrix.arch }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: pentest/trivy/.trivyignore
          exit-code: '1'
          limit-severities-for-sarif: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-${{ matrix.image }}-${{ matrix.arch }}.sarif
          category: trivy-${{ matrix.image }}-${{ matrix.arch }}

  # ── Create Multi-Arch Manifests ────────────────────────
  create-manifests:
    name: Manifest ${{ matrix.image }}
    needs: [prepare, build-images-amd64, build-images-arm64, python-lint, frontend-lint, python-test, python-audit, npm-audit, secret-scan, codeql, helm-lint, sast, scan-images]
    if: |
      always()
      && needs.build-images-amd64.result == 'success'
      && needs.build-images-arm64.result == 'success'
      && needs.prepare.outputs.is_pr != 'true'
      && (needs.python-lint.result == 'success' || needs.python-lint.result == 'skipped')
      && (needs.frontend-lint.result == 'success' || needs.frontend-lint.result == 'skipped')
      && (needs.python-test.result == 'success' || needs.python-test.result == 'skipped')
      && (needs.python-audit.result == 'success' || needs.python-audit.result == 'skipped')
      && (needs.npm-audit.result == 'success' || needs.npm-audit.result == 'skipped')
      && (needs.secret-scan.result == 'success' || needs.secret-scan.result == 'skipped')
      && (needs.codeql.result == 'success' || needs.codeql.result == 'skipped')
      && (needs.helm-lint.result == 'success' || needs.helm-lint.result == 'skipped')
      && (needs.sast.result == 'success' || needs.sast.result == 'skipped')
      && (needs.scan-images.result == 'success' || needs.scan-images.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [terrapod-api, terrapod-web, terrapod-runner, terrapod-listener, terrapod-migrations]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}

      - name: Create multi-arch manifest
        run: |
          sha_short="${{ needs.prepare.outputs.sha_short }}"
          echo "Creating manifest for ${{ matrix.image }}:sha-$sha_short"
          docker buildx imagetools create -t "$REGISTRY/${{ matrix.image }}:sha-$sha_short" \
            "$REGISTRY/${{ matrix.image }}:sha-${sha_short}-amd64" \
            "$REGISTRY/${{ matrix.image }}:sha-${sha_short}-arm64"

  # ── Release ────────────────────────────────────────────
  # The release stage is five jobs — a tiny pre-create that owns the
  # Release object and four branches that all upload into it in
  # parallel:
  #
  #   release-create   — pre-creates an empty GitHub Release for the tag
  #                      with a placeholder title. Owning Release
  #                      creation here means provider AND migrate can
  #                      both run in append mode at the same time
  #                      instead of provider gating migrate (#435 had
  #                      provider create the Release → migrate append).
  #   release-images   — image retag + Helm push + SBOM generation.
  #                      Saves chart + SBOMs + checksums as a workflow
  #                      artifact for release-finalize to upload.
  #   release-provider — GoReleaser provider, append mode.
  #   release-migrate  — GoReleaser migrate, append mode.
  #   release-publish  — GoReleaser terrapod-publish, append mode.
  #   release-query    — GoReleaser terrapod-query, append mode.
  #   release-mcp      — GoReleaser terrapod-mcp, append mode.
  #   release-finalize — joins all the above; sets real title + release
  #                      notes and uploads the workflow artifact from
  #                      release-images.
  #
  # Both goreleaser invocations also pass `--parallelism 6` so each
  # process saturates the runner's cores when crunching its own
  # platform matrix.

  # ── Quality gate for releases (#1263) ──────────────────
  #
  # Every lint and test job, aggregated once, so the release chain can depend
  # on "the checks passed" instead of on a hand-listed subset of them.
  #
  # v1.2.2 published while `Migrate Lint` was red. Neither the release chain
  # nor `cleanup-tag` mentioned that job — both enumerated only the build,
  # scan and release-* jobs, a list written when those were the only jobs and
  # never extended as lint and test jobs were added. The artifacts happened to
  # be fine; nothing verified that they were.
  #
  # `ci-pass` cannot serve this purpose: it needs `release-finalize`, so
  # gating the release on it would be circular. This runs BEFORE the release
  # chain rather than after everything.
  #
  # `skipped` counts as a pass: on a tag whose images already exist the build
  # and test jobs are deliberately skipped. Only a failure or a cancellation
  # stops a release.
  quality-gate:
    name: Quality Gate
    if: always()
    needs:
      - python-lint
      - frontend-lint
      - provider-lint
      - provider-test
      - go-terrapod-lint
      - go-terrapod-test
      - migrate-lint
      - migrate-test
      - publish-lint
      - publish-test
      - query-lint
      - query-test
      - mcp-lint
      - mcp-test
      - python-test
      - pricegen-test
      - rescan-test
      - migration-check
      - docs-audit
      - python-audit
      - npm-audit
      - secret-scan
      - helm-lint
      - helm-smoke
      - helm-config-contract
      - sast
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          # Space-separated name=result pairs, so the check below is a plain
          # loop rather than 25 hand-written comparisons that can drift.
          RESULTS: >-
            python-lint=${{ needs.python-lint.result }}
            frontend-lint=${{ needs.frontend-lint.result }}
            provider-lint=${{ needs.provider-lint.result }}
            provider-test=${{ needs.provider-test.result }}
            go-terrapod-lint=${{ needs.go-terrapod-lint.result }}
            go-terrapod-test=${{ needs.go-terrapod-test.result }}
            migrate-lint=${{ needs.migrate-lint.result }}
            migrate-test=${{ needs.migrate-test.result }}
            publish-lint=${{ needs.publish-lint.result }}
            publish-test=${{ needs.publish-test.result }}
            query-lint=${{ needs.query-lint.result }}
            query-test=${{ needs.query-test.result }}
            mcp-lint=${{ needs.mcp-lint.result }}
            mcp-test=${{ needs.mcp-test.result }}
            python-test=${{ needs.python-test.result }}
            pricegen-test=${{ needs.pricegen-test.result }}
            rescan-test=${{ needs.rescan-test.result }}
            migration-check=${{ needs.migration-check.result }}
            docs-audit=${{ needs.docs-audit.result }}
            python-audit=${{ needs.python-audit.result }}
            npm-audit=${{ needs.npm-audit.result }}
            secret-scan=${{ needs.secret-scan.result }}
            helm-lint=${{ needs.helm-lint.result }}
            helm-smoke=${{ needs.helm-smoke.result }}
            helm-config-contract=${{ needs.helm-config-contract.result }}
            sast=${{ needs.sast.result }}
        run: |
          set -eu
          bad=""
          for entry in $RESULTS; do
            case "${entry#*=}" in
              success|skipped) ;;
              *) bad="$bad $entry" ;;
            esac
          done
          if [ -n "$bad" ]; then
            echo "Quality gate failed —$bad"
            echo "No release is created while any check is red."
            exit 1
          fi
          echo "Quality gate passed"

  release-create:
    name: Release — Create empty GitHub Release
    needs: [prepare, create-manifests, quality-gate]
    if: |
      always()
      && needs.prepare.outputs.is_tag == 'true'
      && needs.prepare.result == 'success'
      && needs.quality-gate.result == 'success'
      && (needs.create-manifests.result == 'success' || needs.create-manifests.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create empty Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.prepare.outputs.version }}"

          # Idempotent: if the Release already exists (e.g. this job
          # is being re-run), skip. release-finalize will set the
          # real title/notes; we just need the Release object so the
          # append-mode goreleaser runs have somewhere to upload to.
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists; skipping create"
            exit 0
          fi
          gh release create "$version" \
            --title "$version (in progress)" \
            --notes "Release in progress — assets are being attached by parallel CI jobs."

  release-images:
    name: Release — Images, Helm, SBOMs
    needs: [prepare, create-manifests]
    if: |
      always()
      && needs.prepare.outputs.is_tag == 'true'
      && needs.prepare.result == 'success'
      && (needs.create-manifests.result == 'success' || needs.create-manifests.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless cosign signing + SLSA provenance (OIDC)
      attestations: write   # actions/attest-build-provenance OCI referrer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR (docker + helm)
        uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}
          helm: 'true'

      - name: Retag images with version
        run: |
          sha_short="${{ needs.prepare.outputs.sha_short }}"
          version="${{ needs.prepare.outputs.version }}"

          # GHCR occasionally returns 5xx on manifest reads/writes during
          # a retag — wrap with the shared 5/10/20/40s backoff helper.
          for image in terrapod-api terrapod-web terrapod-runner terrapod-listener terrapod-migrations; do
            echo "Retagging $image:sha-$sha_short -> $version + latest"
            .github/scripts/with-retry.sh "imagetools create $image" -- \
              docker buildx imagetools create \
                -t "$REGISTRY/$image:$version" \
                -t "$REGISTRY/$image:latest" \
                "$REGISTRY/$image:sha-$sha_short"
          done

      - name: Publish Helm chart
        run: |
          version="${{ needs.prepare.outputs.version }}"
          chart_version="${version#v}"

          helm package helm/terrapod --destination dist/ \
            --version "$chart_version" --app-version "$version"

          .github/scripts/with-retry.sh "helm push" -- \
            helm push "dist/terrapod-${chart_version}.tgz" "oci://$REGISTRY"

      - name: Generate SBOMs
        run: |
          version="${{ needs.prepare.outputs.version }}"

          # Install syft: fetch the installer pinned to a release tag (not main)
          # to a file, then run it (no curl|sh pipe), installing a pinned version.
          # NOTE: `-s --` belongs ONLY to the piped `curl | sh -s -- ARGS` idiom
          # (where `-s` tells sh to read the script from stdin). When running the
          # installer as a FILE, the args go straight to syft's install.sh, whose
          # usage is `install.sh [-v] [-b DIR] [-d] [TAG]` — so pass `-b DIR TAG`
          # directly; `-s` is rejected as an illegal option.
          SYFT_VERSION=v1.46.0
          curl -sSfL -o "$RUNNER_TEMP/syft-install.sh" \
            "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh"
          sh "$RUNNER_TEMP/syft-install.sh" -b /usr/local/bin "$SYFT_VERSION"

          for image in terrapod-api terrapod-web terrapod-runner terrapod-listener terrapod-migrations; do
            echo "Generating SBOM for $image:$version"
            syft "$REGISTRY/$image:$version" -o spdx-json="dist/sbom-${image}.spdx.json"
          done

      # Supply-chain attestation (#549): keyless cosign signatures + SBOM
      # attestations on every release image and the Helm chart, anchored to
      # this workflow's GitHub OIDC identity and logged in Rekor. Signing is
      # done by immutable digest so it's independent of the retag above.
      - name: Sign images + Helm chart (cosign keyless)
        id: digests
        env:
          COSIGN_YES: "true"
        run: |
          version="${{ needs.prepare.outputs.version }}"
          chart_version="${version#v}"

          # Keyless signing reaches out to the Actions OIDC endpoint, Fulcio and
          # Rekor, so it fails for the usual transient network reasons — and a
          # release is an expensive thing to lose to one of them. A v1.4.0 tag
          # died on a single TLS handshake timeout fetching the OIDC token.
          #
          # The retry also side-steps the way that failure presents: with no
          # ambient token, cosign falls back to the interactive device flow,
          # prints a verification URL no one is watching, and waits out the full
          # five-minute code validity before failing. The next attempt fetches
          # the token normally.
          sign() {
            local subject="$1"
            for attempt in 1 2 3; do
              if cosign sign "$subject"; then
                return 0
              fi
              echo "cosign sign failed for $subject (attempt $attempt/3)"
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 15))
              fi
            done
            echo "::error::cosign sign gave up on $subject after 3 attempts"
            return 1
          }

          for image in terrapod-api terrapod-web terrapod-runner terrapod-listener terrapod-migrations; do
            digest=$(docker buildx imagetools inspect "$REGISTRY/$image:$version" --format '{{.Manifest.Digest}}')
            echo "Signing $image@$digest"
            sign "$REGISTRY/$image@$digest"
            # Expose the digest (hyphens → underscores for the output key) so the
            # SBOM + SLSA provenance steps below can attest the same immutable
            # subject as OCI 1.1 referrers.
            echo "${image//-/_}_digest=$digest" >> "$GITHUB_OUTPUT"
          done

          # Helm chart OCI artifact (cosign resolves the tag to its digest).
          echo "Signing Helm chart terrapod:$chart_version"
          sign "$REGISTRY/terrapod:$chart_version"

      # SLSA build provenance per image, published as an OCI referrer next to
      # the image (verifiable with `gh attestation verify` / `cosign verify-attestation`).
      - name: Provenance — terrapod-api
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/terrapod-api
          subject-digest: ${{ steps.digests.outputs.terrapod_api_digest }}
          push-to-registry: true
      - name: Provenance — terrapod-web
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/terrapod-web
          subject-digest: ${{ steps.digests.outputs.terrapod_web_digest }}
          push-to-registry: true
      - name: Provenance — terrapod-runner
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/terrapod-runner
          subject-digest: ${{ steps.digests.outputs.terrapod_runner_digest }}
          push-to-registry: true
      - name: Provenance — terrapod-listener
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/terrapod-listener
          subject-digest: ${{ steps.digests.outputs.terrapod_listener_digest }}
          push-to-registry: true
      - name: Provenance — terrapod-migrations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/terrapod-migrations
          subject-digest: ${{ steps.digests.outputs.terrapod_migrations_digest }}
          push-to-registry: true

      # SBOM (SPDX) per image, published as an OCI 1.1 referrer next to the image
      # — same discovery path as the provenance above. (Previously attached via
      # `cosign attest`, which writes the legacy `.att` tag that
      # `cosign verify-attestation`/`gh attestation verify` don't read as a
      # referrer; #549 follow-up.)
      - name: SBOM — terrapod-api
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/terrapod-api
          subject-digest: ${{ steps.digests.outputs.terrapod_api_digest }}
          sbom-path: dist/sbom-terrapod-api.spdx.json
          push-to-registry: true
      - name: SBOM — terrapod-web
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/terrapod-web
          subject-digest: ${{ steps.digests.outputs.terrapod_web_digest }}
          sbom-path: dist/sbom-terrapod-web.spdx.json
          push-to-registry: true
      - name: SBOM — terrapod-runner
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/terrapod-runner
          subject-digest: ${{ steps.digests.outputs.terrapod_runner_digest }}
          sbom-path: dist/sbom-terrapod-runner.spdx.json
          push-to-registry: true
      - name: SBOM — terrapod-listener
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/terrapod-listener
          subject-digest: ${{ steps.digests.outputs.terrapod_listener_digest }}
          sbom-path: dist/sbom-terrapod-listener.spdx.json
          push-to-registry: true
      - name: SBOM — terrapod-migrations
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/terrapod-migrations
          subject-digest: ${{ steps.digests.outputs.terrapod_migrations_digest }}
          sbom-path: dist/sbom-terrapod-migrations.spdx.json
          push-to-registry: true

      - name: Generate checksums
        run: |
          (cd dist && sha256sum -- *.tgz *.spdx.json > checksums.txt)

      - name: Upload artifact for release-finalize
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-images-assets
          path: dist/
          retention-days: 1

  release-provider:
    name: Release — Provider (GoReleaser)
    # Both goreleaser jobs depend only on release-create — they no
    # longer gate on each other. provider/.goreleaser.yml is
    # release.mode=append.
    needs: [prepare, release-create]
    if: |
      always()
      && needs.prepare.outputs.is_tag == 'true'
      && needs.release-create.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum

      - name: Import GPG signing key
        id: gpg
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          fingerprint=$(gpg --with-colons --import-options show-only --import <<< "${{ secrets.GPG_PRIVATE_KEY }}" | awk -F: '/^fpr:/{print $10; exit}')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Build provider binaries with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: latest
          # --parallelism saturates the runner's 4 vCPUs across the
          # 8-platform build matrix (slightly oversubscribed because
          # part of each build is I/O — module download, GPG signing).
          args: release --clean --parallelism 6
          workdir: provider
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}

  release-migrate:
    name: Release — Migrate tool (GoReleaser)
    # Parallel with release-provider — both append to the Release that
    # release-create made.
    needs: [prepare, release-create]
    if: |
      always()
      && needs.prepare.outputs.is_tag == 'true'
      && needs.release-create.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: migrate/go.mod
          cache-dependency-path: migrate/go.sum

      - name: Import GPG signing key
        id: gpg
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          fingerprint=$(gpg --with-colons --import-options show-only --import <<< "${{ secrets.GPG_PRIVATE_KEY }}" | awk -F: '/^fpr:/{print $10; exit}')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      # Linux/Windows ship as per-arch zips; macOS ships as a single
      # Universal 2 binary built by lipo-merging darwin/amd64 +
      # darwin/arm64. See migrate/.goreleaser.yml.
      - name: Build migrate-tool binaries with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: latest
          # See note on release-provider — same parallelism rationale.
          args: release --clean --parallelism 6
          workdir: migrate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}

  release-publish:
    name: Release — Publish tool (GoReleaser)
    # Parallel with release-provider / release-migrate — all append to the
    # Release that release-create made.
    needs: [prepare, release-create]
    if: |
      always()
      && needs.prepare.outputs.is_tag == 'true'
      && needs.release-create.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: publish/go.mod
          cache-dependency-path: publish/go.sum

      - name: Import GPG signing key
        id: gpg
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          fingerprint=$(gpg --with-colons --import-options show-only --import <<< "${{ secrets.GPG_PRIVATE_KEY }}" | awk -F: '/^fpr:/{print $10; exit}')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Build terrapod-publish binaries with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --parallelism 6
          workdir: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}

  release-query:
    name: Release — terrapod-query
    # Reuses the linux binaries build-query already compiled (downloaded as
    # artifacts), so linux is never compiled twice — only darwin/windows are
    # built here. (No GoReleaser: its `prebuilt` builder is Pro-only, so this
    # packages the artifacts + native builds directly.)
    needs: [prepare, release-create, build-query]
    if: |
      always()
      && needs.prepare.outputs.is_tag == 'true'
      && needs.release-create.result == 'success'
      && needs.build-query.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: query/go.mod
          cache: false

      - name: Download prebuilt linux binaries (built once by build-query)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: terrapod-query-linux-*
          path: prebuilt
          merge-multiple: true

      - name: Import GPG signing key
        id: gpg
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          fingerprint=$(gpg --with-colons --import-options show-only --import <<< "${{ secrets.GPG_PRIVATE_KEY }}" | awk -F: '/^fpr:/{print $10; exit}')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Package, checksum, sign, and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          ver="${version#v}"   # archive names use the bare version, matching the other tools
          mkdir -p dist

          # Reuse the EXACT linux binaries baked into the images (built once by
          # build-query) — tar them, don't recompile.
          for arch in amd64 arm64; do
            install -m 0755 "prebuilt/terrapod-query-linux-${arch}" dist/terrapod-query
            tar -C dist -czf "dist/terrapod-query_${ver}_linux_${arch}.tar.gz" terrapod-query
            rm dist/terrapod-query
          done

          # Build + package the remaining platforms here (punted from build-query).
          # macOS: build BOTH arches and fuse them into a single UNIVERSAL binary
          # (darwin_all), matching the terrapod-migrate/publish/mcp artifacts.
          # makefat is the pure-Go fat-binary writer GoReleaser uses internally, so
          # it produces a valid universal Mach-O on the Linux runner (no lipo).
          GOBIN="${RUNNER_TEMP:-/tmp}/qbin" go install github.com/randall77/makefat@v0.0.0-20260406194835-1b91746796b7
          makefat="${RUNNER_TEMP:-/tmp}/qbin/makefat"
          for arch in amd64 arm64; do
            (cd query && GOOS=darwin GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w" -o "../dist/terrapod-query-darwin-${arch}" ./cmd/terrapod-query)
          done
          "$makefat" dist/terrapod-query \
            dist/terrapod-query-darwin-amd64 dist/terrapod-query-darwin-arm64
          tar -C dist -czf "dist/terrapod-query_${ver}_darwin_all.tar.gz" terrapod-query
          rm dist/terrapod-query dist/terrapod-query-darwin-amd64 dist/terrapod-query-darwin-arm64

          # Windows: per-arch (no universal concept on Windows).
          for arch in amd64 arm64; do
            (cd query && GOOS=windows GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w" -o "../dist/terrapod-query.exe" ./cmd/terrapod-query)
            (cd dist && zip -q "terrapod-query_${ver}_windows_${arch}.zip" terrapod-query.exe && rm terrapod-query.exe)
          done

          # SHA256SUMS over all archives + detached GPG signature (same shape as
          # the provider/migrate/publish artifacts).
          ( cd dist && sha256sum terrapod-query_${ver}_* > "terrapod-query_${ver}_SHA256SUMS" )
          gpg --batch --local-user "$GPG_FINGERPRINT" \
            --output "dist/terrapod-query_${ver}_SHA256SUMS.sig" \
            --detach-sign "dist/terrapod-query_${ver}_SHA256SUMS"

          # Append to the Release that release-create already opened.
          gh release upload "$version" dist/terrapod-query_${ver}_* --clobber

  release-mcp:
    name: Release — MCP server (GoReleaser)
    # Parallel with the other GoReleaser jobs — all append to the Release that
    # release-create made.
    needs: [prepare, release-create]
    if: |
      always()
      && needs.prepare.outputs.is_tag == 'true'
      && needs.release-create.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum

      - name: Import GPG signing key
        id: gpg
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          fingerprint=$(gpg --with-colons --import-options show-only --import <<< "${{ secrets.GPG_PRIVATE_KEY }}" | awk -F: '/^fpr:/{print $10; exit}')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Build terrapod-mcp binaries with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --parallelism 6
          workdir: mcp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}

  release-finalize:
    name: Release — Finalize (notes + chart + SBOMs)
    needs: [prepare, release-create, release-images, release-provider, release-migrate, release-publish, release-query, release-mcp]
    if: |
      always()
      && needs.prepare.outputs.is_tag == 'true'
      && needs.release-create.result == 'success'
      && needs.release-images.result == 'success'
      && needs.release-provider.result == 'success'
      && needs.release-migrate.result == 'success'
      && needs.release-publish.result == 'success'
      && needs.release-query.result == 'success'
      && needs.release-mcp.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download release-images artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-images-assets
          path: dist/

      - name: Generate release notes
        run: |
          version="${{ needs.prepare.outputs.version }}"

          prev_tag=$(git describe --tags --abbrev=0 "${version}^" 2>/dev/null || echo "")

          if [[ -n "$prev_tag" ]]; then
            range="${prev_tag}..${version}"
          else
            range="$version"
          fi

          feats="" fixes="" docs="" refactors="" tests="" chores="" others=""

          while IFS= read -r line; do
            msg=$(echo "$line" | sed -E 's/^[a-z]+(\([^)]*\))?[!]?:[[:space:]]*//')

            case "$line" in
              feat:*|feat\(*)     feats+="- ${msg}"$'\n' ;;
              fix:*|fix\(*)       fixes+="- ${msg}"$'\n' ;;
              docs:*|docs\(*)     docs+="- ${msg}"$'\n' ;;
              refactor:*|refactor\(*) refactors+="- ${msg}"$'\n' ;;
              test:*|test\(*)     tests+="- ${msg}"$'\n' ;;
              chore:*|chore\(*|ci:*|ci\(*) chores+="- ${msg}"$'\n' ;;
              *)                  others+="- ${line}"$'\n' ;;
            esac
          done < <(git log --format='%s' "$range" 2>/dev/null)

          notes=""
          [[ -n "$feats" ]] && notes+="### Features"$'\n\n'"$feats"$'\n'
          [[ -n "$fixes" ]] && notes+="### Bug Fixes"$'\n\n'"$fixes"$'\n'
          [[ -n "$docs" ]] && notes+="### Documentation"$'\n\n'"$docs"$'\n'
          [[ -n "$refactors" ]] && notes+="### Refactoring"$'\n\n'"$refactors"$'\n'
          [[ -n "$tests" ]] && notes+="### Tests"$'\n\n'"$tests"$'\n'
          [[ -n "$chores" ]] && notes+="### Maintenance"$'\n\n'"$chores"$'\n'
          [[ -n "$others" ]] && notes+="### Other Changes"$'\n\n'"$others"$'\n'

          if [[ -n "$prev_tag" ]]; then
            notes+="**Full Changelog**: https://github.com/mattrobinsonsre/terrapod/compare/${prev_tag}...${version}"$'\n'
          fi

          # Write to file to preserve newlines
          echo "$notes" > /tmp/release-notes.md

      - name: Edit Release title/notes + upload chart, SBOMs, checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.prepare.outputs.version }}"
          chart_version="${version#v}"

          # Is this the newest version we have released? GitHub picks "latest"
          # by PUBLISH TIME, not by version — so a security patch cut for an
          # older line silently takes the badge from a newer minor, pointing
          # the repo front page and everything reading /releases/latest at an
          # older release. That happened with v1.4.2 over v1.5.0 (#1374).
          #
          # Compare versions, not branch names: a patch on the NEWEST line
          # (v1.5.1 over v1.5.0) should take the badge.
          highest=$(
            {
              gh release list --limit 100 --json tagName --jq '.[].tagName'
              echo "$version"
            } | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1
          )
          if [ "$highest" = "$version" ]; then
            latest=true
          else
            latest=false
            echo "::notice::$version is not the newest release ($highest is) — not taking the 'Latest' badge"
          fi

          # GoReleaser already created the release with provider binaries.
          # Update title/notes and upload remaining assets.
          gh release edit "$version" \
            --title "$version" \
            --latest="$latest" \
            --notes-file /tmp/release-notes.md

          gh release upload "$version" \
            dist/terrapod-${chart_version}.tgz \
            dist/sbom-terrapod-api.spdx.json \
            dist/sbom-terrapod-web.spdx.json \
            dist/sbom-terrapod-runner.spdx.json \
            dist/sbom-terrapod-listener.spdx.json \
            dist/sbom-terrapod-migrations.spdx.json \
            dist/checksums.txt \
            --clobber

  # ── Cleanup Tag on Failure ─────────────────────────────
  cleanup-tag:
    name: Cleanup Tag
    needs: [prepare, quality-gate, build-images-amd64, build-images-arm64, build-query, scan-images, create-manifests, release-create, release-images, release-provider, release-migrate, release-publish, release-query, release-mcp, release-finalize]
    if: |
      always()
      && needs.prepare.outputs.is_tag == 'true'
      && (needs.quality-gate.result == 'failure' || needs.build-images-amd64.result == 'failure' || needs.build-images-arm64.result == 'failure' || needs.build-query.result == 'failure' || needs.scan-images.result == 'failure' || needs.create-manifests.result == 'failure' || needs.release-create.result == 'failure' || needs.release-images.result == 'failure' || needs.release-provider.result == 'failure' || needs.release-migrate.result == 'failure' || needs.release-publish.result == 'failure' || needs.release-query.result == 'failure' || needs.release-mcp.result == 'failure' || needs.release-finalize.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Delete tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.prepare.outputs.version }}"
          echo "Cleaning up failed release $version"

          gh release delete "$version" --cleanup-tag --yes 2>/dev/null || true
          git push origin ":refs/tags/$version" 2>/dev/null || true

  # ── Gate ───────────────────────────────────────────────
  ci-pass:
    name: CI
    if: always()
    needs:
      - prepare
      - python-lint
      - frontend-lint
      - provider-lint
      - provider-test
      - go-terrapod-lint
      - go-terrapod-test
      - migrate-lint
      - migrate-test
      - publish-lint
      - publish-test
      - query-lint
      - query-test
      - mcp-lint
      - mcp-test
      - build-query
      - python-test
      - pricegen-test
      - rescan-test
      - migration-check
      - python-audit
      - npm-audit
      - secret-scan
      - codeql
      - dependency-review
      - helm-lint
      - helm-smoke
      - helm-config-contract
      - helm-eval-boot
      - sast
      - build-images-amd64
      - build-images-arm64
      - scan-images
      - e2e-test
      - e2e-report
      - oci-conformance
      - create-manifests
      - release-create
      - release-images
      - release-provider
      - release-migrate
      - release-publish
      - release-query
      - release-mcp
      - release-finalize
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results=(
            "${{ needs.prepare.result }}"
            "${{ needs.python-lint.result }}"
            "${{ needs.frontend-lint.result }}"
            "${{ needs.provider-lint.result }}"
            "${{ needs.provider-test.result }}"
            "${{ needs.go-terrapod-lint.result }}"
            "${{ needs.go-terrapod-test.result }}"
            "${{ needs.migrate-lint.result }}"
            "${{ needs.migrate-test.result }}"
            "${{ needs.publish-lint.result }}"
            "${{ needs.publish-test.result }}"
            "${{ needs.query-lint.result }}"
            "${{ needs.query-test.result }}"
            "${{ needs.mcp-lint.result }}"
            "${{ needs.mcp-test.result }}"
            "${{ needs.build-query.result }}"
            "${{ needs.python-test.result }}"
            "${{ needs.pricegen-test.result }}"
            "${{ needs.rescan-test.result }}"
            "${{ needs.migration-check.result }}"
            "${{ needs.python-audit.result }}"
            "${{ needs.npm-audit.result }}"
            "${{ needs.secret-scan.result }}"
            "${{ needs.codeql.result }}"
            "${{ needs.dependency-review.result }}"
            "${{ needs.helm-lint.result }}"
            "${{ needs.helm-smoke.result }}"
            "${{ needs.helm-config-contract.result }}"
            "${{ needs.helm-eval-boot.result }}"
            "${{ needs.sast.result }}"
            "${{ needs.build-images-amd64.result }}"
            "${{ needs.build-images-arm64.result }}"
            "${{ needs.scan-images.result }}"
            "${{ needs.e2e-test.result }}"
            "${{ needs.oci-conformance.result }}"
            "${{ needs.create-manifests.result }}"
            "${{ needs.release-create.result }}"
            "${{ needs.release-images.result }}"
            "${{ needs.release-provider.result }}"
            "${{ needs.release-migrate.result }}"
            "${{ needs.release-publish.result }}"
            "${{ needs.release-query.result }}"
            "${{ needs.release-mcp.result }}"
            "${{ needs.release-finalize.result }}"
          )

          for r in "${results[@]}"; do
            if [[ "$r" == "failure" ]]; then
              echo "One or more jobs failed"
              exit 1
            fi
          done
          echo "All checks passed"

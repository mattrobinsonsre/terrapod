      - name: (helm-smoke) A separate runner namespace renders a working topology
        run: |
          # GHSA-p8xx-7rwg-9f72. Where runner Jobs run is the operator's call, so
          # the DEFAULTS do not move: runnerNamespace stays empty and
          # networkPolicies stays off. What has to hold is that CHOOSING the
          # separated topology produces something that WORKS — both bugs below
          # appear only once the isolation is on, which is the worst direction
          # for a security control to fail in.
          #
          # `# Source: <template>` is the signal for "did this template render at
          # all": helm drops an empty manifest entirely, marker and all.
          H() { docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
                  template terrapod helm/terrapod \
                  --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
                  --set redis.url=redis://redis:6379 "$@"; }
          WEB_FROM='networkPolicies.web.ingressFrom[0].namespaceSelector.matchLabels.kubernetes\.io/metadata\.name=kube-system'

          # 1. The in-cluster API URL is a FQDN, on EVERY profile. This value is
          #    runners.yaml's server_url, which the listener hands to every
          #    runner Job as TP_API_URL — and a bare Service name resolves only
          #    from the release namespace, i.e. only while the isolation is off.
          for f in values.yaml values-local.yaml values-eval.yaml; do
            su=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
                   template terrapod helm/terrapod -f "helm/terrapod/$f" \
                 | grep 'server_url:' | head -1)
            case "$su" in
              *.svc.cluster.local:8000*) ;;
              *) echo "$f: server_url is not a cluster-local FQDN: $su"
                 echo "runner Jobs run in listener.runnerNamespace, where a bare Service name does not resolve"
                 exit 1 ;;
            esac
          done

          # 2. With the runners moved out, the API policy must admit them with a
          #    namespaceSelector. A bare podSelector matches only pods in the
          #    policy's OWN namespace, so without this the policy denies every
          #    run's API call while looking perfectly correct.
          api_np=$(H --set listener.runnerNamespace=tp-runners \
                     --set networkPolicies.enabled=true --set "$WEB_FROM" \
                     --show-only templates/networkpolicy-api.yaml)
          echo "$api_np" | grep -q 'kubernetes.io/metadata.name: tp-runners' || {
            echo "the API NetworkPolicy does not admit runners from their own namespace"; exit 1; }
          echo "$api_np" | grep -q 'app.kubernetes.io/name: terrapod-runner' || {
            echo "the API NetworkPolicy no longer selects runner pods at all"; exit 1; }

          # 3. Every namespaced object the topology needs lands in that namespace:
          #    the listener's Role + RoleBinding, the runner SA, the runner policy.
          n=$(H --set listener.runnerNamespace=tp-runners --set networkPolicies.enabled=true \
                --set "$WEB_FROM" | grep -c '^  namespace: tp-runners')
          [ "$n" -ge 4 ] || { echo "expected >=4 objects in the runner namespace, got $n"; exit 1; }

          # 4. The co-located arrangement must be UNCHANGED: a bare podSelector,
          #    and no namespaceSelector naming a namespace it is already in.
          same_np=$(H --set networkPolicies.enabled=true --set "$WEB_FROM" \
                      --show-only templates/networkpolicy-api.yaml)
          echo "$same_np" | grep -q 'app.kubernetes.io/name: terrapod-runner' || {
            echo "the co-located API policy no longer admits runner pods"; exit 1; }
          echo "$same_np" | grep -q 'namespaceSelector' && {
            echo "a namespaceSelector is rendered when runners share the release namespace"; exit 1; }

          # 5. The runner Namespace is created only on request, and only when it
          #    is genuinely separate — otherwise two manifest entries would claim
          #    the release namespace.
          H --set namespace.createRunner=true --set listener.runnerNamespace=tp-runners \
            | grep -q 'name: tp-runners' || { echo "namespace.createRunner did not create it"; exit 1; }
          H --set namespace.createRunner=true | grep -q 'templates/namespace.yaml' && {
            echo "a runner Namespace was rendered with no separate namespace to create"; exit 1; }
          H --set listener.runnerNamespace=tp-runners | grep -q 'templates/namespace.yaml' && {
            echo "a runner Namespace was rendered without namespace.createRunner"; exit 1; }

          # 6. An explicit `false` must survive — `hasKey`/a plain `if`, never
          #    `| default`, which would coerce it back to true.
          H --set namespace.createRunner=false --set listener.runnerNamespace=tp-runners \
            | grep -q 'templates/namespace.yaml' && {
            echo "createRunner=false still created the namespace — a | default swallowed the false"; exit 1; }
          H --set networkPolicies.enabled=false | grep -q 'kind: NetworkPolicy' && {
            echo "networkPolicies.enabled=false still rendered policies"; exit 1; }

          echo "the separated runner namespace renders a working topology, and the defaults are unmoved"


      - name: (helm-smoke) No credential supplied in values is rendered into a manifest
        run: |
          # GHSA-93m3-v3h4-4qvw. Four credentials used to be rendered as literal
          # env values: the database URL (the API Deployment plus the migrations,
          # preflight, bootstrap and backup Jobs), the listener's join token, and
          # the bootstrap admin password and pool token. A Deployment or Job spec
          # is readable by anyone with `get` on it in the namespace, by
          # `helm get values`, and by whatever stores the rendered manifest.
          #
          # This is the rendered half of the contract: pass each one through
          # --set with a recognisable value, then assert it appears in no object
          # whose kind is not Secret. Grepping for "secretKeyRef" would only show
          # that SOME path uses one; this shows no path does not.
          out=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
            --set postgresql.url='postgresql+asyncpg://u:TPDBSECRET@db:5432/terrapod' \
            --set redis.url=redis://redis:6379 \
            --set listener.joinToken=TPJOINSECRET \
            --set bootstrap.adminEmail=a@example.com \
            --set bootstrap.adminPassword=TPPWSECRET \
            --set bootstrap.poolName=p1 \
            --set bootstrap.poolToken=TPPOOLSECRET \
            --set preflight.enabled=true \
            --set backup.enabled=true)

          # Split the manifest per document and check each one's kind.
          printf '%s\n' "$out" | awk -v RS='\n---\n' '
            { kind=""; for (i = 1; i <= NF; i++) if ($i == "kind:") { kind = $(i+1); break }
              if ($0 ~ /TPDBSECRET|TPJOINSECRET|TPPWSECRET|TPPOOLSECRET/ && kind != "Secret")
                { print "LEAK in kind=" kind; bad = 1 } }
            END { exit bad ? 1 : 0 }' || {
            echo "a credential supplied in values was rendered into a non-Secret object."
            echo "it must reach its consumer by secretKeyRef from a chart-managed Secret."
            exit 1; }

          # And each one must actually be delivered, not merely absent: a
          # credential that reaches nothing is a broken install, not a fix.
          for want in TPDBSECRET TPJOINSECRET TPPWSECRET TPPOOLSECRET; do
            printf '%s\n' "$out" | grep -q "$want" \
              || { echo "$want is in no Secret at all — the value is being dropped"; exit 1; }
          done
          # Anchored and end-matched: `name: terrapod-bootstrap` unanchored would
          # also match the bootstrap Job's own `terrapod-bootstrap-1`, so the
          # check would pass with no Secret rendered at all.
          for ref in '-database-url' '-listener-join-token' '-bootstrap'; do
            printf '%s\n' "$out" | grep -qE "^  name: terrapod$ref\$" \
              || { echo "the chart-managed Secret terrapod$ref was not rendered"; exit 1; }
          done

          # The Secrets that feed a pre-install hook must themselves be hooks at a
          # lower weight, or the migrations Job (weight -5) starts with nothing to
          # read. The join-token Secret is deliberately NOT a hook: its only
          # consumer is an ordinary Deployment, and Secret sorts before Deployment.
          printf '%s\n' "$out" | grep -B 20 'name: terrapod-database-url' | grep -q '"-25"' \
            || { echo "the database-URL Secret is not a pre-install hook at weight -25"; exit 1; }

          # An operator's own Secret must still win, and the chart must then
          # render no Secret of its own for that credential.
          own=$(docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
            template terrapod helm/terrapod \
            --set postgresql.existingSecret=my-db --set postgresql.existingSecretKey=dsn \
            --set redis.url=redis://redis:6379 \
            --set listener.existingSecret=my-listener)
          echo "$own" | grep -q 'name: my-db' || { echo "postgresql.existingSecret is ignored"; exit 1; }
          echo "$own" | grep -q 'name: my-listener' || { echo "listener.existingSecret is ignored"; exit 1; }
          echo "$own" | grep -q 'name: terrapod-database-url' && {
            echo "the chart rendered its own database Secret despite existingSecret"; exit 1; }
          echo "$own" | grep -q 'name: terrapod-listener-join-token' && {
            echo "the chart rendered its own join-token Secret despite existingSecret"; exit 1; }

          echo "every credential supplied in values reaches its consumer from a Secret, and only from a Secret"


      - name: (helm-smoke) Bootstrap join tokens are bounded, and an explicit 0 survives
        run: |
          # GHSA-93m3-v3h4-4qvw, second half. A bootstrap join token was created
          # with no expiry and no use limit — a permanent, unlimited credential
          # for joining a listener to the pool, and a listener in the pool
          # receives every variable the runs it claims resolve.
          B() { docker run --rm -v "$PWD:/chart" -w /chart "${HELM_IMAGE:-alpine/helm:3.17.2}" \
                  template terrapod helm/terrapod \
                  --set postgresql.url=postgresql+asyncpg://t:t@db:5432/terrapod \
                  --set redis.url=redis://redis:6379 \
                  --set bootstrap.adminEmail=a@example.com --set bootstrap.adminPassword=p \
                  --set bootstrap.poolName=p1 "$@" \
                  --show-only templates/job-bootstrap.yaml; }

          # Rendered unconditionally, so a limit an operator sets can never be
          # silently inert, and the chart's defaults cannot drift from the CLI's.
          B | grep -A1 'TERRAPOD_BOOTSTRAP_POOL_TOKEN_MAX_USES' | grep -q 'value: "1"' \
            || { echo "the default use limit does not reach the Job"; exit 1; }
          B | grep -A1 'TERRAPOD_BOOTSTRAP_POOL_TOKEN_TTL_SECONDS' | grep -q 'value: "86400"' \
            || { echo "the default token lifetime does not reach the Job"; exit 1; }

          # An operator's own values reach the Job.
          B --set bootstrap.poolTokenMaxUses=3 --set bootstrap.poolTokenTTLSeconds=600 \
            | grep -A1 'POOL_TOKEN_MAX_USES' | grep -q 'value: "3"' \
            || { echo "poolTokenMaxUses does not reach the Job"; exit 1; }

          # And the one that matters: an explicit 0 is the documented opt-out
          # (unlimited / never expires), and Go templates treat 0 as empty — so
          # `| default 1` here would render 1 and turn a deliberate "no limit"
          # into the tightest limit there is, on a token a listener needs.
          # `dig` is what keeps the two apart.
          zero=$(B --set bootstrap.poolTokenMaxUses=0 --set bootstrap.poolTokenTTLSeconds=0)
          echo "$zero" | grep -A1 'POOL_TOKEN_MAX_USES' | grep -q 'value: "0"' \
            || { echo "an explicit poolTokenMaxUses=0 was swallowed — use dig, not | default"; exit 1; }
          echo "$zero" | grep -A1 'POOL_TOKEN_TTL_SECONDS' | grep -q 'value: "0"' \
            || { echo "an explicit poolTokenTTLSeconds=0 was swallowed"; exit 1; }

          echo "bootstrap join tokens render bounded by default, and an explicit 0 survives"

      - name: (helm-smoke) The cloud identity audience catalogue reaches the ConfigMap
        run: |
          # Leg 3 of the config-channel contract. A values key with no render
          # line is SILENTLY INERT -- the operator sets it, it never reaches the
          # pod, and the code default wins. For this key that failure is
          # invisible in the worst way: every workspace would fall through to the
          # agent pool's identity while the chart says otherwise.
          out=$(helm template tp ./helm/terrapod \
            --set api.config.auth.oidc_issuer.enabled=true \
            --set-json 'api.config.auth.oidc_issuer.audiences={"aws":["sts.amazonaws.com"],"vault":["https://vault.example.com"]}')
          echo "$out" | grep -q 'audiences:' \
            || { echo "FAIL: oidc_issuer.audiences does not render into config.yaml"; exit 1; }
          echo "$out" | grep -q 'sts.amazonaws.com' \
            || { echo "FAIL: a configured audience value is missing from config.yaml"; exit 1; }
          echo "$out" | grep -q 'https://vault.example.com' \
            || { echo "FAIL: a second target's audience is missing from config.yaml"; exit 1; }
          # Absent by default, on every profile: an empty map is what makes the
          # whole feature opt-in, and a stray default would hand every workspace
          # an audience nobody chose.
          for prof in values.yaml values-local.yaml values-eval.yaml; do
            stock=$(helm template tp ./helm/terrapod -f "helm/terrapod/$prof") \
              || { echo "FAIL: $prof does not render"; exit 1; }
            echo "$stock" | grep -q 'audiences:' \
              && { echo "FAIL: $prof renders an audience catalogue by default"; exit 1; }
          done
          echo "cloud identity audience catalogue renders OK and is empty by default (#1901)"


      - name: (helm-smoke) The apply ServiceAccount renders only when asked for (#2189)
        run: |
          # An apply-phase identity exists so a speculative plan -- which runs
          # code from a pull request nobody has reviewed -- cannot reach the
          # credentials that change infrastructure. It is only worth having if it
          # is also invisible to every deployment that does not want it, so what
          # needs proving here is BOTH directions, against a real render.
          #
          # Leg 4 of the config-channel contract. The source-level gates in
          # services/tests/helm assert the conditionals are written; only a
          # render shows what an operator actually gets.
          out=$(helm template tp ./helm/terrapod \
            --set runners.applyServiceAccount.create=true \
            --set 'runners.applyServiceAccount.annotations.eks\.amazonaws\.com/role-arn=arn:aws:iam::111122223333:role/tp-apply')
          echo "$out" | grep -q 'terrapod-runner-apply' \
            || { echo "FAIL: the apply ServiceAccount is not rendered"; exit 1; }
          echo "$out" | grep -q 'apply_service_account_name:' \
            || { echo "FAIL: apply_service_account_name does not reach the runner ConfigMap"; exit 1; }
          echo "$out" | grep -q 'role/tp-apply' \
            || { echo "FAIL: the apply account's annotations do not render -- without them it is a differently-named account with no cloud identity"; exit 1; }
          # The plan/default account must be untouched: this adds an identity, it
          # does not move the existing one.
          echo "$out" | grep -qE 'service_account_name: "[^"]*runner"' \
            || { echo "FAIL: the default runner account is missing from the ConfigMap"; exit 1; }
          # An operator may instead NAME an account they already manage, in which
          # case the config key must render and the chart must create nothing.
          named=$(helm template tp ./helm/terrapod \
            --set runners.applyServiceAccount.name=preexisting-apply)
          echo "$named" | grep -q 'apply_service_account_name: "preexisting-apply"' \
            || { echo "FAIL: a named pre-existing apply account does not reach the ConfigMap"; exit 1; }
          echo "$named" | awk '/^kind: ServiceAccount/{sa=1} sa && /name: preexisting-apply/{found=1} END{exit !found}' \
            && { echo "FAIL: the chart created an account the operator said already exists"; exit 1; }
          # Absent by default, on every profile. A stray default would put a
          # second account in every namespace and point every apply at it.
          for prof in values.yaml values-local.yaml values-eval.yaml; do
            stock=$(helm template tp ./helm/terrapod -f "helm/terrapod/$prof") \
              || { echo "FAIL: $prof does not render"; exit 1; }
            echo "$stock" | grep -q 'apply_service_account_name:' \
              && { echo "FAIL: $prof renders apply_service_account_name by default"; exit 1; }
            echo "$stock" | grep -q 'terrapod-runner-apply' \
              && { echo "FAIL: $prof creates an apply ServiceAccount by default"; exit 1; }
          done
          echo "apply ServiceAccount renders OK and is absent by default (#2189)"


      - name: (helm-smoke) An issuer-only webhook Ingress is a renderable configuration
        run: |
          # values.yaml advertises "enabling this block with ONLY those two
          # paths, and no webhook path at all" as first-class, for a deployment
          # that polls VCS and wants nothing else public. The chart supplies the
          # two issuer paths itself, so the way to express that is an empty
          # allow-list -- which the validation guard refused outright, because it
          # judged the operator's list rather than the resolved set. The chart
          # contradicting its own documented configuration is the kind of thing
          # only a render catches.
          out=$(helm template tp ./helm/terrapod \
            --set webhookIngress.enabled=true \
            --set webhookIngress.hostname=hooks.example.com \
            --set 'webhookIngress.paths=null' \
            --set api.config.auth.oidc_issuer.enabled=true) \
            || { echo "FAIL: an issuer-only webhook Ingress does not render"; exit 1; }
          echo "$out" | grep -q 'path: /.well-known/openid-configuration' \
            || { echo "FAIL: the discovery path is missing from the issuer-only Ingress"; exit 1; }
          echo "$out" | grep -q 'path: /.well-known/jwks.json' \
            || { echo "FAIL: the JWKS path is missing from the issuer-only Ingress"; exit 1; }
          echo "$out" | grep -q 'path: /api/terrapod/v1/vcs-events' \
            && { echo "FAIL: a webhook path leaked into an issuer-only Ingress"; exit 1; }
          # And the guard still fires where it should: with the issuer off, an
          # empty allow-list really would accept nothing.
          if helm template tp ./helm/terrapod \
            --set webhookIngress.enabled=true \
            --set webhookIngress.hostname=hooks.example.com \
            --set 'webhookIngress.paths=null' >/dev/null 2>&1; then
            echo "FAIL: an empty allow-list with no issuer rendered an Ingress that accepts nothing"
            exit 1
          fi
          echo "issuer-only webhook Ingress renders, and an empty allow-list is still refused (#1901)"

  # ── Config-channel contract (#617) ────────────────────
  # Renders the chart (every values profile) and parses the rendered ConfigMaps
  # THROUGH the real Pydantic config models (Settings / RunnerConfig), asserting
  # the chart ↔ code ↔ chart-test contract: no drift (every rendered key is a
  # real model field), contract-spine keys present, and no non-sensitive
  # TERRAPOD_* env on any Deployment. See AGENTS.md → "The config-channel
  # contract" and scripts/check_helm_config_contract.py.

      - name: (go-audit) Audit every Go module
        # Six Go modules ship in every release and, until #1542, NOTHING scanned
        # any of them. Trivy covers the images; `provider` and `migrate` are
        # release *assets*, not image contents, so the image scan cannot see
        # them. pip-audit and npm audit cover Python and JavaScript. Go had no
        # equivalent, and a HIGH in grpc reached a tagged release because of it.
        #
        # Version-based, not `govulncheck`. govulncheck does reachability
        # analysis and reported the grpc advisory as clean, because the
        # vulnerable function is never called from our binaries — which is
        # useful for triage and useless as a gate, since an operator scanning
        # our released artifacts sees the version, not the call graph. This
        # matches what Dependabot and their scanner will say.
        #
        # It also found two modules Dependabot missed entirely (`publish`,
        # `query`), so it is not merely duplicating the alerts.
        #
        # The vulnerability DB is downloaded ONCE, up front, into a shared
        # cache, and the six scans then run with `--skip-db-update`. Before
        # this each `docker run` fetched the DB itself — six independent
        # chances for a transient registry failure, and when one hit (a 404
        # from mirror.gcr.io on the DB layer, 2026-10-05) the job reported
        # "High/critical advisories in a Go module" and exited 1. `--exit-code
        # 1` means findings, but a FATAL init error also exits non-zero, so
        # `|| fail=1` could not tell "found a CVE" from "never scanned", and
        # the gate named the wrong cause. Separating the download makes a DB
        # failure its own attributable failure, before any module is scanned.
        run: |
          set -u
          TRIVY="${TRIVY_IMAGE:-ghcr.io/aquasecurity/trivy:0.72.0}"
          CACHE="${RUNNER_TEMP:-/tmp}/trivy-cache"
          mkdir -p "$CACHE"

          # Bounded retry: a registry hiccup here is infrastructure, not a
          # finding, and must not be reported as one. Three attempts with
          # backoff, then fail with a message that says what actually broke.
          db_ok=0
          for attempt in 1 2 3; do
            echo "── vulnerability DB (attempt $attempt/3)"
            if docker run --rm -v "$CACHE:/cache" "$TRIVY" \
                 fs --cache-dir /cache --scanners vuln --download-db-only --quiet; then
              db_ok=1; break
            fi
            [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
          done
          if [ "$db_ok" != "1" ]; then
            echo
            echo "Could not download the Trivy vulnerability database after 3 attempts."
            echo "NO MODULE WAS SCANNED — this is an infrastructure failure, not a"
            echo "finding. Re-run the job; if it persists, check Trivy DB registry"
            echo "availability (ghcr.io / mirror.gcr.io)."
            exit 1
          fi

          fail=0
          # DERIVED, not listed. A hand-kept list is why `loadtest` had never
          # been audited at all — it is the one module that was also missing a
          # lint and a test job, and it stayed invisible here for the same
          # reason. The floor is the same shape CodeQL's module build uses: a
          # finder that stops matching must fail rather than audit a fraction
          # of the Go code and report success.
          mapfile -t mods < <(
            find . -name go.mod \
              -not -path './.conformance/*' \
              -not -path './.claude/*' \
              -not -path './node_modules/*' \
              -printf '%h\n' | sed 's|^\./||' | sort
          )
          # The floor EQUALS the module count, and `check_go_directives.py` keeps
          # it that way -- it reads this number out of this job and fails when the
          # two disagree. Slack here is the hole rather than a convenience: this
          # floor is the only thing between a finder that stopped matching and a
          # green run over a fraction of the Go code. It sat at 7 against nine
          # modules (#2275), so two could have vanished unnoticed.
          if [ "${#mods[@]}" -lt 9 ]; then
            echo "Found only ${#mods[@]} Go module(s): ${mods[*]}"
            echo "Expected at least 9 — failing rather than auditing a fraction."
            exit 1
          fi
          echo "Auditing ${#mods[@]} module(s): ${mods[*]}"
          for m in "${mods[@]}"; do
            echo "── $m"
            docker run --rm -v "$PWD:/src" -v "$CACHE:/cache" -w /src \
              "$TRIVY" \
              fs --cache-dir /cache --skip-db-update \
              --scanners vuln --severity HIGH,CRITICAL \
              --ignorefile /src/pentest/trivy/.trivyignore \
              --exit-code 1 --quiet "$m/go.mod" || fail=1
          done
          if [ "$fail" != "0" ]; then
            echo
            echo "High/critical advisories in a Go module. Bump the dependency:"
            echo "  cd <module> && go get <pkg>@<fixed> && go mod tidy"
            echo "Pin the FIXED version, never an older one — pinning a lower"
            echo "version downgrades the whole module graph and can reintroduce"
            echo "advisories elsewhere."
            exit 1
          fi
          echo "all Go modules clean"

  # ── Secret Scanning (gitleaks) ────────────────────────

      - name: (migration-check) Build migrations image
        run: docker build -f docker/Dockerfile.migrations -t tp-migrations:ci .

      - name: (migration-check) Run migrations (alembic upgrade head — the real migration files)
        run: docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" tp-migrations:ci

      - name: (migration-check) Seed representative rows + query the migrated schema
        run: |
          docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" \
            -v "$PWD/scripts/migration_smoke.py:/app/scripts/migration_smoke.py:ro" \
            --entrypoint python tp-migrations:ci scripts/migration_smoke.py

  # ── Dependency Audit (Python) ─────────────────────────

  helm-eval-boot:
    name: Eval Boot (${{ matrix.tool }})
    # Depend on the amd64 build so the eval boots the images BUILT FROM THIS PR
    # (loaded into the cluster), not published `:latest`. That's what makes the
    # plan-through-listener smoke test the PR's actual code (e.g. the binary-cache
    # version-resolution path), and keeps it from depending on whatever is live.
    needs: [prepare, build-images-amd64]
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    # `helm --wait` blocks on the full stack (incl. the listener joining the
    # bootstrapped pool) and the plan-smoke launches a runner Job — so cap the
    # job at a sensible ceiling rather than the 6h default, in case an install or
    # the run ever hangs.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        tool: [kind, k3d]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install ${{ matrix.tool }}
        run: |
          # Pinned by version AND verified by checksum. A version pin alone says
          # which URL to fetch, not which bytes arrive: a release asset can be
          # replaced, and kind.sigs.k8s.io/dl is a redirect. These binaries build
          # the cluster that a tag-gating job boots the release candidate in, so
          # an unverified download is a gate that can be rewritten from outside
          # (the installer-pinning half of GHSA-34pp-q7wp-3j54). Bump the version
          # and the checksum together — the upstream checksum files are
          # <url>.sha256sum for kind and checksums.txt for k3d.
          if [ "${{ matrix.tool }}" = "kind" ]; then
            curl -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
            echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  ./kind" \
              | sha256sum -c -
            sudo install -m 0755 ./kind /usr/local/bin/kind && rm -f ./kind
          else
            # Download the pinned k3d release binary directly (no curl|bash).
            curl -fsSLo ./k3d https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
            echo "06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0  ./k3d" \
              | sha256sum -c -
            sudo install -m 0755 ./k3d /usr/local/bin/k3d && rm -f ./k3d
          fi
      # ── Get the amd64 images built by this run ───────────────────────────────
      # PR builds load them from the build-images-amd64 artifacts (no GHCR push on
      # PRs); branch/tag builds pull them from GHCR. Either way they end up in the
      # local docker daemon under their canonical sha-<short>-amd64 tag, which is
      # what eval.sh resolves below (chart pullPolicy is IfNotPresent, so the
      # loaded images are used without a registry round-trip).
      - name: Log in to GHCR (branch/tag)
        if: needs.prepare.outputs.is_pr != 'true'
        uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}
      - name: Pull images (branch/tag)
        if: needs.prepare.outputs.is_pr != 'true'
        run: |
          sha="${{ needs.prepare.outputs.sha_short }}"
          for i in terrapod-api terrapod-web terrapod-migrations terrapod-listener terrapod-runner; do
            docker pull "$REGISTRY/$i:sha-${sha}-amd64"
          done
      - name: Download image artifacts (PR)
        if: needs.prepare.outputs.is_pr == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: image-*-amd64
          path: /tmp/images
          merge-multiple: true
      # k3d only: it needs the images in the local daemon so they can be tagged
      # and pushed to the eval registry. kind loads the archives straight into
      # the node below and never involves the daemon at all.
      #
      # Parallel because gunzip is single-threaded and CPU-bound while the runner
      # has four cores; serially this was 73s, the largest step in the k3d job.
      # Statuses are collected explicitly — backgrounding must not turn a failed
      # load into a green step.
      - name: Load images into docker (PR, k3d)
        if: needs.prepare.outputs.is_pr == 'true' && matrix.tool == 'k3d'
        run: |
          set -euo pipefail
          pids=()
          for i in terrapod-api terrapod-web terrapod-migrations terrapod-listener terrapod-runner; do
            ( set -o pipefail; gunzip -c "/tmp/images/$i-amd64.tar.gz" | docker load ) &
            pids+=("$!")
          done
          rc=0
          for pid in "${pids[@]}"; do wait "$pid" || rc=1; done
          [ "$rc" -eq 0 ] || { echo "at least one image failed to load" >&2; exit 1; }
      # ── Create the cluster + load the images into it, then install ───────────
      # eval.sh reuses an existing cluster, so we create it here (kind load /
      # k3d image import need the cluster to exist first) and let eval.sh install.
      - name: Create cluster + load images
        run: |
          sha="${{ needs.prepare.outputs.sha_short }}"
          imgs=""
          for i in terrapod-api terrapod-web terrapod-migrations terrapod-listener terrapod-runner; do
            imgs="$imgs $REGISTRY/$i:sha-${sha}-amd64"
          done
          if [ "${{ matrix.tool }}" = "kind" ]; then
            # Pinned to the chart's declared floor (Chart.yaml kubeVersion, #1486).
            # Unpinned, kind boots whatever its own default is — current Kubernetes —
            # so the floor was a claim nothing tested, which is the shape of accidental
            # promise #1387 set out to fix. The k3d leg stays unpinned on current, so
            # between them the two legs cover both ends of the supported range.
            kind create cluster --name terrapod-eval --wait 120s \
              --image "kindest/node:${KIND_NODE_IMAGE_TAG}"
            if [ "${{ needs.prepare.outputs.is_pr }}" = "true" ]; then
              # Import the build artifacts straight into the node. `kind load
              # docker-image` has to docker-save each image back out of the
              # daemon first, so routing through the daemon paid for the same
              # bytes three times — gunzip, load, save. Those two steps
              # together were 125s of a 224s job.
              #
              # image-archive wants an uncompressed tar, so decompress in
              # parallel (CPU-bound, four cores) and import serially: kind
              # writes into the node's containerd, which is not worth racing.
              pids=()
              for i in terrapod-api terrapod-web terrapod-migrations terrapod-listener terrapod-runner; do
                gunzip -c "/tmp/images/$i-amd64.tar.gz" > "/tmp/images/$i.tar" &
                pids+=("$!")
              done
              rc=0
              for pid in "${pids[@]}"; do wait "$pid" || rc=1; done
              [ "$rc" -eq 0 ] || { echo "failed to decompress an image archive" >&2; exit 1; }
              for i in terrapod-api terrapod-web terrapod-migrations terrapod-listener terrapod-runner; do
                kind load image-archive "/tmp/images/$i.tar" --name terrapod-eval
              done
            else
              # Branch/tag builds pulled the images from GHCR into the daemon,
              # so there is no archive on disk to import from.
              for img in $imgs; do kind load docker-image "$img" --name terrapod-eval; done
            fi
          else
            # A k3d-managed local registry, NOT `k3d image import`. The import
            # reports "Successfully imported" but leaves images unresolvable by
            # the kubelet under their own ref, so pods fall back to pulling from
            # ghcr.io (nothing pushed there on PRs) → ImagePullBackOff → the
            # pre-install migration hook hangs the whole boot for 10 min. A real
            # registry pull is deterministic and works identically on PR + branch
            # builds. #975.
            reg_port=5111
            k3d registry create eval-registry.localhost --port "$reg_port" \
              --image "${K3D_REGISTRY_IMAGE}"
            k3d cluster create terrapod-eval \
              --registry-use "k3d-eval-registry.localhost:${reg_port}" \
              --wait --timeout 120s
            # Tag serially (metadata only, cheap), push in parallel — five
            # independent pushes to a local registry, 70s serially.
            pids=()
            for i in terrapod-api terrapod-web terrapod-migrations terrapod-listener terrapod-runner; do
              # Push over localhost:PORT (docker auto-treats localhost as an
              # insecure registry — no daemon config needed); pods pull the same
              # repo path in-cluster via k3d-eval-registry.localhost:PORT, which
              # the chart's global.imageRegistry override points them at.
              dst="localhost:${reg_port}/mattrobinsonsre/${i}:sha-${sha}-amd64"
              docker tag "$REGISTRY/${i}:sha-${sha}-amd64" "$dst"
              docker push "$dst" &
              pids+=("$!")
            done
            rc=0
            for pid in "${pids[@]}"; do wait "$pid" || rc=1; done
            [ "$rc" -eq 0 ] || { echo "at least one push to the eval registry failed" >&2; exit 1; }
          fi
      - name: make eval (install into the cluster)
        # Bounded below the job's own timeout so an install that will not
        # converge FAILS this step — leaving budget for diagnostics and
        # teardown — instead of cancelling the job and skipping both.
        timeout-minutes: 12
        env:
          CI: "1"
          EVAL_NO_PORT_FORWARD: "1"
          # Use the images built + loaded above (NOT :latest).
          TERRAPOD_VERSION: sha-${{ needs.prepare.outputs.sha_short }}-amd64
          # Pin the tool — the runner ships a pre-installed `kind`, so without
          # this the k3d matrix job would auto-detect kind and the smoke step's
          # k3d-pinned context lookup would miss.
          TERRAPOD_EVAL_TOOL: ${{ matrix.tool }}
          # k3d pulls every image from the local registry created above (kind
          # loads images straight into the node, so it needs no override). #975.
          TERRAPOD_EVAL_IMAGE_REGISTRY: ${{ matrix.tool == 'k3d' && 'k3d-eval-registry.localhost:5111' || '' }}
          # Fail fast: a healthy boot is ~50s, so cap the install wait at 5 min so
          # a genuine image/scheduling problem surfaces quickly with pod
          # diagnostics instead of a ~10-min silent hang. #975.
          TERRAPOD_EVAL_HELM_TIMEOUT: 300s
        run: scripts/eval.sh up
      - name: Smoke the running stack
        run: |
          ctx=$([ "${{ matrix.tool }}" = "kind" ] && echo kind-terrapod-eval || echo k3d-terrapod-eval)
          ns=terrapod-eval
          # eval.sh installs with `helm --wait`, so these are already satisfied;
          # assert them explicitly anyway as the smoke contract.
          kubectl --context "$ctx" -n "$ns" wait --for=condition=available deploy/terrapod-web --timeout=150s
          kubectl --context "$ctx" -n "$ns" wait --for=condition=available deploy/terrapod-api --timeout=150s
          # The listener only reports Available once it has JOINED the bootstrapped
          # eval-pool — so this proves the agent-execution wiring end-to-end, not
          # just that a pod started.
          kubectl --context "$ctx" -n "$ns" wait --for=condition=available deploy/terrapod-listener --timeout=180s
          kubectl --context "$ctx" -n "$ns" port-forward svc/terrapod-web 18080:3000 >/dev/null 2>&1 &
          sleep 6
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 8 --retry-delay 3 --retry-all-errors http://localhost:18080/login)
          echo "GET /login -> $code"
          [ "$code" = "200" ] || { echo "FAIL: UI did not serve /login"; exit 1; }
          echo "Eval stack booted + UI served on ${{ matrix.tool }}"
      - name: Plan through the listener
        # Prove the listener actually EXECUTES runs: create an agent workspace on
        # the bootstrapped eval-pool, upload a config, queue a plan, and assert it
        # reaches `planned` on a real Kubernetes Job. This is the difference
        # between "a listener pod exists" and "server-side runs work".
        run: |
          ctx=$([ "${{ matrix.tool }}" = "kind" ] && echo kind-terrapod-eval || echo k3d-terrapod-eval)
          scripts/eval-smoke-plan.sh "$ctx" terrapod-eval
      - name: Diagnostics on failure
        # `failure()` alone does NOT run when the job is cancelled by its own
        # timeout-minutes — only `always()`/`cancelled()` do. A hung boot is
        # exactly the case we most want diagnostics for, and it is the case
        # this condition used to skip.
        if: failure() || cancelled()
        timeout-minutes: 3
        run: |
          ctx=$([ "${{ matrix.tool }}" = "kind" ] && echo kind-terrapod-eval || echo k3d-terrapod-eval)
          kubectl --context "$ctx" -n terrapod-eval get pods,jobs || true
          kubectl --context "$ctx" -n terrapod-eval logs deploy/terrapod-listener --tail=80 || true
          kubectl --context "$ctx" -n terrapod-eval logs -l app.kubernetes.io/name=terrapod-runner --tail=120 --prefix || true
      - name: Teardown
        # `k3d cluster delete` has hung for 23 minutes here, consuming the rest
        # of the job budget and turning "one step failed" into "the whole job
        # was killed" — which is a much harder thing to read. A cluster delete
        # that cannot finish in 3 minutes is not going to.
        if: always()
        timeout-minutes: 3
        env:
          TERRAPOD_EVAL_TOOL: ${{ matrix.tool }}
        run: scripts/eval.sh down

  # ── SAST (Semgrep) ─────────────────────────────────────
  sast:
    name: SAST
    needs: prepare
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            "${SEMGREP_IMAGE:-semgrep/semgrep:1.117}" \
            semgrep scan /src \
              --config "p/python" \
              --config "p/owasp-top-ten" \
              --config "p/secrets" \
              --config "/src/pentest/semgrep/.semgrep.yml" \
              --exclude "web/node_modules" \
              --exclude ".next" \
              --exclude "dist" \
              --exclude "alembic/versions" \
              --exclude "reports" \
              --exclude "services/ai_eval" \
              --exclude-rule "python.lang.security.insecure-hash-algorithms-md5.insecure-hash-algorithm-md5" \
              --exclude-rule "python.lang.security.audit.logging.logger-credential-leak.python-logger-credential-disclosure" \
              --exclude-rule "python.flask.security.audit.directly-returned-format-string.directly-returned-format-string" \
              --sarif \
              --output "/src/semgrep-results.sarif"

      # Drop findings Semgrep reports as suppressed by a reviewed `nosemgrep`
      # comment. Code scanning honours a SARIF suppression only when it first
      # creates an alert: a finding suppressed AFTER its alert was opened stays
      # open for good, however often it is re-uploaded suppressed. Leaving the
      # suppressed results out closes such an alert as fixed.
      - name: Drop suppressed Semgrep findings
        if: always()
        run: |
          set -euo pipefail
          f=semgrep-results.sarif
          [ -s "$f" ] || exit 0
          jq '.runs |= map(.results |= map(select((.suppressions // []) | length == 0)))' "$f" > "$f.tmp"
          echo "suppressed findings dropped: $(( $(jq '[.runs[].results[]] | length' "$f") - $(jq '[.runs[].results[]] | length' "$f.tmp") ))"
          mv "$f.tmp" "$f"

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      # Semgrep ran without `--error`, so a finding was reported and the job
      # still passed — the gate could not fail, which is the whole of the
      # finding. Gate on the count AFTER the suppression filter above rather
      # than on semgrep's own exit code, so the gate and the upload agree about
      # what counts as a finding; `--error` would judge it before that filter.
      # Ordered after the upload, and the upload is `always()`, so a finding is
      # always visible in code scanning as well as failing the build.
      - name: Fail on Semgrep findings
        if: always()
        run: |
          set -euo pipefail
          f=semgrep-results.sarif
          [ -s "$f" ] || { echo "no SARIF produced — semgrep did not run"; exit 1; }
          n=$(jq '[.runs[].results[]] | length' "$f")
          echo "semgrep findings after suppression: $n"
          if [ "$n" -ne 0 ]; then
            jq -r '.runs[].results[] | "  \(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri)"' "$f"
            exit 1
          fi

  # ── Build Images ───────────────────────────────────────
  # Built per-arch in SEPARATE jobs (not one arch×image matrix) so the
  # latency-sensitive consumers can depend on only the arch they need:
  # e2e-test + scan-images run on amd64 and must NOT wait on the slow arm64
  # web build. Splitting also gives each arch its own fail-fast scope, so a
  # failing arm64 leg no longer cancels the amd64 images e2e needs. arm64
  # still runs (build-validation + release manifests) and is now also
  # artifacted on PRs so scan-images can scan it.
  build-images-amd64:
    name: Build ${{ matrix.image }} (amd64)
    needs: [prepare, build-query, build-ee-agent]
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [terrapod-api, terrapod-web, terrapod-runner, terrapod-listener, terrapod-migrations]
        include:
          - image: terrapod-api
            dockerfile: docker/Dockerfile.api
          - image: terrapod-web
            dockerfile: docker/Dockerfile.web
          - image: terrapod-runner
            dockerfile: docker/Dockerfile.runner
          - image: terrapod-listener
            dockerfile: docker/Dockerfile.listener
          - image: terrapod-migrations
            dockerfile: docker/Dockerfile.migrations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to GHCR
        uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}

      # terrapod-query is baked into api + runner (#823) from the binary the
      # build-query job compiled once — staged into the build context here.
      - name: Stage terrapod-query binary (api/runner only)
        if: matrix.image == 'terrapod-api' || matrix.image == 'terrapod-runner'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: terrapod-query-linux-amd64
          path: docker/query-bin
      - name: Normalise terrapod-query binary
        if: matrix.image == 'terrapod-api' || matrix.image == 'terrapod-runner'
        run: |
          mv docker/query-bin/terrapod-query-linux-amd64 docker/query-bin/terrapod-query
          chmod 0755 docker/query-bin/terrapod-query

      # terrapod-ee-agent is baked into the RUNNER only (#2154), from the
      # binary build-ee-agent compiled once. The runner's initContainer
      # copies it onto a shared volume so the EE can run it — which is how
      # an EE stays free of Terrapod code and insensitive to our releases.
      - name: Stage terrapod-ee-agent binary (runner only)
        if: matrix.image == 'terrapod-runner'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: terrapod-ee-agent-linux-amd64
          path: docker/ee-agent-bin
      - name: Normalise terrapod-ee-agent binary
        if: matrix.image == 'terrapod-runner'
        run: |
          mv docker/ee-agent-bin/terrapod-ee-agent-linux-amd64 docker/ee-agent-bin/terrapod-ee-agent
          chmod 0755 docker/ee-agent-bin/terrapod-ee-agent

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          # On PRs we do NOT push to GHCR (fork PRs lack package:write; even
          # same-repo PRs gain nothing from a round-trip). The image is loaded
          # into the local daemon and handed to scan/e2e as an artifact.
          push: ${{ needs.prepare.outputs.is_pr != 'true' }}
          load: ${{ needs.prepare.outputs.is_pr == 'true' }}
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:sha-${{ needs.prepare.outputs.sha_short }}-amd64
          build-args: |
            PKG_REFRESH=${{ needs.prepare.outputs.pkg_refresh }}
            BASE_IMAGE=${{ matrix.image == 'terrapod-web' && env.NODE_BASE_IMAGE || env.PYTHON_BASE_IMAGE }}
          cache-from: type=gha,scope=${{ matrix.image }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-amd64

      - name: Export image artifact
        if: needs.prepare.outputs.is_pr == 'true'
        run: |
          docker save "$REGISTRY/${{ matrix.image }}:sha-${{ needs.prepare.outputs.sha_short }}-amd64" \
            | gzip > "/tmp/${{ matrix.image }}-amd64.tar.gz"

      - name: Upload image artifact
        if: needs.prepare.outputs.is_pr == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-${{ matrix.image }}-amd64
          path: /tmp/${{ matrix.image }}-amd64.tar.gz
          retention-days: 1

  build-images-arm64:
    name: Build ${{ matrix.image }} (arm64)
    needs: [prepare, build-query, build-ee-agent]
    if: needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [terrapod-api, terrapod-web, terrapod-runner, terrapod-listener, terrapod-migrations]
        include:
          - image: terrapod-api
            dockerfile: docker/Dockerfile.api
          - image: terrapod-web
            dockerfile: docker/Dockerfile.web
          - image: terrapod-runner
            dockerfile: docker/Dockerfile.runner
          - image: terrapod-listener
            dockerfile: docker/Dockerfile.listener
          - image: terrapod-migrations
            dockerfile: docker/Dockerfile.migrations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to GHCR
        uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}

      # terrapod-query is baked into api + runner (#823) from the binary the
      # build-query job compiled once — staged into the build context here.
      - name: Stage terrapod-query binary (api/runner only)
        if: matrix.image == 'terrapod-api' || matrix.image == 'terrapod-runner'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: terrapod-query-linux-arm64
          path: docker/query-bin
      - name: Normalise terrapod-query binary
        if: matrix.image == 'terrapod-api' || matrix.image == 'terrapod-runner'
        run: |
          mv docker/query-bin/terrapod-query-linux-arm64 docker/query-bin/terrapod-query
          chmod 0755 docker/query-bin/terrapod-query

      # terrapod-ee-agent is baked into the RUNNER only (#2154), from the
      # binary build-ee-agent compiled once. The runner's initContainer
      # copies it onto a shared volume so the EE can run it — which is how
      # an EE stays free of Terrapod code and insensitive to our releases.
      - name: Stage terrapod-ee-agent binary (runner only)
        if: matrix.image == 'terrapod-runner'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: terrapod-ee-agent-linux-arm64
          path: docker/ee-agent-bin
      - name: Normalise terrapod-ee-agent binary
        if: matrix.image == 'terrapod-runner'
        run: |
          mv docker/ee-agent-bin/terrapod-ee-agent-linux-arm64 docker/ee-agent-bin/terrapod-ee-agent
          chmod 0755 docker/ee-agent-bin/terrapod-ee-agent

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: ${{ needs.prepare.outputs.is_pr != 'true' }}
          load: ${{ needs.prepare.outputs.is_pr == 'true' }}
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:sha-${{ needs.prepare.outputs.sha_short }}-arm64
          build-args: |
            PKG_REFRESH=${{ needs.prepare.outputs.pkg_refresh }}
            BASE_IMAGE=${{ matrix.image == 'terrapod-web' && env.NODE_BASE_IMAGE || env.PYTHON_BASE_IMAGE }}
          cache-from: type=gha,scope=${{ matrix.image }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-arm64

      # arm64 is now artifacted on PRs too — scan-images scans it as well.
      - name: Export image artifact
        if: needs.prepare.outputs.is_pr == 'true'
        run: |
          docker save "$REGISTRY/${{ matrix.image }}:sha-${{ needs.prepare.outputs.sha_short }}-arm64" \
            | gzip > "/tmp/${{ matrix.image }}-arm64.tar.gz"

      - name: Upload image artifact
        if: needs.prepare.outputs.is_pr == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-${{ matrix.image }}-arm64
          path: /tmp/${{ matrix.image }}-arm64.tar.gz
          retention-days: 1

  # ── E2E Tests (Playwright) ─────────────────────────────
  e2e-test:
    # Sharded across N GitHub runners using Playwright's built-in --shard=k/N.
    # Each shard boots its own docker-compose stack in PARALLEL, so stack-boot
    # wall-clock is ~constant regardless of shard count — adding shards lowers
    # the per-shard TEST time without raising boot wall-clock. Per-shard blob
    # reports are merged into one HTML report by the `e2e-report` job.
    #
    # The sentence that used to follow -- "the cost is runner-minutes, so grow
    # the list as the suite grows" -- was true and incomplete, and the missing
    # half is what drove this back from eight to FIVE on 2026-10-26. The cost is
    # runner-minutes AND a slot, and against a 20-job ceiling the slot is the
    # scarce one. Measured per shard on run 40333801771: ~95s of FIXED cost
    # (2s checkout, 14s artifact download, 43s image load, 25s stack boot, 2s
    # health, 2s node_modules, 5s teardown, 2s set-up) against 77s of actual
    # Playwright. The overhead is larger than the work it protects, so at eight
    # shards 760s of the tier's 1215s was setup and only ~450s was testing.
    #
    # Five puts ~90s of test on each shard for the same ~95s of fixed cost --
    # the longest shard goes 176s -> ~190s, still inside this wave's own tail --
    # and hands three slots back to the wave. So grow the list when the SUITE
    # grows past the point where a shard's test time dominates its ~95s floor,
    # not merely when the suite grows.
    name: E2E Tests (${{ matrix.shard }}/${{ strategy.job-total }})
    # amd64 only — e2e loads the amd64 images and must not wait on the
    # slower arm64 builds (they run in parallel as a build-validation gate).
    needs: [prepare, build-images-amd64]
    if: |
      always()
      && needs.build-images-amd64.result == 'success'
      && needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    # Whole-job upper bound. Default is GitHub's 360 min, which lets a
    # wedged step run for six hours before anyone notices. 15 min covers
    # a cold-runner worst-case (image pull + stack boot + test suite)
    # with headroom; anything past that is genuinely broken, not slow.
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Branch/tag builds pull the images from GHCR; PR builds load them
      # from the build-images-amd64 artifacts (no registry push on PRs).
      # Either way the stack runs off the `<image>:local` tags.
      - name: Log in to GHCR
        if: needs.prepare.outputs.is_pr != 'true'
        uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}

      - name: Pull images (branch/tag)
        if: needs.prepare.outputs.is_pr != 'true'
        run: |
          sha_short="${{ needs.prepare.outputs.sha_short }}"
          for image in terrapod-api terrapod-web terrapod-migrations; do
            docker pull "$REGISTRY/$image:sha-${sha_short}-amd64"
            docker tag "$REGISTRY/$image:sha-${sha_short}-amd64" "$image:local"
          done

      - name: Download image artifacts (PR)
        if: needs.prepare.outputs.is_pr == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: image-*-amd64
          path: /tmp/images
          merge-multiple: true

      - name: Load images (PR)
        if: needs.prepare.outputs.is_pr == 'true'
        run: |
          sha_short="${{ needs.prepare.outputs.sha_short }}"
          for image in terrapod-api terrapod-web terrapod-migrations; do
            gunzip -c "/tmp/images/$image-amd64.tar.gz" | docker load
            docker tag "$REGISTRY/$image:sha-${sha_short}-amd64" "$image:local"
          done

      - name: Start E2E stack
        run: docker compose -f e2e/docker-compose.e2e.yml up -d

      - name: Wait for stack health
        run: |
          timeout=120
          elapsed=0
          while ! curl -sf http://localhost:3000/ > /dev/null 2>&1; do
            if (( elapsed >= timeout )); then
              echo "Stack not healthy after ${timeout}s"
              docker compose -f e2e/docker-compose.e2e.yml logs
              exit 1
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done
          echo "Stack healthy (${elapsed}s)"

      # Run npm ci + tests inside the official Playwright image. The
      # image bundles Node + Chromium + all OS deps, eliminating the
      # `playwright install` step that has repeatedly wedged at the
      # extract phase on the Azure-backed runner disk (167 MiB → ~600
      # MiB unpack across many small files takes >5 min consistently).
      #
      # `--network host` lets the container reach the docker-compose
      # stack on localhost. `--ipc=host` is the Playwright-recommended
      # setting to avoid Chromium running out of memory in shared /dev/shm.
      # Image tag MUST track the pinned `@playwright/test` version in
      # e2e/package-lock.json — version skew between client and bundled
      # browsers causes runtime failures.
      # `npm ci` for this tree is FOUR packages and was taking two minutes — 51%
      # of the job, against 22s for the tests themselves. The container starts
      # with an empty npm cache every run, so playwright-core and typescript are
      # refetched cold each time. Measured at 125.8s here and 54s for the same
      # command in node:24-alpine; neither is a sane figure for four packages.
      #
      # The step below mounts ${{ github.workspace }}/e2e into the container, so
      # `npm ci` writes node_modules into the RUNNER's workspace — which is what
      # makes it cacheable from out here at all.
      #
      # Keyed on the lockfile hash, so a Playwright bump changes the key and a
      # stale node_modules can never be restored against a new lockfile. No
      # restore-keys, deliberately: a partial match is exactly the silent
      # staleness this must not have.
      - name: Cache e2e node_modules
        id: e2e-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: e2e/node_modules
          key: e2e-node-modules-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Run Playwright tests
        run: |
          docker run --rm \
            --network=host \
            --ipc=host \
            -v "${{ github.workspace }}/e2e:/work" \
            -w /work \
            -e CI=true \
            -e HOME=/tmp \
            ${PLAYWRIGHT_IMAGE:-mcr.microsoft.com/playwright:v1.58.2-noble} \
            sh -c "${{ steps.e2e-modules.outputs.cache-hit == 'true' && 'true' || 'npm ci --ignore-scripts' }} && npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}"
        # Playwright has per-test timeouts of its own; this is the outer
        # safety net. (This comment used to say npm ci was "~10 s for this
        # tree" — it was two minutes, and that claim is why nobody looked.)
        timeout-minutes: 10

      # Per-shard blob report → merged into one HTML report by `e2e-report`.
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose -f e2e/docker-compose.e2e.yml down -v

  # ── OCI conformance ────────────────────────────────────
  # The registry checked against the distribution spec rather than against the
  # one client we happened to try. That distinction earned its place: every
  # finding this suite produced during #1408 — a hardcoded digest algorithm, a
  # missing OCI-Subject echo, foreign layers treated as missing blobs, referrers
  # answering 404 instead of an empty index, and no Range support at all — left
  # `docker push` and `docker pull` working perfectly.
  #
  # Run against the BFF, not the API, because that is the only address a
  # deployment exposes. Testing the API directly skips a hop that has already
  # broken pulls once (Content-Length stripped from a blob HEAD).
  oci-conformance:
    name: OCI Conformance
    needs: [prepare, build-images-amd64]
    if: |
      always()
      && needs.build-images-amd64.result == 'success'
      && needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        if: needs.prepare.outputs.is_pr != 'true'
        uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}

      - name: Pull images (branch/tag)
        if: needs.prepare.outputs.is_pr != 'true'
        run: |
          sha_short="${{ needs.prepare.outputs.sha_short }}"
          for image in terrapod-api terrapod-web terrapod-migrations; do
            docker pull "$REGISTRY/$image:sha-${sha_short}-amd64"
            docker tag "$REGISTRY/$image:sha-${sha_short}-amd64" "$image:local"
          done

      - name: Download image artifacts (PR)
        if: needs.prepare.outputs.is_pr == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: image-*-amd64
          path: /tmp/images
          merge-multiple: true

      - name: Load images (PR)
        if: needs.prepare.outputs.is_pr == 'true'
        run: |
          sha_short="${{ needs.prepare.outputs.sha_short }}"
          for image in terrapod-api terrapod-web terrapod-migrations; do
            gunzip -c "/tmp/images/$image-amd64.tar.gz" | docker load
            docker tag "$REGISTRY/$image:sha-${sha_short}-amd64" "$image:local"
          done

      - name: Start stack
        run: docker compose -f e2e/docker-compose.e2e.yml up -d

      - name: Wait for stack health
        run: |
          timeout=120
          elapsed=0
          while ! curl -sf http://localhost:3000/ > /dev/null 2>&1; do
            if (( elapsed >= timeout )); then
              echo "Stack not healthy after ${timeout}s"
              docker compose -f e2e/docker-compose.e2e.yml logs
              exit 1
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done
          echo "Stack healthy (${elapsed}s)"

      - name: Run the conformance suite
        run: scripts/oci-conformance.sh http://localhost:3000

      # The three clients most people actually use. They exercise different
      # parts of the protocol from each other and from the conformance suite —
      # the Content-Length regression above was invisible to the suite and fatal
      # to docker.
      - name: Push and pull with real clients
        run: |
          set -euo pipefail
          TOKEN="$(python3 scripts/mint-token.py --url http://localhost:3000 \
                   --email admin@terrapod.local --password 'TestPassword123!')"
          echo "$TOKEN" | docker login localhost:3000 -u tp --password-stdin

          docker pull -q alpine:3.20
          docker tag alpine:3.20 localhost:3000/smoke/app:v1
          docker push -q localhost:3000/smoke/app:v1

          # Remove every local copy, so the pull genuinely comes from Terrapod.
          docker rmi -f localhost:3000/smoke/app:v1 alpine:3.20
          docker pull -q localhost:3000/smoke/app:v1
          # The strongest assertion available: the pulled image runs.
          docker run --rm localhost:3000/smoke/app:v1 cat /etc/alpine-release

          # crane and skopeo are stricter than docker about parts of the spec,
          # and skopeo copy exercises pull and push in one operation.
          # To a file and checksummed, rather than piped straight into tar: a
          # pipe cannot be verified before it is consumed, and this binary is one
          # of the things asserting the registry is spec-compliant (the
          # installer-pinning half of GHSA-34pp-q7wp-3j54). Bump the version and
          # the checksum together — upstream publishes checksums.txt.
          crane_url=https://github.com/google/go-containerregistry/releases/download/v0.20.3/go-containerregistry_Linux_x86_64.tar.gz
          curl -fsSLo /tmp/crane.tar.gz "$crane_url"
          echo "36c67a932f489b3f2724b64af90b599a8ef2aa7b004872597373c0ad694dc059  /tmp/crane.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/crane.tar.gz -C /tmp crane
          /tmp/crane auth login localhost:3000 -u tp -p "$TOKEN"
          test "$(/tmp/crane ls localhost:3000/smoke/app)" = "v1"
          /tmp/crane digest localhost:3000/smoke/app:v1

          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          skopeo copy --src-tls-verify=false --dest-tls-verify=false \
            --src-creds "tp:$TOKEN" --dest-creds "tp:$TOKEN" \
            docker://localhost:3000/smoke/app:v1 \
            docker://localhost:3000/smoke/copied:v2

      - name: Registry rejects anonymous access
        run: |
          # A registry that mirrors upstreams must never be an open relay for
          # anyone who finds it. Checked here rather than only in unit tests
          # because this is the deployed path, through the real ingress.
          status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/v2/)"
          test "$status" = "401" || { echo "FAIL: /v2/ answered $status anonymously, expected 401"; exit 1; }

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f e2e/docker-compose.e2e.yml logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f e2e/docker-compose.e2e.yml down -v

  # ── Air-gap gate (#1485, phase 0 of #1407) ──────────────
  # #1407 §12 states the phase-0 acceptance in one sentence: *run each client with
  # upstream network blocked*. Every surface met that by hand, once, when it was
  # built. This makes it standing.
  #
  # A pull-through cache that has quietly started reaching upstream on a path
  # nobody exercises looks identical to one that has not — right up until an
  # air-gapped operator's runner hangs. That failure is invisible by construction,
  # which is why it needs a machine watching rather than a memory of having checked.
  airgap-gate:
    name: Air-gap Gate
    needs: [prepare, build-images-amd64]
    if: |
      always()
      && needs.build-images-amd64.result == 'success'
      && needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        if: needs.prepare.outputs.is_pr != 'true'
        uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}

      - name: Pull images (branch/tag)
        if: needs.prepare.outputs.is_pr != 'true'
        run: |
          sha_short="${{ needs.prepare.outputs.sha_short }}"
          for image in terrapod-api terrapod-web terrapod-migrations; do
            docker pull "$REGISTRY/$image:sha-${sha_short}-amd64"
            docker tag "$REGISTRY/$image:sha-${sha_short}-amd64" "$image:local"
          done

      - name: Download image artifacts (PR)
        if: needs.prepare.outputs.is_pr == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: image-*-amd64
          path: /tmp/images
          merge-multiple: true

      - name: Load images (PR)
        if: needs.prepare.outputs.is_pr == 'true'
        run: |
          sha_short="${{ needs.prepare.outputs.sha_short }}"
          for image in terrapod-api terrapod-web terrapod-migrations; do
            gunzip -c "/tmp/images/$image-amd64.tar.gz" | docker load
            docker tag "$REGISTRY/$image:sha-${sha_short}-amd64" "$image:local"
          done

      # Presigned filesystem URLs default to the api container's own address, so
      # any other client following one gets connection refused. Pointed at the
      # BFF here, which is also the hop the clients themselves use.
      - name: Start stack
        run: |
          TERRAPOD_FS_BASE_URL=http://web:3000 \
            docker compose -f e2e/docker-compose.e2e.yml up -d

      - name: Wait for stack health
        run: |
          timeout=120
          elapsed=0
          while ! curl -sf http://localhost:3000/ > /dev/null 2>&1; do
            if (( elapsed >= timeout )); then
              echo "Stack not healthy after ${timeout}s"
              docker compose -f e2e/docker-compose.e2e.yml logs
              exit 1
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done
          echo "Stack healthy (${elapsed}s)"

      # Warm each client through Terrapod, then repeat every install on a network
      # with no gateway. The script proves that network really is severed before
      # asserting anything through it — without that self-check the whole job
      # would pass while testing nothing.
      - name: Real clients, with and without a route to the internet
        run: scripts/airgap-gate.sh http://localhost:3000

      # The other half of the capability flags (#1986): switched off, these
      # surfaces are ABSENT rather than answering 404, while terraform's own
      # provider mirror, module registry and binary cache still answer. Asserted
      # per-PR in unit tests; asserting it against a running stack is what makes
      # it true rather than believed.
      - name: Restart with the registry and package cache switched off
        run: |
          TERRAPOD_FS_BASE_URL=http://web:3000 \
          TERRAPOD_OCI_ENABLED=false TERRAPOD_PACKAGE_CACHE_ENABLED=false \
            docker compose -f e2e/docker-compose.e2e.yml up -d
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3000/ >/dev/null 2>&1 && break
            sleep 4
          done

      - name: Switched-off surfaces are absent, terraform's still answer
        run: scripts/airgap-gate.sh --gated-off http://localhost:3000

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f e2e/docker-compose.e2e.yml logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f e2e/docker-compose.e2e.yml down -v

  # ── E2E Report (merge shard blob reports) ──────────────
  # Merges the per-shard Playwright blob reports into a single HTML report, so
  # a failure anywhere in the matrix is triaged from one artifact. Runs even
  # when shards fail (always()) — that's exactly when the merged report is
  # needed. The download is `blob-report-*` with `merge-multiple`, so it is
  # count-agnostic and the shard list can move without touching this job.
  # Merges the shard blob reports into one HTML report for a human to read.
  #
  # Deliberately NOT part of `ci-pass`: it asserts nothing about the product. The
  # test verdict lives in the eight `e2e-test` shards, which are gated. Having
  # this in the gate meant a GitHub artifact-storage failure — no Terrapod code
  # involved, artifacts intact per the API, `download-artifact` exhausting its own
  # retries — could fail a release that was otherwise complete and correct, with
  # no rerun able to clear it. That happened on v1.5.3.
  #
  # Losing the merge costs the pretty report and nothing else.
  e2e-report:
    name: E2E Report
    needs: [prepare, e2e-test]
    if: always() && needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    # Literal, not ${{ env.* }}: the env context is NOT available in a job's
    # `container:`. Same mirrored image the lint jobs use.
    container: ghcr.io/mattrobinsonsre/mirror/node:24-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download blob reports
        # Keep going if a shard's report cannot be fetched: a partial report is
        # more useful than none, and this job is not a gate.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      # Merging blob reports is pure Node — it reads the shards' blob files and
      # renders HTML. It needs the @playwright/test PACKAGE, not browsers, and
      # `--ignore-scripts` already skipped Playwright's browser-download
      # postinstall — so the ~2GB mcr.microsoft.com/playwright image this used to
      # pull supplied browsers that were never installed and never used. That
      # pull was most of the job's 257-335s.
      #
      # The mirrored node image is the same one the lint jobs use (~50MB), and
      # the install is six packages / 14MB. Version fidelity comes from
      # e2e/package-lock.json, which pins @playwright/test to the same 1.58.2 the
      # shards ran — blob format is version-sensitive, so deriving it from the
      # lockfile rather than a second hard-coded tag is what stops the two
      # drifting apart.
      # Same four packages, same 54s. This job runs IN the node container
      # rather than mounting into one, so node_modules lands at e2e/node_modules
      # in the workspace either way and the same cache key serves both.
      - name: Cache e2e node_modules
        id: e2e-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: e2e/node_modules
          key: e2e-node-modules-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Merge into HTML report
        continue-on-error: true
        working-directory: e2e
        run: |
          [ "${{ steps.e2e-modules.outputs.cache-hit }}" = "true" ] || npm ci --ignore-scripts
          npx playwright merge-reports --reporter html ../all-blob-reports
      - name: Upload merged HTML report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-html-report
          path: e2e/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  # ── Scan Images (Trivy) ────────────────────────────────
  # Both architectures are scanned (image × arch matrix): arm64 images ship
  # in the release manifest too, and arch-specific base layers can differ.
  # Trivy reads image layers/package DBs without executing the binary, so an
  # arm64 image scans fine on an amd64 runner.
  # ── Image CVE gate ─────────────────────────────────────
  #
  # This job BLOCKS PUBLICATION. `create-manifests` requires it to
  # succeed, so an image carrying a fixable HIGH/CRITICAL never becomes
  # a multi-arch tag and never reaches a release. It is a gate, not a
  # report. Policy: docs/cve-policy.md.
  #
  # Two settings decide what "fixable" means, and both are deliberate:
  #
  #   ignore-unfixed: true — a vulnerability with no patched version
  #     available anywhere cannot be actioned by a build. Failing on it
  #     would only teach people to bypass the gate. Note the
  #     consequence, because it is the honest cost of this choice: a
  #     CVE becomes visible to us on the *day upstream publishes a fix*,
  #     which may be well after disclosure. Our answer to that window is
  #     release cadence (roughly weekly), not a lower gate.
  #
  #   trivyignores: pentest/trivy/.trivyignore — the accepted-risk
  #     register. Every entry states why the vulnerable code is
  #     unreachable in Terrapod and the exact condition that removes it,
  #     and the pre-release audit re-checks all of them each
  #     release. Preferring an upstream bump over a new entry is the
  #     rule; entries are deleted in the same PR as the bump.
  #
  # Operators run their own scanners and will still see whatever is in
  # that register — it suppresses nothing outside this pipeline, which
  # is why each entry is written to be read by someone outside the
  # project.
  scan-images:
    # One job per IMAGE, scanning both arches, rather than one per image+arch.
    #
    # As 5x2 this was ten jobs that all became eligible at the same instant as
    # the eight E2E shards, two helm-eval-boot jobs and oci-conformance — 21 jobs
    # for 20 concurrent slots. The E2E shards lost 27s, 44s and 57s of queue wait
    # to it, and the shard that waited 44s was the straggler gating E2E Report,
    # so the contention sat directly on the critical path (#1468).
    #
    # Five jobs scan the same images with the same settings and free five slots
    # at exactly the contended moment. Each takes roughly twice as long (~52-172s
    # against 26-86s), which is well inside the slack before create-manifests.
    #
    # Deliberately NOT solved with `needs: [e2e-test]`. That works today only
    # because create-manifests is gated behind python-test; once the integration
    # shard is split, that slack disappears and deferred scans become the new
    # critical path.
    name: Scan ${{ matrix.image }}
    needs: [prepare, build-images-amd64, build-images-arm64]
    if: |
      always()
      && needs.build-images-amd64.result == 'success'
      && needs.build-images-arm64.result == 'success'
      && needs.prepare.outputs.images_exist != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [terrapod-api, terrapod-web, terrapod-runner, terrapod-listener, terrapod-migrations]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # On branch/tag builds the image lives in GHCR — log in and let Trivy pull
      # the per-arch tag. On PRs nothing was pushed; the image arrives as a
      # per-arch artifact from build-images-<arch> and is loaded into the local
      # daemon below, where Trivy finds it by the same tag.
      - name: Log in to GHCR
        if: needs.prepare.outputs.is_pr != 'true'
        uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}

      # ── amd64 ──
      - name: Download image artifact (amd64, PR)
        if: needs.prepare.outputs.is_pr == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: image-${{ matrix.image }}-amd64
          path: /tmp

      - name: Load image (amd64, PR)
        if: needs.prepare.outputs.is_pr == 'true'
        run: gunzip -c "/tmp/${{ matrix.image }}-amd64.tar.gz" | docker load

      # Human-readable findings step. Always prints the table of CVEs Trivy would
      # gate on to the action log — so a failure in the gating step below can be
      # diagnosed without downloading SARIF or re-running Trivy locally.
      # exit-code: '0' keeps this informational.
      - name: Trivy findings (amd64, table, informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # The per-arch tag (sha-XXX-amd64) is an OCI index whose only child is
          # that arch. Without this, Trivy defaults to the runner's platform when
          # pulling from GHCR on branch/tag builds and fails with "no child with
          # platform linux/amd64". Trivy reads TRIVY_PLATFORM as --platform.
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ghcr.io/mattrobinsonsre/${{ matrix.image }}:sha-${{ needs.prepare.outputs.sha_short }}-amd64
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: pentest/trivy/.trivyignore
          exit-code: '0'

      - name: Scan with Trivy (amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ghcr.io/mattrobinsonsre/${{ matrix.image }}:sha-${{ needs.prepare.outputs.sha_short }}-amd64
          format: sarif
          output: trivy-${{ matrix.image }}-amd64.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: pentest/trivy/.trivyignore
          exit-code: '1'
          limit-severities-for-sarif: true

      # The category MUST stay distinct per image AND arch: code scanning keys
      # results on it, so a shared category would have one arch silently
      # overwrite the other's findings.
      - name: Upload SARIF (amd64)
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: trivy-${{ matrix.image }}-amd64.sarif
          category: trivy-${{ matrix.image }}-amd64

      # ── arm64 ──
      - name: Download image artifact (arm64, PR)
        if: needs.prepare.outputs.is_pr == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: image-${{ matrix.image }}-arm64
          path: /tmp

      - name: Load image (arm64, PR)
        if: needs.prepare.outputs.is_pr == 'true'
        run: gunzip -c "/tmp/${{ matrix.image }}-arm64.tar.gz" | docker load

      # Human-readable findings step. Always prints the table of CVEs Trivy would
      # gate on to the action log — so a failure in the gating step below can be
      # diagnosed without downloading SARIF or re-running Trivy locally.
      # exit-code: '0' keeps this informational.
      - name: Trivy findings (arm64, table, informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # The per-arch tag (sha-XXX-arm64) is an OCI index whose only child is
          # that arch. Without this, Trivy defaults to the runner's platform when
          # pulling from GHCR on branch/tag builds and fails with "no child with
          # platform linux/amd64". Trivy reads TRIVY_PLATFORM as --platform.
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ghcr.io/mattrobinsonsre/${{ matrix.image }}:sha-${{ needs.prepare.outputs.sha_short }}-arm64
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: pentest/trivy/.trivyignore
          exit-code: '0'

      - name: Scan with Trivy (arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ghcr.io/mattrobinsonsre/${{ matrix.image }}:sha-${{ needs.prepare.outputs.sha_short }}-arm64
          format: sarif
          output: trivy-${{ matrix.image }}-arm64.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: pentest/trivy/.trivyignore
          exit-code: '1'
          limit-severities-for-sarif: true

      # The category MUST stay distinct per image AND arch: code scanning keys
      # results on it, so a shared category would have one arch silently
      # overwrite the other's findings.
      - name: Upload SARIF (arm64)
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: trivy-${{ matrix.image }}-arm64.sarif
          category: trivy-${{ matrix.image }}-arm64

  # ── Create Multi-Arch Manifests ────────────────────────
  create-manifests:
    name: Manifest ${{ matrix.image }}
    needs: [prepare, build-images-amd64, build-images-arm64, python-checks, node-checks, python-test, python-audit, host-checks, secret-scan, codeql, sast, scan-images]
    if: |
      always()
      && needs.build-images-amd64.result == 'success'
      && needs.build-images-arm64.result == 'success'
      && needs.prepare.outputs.is_pr != 'true'
      && (needs.python-checks.result == 'success' || needs.python-checks.result == 'skipped')
      && (needs.node-checks.result == 'success' || needs.node-checks.result == 'skipped')
      && (needs.python-test.result == 'success' || needs.python-test.result == 'skipped')
      && (needs.python-audit.result == 'success' || needs.python-audit.result == 'skipped')
      && (needs.host-checks.result == 'success' || needs.host-checks.result == 'skipped')
      && (needs.secret-scan.result == 'success' || needs.secret-scan.result == 'skipped')
      && (needs.codeql.result == 'success' || needs.codeql.result == 'skipped')
      && (needs.sast.result == 'success' || needs.sast.result == 'skipped')
      && (needs.scan-images.result == 'success' || needs.scan-images.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless cosign signing of the manifest (OIDC)
    strategy:
      fail-fast: false
      matrix:
        image: [terrapod-api, terrapod-web, terrapod-runner, terrapod-listener, terrapod-migrations]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}

      - name: Create multi-arch manifest
        id: manifest
        run: |
          sha_short="${{ needs.prepare.outputs.sha_short }}"
          echo "Creating manifest for ${{ matrix.image }}:sha-$sha_short"
          docker buildx imagetools create -t "$REGISTRY/${{ matrix.image }}:sha-$sha_short" \
            "$REGISTRY/${{ matrix.image }}:sha-${sha_short}-amd64" \
            "$REGISTRY/${{ matrix.image }}:sha-${sha_short}-arm64"

          digest=$(docker buildx imagetools inspect \
            "$REGISTRY/${{ matrix.image }}:sha-$sha_short" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Manifest digest: $digest"

      # GHSA-34pp-q7wp-3j54. This job's `if:` is the whole gate set — lint, test,
      # audits, CodeQL, trivy, secret scan — so a manifest built here is a
      # manifest those checks passed on. Signing it is what makes that fact
      # carryable: `sha-<short>` is a MUTABLE tag, and on a tag push whose images
      # already exist every gate job is skipped, so the release job has nothing
      # else left to distinguish a gated digest from one somebody pushed over the
      # tag afterwards. It verifies this signature before it retags anything.
      #
      # Signed by digest, so the signature is attached to the bytes rather than
      # to the name, and keyless so there is no key to hold: the Fulcio
      # certificate names this workflow and this ref, which is precisely the
      # claim the release job needs and precisely what an actor with
      # packages:write cannot manufacture.
      - name: Sign the manifest (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          subject="$REGISTRY/${{ matrix.image }}@${{ steps.manifest.outputs.digest }}"

          # Same retry as the release job's signing step, for the same reason: a
          # keyless sign reaches the Actions OIDC endpoint, Fulcio and Rekor, and
          # with no ambient token cosign falls back to an interactive device flow
          # that waits out its full code validity before failing.
          for attempt in 1 2 3; do
            if cosign sign "$subject"; then
              echo "Signed $subject"
              exit 0
            fi
            echo "cosign sign failed for $subject (attempt $attempt/3)"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          echo "::error::cosign sign gave up on $subject after 3 attempts"
          exit 1

  # ── Release ────────────────────────────────────────────
  # The release stage is five jobs — a tiny pre-create that owns the
  # Release object and four branches that all upload into it in
  # parallel:
  #
  #   release-create   — pre-creates an empty GitHub Release for the tag
  #                      with a placeholder title. Owning Release
  #                      creation here means provider AND migrate can
  #                      both run in append mode at the same time
  #                      instead of provider gating migrate (#435 had
  #                      provider create the Release → migrate append).
  #   release-images   — image retag + Helm push + SBOM generation.
  #                      Saves chart + SBOMs + checksums as a workflow
  #                      artifact for release-finalize to upload.
  #   release-provider — GoReleaser provider, append mode.
  #   release-migrate  — GoReleaser migrate, append mode.
  #   release-publish  — GoReleaser terrapod-publish, append mode.
  #   release-query    — GoReleaser terrapod-query, append mode.
  #   release-mcp      — GoReleaser terrapod-mcp, append mode.
  #   release-finalize — joins all the above; sets real title + release
  #                      notes and uploads the workflow artifact from
  #                      release-images.
  #
  # Both goreleaser invocations also pass `--parallelism 6` so each
  # process saturates the runner's cores when crunching its own
  # platform matrix.

  # ── Quality gate for releases (#1263) ──────────────────
  #
  # Every lint and test job, aggregated once, so the release chain can depend
  # on "the checks passed" instead of on a hand-listed subset of them.
  #
  # v1.2.2 published while `Migrate Lint` was red. Neither the release chain
  # nor `cleanup-tag` mentioned that job — both enumerated only the build,
  # scan and release-* jobs, a list written when those were the only jobs and
  # never extended as lint and test jobs were added. The artifacts happened to
  # be fine; nothing verified that they were.
  #
  # `ci-pass` cannot serve this purpose: it needs `release-finalize`, so
  # gating the release on it would be circular. This runs BEFORE the release
  # chain rather than after everything.
  #
  # `skipped` counts as a pass: on a tag whose images already exist the build
  # and test jobs are deliberately skipped. Only a failure or a cancellation
  # stops a release.
  quality-gate:
    name: Quality Gate
    if: always()
    needs:
      - python-checks
      - node-checks
      - go-modules
      - pulumi-sdk-build
      - python-test
      - python-audit
      - secret-scan
      - host-checks
      - sast
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          # Space-separated name=result pairs, so the check below is a plain
          # loop rather than 25 hand-written comparisons that can drift.
          RESULTS: >-
            python-checks=${{ needs.python-checks.result }}
            node-checks=${{ needs.node-checks.result }}
            go-modules=${{ needs.go-modules.result }}
            pulumi-sdk-build=${{ needs.pulumi-sdk-build.result }}
            python-test=${{ needs.python-test.result }}
            python-audit=${{ needs.python-audit.result }}
            secret-scan=${{ needs.secret-scan.result }}
            host-checks=${{ needs.host-checks.result }}
            sast=${{ needs.sast.result }}
        run: |
          set -eu
          bad=""
          for entry in $RESULTS; do
            case "${entry#*=}" in
              success|skipped) ;;
              *) bad="$bad $entry" ;;
            esac
          done
          if [ -n "$bad" ]; then
            echo "Quality gate failed —$bad"
            echo "No release is created while any check is red."
            exit 1
          fi
          echo "Quality gate passed"

  release-create:
    name: Release — Create empty GitHub Release
    needs: [prepare, create-manifests, quality-gate]
    if: |
      always()
      && needs.prepare.outputs.is_tag == 'true'
      && needs.prepare.result == 'success'
      && needs.quality-gate.result == 'success'
      && (needs.create-manifests.result == 'success' || needs.create-manifests.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create empty Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.prepare.outputs.version }}"

          # Idempotent: if the Release already exists (e.g. this job
          # is being re-run), skip. release-finalize will set the
          # real title/notes; we just need the Release object so the
          # append-mode goreleaser runs have somewhere to upload to.
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists; skipping create"
            exit 0
          fi
          # NOT created with `--prerelease`, deliberately: GitHub refuses the
          # "Latest" badge to a release flagged as a pre-release, so the flag and
          # the badge cannot both be had. A pre-release is the newest thing we
          # have published while it is current, and the repo front page should
          # say so rather than pointing at the previous stable line -- so the
          # badge wins and the version string carries the warning instead.
          # `release-finalize` sets the flag explicitly false for the same reason.
          gh release create "$version" \
            --title "$version (in progress)" \
            --notes "Release in progress — assets are being attached by parallel CI jobs."

  release-images:
    name: Release — Images, Helm, SBOMs
    needs: [prepare, create-manifests]
    if: |
      always()
      && needs.prepare.outputs.is_tag == 'true'
      && needs.prepare.result == 'success'
      && (needs.create-manifests.result == 'success' || needs.create-manifests.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless cosign signing + SLSA provenance (OIDC)
      attestations: write   # actions/attest-build-provenance OCI referrer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR (docker + helm)
        uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.actor }}
          helm: 'true'

      # ── The release's trust anchor (GHSA-34pp-q7wp-3j54) ──────────────────────
      #
      # Everything below this step derives from `sha-<short>`, and that tag is
      # MUTABLE: anyone with packages:write can push over it. Worse, a tag push
      # whose images already exist deliberately SKIPS every gate job — that skip
      # is what makes a same-commit release take minutes instead of a full
      # rebuild — and the quality gate counts `skipped` as a pass. So on its own,
      # "the short-SHA tag exists" says nothing about what is under it, and the
      # retag, the cosign signatures and the SLSA provenance would all have
      # attested whatever that was.
      #
      # `create-manifests` signs the manifest it builds, and it runs only when
      # the whole gate set passed. Verifying that signature here is what carries
      # the gates' verdict across the skip: a digest that verifies came out of a
      # gated run. An actor with packages:write can push an image, but cannot
      # make Fulcio issue a certificate naming this workflow.
      #
      # The identity is pinned to THIS repository's ci.yml on `main`, on a
      # release branch, or on a version tag — the three refs that can legitimately
      # build a manifest (PRs are excluded from create-manifests by its
      # `is_pr != 'true'` gate).
      #
      # It said "the only TWO refs ... and `release/**` only ever runs on
      # pull_request" until #2277, and that stopped being true at #2185, which put
      # `release/**` on `on.push` so a release branch builds its images at merge.
      # Nothing caught it because neither supported release line carries this step
      # — it would first have fired on the first tag of the first release branch
      # cut from this workflow, failing `release-images` and so letting
      # `Cleanup Tag` delete a tag whose release was otherwise complete.
      #
      # The tag alternative admits a pre-release suffix for the same reason the
      # trigger and `is_tag` do (#2277).
      #
      # Hardcoded rather than built from `github.repository`,
      # for the same reason REGISTRY is: it is a trust anchor, and a trust anchor
      # read from the environment it is anchoring is not one. Move it with
      # REGISTRY if this ever lives somewhere else.
      #
      # The digests resolved here are what every later step consumes, so nothing
      # re-reads a mutable tag between the verification and the use of it.
      - name: Verify the short-SHA manifests came from a gated run
        id: digests
        env:
          COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
          COSIGN_IDENTITY_RE: ^https://github\.com/mattrobinsonsre/terrapod/\.github/workflows/ci\.yml@refs/(heads/main|heads/release/v[0-9]+\.[0-9]+|tags/v[0-9]+\.[0-9]+\.[0-9]+|tags/v[0-9]+\.0\.0-[0-9A-Za-z.-]+)$
        run: |
          sha_short="${{ needs.prepare.outputs.sha_short }}"
          : > "$RUNNER_TEMP/digests.txt"

          for image in terrapod-api terrapod-web terrapod-runner terrapod-listener terrapod-migrations; do
            digest=$(docker buildx imagetools inspect \
              "$REGISTRY/$image:sha-$sha_short" --format '{{.Manifest.Digest}}')
            echo "── verifying $image@$digest"
            cosign verify \
              --certificate-oidc-issuer "$COSIGN_OIDC_ISSUER" \
              --certificate-identity-regexp "$COSIGN_IDENTITY_RE" \
              "$REGISTRY/$image@$digest"
            echo "$image $digest" >> "$RUNNER_TEMP/digests.txt"
            # Hyphens → underscores for the output key, consumed by the SLSA
            # provenance and SBOM steps below.
            echo "${image//-/_}_digest=$digest" >> "$GITHUB_OUTPUT"
          done

          echo "All five manifests verified as built by a gated run."

      - name: Retag images with version
        run: |
          version="${{ needs.prepare.outputs.version }}"

          # By DIGEST, from the list the step above verified — NOT by re-reading
          # `sha-<short>`. Re-reading the tag here would reopen the exact window
          # the verification just closed (GHSA-34pp-q7wp-3j54).
          #
          # GHCR occasionally returns 5xx on manifest reads/writes during
          # a retag — wrap with the shared 5/10/20/40s backoff helper.
          while read -r image digest; do
            echo "Retagging $image@$digest -> $version + latest"
            .github/scripts/with-retry.sh "imagetools create $image" -- \
              docker buildx imagetools create \
                -t "$REGISTRY/$image:$version" \
                -t "$REGISTRY/$image:latest" \
                "$REGISTRY/$image@$digest"
          done < "$RUNNER_TEMP/digests.txt"

      - name: Publish Helm chart
        run: |
          version="${{ needs.prepare.outputs.version }}"
          chart_version="${version#v}"

          helm package helm/terrapod --destination dist/ \
            --version "$chart_version" --app-version "$version"

          .github/scripts/with-retry.sh "helm push" -- \
            helm push "dist/terrapod-${chart_version}.tgz" "oci://$REGISTRY"

      - name: Generate SBOMs
        run: |
          version="${{ needs.prepare.outputs.version }}"

          # Install syft: fetch the installer to a file, verify it, then run it
          # (no curl|sh pipe), installing a pinned version.
          #
          # Fetched by COMMIT SHA, and checksummed. A release tag is a mutable
          # ref — it can be moved, and `raw.githubusercontent.com/<org>/<repo>/
          # <tag>/...` then serves different bytes under the same URL. This script
          # runs with the release job's credentials, which is the second half of
          # GHSA-34pp-q7wp-3j54: pinning the version it installs was never the
          # same thing as pinning the thing doing the installing.
          #
          # The three values move together. SYFT_INSTALLER_COMMIT is the commit
          # that anchore/syft's v1.46.0 tag points at (its install.sh is identical
          # to the one that tag serves today — verified byte-for-byte); the sha256
          # is of that file.
          #
          # NOTE: `-s --` belongs ONLY to the piped `curl | sh -s -- ARGS` idiom
          # (where `-s` tells sh to read the script from stdin). When running the
          # installer as a FILE, the args go straight to syft's install.sh, whose
          # usage is `install.sh [-v] [-b DIR] [-d] [TAG]` — so pass `-b DIR TAG`
          # directly; `-s` is rejected as an illegal option.
          SYFT_VERSION=v1.46.0
          SYFT_INSTALLER_COMMIT=b15c5dbfe2bb21c9d73002c1056a829c8c411c75
          SYFT_INSTALLER_SHA256=8a277b4b4dc21809ecd9a0e4926f4d7319affc6451a607fdeb3e5e1fbd9bc573
          curl -sSfL -o "$RUNNER_TEMP/syft-install.sh" \
            "https://raw.githubusercontent.com/anchore/syft/${SYFT_INSTALLER_COMMIT}/install.sh"
          echo "${SYFT_INSTALLER_SHA256}  $RUNNER_TEMP/syft-install.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/syft-install.sh" -b /usr/local/bin "$SYFT_VERSION"

          for image in terrapod-api terrapod-web terrapod-runner terrapod-listener terrapod-migrations; do
            echo "Generating SBOM for $image:$version"
            syft "$REGISTRY/$image:$version" -o spdx-json="dist/sbom-${image}.spdx.json"
          done

      # Supply-chain attestation (#549): keyless cosign signatures + SBOM
      # attestations on every release image and the Helm chart, anchored to
      # this workflow's GitHub OIDC identity and logged in Rekor. Signing is
      # done by immutable digest so it's independent of the retag above — and
      # since GHSA-34pp-q7wp-3j54 that digest comes from the verified list rather
      # than from inspecting the freshly-written `:$version` tag, so the subject
      # signed here is provably the subject the gates ran against.
      - name: Sign images + Helm chart (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          version="${{ needs.prepare.outputs.version }}"
          chart_version="${version#v}"

          # Keyless signing reaches out to the Actions OIDC endpoint, Fulcio and
          # Rekor, so it fails for the usual transient network reasons — and a
          # release is an expensive thing to lose to one of them. A v1.4.0 tag
          # died on a single TLS handshake timeout fetching the OIDC token.
          #
          # The retry also side-steps the way that failure presents: with no
          # ambient token, cosign falls back to the interactive device flow,
          # prints a verification URL no one is watching, and waits out the full
          # five-minute code validity before failing. The next attempt fetches
          # the token normally.
          sign() {
            local subject="$1"
            for attempt in 1 2 3; do
              if cosign sign "$subject"; then
                return 0
              fi
              echo "cosign sign failed for $subject (attempt $attempt/3)"
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 15))
              fi
            done
            echo "::error::cosign sign gave up on $subject after 3 attempts"
            return 1
          }

          # The verified digests, not a fresh `imagetools inspect` of `:$version`.
          # Those resolve to the same thing today, but one reads a tag that was
          # just written and the other reads the value a signature vouched for —
          # and the SBOM and SLSA provenance steps below attest whichever one this
          # loop used (they read `steps.digests.outputs.*`, now produced by the
          # verification step).
          while read -r image digest; do
            echo "Signing $image@$digest"
            sign "$REGISTRY/$image@$digest"
          done < "$RUNNER_TEMP/digests.txt"

          # Helm chart OCI artifact (cosign resolves the tag to its digest).
          echo "Signing Helm chart terrapod:$chart_version"
          sign "$REGISTRY/terrapod:$chart_version"

      # SLSA build provenance per image, published as an OCI referrer next to
      # the image (verifiable with `gh attestation verify` / `cosign verify-attestation`).
      - name: Provenance — terrapod-api
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/terrapod-api
          subject-digest: ${{ steps.digests.outputs.terrapod_api_digest }}
          push-to-registry: true
      - name: Provenance — terrapod-web
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/terrapod-web
          subject-digest: ${{ steps.digests.outputs.terrapod_web_digest }}
          push-to-registry: true
      - name: Provenance — terrapod-runner
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/terrapod-runner
          subject-digest: ${{ steps.digests.outputs.terrapod_runner_digest }}
          push-to-registry: true
      - name: Provenance — terrapod-listener
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/terrapod-listener
          subject-digest: ${{ steps.digests.outputs.terrapod_listener_digest }}
          push-to-registry: true
      - name: Provenance — terrapod-migrations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/terrapod-migrations
          subject-digest: ${{ steps.digests.outputs.terrapod_migrations_digest }}
          push-to-registry: true

      # SBOM (SPDX) per image, published as an OCI 1.1 referrer next to the image
      # — same discovery path as the provenance above. (Previously attached via
      # `cosign attest`, which writes the legacy `.att` tag that
      # `cosign verify-attestation`/`gh attestation verify` don't read as a
      # referrer; #549 follow-up.)
      - name: SBOM — terrapod-api
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/terrapod-api
          subject-digest: ${{ steps.digests.outputs.terrapod_api_digest }}
          sbom-path: dist/sbom-terrapod-api.spdx.json
          push-to-registry: true
      - name: SBOM — terrapod-web
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/terrapod-web
          subject-digest: ${{ steps.digests.outputs.terrapod_web_digest }}
          sbom-path: dist/sbom-terrapod-web.spdx.json
          push-to-registry: true
      - name: SBOM — terrapod-runner
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/terrapod-runner
          subject-digest: ${{ steps.digests.outputs.terrapod_runner_digest }}
          sbom-path: dist/sbom-terrapod-runner.spdx.json
          push-to-registry: true
      - name: SBOM — terrapod-listener
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/terrapod-listener
          subject-digest: ${{ steps.digests.outputs.terrapod_listener_digest }}
          sbom-path: dist/sbom-terrapod-listener.spdx.json
          push-to-registry: true
      - name: SBOM — terrapod-migrations
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/terrapod-migrations
          subject-digest: ${{ steps.digests.outputs.terrapod_migrations_digest }}
          sbom-path: dist/sbom-terrapod-migrations.spdx.json
          push-to-registry: true

      - name: Generate checksums
        run: |
          (cd dist && sha256sum -- *.tgz *.spdx.json > checksums.txt)

      - name: Upload artifact for release-finalize
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-images-assets
          path: dist/
          retention-days: 1

  release-pulumi-provider:
    name: Release — Pulumi Provider (GoReleaser)
    # The bridged Pulumi provider's plugin binary (#1987). Parallel with the
    # other goreleaser jobs -- pulumi-provider/.goreleaser.yml is
    # release.mode=append, so all of them upload to the one Release that
    # release-create made.
    #
    # It publishes the PLUGIN only. No SDK goes to npm, PyPI or NuGet: Pulumi's
    # own documented path is a locally generated SDK (`pulumi package add`
    # downloads the plugin and generates it in the user's language), so the
    # plugin is the whole artifact. That is also what makes the air-gapped story
    # work -- one tarball, through the cache proxy that already exists.
    needs: [prepare, release-create]
    if: |
      always()
      && needs.prepare.outputs.is_tag == 'true'
      && needs.release-create.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pulumi-provider/go.mod
          cache-dependency-path: pulumi-provider/go.sum

      - name: Import GPG signing key
        id: gpg
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          fingerprint=$(gpg --with-colons --import-options show-only --import <<< "${{ secrets.GPG_PRIVATE_KEY }}" | awk -F: '/^fpr:/{print $10; exit}')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Build plugin tarballs with GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: latest
          # See release-provider — same parallelism rationale.
          args: release --clean --parallelism 6
          workdir: pulumi-provider
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}

      # The archive name is a PROTOCOL: `pulumi_plugins.py` parses it on the way
      # back in, so a cosmetic change to the template silently breaks every
      # plugin download through the cache -- and the failure would surface to an
      # operator as a 404 from their own instance. Asserted against the
      # PUBLISHED assets rather than against the template, because the template
      # is the thing that would have changed.
      - name: The published tarballs carry the name the cache parses
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ALREADY carries the `v`: prepare sets it to `${GITHUB_REF#refs/tags/}`,
          # which strips only the ref prefix. So it is `v1.2.3`, which is both the
          # Release name and exactly the form the plugin filename wants -- while
          # GoReleaser's own `{{ .Version }}` strips the `v`, which is why the
          # archive template in .goreleaser.yml spells it back in.
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          names=$(gh release view "${TAG}" --repo "${{ github.repository }}" --json assets -q '.assets[].name')
          missing=0
          for plat in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64 windows-arm64; do
            want="pulumi-resource-terrapod-${TAG}-${plat}.tar.gz"
            if ! printf '%s\n' "$names" | grep -qx "$want"; then
              echo "MISSING: $want"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::$missing plugin tarball(s) absent or misnamed. The name is parsed by"
            echo "::error::services/terrapod/services/package_cache/pulumi_plugins.py -- a plugin"
            echo "::error::whose name the cache cannot parse cannot be downloaded by any agent run."
            exit 1
          fi
          echo "all 6 plugin tarballs present and named as the cache parses them"

  release-provider:
    name: Release — Provider (GoReleaser)
    # Both goreleaser jobs depend only on release-create — they no
    # longer gate on each other. provider/.goreleaser.yml is
    # release.mode=append.
    needs: [prepare, release-create]
    if: |
      always()
      && needs.prepare.outputs.is_tag == 'true'
      && needs.release-create.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum

      - name: Import GPG signing key
        id: gpg
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          fingerprint=$(gpg --with-colons --import-options show-only --import <<< "${{ secrets.GPG_PRIVATE_KEY }}" | awk -F: '/^fpr:/{print $10; exit}')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Build provider binaries with GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: latest
          # --parallelism saturates the runner's 4 vCPUs across the
          # 8-platform build matrix (slightly oversubscribed because
          # part of each build is I/O — module download, GPG signing).
          args: release --clean --parallelism 6
          workdir: provider
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}

  release-migrate:
    name: Release — Migrate tool (GoReleaser)
    # Parallel with release-provider — both append to the Release that
    # release-create made.
    needs: [prepare, release-create]
    if: |
      always()
      && needs.prepare.outputs.is_tag == 'true'
      && needs.release-create.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: migrate/go.mod
          cache-dependency-path: migrate/go.sum

      - name: Import GPG signing key
        id: gpg
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          fingerprint=$(gpg --with-colons --import-options show-only --import <<< "${{ secrets.GPG_PRIVATE_KEY }}" | awk -F: '/^fpr:/{print $10; exit}')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      # Linux/Windows ship as per-arch zips; macOS ships as a single
      # Universal 2 binary built by lipo-merging darwin/amd64 +
      # darwin/arm64. See migrate/.goreleaser.yml.
      - name: Build migrate-tool binaries with GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: latest
          # See note on release-provider — same parallelism rationale.
          args: release --clean --parallelism 6
          workdir: migrate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}

  release-publish:
    name: Release — Publish tool (GoReleaser)
    # Parallel with release-provider / release-migrate — all append to the
    # Release that release-create made.
    needs: [prepare, release-create]
    if: |
      always()
      && needs.prepare.outputs.is_tag == 'true'
      && needs.release-create.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: publish/go.mod
          cache-dependency-path: publish/go.sum

      - name: Import GPG signing key
        id: gpg
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          fingerprint=$(gpg --with-colons --import-options show-only --import <<< "${{ secrets.GPG_PRIVATE_KEY }}" | awk -F: '/^fpr:/{print $10; exit}')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Build terrapod-publish binaries with GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --parallelism 6
          workdir: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}

  release-query:
    name: Release — terrapod-query
    # Reuses the linux binaries build-query already compiled (downloaded as
    # artifacts), so linux is never compiled twice — only darwin/windows are
    # built here. (No GoReleaser: its `prebuilt` builder is Pro-only, so this
    # packages the artifacts + native builds directly.)
    needs: [prepare, release-create, build-query]
    if: |
      always()
      && needs.prepare.outputs.is_tag == 'true'
      && needs.release-create.result == 'success'
      && needs.build-query.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: query/go.mod
          cache: false

      - name: Download prebuilt linux binaries (built once by build-query)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: terrapod-query-linux-*
          path: prebuilt
          merge-multiple: true

      - name: Import GPG signing key
        id: gpg
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          fingerprint=$(gpg --with-colons --import-options show-only --import <<< "${{ secrets.GPG_PRIVATE_KEY }}" | awk -F: '/^fpr:/{print $10; exit}')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Package, checksum, sign, and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          ver="${version#v}"   # archive names use the bare version, matching the other tools
          mkdir -p dist

          # Reuse the EXACT linux binaries baked into the images (built once by
          # build-query) — tar them, don't recompile.
          for arch in amd64 arm64; do
            install -m 0755 "prebuilt/terrapod-query-linux-${arch}" dist/terrapod-query
            tar -C dist -czf "dist/terrapod-query_${ver}_linux_${arch}.tar.gz" terrapod-query
            rm dist/terrapod-query
          done

          # Build + package the remaining platforms here (punted from build-query).
          # macOS: build BOTH arches and fuse them into a single UNIVERSAL binary
          # (darwin_all), matching the terrapod-migrate/publish/mcp artifacts.
          # makefat is the pure-Go fat-binary writer GoReleaser uses internally, so
          # it produces a valid universal Mach-O on the Linux runner (no lipo).
          GOBIN="${RUNNER_TEMP:-/tmp}/qbin" go install github.com/randall77/makefat@v0.0.0-20260406194835-1b91746796b7
          makefat="${RUNNER_TEMP:-/tmp}/qbin/makefat"
          for arch in amd64 arm64; do
            (cd query && GOOS=darwin GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w" -o "../dist/terrapod-query-darwin-${arch}" ./cmd/terrapod-query)
          done
          "$makefat" dist/terrapod-query \
            dist/terrapod-query-darwin-amd64 dist/terrapod-query-darwin-arm64
          tar -C dist -czf "dist/terrapod-query_${ver}_darwin_all.tar.gz" terrapod-query
          rm dist/terrapod-query dist/terrapod-query-darwin-amd64 dist/terrapod-query-darwin-arm64

          # Windows: per-arch (no universal concept on Windows).
          for arch in amd64 arm64; do
            (cd query && GOOS=windows GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w" -o "../dist/terrapod-query.exe" ./cmd/terrapod-query)
            (cd dist && zip -q "terrapod-query_${ver}_windows_${arch}.zip" terrapod-query.exe && rm terrapod-query.exe)
          done

          # SHA256SUMS over all archives + detached GPG signature (same shape as
          # the provider/migrate/publish artifacts).
          ( cd dist && sha256sum terrapod-query_${ver}_* > "terrapod-query_${ver}_SHA256SUMS" )
          gpg --batch --local-user "$GPG_FINGERPRINT" \
            --output "dist/terrapod-query_${ver}_SHA256SUMS.sig" \
            --detach-sign "dist/terrapod-query_${ver}_SHA256SUMS"

          # Append to the Release that release-create already opened.
          gh release upload "$version" dist/terrapod-query_${ver}_* --clobber

  release-mcp:
    name: Release — MCP server (GoReleaser)
    # Parallel with the other GoReleaser jobs — all append to the Release that
    # release-create made.
    needs: [prepare, release-create]
    if: |
      always()
      && needs.prepare.outputs.is_tag == 'true'
      && needs.release-create.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum

      - name: Import GPG signing key
        id: gpg
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          fingerprint=$(gpg --with-colons --import-options show-only --import <<< "${{ secrets.GPG_PRIVATE_KEY }}" | awk -F: '/^fpr:/{print $10; exit}')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Build terrapod-mcp binaries with GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --parallelism 6
          workdir: mcp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}

  release-finalize:
    name: Release — Finalize (notes + chart + SBOMs)
    # `create-manifests` is listed explicitly even though release-create and
    # release-images already gate on it. It is now the job that SIGNS the digests
    # the release verifies (GHSA-34pp-q7wp-3j54), so it is the release's trust
    # anchor and should be a named condition here rather than an inherited one —
    # which is also what the six-site rule asks of every job that runs on a tag.
    # v1.2.2 published while `Migrate Lint` was red for exactly the opposite
    # reason: a hand-listed subset that nobody extended.
    needs: [prepare, helm-eval-boot, create-manifests, release-create, release-images, release-provider, release-pulumi-provider, release-migrate, release-publish, release-query, release-mcp]
    if: |
      always()
      && needs.prepare.outputs.is_tag == 'true'
      && (needs.create-manifests.result == 'success' || needs.create-manifests.result == 'skipped')
      && needs.release-create.result == 'success'
      && needs.release-images.result == 'success'
      && needs.release-provider.result == 'success'
      && needs.release-pulumi-provider.result == 'success'
      && needs.release-migrate.result == 'success'
      && needs.release-publish.result == 'success'
      && needs.release-query.result == 'success'
      && needs.release-mcp.result == 'success'
      && (needs.helm-eval-boot.result == 'success' || needs.helm-eval-boot.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download release-images artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-images-assets
          path: dist/

      - name: Generate release notes
        run: |
          version="${{ needs.prepare.outputs.version }}"

          prev_tag=$(git describe --tags --abbrev=0 "${version}^" 2>/dev/null || echo "")

          if [[ -n "$prev_tag" ]]; then
            range="${prev_tag}..${version}"
          else
            range="$version"
          fi

          feats="" fixes="" docs="" refactors="" tests="" chores="" others=""

          while IFS= read -r line; do
            msg=$(echo "$line" | sed -E 's/^[a-z]+(\([^)]*\))?[!]?:[[:space:]]*//')

            case "$line" in
              feat:*|feat\(*)     feats+="- ${msg}"$'\n' ;;
              fix:*|fix\(*)       fixes+="- ${msg}"$'\n' ;;
              docs:*|docs\(*)     docs+="- ${msg}"$'\n' ;;
              refactor:*|refactor\(*) refactors+="- ${msg}"$'\n' ;;
              test:*|test\(*)     tests+="- ${msg}"$'\n' ;;
              chore:*|chore\(*|ci:*|ci\(*) chores+="- ${msg}"$'\n' ;;
              *)                  others+="- ${line}"$'\n' ;;
            esac
          done < <(git log --format='%s' "$range" 2>/dev/null)

          notes=""
          [[ -n "$feats" ]] && notes+="### Features"$'\n\n'"$feats"$'\n'
          [[ -n "$fixes" ]] && notes+="### Bug Fixes"$'\n\n'"$fixes"$'\n'
          [[ -n "$docs" ]] && notes+="### Documentation"$'\n\n'"$docs"$'\n'
          [[ -n "$refactors" ]] && notes+="### Refactoring"$'\n\n'"$refactors"$'\n'
          [[ -n "$tests" ]] && notes+="### Tests"$'\n\n'"$tests"$'\n'
          [[ -n "$chores" ]] && notes+="### Maintenance"$'\n\n'"$chores"$'\n'
          [[ -n "$others" ]] && notes+="### Other Changes"$'\n\n'"$others"$'\n'

          if [[ -n "$prev_tag" ]]; then
            notes+="**Full Changelog**: https://github.com/mattrobinsonsre/terrapod/compare/${prev_tag}...${version}"$'\n'
          fi

          # Write to file to preserve newlines
          echo "$notes" > /tmp/release-notes.md

      - name: Edit Release title/notes + upload chart, SBOMs, checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.prepare.outputs.version }}"
          chart_version="${version#v}"

          # Is this the newest version we have released? GitHub picks "latest"
          # by PUBLISH TIME, not by version — so a security patch cut for an
          # older line silently takes the badge from a newer minor, pointing
          # the repo front page and everything reading /releases/latest at an
          # older release. That happened with v1.4.2 over v1.5.0 (#1374).
          #
          # Compare versions, not branch names: a patch on the NEWEST line
          # (v1.5.1 over v1.5.0) should take the badge.
          #
          # Enumerated with `gh api --paginate`, NOT `gh release list --limit N`.
          # The Checkov builder publishes its own non-`v` releases into this
          # repository, and `gh release list` windows by PUBLISH TIME -- measured
          # after the mirror backfill, 31 of the newest 100 releases were
          # non-`v`, out of 274 in total. Once no `v` tag survives that window
          # the grep leaves only the version being released, `highest` equals
          # `version`, and an older line's patch silently takes the badge. That
          # is #1374 again, from a direction nothing in this job could see.
          highest=$(
            {
              gh api "/repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[].tag_name'
              echo "$version"
            # The optional group admits a pre-release (`v2.0.0-alpha.1`), which
            # is what lets one hold the badge while it is the newest thing
            # published. Both ends stay anchored: that is what keeps the Checkov
            # builder's non-`v` releases out of the comparison, which is the job
            # the anchors were doing all along.
            #
            # `sed 's/-/~/'` on the FIRST dash is what makes `sort -V` agree with
            # semver, and it is not cosmetic. `sort -V` is Debian version
            # ordering, where a pre-release suffix sorts AFTER the release it
            # precedes -- measured identically under GNU coreutils 9.12 and BSD
            # sort, so it is not a platform quirk. Without the transform
            # `v2.0.0-alpha.1` beats `v2.0.0`, and the alpha would keep the badge
            # for ever once 2.0.0 shipped. `~` is the one character that sorts
            # before nothing, so the substitution restores exactly semver's rule;
            # it exists only inside this pipeline and never reaches a tag, which
            # matters because `~` is neither valid semver nor a valid Docker tag.
            } | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$|^v[0-9]+\.0\.0-[0-9A-Za-z.-]+$' \
              | sed 's/-/~/' | sort -V | tail -1 | sed 's/~/-/'
          )
          echo "::notice::newest released version is $highest (compared against every release, not a window)"
          if [ "$highest" = "$version" ]; then
            latest=true
          else
            latest=false
            echo "::notice::$version is not the newest release ($highest is) — not taking the 'Latest' badge"
          fi

          # `release-create` made the empty Release and the append-mode goreleaser
          # runs have uploaded their binaries into it -- goreleaser does not create
          # it, which every `.goreleaser.yml` says in as many words (`mode: append`).
          # Update title/notes and upload remaining assets.
          # `--prerelease=false` unconditionally, and set rather than omitted so
          # a re-run converges instead of inheriting whatever the Release already
          # had. A pre-release is published under the badge on purpose (see
          # `release-create`); flagging it would silently decline the badge, and
          # the decline is invisible -- `gh release edit` exits 0 either way.
          gh release edit "$version" \
            --title "$version" \
            --latest="$latest" \
            --prerelease=false \
            --notes-file /tmp/release-notes.md

          # Declining the badge is NOT the same as handing it to someone else.
          # `make_latest=false` only says "do not force THIS one"; it elects no
          # replacement, so GitHub falls back to picking by publish date — and the
          # patch just published is the most recent, so it takes the badge back.
          #
          # Observed on v1.5.5: this step logged "v1.5.5 is not the newest release
          # (v1.6.0 is)", passed --latest=false, ran last of all the release jobs,
          # and /releases/latest still returned v1.5.5 until it was corrected by
          # hand (#1466).
          #
          # So promote the highest release positively. A no-op when it already holds
          # the badge, which keeps the ordinary case quiet.
          if [ "$latest" != "true" ]; then
            echo "::notice::re-electing $highest as the latest release"
            # Warn rather than fail. A failure here would fail release-finalize,
            # and Cleanup Tag would then DELETE the tag — losing a complete,
            # correct release over a badge. The release is already published and
            # sound at this point; a wrong badge is visible and fixable by hand,
            # a deleted tag is not.
            gh release edit "$highest" --latest=true \
              || echo "::warning::could not re-elect $highest as latest; $version may hold the badge — fix with: gh release edit $highest --latest=true"
          fi

          # Read the badge back rather than trusting the edit. GitHub documents
          # that a release flagged as a pre-release cannot be set as latest, and
          # `gh release edit` exits 0 whether or not the badge actually moved --
          # so an absent signal would read as a passing one, which is how #1374
          # went unnoticed in the first place. One call, and it turns a
          # documented constraint into a checked one on every release.
          actual=$(gh api "/repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || echo "<unreadable>")
          if [ "$actual" = "$highest" ]; then
            echo "::notice::Latest badge verified: $actual"
          else
            echo "::warning::Latest badge is $actual, expected $highest — fix with: gh release edit $highest --latest=true"
          fi

          gh release upload "$version" \
            dist/terrapod-${chart_version}.tgz \
            dist/sbom-terrapod-api.spdx.json \
            dist/sbom-terrapod-web.spdx.json \
            dist/sbom-terrapod-runner.spdx.json \
            dist/sbom-terrapod-listener.spdx.json \
            dist/sbom-terrapod-migrations.spdx.json \
            dist/checksums.txt \
            --clobber

  # ── Cleanup Tag on Failure ─────────────────────────────
  cleanup-tag:
    name: Cleanup Tag
    needs: [prepare, quality-gate, helm-eval-boot, build-images-amd64, build-images-arm64, build-query, scan-images, create-manifests, release-create, release-images, release-provider, release-pulumi-provider, release-migrate, release-publish, release-query, release-mcp, release-finalize]
    if: |
      always()
      && needs.prepare.outputs.is_tag == 'true'
      && (needs.quality-gate.result == 'failure' || needs.helm-eval-boot.result == 'failure' || needs.build-images-amd64.result == 'failure' || needs.build-images-arm64.result == 'failure' || needs.build-query.result == 'failure' || needs.scan-images.result == 'failure' || needs.create-manifests.result == 'failure' || needs.release-create.result == 'failure' || needs.release-images.result == 'failure' || needs.release-provider.result == 'failure' || needs.release-pulumi-provider.result == 'failure' || needs.release-migrate.result == 'failure' || needs.release-publish.result == 'failure' || needs.release-query.result == 'failure' || needs.release-mcp.result == 'failure' || needs.release-finalize.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Delete tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.prepare.outputs.version }}"
          echo "Cleaning up failed release $version"

          gh release delete "$version" --cleanup-tag --yes 2>/dev/null || true
          git push origin ":refs/tags/$version" 2>/dev/null || true

  # ── Pulumi SDK Build ──────────────────────────────────
  # Generates a per-language SDK from the COMMITTED schema and proves it is
  # USABLE in that language -- one matrix leg each, in parallel.
  #
  # This exists because nothing in CI generated or built an SDK, and two defects
  # lived in exactly that gap while every other gate was green, because the
  # schema was fine both times and the defect was in what Pulumi GENERATES from
  # it:
  #
  #   - #2284, Go: a nested type collided with a function's own
  #     `<Function>Output` helper, so the SDK did not compile at all.
  #   - #2267, Python: the package name was hyphenated, and the generator uses
  #     that field as the module DIRECTORY as well as the distribution name, so
  #     the SDK installed and could never be imported.
  #
  # Both were found by generating an SDK and trying to use it, which is why each
  # leg below does the cheapest thing that would have caught its own language's
  # defect rather than stopping at "files were produced".
  #
  # It generates from the committed schema deliberately: that is what
  # `pulumi package add` consumes. Whether that schema is STALE against the
  # Terraform provider is gated by the pulumi-provider tests in `go-modules`, so
  # this does not re-check it.
  #
  # Node, Python and .NET come from the runner image rather than a setup action,
  # deliberately: three more pinned actions is three more SHA comments to drift,
  # and none of these legs depends on a specific toolchain version.
  #
  # When a leg fails after a bridge or Pulumi CLI bump and the diff touched
  # neither the provider nor the schema, suspect upstream before suspecting us:
  # the tree being built is GENERATED, so a generator change can break it with
  # nothing of ours having moved.
  pulumi-sdk-build:
    name: Pulumi SDK (${{ matrix.language }})
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Every language, independently: a leg that fails must not hide the others,
      # since the whole point is that a silently smaller surface is this
      # feature's failure mode (#2267).
      fail-fast: false
      matrix:
        language: [go, nodejs, python, dotnet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: pulumi-provider/go.mod

      # Pinned, and from the release archive rather than piped from
      # get.pulumi.com into a shell -- the same shape `release-rescan.yml` uses
      # for crane.
      - name: Install the Pulumi CLI
        run: |
          set -euo pipefail
          version=3.272.0
          curl -fsSL -o pulumi.tar.gz \
            "https://github.com/pulumi/pulumi/releases/download/v${version}/pulumi-v${version}-linux-x64.tar.gz"
          tar -xzf pulumi.tar.gz
          sudo install -m 0755 pulumi/pulumi /usr/local/bin/pulumi
          pulumi version

      - name: Generate the ${{ matrix.language }} SDK from the committed schema
        run: |
          set -euo pipefail
          pulumi package gen-sdk \
            pulumi-provider/cmd/pulumi-resource-terrapod/schema.json \
            --language "${{ matrix.language }}" --out "$RUNNER_TEMP/sdk"
          # gen-sdk exits 0 when it writes nothing, which is the shape to
          # distrust -- an absent SDK would otherwise read as a passing build.
          found=$(find "$RUNNER_TEMP/sdk" -type f \
            \( -name '*.go' -o -name '*.ts' -o -name '*.py' -o -name '*.cs' \) | wc -l)
          echo "generated source files: $found"
          test "$found" -gt 0 || {
            echo "gen-sdk reported success and produced no sources for ${{ matrix.language }}."
            exit 1
          }

      # Go -- #2284's language. The generator emits no go.mod, so the module path
      # the SDK imports itself under has to be supplied; it must match
      # `ImportBasePath` in provider.go minus the trailing package, or the SDK's
      # own `internal` package does not resolve and the failure has nothing to do
      # with the schema.
      - name: Compile the Go SDK
        if: matrix.language == 'go'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sdk/go"
          goline=$(grep -m1 '^go ' "$GITHUB_WORKSPACE/pulumi-provider/go.mod")
          printf 'module github.com/mattrobinsonsre/terrapod/pulumi-provider/sdk/go\n\n%s\n' "$goline" > go.mod
          go mod tidy
          go build ./... || {
            echo
            echo "The generated Pulumi Go SDK does not compile."
            echo "A duplicate declaration here is usually a NAME COLLISION between a"
            echo "generated nested type and a function's own <Function>Output helper."
            echo "See TestNoFunctionsOutputHelperCollidesWithAGeneratedType and the"
            echo "Fields override in pulumi-provider/provider.go (#2284)."
            exit 1
          }

      - name: Type-check the TypeScript SDK
        if: matrix.language == 'nodejs'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sdk/nodejs"
          npm install --no-audit --no-fund
          npx tsc --noEmit
          test -f inventoryHost.ts || {
            echo "inventoryHost.ts is absent -- the inventory resources are the"
            echo "reason this provider exists (#1987), so their absence is a"
            echo "failure even if everything else type-checks."
            exit 1
          }

      # Python -- #2267's language. INSTALL and IMPORT rather than compile:
      # Python has no compile step, and the defect this catches was a package
      # that installed perfectly and could never be imported.
      - name: Install and import the Python SDK
        if: matrix.language == 'python'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "$RUNNER_TEMP/sdk/python"
          # To a FILE rather than `python3 - <<EOF`: a program on stdin is one
          # heredoc away from colliding with piped data, and a file is the shape
          # that keeps working when someone later adds an input to this step.
          cat > "$RUNNER_TEMP/import_probe.py" <<'PY'
          import terrapod_pulumi as tp

          missing = [
              n
              for n in ("InventoryHost", "InventoryHostVar", "InventoryHostGroup")
              if not hasattr(tp, n)
          ]
          if missing:
              raise SystemExit(f"the imported SDK is missing {missing}")
          print("imported, and the inventory resources are present")
          PY
          "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/import_probe.py"

      - name: Build the .NET SDK
        if: matrix.language == 'dotnet'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sdk/dotnet"
          dotnet --version
          dotnet build --nologo


  ci-pass:
    name: CI
    if: always()
    needs:
      - prepare
      - python-checks
      - node-checks
      - go-modules
      - pulumi-sdk-build
      - build-ee-agent
      - build-query
      - python-test
      - python-audit
      - secret-scan
      - codeql
      - dependency-review
      - host-checks
      - helm-eval-boot
      - sast
      - build-images-amd64
      - build-images-arm64
      - scan-images
      - e2e-test
      # `e2e-report` is deliberately absent, and must stay absent. It is already
      # excluded from the `results=()` verdict below (see the reasoning on the
      # job itself: an artifact-storage failure with no Terrapod code involved
      # failed a correct release on v1.5.3). Listing it here anyway made
      # `ci-pass` WAIT for a job whose result it then ignored — 5m35s of a PR
      # run with one job on the machine and nineteen slots idle, because the
      # report merges eight Playwright blobs behind a ~2GB image pull.
      #
      # The workflow run still finishes it; the required status check no longer
      # waits for it. Re-adding this line reintroduces the stall silently, since
      # nothing about the verdict changes (#1468).
      - oci-conformance
      - airgap-gate
      - create-manifests
      - release-create
      - release-images
      - release-provider
      - release-pulumi-provider
      - release-migrate
      - release-publish
      - release-query
      - release-mcp
      - release-finalize
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results=(
            "${{ needs.prepare.result }}"
            "${{ needs.python-checks.result }}"
            "${{ needs.node-checks.result }}"
            "${{ needs.go-modules.result }}"
            "${{ needs.pulumi-sdk-build.result }}"
            "${{ needs.build-ee-agent.result }}"
            "${{ needs.build-query.result }}"
            "${{ needs.python-test.result }}"
            "${{ needs.python-audit.result }}"
            "${{ needs.secret-scan.result }}"
            "${{ needs.codeql.result }}"
            "${{ needs.dependency-review.result }}"
            "${{ needs.host-checks.result }}"
            "${{ needs.helm-eval-boot.result }}"
            "${{ needs.sast.result }}"
            "${{ needs.build-images-amd64.result }}"
            "${{ needs.build-images-arm64.result }}"
            "${{ needs.scan-images.result }}"
            "${{ needs.e2e-test.result }}"
            "${{ needs.oci-conformance.result }}"
            "${{ needs.airgap-gate.result }}"
            "${{ needs.create-manifests.result }}"
            "${{ needs.release-create.result }}"
            "${{ needs.release-images.result }}"
            "${{ needs.release-provider.result }}"
            "${{ needs.release-pulumi-provider.result }}"
            "${{ needs.release-migrate.result }}"
            "${{ needs.release-publish.result }}"
            "${{ needs.release-query.result }}"
            "${{ needs.release-mcp.result }}"
            "${{ needs.release-finalize.result }}"
          )

          for r in "${results[@]}"; do
            if [[ "$r" == "failure" ]]; then
              echo "One or more jobs failed"
              exit 1
            fi
          done
          echo "All checks passed"

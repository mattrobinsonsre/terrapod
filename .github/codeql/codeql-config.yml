# CodeQL configuration.
#
# A repo-wide `exclude` is an assertion about EVERY file, now and in future, and
# six of the ones here were assertions about a codebase that no longer exists
# (GHSA-9rfc-j5x9-p84w). Each was written in PR #40 naming a single call site —
# "provider cache: hostname validated against an admin-configured allowlist" was
# true of the one fetch there was. Since then the tree gained an OCI pull-through
# registry, PyPI and npm package proxies, operator-supplied webhook and run-task
# URLs, Vault and OpenBao clients and a cost-pricesheet fetch: SSRF and
# path-injection sinks, excluded sight unseen by a filter whose stated reason had
# never been re-read. The CVE policy meanwhile claimed CodeQL gates the source.
#
# So the security-relevant filters are gone, and anything they were right about is
# now dismissed per alert — which costs a click and leaves a dated, auditable
# record naming the alert, instead of a comment that silently stops being true.
#
# What is left is deliberately not security analysis. These flag an idiom the
# codebase uses on purpose, in hundreds of places, and per-alert dismissal would be
# churn with no judgement in it:
#
# py/ineffectual-statement — PEP 544 Protocol stubs use `...` (Ellipsis)
# py/unnecessary-lambda    — FastAPI dependency overrides need a fresh mock per request
# py/multiple-definition   — intentional re-fetch after a DB mutation
#
# `py/empty-except` is the one judgement call in that list. It stays because the
# fail-open patterns it flags (Redis, K8s, URL parsing) are deliberate and
# documented, and because the thing that actually governs them is the rule that a
# best-effort handler must not swallow a DB mutation — which is gated by a test
# that reads the code, not by CodeQL. Revisit it if that stops being true.
#
# alembic/versions — Alembic migration boilerplate. The module globals
# `revision`, `down_revision`, `branch_labels`, `depends_on` are required
# by Alembic and read via module introspection, so CodeQL's
# py/unused-global-variable flags every one as "unused" on every
# migration. They are not unused and must not be removed; the whole
# generated-migration directory is excluded rather than littering each
# file with per-line suppressions on every new migration.

paths-ignore:
  - e2e
  - alembic/versions
  # services/ai_eval is the AI-analysis evaluation harness + its synthetic,
  # never-applied terraform/HCL corpus fixtures (deliberately "insecure" infra
  # so the AI risk-analysis prompt has something to flag). Not product code,
  # never deployed — excluded from code scanning entirely (see also .semgrepignore).
  - services/ai_eval
  # scripts/ is build, CI and developer tooling — linting, the eval stack, the
  # release re-scan, and the protocol captures that drive real clients at a
  # logging stub. No Dockerfile COPYs it, so none of it ships in an image or is
  # reachable by anyone but whoever runs it. Alerts here are about a throwaway
  # stub's return style, not about anything a deployment exposes, and they crowd
  # out the product findings the tab exists to surface.
  #
  # Semgrep still scans it (see .semgrepignore, which excludes only ai_eval), so
  # this narrows one tool's noise rather than leaving the directory unanalysed.

query-filters:
  - exclude:
      id: py/ineffectual-statement
  - exclude:
      id: py/unnecessary-lambda
  - exclude:
      id: py/multiple-definition
  - exclude:
      id: py/empty-except

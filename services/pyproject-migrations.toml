[project]
name = "terrapod-migrations"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31",
    "alembic>=1.14",
    # Pin Mako forward to dodge CVE-2026-44307 (path traversal via
    # backslash URI). Mako is pulled in transitively by alembic; the
    # CVE is Windows-only (backslash URIs aren't a Linux concern) so
    # this is defence-in-depth — Trivy still flags it because the
    # advisory doesn't carry an OS qualifier.
    "Mako>=1.3.12",
    # Cloud-IAM DB auth (#573): the migrations Job mints a per-connection token
    # the same way the API does (terrapod.db.iam_auth, already copied into the
    # image). structlog is imported by that module; the cloud SDKs are lazy
    # per auth_mode (botocore=AWS RDS, google-auth=Cloud SQL, azure-identity=Entra).
    "structlog>=24.1",
    "botocore>=1.34",
    "google-auth>=2.28",
    "azure-identity>=1.21",
    # Pin cryptography forward for CVE-2026-69247 (PKCS#7 EnvelopedData
    # decryption exposes a Bleichenbacher oracle; affects 44.0.0 to 49.x).
    # It arrives transitively via azure-identity/google-auth, so without an
    # explicit floor this image keeps resolving an affected version even
    # though the API and listener have moved — same shape as the Mako pin
    # above. Migrations do no PKCS#7 work; this is defence in depth.
    "cryptography>=50.0.0",
]

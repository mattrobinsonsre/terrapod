[tool.poetry]
name = "terrapod"
version = "0.1.0"
description = "Terrapod - Open-source Terraform Enterprise replacement - API Server"
authors = ["Matt Robinson"]
license = "MPL-2.0"
packages = [{include = "terrapod"}]

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
fastapi = ">=0.135.2,!=0.136.3,<0.137.0"
# Pin starlette directly even though it is fastapi's dependency. fastapi
# only declares a FLOOR (`starlette>=0.46`, no ceiling), so without our own
# upper bound starlette floats to the latest release on every build — a
# starlette major/minor can then change framework behaviour with no
# deliberate bump on our side. Capping it here forces every starlette move
# to be an explicit, reviewed edit, and makes a fastapi bump that needs a
# starlette outside this range FAIL TO RESOLVE rather than silently swap it
# (fastapi 0.137 + starlette 1.x is exactly the trap this guards). See
# tests/test_dependency_pins.py — keep the upper bound. Bump this line in
# lock-step when intentionally taking a new starlette.
starlette = ">=1.3.1,<1.4.0"
# msgpack is a transitive (no lockfile is committed — the image build resolves
# it), so a floor here is the only way to keep the fixed version. GHSA-6v7p-g79w-8964
# (out-of-bounds read on Unpacker reuse) is HIGH and fixed in 1.2.1; it failed
# every image scan. Floor, not a pin, so patches still flow.
msgpack = ">=1.2.1"
uvicorn = {extras = ["standard"], version = ">=0.42,<0.55"}
pydantic = "^2.10.0"
pydantic-settings = "^2.14.2"
structlog = ">=25.5,<27.0"
httpx = "^0.28.0"
slack-sdk = "^3.33.0"
pyyaml = "^6.0.0"
aiofiles = "^25.1.0"
# AWS S3 and KMS. aiobotocore DIRECTLY, not through aioboto3 (#2263).
#
# aioboto3 wraps aiobotocore to add a boto3-style `resource` API and the S3
# transfer helpers, and Terrapod used NEITHER -- every call in storage/s3.py and
# crypto/providers.py is a low-level botocore operation. What it did do was
# hard-pin `aiobotocore[boto3]==2.25.1`, which capped `boto3 <1.40.62` and so
# made every patched litellm uninstallable; it had also gone 362 days without a
# release while aiobotocore shipped 2.25.1 -> 3.10.0.
#
# Deliberately WITHOUT the `[boto3]` extra: nothing here imports boto3, so this
# brings botocore alone and boto3 is left entirely to litellm's own constraint.
aiobotocore = "^3.10"
# Azure Blob Storage
azure-storage-blob = "^12.25.0"
azure-identity = "^1.21.0"
# GCP Cloud Storage
google-cloud-storage = "^3.9.0"
gcloud-aio-storage = "^9.6.4"
# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = ">=0.31,<0.33"
alembic = "^1.14.0"
# HCL parsing (module interface extraction)
python-hcl2 = "^7.0.0"
# Redis
redis = ">=7.4,<9.0"
# Auth
authlib = "^1.4.0"
python3-saml = "^1.16.0"
cryptography = ">=50.0.0,<51.0.0"
zxcvbn = "^4.4.28"
python-multipart = ">=0.0.26,<0.0.33"
# Kubernetes (runner listener)
kubernetes = ">=35,<38"
# GPG key parsing for provider registry
pgpy = "^0.6.0"
# GitHub App JWT signing for VCS integration
pyjwt = {extras = ["crypto"], version = "^2.8.0"}
# Async SMTP for email notifications
aiosmtplib = "^5.1.0"
# SSE (Server-Sent Events) for real-time run status updates
sse-starlette = "^3.3.2"
# Prometheus metrics exposition
prometheus-client = ">=0.24,<0.27"
# imghdr removed in Python 3.13; pgpy still imports it
standard-imghdr = "^3.13"
# LiteLLM SDK for the AI plan-summary feature (#401). One library, every
# major provider — Bedrock (native Converse + IAM auth via boto3),
# OpenAI, Anthropic direct, Gemini, Azure OpenAI, vLLM, etc. Terrapod
# speaks OpenAI Chat Completions request shape to LiteLLM; LiteLLM
# handles per-provider request translation and auth in-process.
#
# Upper bound <1.104, NOT <2.0, and the reason is a cap of litellm's own
# (#2263). litellm 1.104.0 added `filelock<4.0` — a fortnight after filelock
# cut 4.0.0, so a precautionary major-version cap rather than a response to
# anything broken. filelock's own CVE-2026-112907, CVE-2026-112913 and
# CVE-2026-112940 are fixed ONLY in 4.2.1, so any litellm from 1.104 up drags
# filelock from 4.2.4 down to 3.x and reintroduces all three — against a
# package we neither declare nor import.
#
# 1.103.x carries no such cap and IS patched for CVE-2026-114612 (fix points
# 1.100.4, 1.101.3, 1.102.2, 1.103.1), so this range takes the patch and keeps
# filelock clean. Measured both ways with pip-audit rather than reasoned.
#
# EXIT: litellm relaxes `filelock<4.0`. Then drop this upper bound back to
# <2.0. Checkable in one call:
#
#   curl -s https://pypi.org/pypi/litellm/json \
#     | jq -r '.info.requires_dist[]' | grep '^filelock'
#
# Lower bound 1.103.1 patches CVE-2026-114612: the proxy seals secrets at rest
# and mints session tokens with ONE key, so an `internal_user` can have a
# forged admin credential encrypted for them and present it back as a bearer
# token, reaching proxy_admin and arbitrary command execution via the MCP stdio
# endpoint. Exploitable in the DEFAULT configuration above 1.91.0. It was
# unreachable here — library-only via acompletion(), proxy never started — and
# bumped anyway, because a reachability argument is a claim about today's call
# sites and a floor is a fact about the artifact.
#
# 1.87 was the previous floor and patches the earlier proxy-mode CVEs (CVE-2026-40217, CVE-2026-42203,
# CVE-2026-42208, CVE-2026-42271) — all proxy-only, not reachable from
# how Terrapod uses litellm (library-only via acompletion(), proxy
# never started) — and relaxes the aiohttp pin from ==3.13.5 to
# <4.0,>=3.10, which lets aiohttp resolve to 3.14+ and clears
# GHSA-hg6j-4rv6-33pg + GHSA-jg22-mg44-37j8 + CVE-2026-34993 +
# CVE-2026-47265.
#
# litellm was what set the interpreter floor: 1.83.11+ declared
# requires_python = <3.14, so the whole project was pinned to 3.13 by
# one dependency. That cap is gone as of 1.99.0 (<3.15,>=3.10), which
# is what let the floor move to 3.14 in 2.0 (#1461).
#
# UPPER BOUND <1.104 EXCLUDES litellm's OWN filelock cap (#2263), and that is
# why it is not <2.0. litellm 1.104.0 added `filelock<4.0` a fortnight after
# filelock cut 4.0.0 — a precautionary major-version cap, not a response to
# anything broken. filelock's CVE-2026-112907, CVE-2026-112913 and
# CVE-2026-112940 were introduced in 3.20.4 and fixed only in 4.2.1, so every
# version that cap permits above 3.20.3 carries all three, against a package we
# neither declare nor import and reach only through litellm and
# huggingface-hub. A capped litellm therefore drags filelock from 4.2.4 down to
# 3.x and trades one accepted, proxy-only, unreachable advisory for three local
# rename/symlink ones.
#
# Not a new untested pairing: `main` already ran litellm 1.97.0 against filelock
# 4.2.4, and 1.97.0 predates filelock 4.0.0 entirely. The cap-free 1.103.x line
# is the same situation with the proxy CVE fixed.
#
# LOWER BOUND 1.103.1 patches CVE-2026-114612 — the proxy seals secrets at rest
# and mints session tokens with ONE key, so an `internal_user` can have a forged
# admin credential encrypted for them and present it back as a bearer token,
# reaching proxy_admin and arbitrary command execution via the MCP stdio
# endpoint. Exploitable in the DEFAULT configuration above 1.91.0. Unreachable
# here and bumped anyway, because a reachability argument is a claim about
# today's call sites while a floor is a fact about the artifact. 1.103.1 is the
# fix point on the cap-free line; the others are 1.100.4, 1.101.3 and 1.102.2.
#
# EXIT: litellm relaxes `filelock<4.0`, after which this returns to <2.0.
#
#   curl -s https://pypi.org/pypi/litellm/json \
#     | jq -r '.info.requires_dist[]' | grep '^filelock'
litellm = ">=1.103.1,<1.104"
# Required at RUNTIME by litellm's completion() path: litellm 1.9x lazily imports
# litellm.responses.mcp -> litellm.proxy.common_utils.http_parsing_utils, which
# does an unconditional `import orjson`. orjson is one of litellm's own optional
# deps (we install it without the proxy extra), so without declaring it here
# every real acompletion() call — AI plan summaries AND AI onboarding polish —
# fails with ModuleNotFoundError. Caught by the #824 live Bedrock smoke.
orjson = "^3.10"

# `ansible-inventory`, for resolving a workspace's inventory in the API (#2021).
#
# BAKED IN, deliberately, and this is the whole of the API's relationship with
# ansible. It replaced machinery that created a virtualenv on first use and
# `pip install ansible-core==<the workspace's version>`-ed into it through an
# in-process PEP 503 shim over the PyPI pull-through cache -- so what the API
# ran depended on what a workspace had pinned, on reaching an index, and on a
# cache that exists for Pulumi's language SDKs. None of that was right: parsing
# a static inventory file is one stable operation, done once, in one place.
#
# A LINE, so the API takes that line's newest patch on each rebuild. It is NOT
# a Helm value and must not become one -- a workspace's `ansible_version`
# selects its execution-environment IMAGE, which is where the core line
# genuinely matters because it decides the supported target Pythons (#2154).
#
# Only the API image installs this: the listener, migrations and runner images
# resolve from their own `pyproject-{name}.toml` manifests. Review at every
# minor release, as for the platform tools.
ansible-core = "~2.21"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
# Parallel test runner. CI Python Test shards (unit, services-api)
# use `-n auto` to spread across runner vCPUs; integration shard
# stays serial because its session-scoped Postgres fixture would
# race under workers. Local `make test` doesn't enable it by
# default — `pytest` itself in the test container still runs
# serial unless `-n` is passed.
pytest-xdist = "^3.6.0"
ruff = ">=0.15,<0.18"
mypy = ">=1.14,<3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# Deliberately behind the interpreter floor, which is 3.14 since #1461.
#
# At py314 ruff's formatter emits PEP 758 — `except (A, B):` becomes
# `except A, B:` — and **CodeQL cannot parse that**. It reads the Python 2
# meaning, where the second name is a binding target, and reports
# `py/uninitialized-local-variable` against a local it thinks was invented.
# Two of those landed on `api/dependencies.py`, at error severity, on the
# authentication path. The code is correct; the scanner cannot read it.
#
# The alternative was excluding `py/uninitialized-local-variable` in
# codeql-config.yml. That is worse: the rule catches genuine use-before-
# assignment across all product code, and turning it off repo-wide to work
# around a parser gap trades a real safety net for a syntax preference.
#
# So ruff keeps emitting syntax every tool in the chain can read. Raise this
# when CodeQL supports PEP 758 — the interpreter floor is not what is holding
# it back. (This is NOT the backport argument that was made and rejected when
# the floor moved; that one did not survive scrutiny. This is about the
# scanner.)
target-version = "py313"
line-length = 100
# Alembic migrations are auto-generated with the conventional revision-vars-
# before-imports layout (E402) and are not hand-linted. (They're now present in
# the test image so tests/db can parse them — this keeps ruff off them.)
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # Depends() in function defaults is idiomatic FastAPI
]

[tool.ruff.lint.isort]
known-first-party = ["terrapod"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: Integration tests using real Postgres, Redis, and filesystem storage",
    "replication_matrix(entity_class, row): Claims coverage of one per-class replication test-matrix row (#1112)",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "aiobotocore.*",
    "azure.*",
    "google.*",
    "gcloud.*",
    "aiofiles",
    "redis.*",
    "authlib.*",
    "onelogin.*",
    "zxcvbn",
    "asyncpg",
    "kubernetes.*",
    "pgpy.*",
    "aiosmtplib",
]
ignore_missing_imports = true

# gitleaks configuration for Terrapod
# https://github.com/gitleaks/gitleaks

title = "Terrapod gitleaks config"

# gitleaks treats a supplied --config as the COMPLETE ruleset. Without this the
# file below defined an allowlist and no rules at all, so the scan matched
# nothing and the required check could not fail. Removing --config would not fix
# it either: gitleaks auto-discovers this file.
[extend]
  useDefault = true

[allowlist]
  description = "Allowlisted paths and patterns"
  paths = [
    # Test fixtures may contain fake secrets
    '''services/tests/''',
    # Pen test rules reference secret patterns
    '''pentest/''',
    # Lock files
    '''poetry\.lock''',
    '''package-lock\.json''',
    # Alembic migrations (revision hashes look like secrets)
    '''alembic/versions/''',
  ]

  # Pulumi's own published format markers, not credentials. A deployment marks a
  # value secret with a map carrying `sig.Key` -> `sig.Secret`; both are fixed
  # constants of Pulumi's `apitype.SecretV1` (pulumi/pulumi, `resource/sig.go`),
  # so Terrapod has to hold the same literals to read or write the format at all.
  # Allowlisted by value rather than by path, so the files that carry them stay
  # scanned for everything else.
  regexes = [
    '''4dabf18193072939515e22adb298388d''',
    '''1b47061264138c4ac30d75fd1eb44270''',
  ]

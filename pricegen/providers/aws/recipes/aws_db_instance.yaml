# RDS -> aws_db_instance. Composite: the DB instance (hourly) + its storage
# (per-GB). The oiq `engine` value combines AWS's databaseEngine + databaseEdition
# (SQL Server + Enterprise -> sqlserver-ee), so `match.engine` uses a composite
# `from` map. `multi_az` comes from deploymentOption. On-demand only for now;
# Reserved (the bulk of RDS) is a separate follow-on.
resource_type: aws_db_instance
service: AmazonRDS

# Shared across both components: the engine identity + multi_az mapping.
_engine: &engine
  from: [databaseEngine, databaseEdition]
  map:
    "PostgreSQL|": postgres
    "MySQL|": mysql
    "MariaDB|": mariadb
    "SQL Server|Enterprise": sqlserver-ee
    "SQL Server|Standard": sqlserver-se
    "SQL Server|Web": sqlserver-web
    "Oracle|Enterprise": oracle-ee
    "Oracle|Standard Two": oracle-se2
    # Aurora is deliberately NOT here: in Terraform it's aws_rds_cluster_instance,
    # not aws_db_instance (oiq conflates them). It gets its own recipe.
_multi_az: &multi_az
  attr: deploymentOption
  map: { Single-AZ: "false", Multi-AZ: "true" }

components:
  # The DB instance — priced per hour (`t`). We match on (engine, instance_class,
  # multi_az) and DELIBERATELY do NOT put license_model in the match: it's an
  # Optional+Computed attribute that a `terraform plan` for a new DB emits as
  # null/absent (the common estimate case), so a row that required it would fail
  # to match — proven by running the consumer engine against a plan without it.
  # The `select` still keeps the three clean license models as SEPARATE priced
  # rows; under the consumer's SUBSET matching that means postgres/mysql (one
  # license) price to a single value, while SQL Server / Oracle (License-included
  # vs BYOL, different prices, same key) price to a min..max RANGE — the honest
  # answer when the plan doesn't pin the license. (oiq's "ambiguous duplicate"
  # rows are the same thing; under subset matching a range is correct, not a bug,
  # which is why the earlier attempt to disambiguate via license_model was wrong.)
  - product_family: "^Database Instance$"
    service_class: instance
    select:
      # keep only the three clean license models (drop NA / Marketplace / media).
      licenseModel: [No license required, License included, Bring your own license]
      deploymentOption: [Single-AZ, Multi-AZ] # skip readable-standbys for now
      # RDS Custom is a distinct offering (custom-oracle-ee/… engines in Terraform,
      # not oracle-ee) — exclude it so the standard engine keys stay unambiguous.
      deploymentModel: { regex: "^Custom$", negate: true }
    match:
      engine: *engine # unmapped engine/edition (Db2, Outposts, Developer) -> skipped
      instance_class: { attr: instanceType }
      multi_az: *multi_az
    price: { type: t, unit: Hrs }
    tier: usage

  # Storage — priced per allocated GB-month. AWS tags storage SKUs per engine +
  # edition, but the *price* is identical across every engine/edition (gp2/gp3
  # $0.115, io1/io2 $0.125, magnetic $0.10) — the engine tag is cosmetic. Since
  # the consumer matches by SUBSET, we omit `engine` entirely: one row per
  # (storage_type, multi_az) correctly prices every engine, and dedup collapses
  # the redundant per-engine SKUs. (oiq instead expands one price into 17
  # engine-keyed rows — same result, more noise.) `volumeType` -> the Terraform
  # `storage_type`; unmapped types (the Aurora variants) resolve to None and are
  # skipped, keeping Aurora out of aws_db_instance. Priced with `a=` (read the
  # real `allocated_storage` attr) rather than oiq's `d` (which falls back to a
  # 1-GB usage default because tf-flattening never feeds allocated_storage into
  # usage.data) — same choice as aws_ebs_volume's `a=values.size`, and accurate.
  - product_family: "^Database Storage$"
    service_class: storage
    select:
      deploymentOption: [Single-AZ, Multi-AZ] # skip Mirror / readable-standbys / RAC
    match:
      storage_type:
        attr: volumeType
        map:
          General Purpose: gp2
          General Purpose (SSD): gp2 # legacy SKU name for gp2
          General Purpose-GP3: gp3
          Provisioned IOPS: io1
          Provisioned IOPS (SSD): io1 # legacy SKU name for io1
          Provisioned IOPS-IO2: io2
          Magnetic: standard
          # Aurora volume types (General Purpose-Aurora, IO Optimized-Aurora)
          # are deliberately absent -> None -> skipped (Aurora is a separate
          # aws_rds_cluster_instance recipe).
      multi_az: *multi_az
    price: { type: "a=values.allocated_storage" }
    tier: none

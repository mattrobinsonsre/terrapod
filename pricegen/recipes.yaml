# The set of recipes the published Terrapod pricesheet includes (#893, #1025).
#
# Each entry names a provider, a recipe, the offer file it reads, and a `fetch:`
# block describing how to download that offer from the official cloud pricing
# API. `python -m pricegen.fetch_offers` populates the offers (from the API); the
# `publish` generator then runs every entry through the engine, combines the rows
# into one gzipped-YAML pricesheet, and aggregates the per-recipe drift manifests.
# Locally the offers live in the gitignored `.cache/`; in CI the scheduled
# pricesheet workflow fetches them fresh each run.
#
# MULTI-REGION (#1025). The generate/consumer side is already region-agnostic —
# each AWS/Azure row carries its region from the product attribute
# (`regionCode`/`armRegionName`), GCP direct rows carry every `serviceRegion`,
# and the consumer resolves a resource's region per-resource (#871). So
# multi-region is a FETCH concern. The PUBLISHED sheet covers EVERY region via a
# CI fan-out (`pricesheet.yml`): one shard per AWS region (+ AWS-global + Azure +
# GCP), each fetching only its slice (the AmazonEC2 offer is ≈458 MB per region,
# so one runner can't hold them all), then `pricegen.merge` combines the partials.
#
# The `regions:` set below is the LOCAL / single-runner default used only when
# `fetch_offers`/`publish` run with no shard flags (`--region`/`--all-regions`/
# `--global-only`); it's a curated workhorse set (US/EU/APAC/AU) so a laptop pass
# stays quick. CI ignores it and drives every region via the flags. A recipe's
# `fetch:` may still pin its own `region:`/`regions:`; `global: true` offers
# ignore region entirely. See `pricegen.shard` for the selection contract.
regions:
  aws:
    - us-east-1
    - us-east-2
    - us-west-2
    - eu-west-1
    - eu-west-2
    - eu-central-1
    - ap-southeast-1
    - ap-northeast-1
  azure:
    - eastus
    - eastus2
    - westus2
    - westeurope
    - northeurope
    - uksouth
    - southeastasia
    - australiaeast
  # GCP direct recipes already emit every serviceRegion a SKU serves (the adapter
  # expands one Unit per (SKU, region)), so they're multi-region for free. This
  # list bounds only the GCP *computed* compute recipe, whose rows are enumerated
  # per region.
  gcp:
    - us-central1
    - us-east1
    - us-west1
    - europe-west1
    - europe-west2
    - asia-southeast1
    - asia-northeast1
    - australia-southeast1

recipes:
  - provider: aws
    recipe: aws_db_instance
    offer: .cache/rds.json
    fetch: { service_code: AmazonRDS }
  - provider: azure
    recipe: azurerm_linux_virtual_machine
    offer: .cache/azure-vm.json
    fetch: { service_name: "Virtual Machines" }
  - provider: azure
    recipe: azurerm_windows_virtual_machine
    offer: .cache/azure-vm.json
    fetch: { service_name: "Virtual Machines" }
  - provider: azure
    recipe: azurerm_public_ip
    offer: .cache/azure-vnet.json
    fetch: { service_name: "Virtual Network" }
  - provider: azure
    recipe: azurerm_kubernetes_cluster
    offer: .cache/azure-aks.json
    fetch: { service_name: "Azure Kubernetes Service" }
  - provider: azure
    recipe: azurerm_storage_account
    offer: .cache/azure-storage.json
    fetch: { service_name: "Storage" }
  - provider: azure
    recipe: azurerm_managed_disk
    offer: .cache/azure-storage.json
    fetch: { service_name: "Storage" }
  - provider: azure
    recipe: azurerm_container_registry
    offer: .cache/azure-acr.json
    fetch: { service_name: "Container Registry" }
  - provider: azure
    recipe: azurerm_postgresql_flexible_server
    offer: .cache/azure-pg.json
    fetch: { service_name: "Azure Database for PostgreSQL" }
  - provider: gcp
    recipe: google_compute_instance
    offer: .cache/gcp-compute.json
    fetch: { service_id: "6F81-5844-456A" } # Compute Engine
  - provider: gcp
    recipe: google_compute_disk
    offer: .cache/gcp-compute.json
    fetch: { service_id: "6F81-5844-456A" } # Compute Engine
  - provider: gcp
    recipe: google_compute_address
    offer: .cache/gcp-compute.json
    fetch: { service_id: "6F81-5844-456A" } # Compute Engine
  - provider: gcp
    recipe: google_storage_bucket
    offer: .cache/gcp-storage.json
    fetch: { service_id: "95FF-2EF5-5EA1" } # Cloud Storage
  - provider: gcp
    recipe: google_container_cluster
    offer: .cache/gcp-gke.json
    fetch: { service_id: "CCD8-9BF1-090E" } # Kubernetes Engine
  - provider: gcp
    recipe: google_dns_managed_zone
    offer: .cache/gcp-dns.json
    fetch: { service_id: "FA26-5236-B8B5" } # Cloud DNS
  - provider: gcp
    recipe: google_pubsub_topic
    offer: .cache/gcp-pubsub.json
    fetch: { service_id: "A1E8-BE35-7EBC" } # Cloud Pub/Sub
  - provider: gcp
    recipe: google_sql_database_instance
    offer: .cache/gcp-sql.json
    fetch: { service_id: "9662-B51E-5089" } # Cloud SQL
  - provider: aws
    recipe: aws_sqs_queue
    offer: .cache/sqs.json
    fetch: { service_code: AWSQueueService }
  - provider: aws
    recipe: aws_lambda_function
    offer: .cache/lambda.json
    fetch: { service_code: AWSLambda }
  - provider: aws
    recipe: aws_s3_bucket
    offer: .cache/s3.json
    fetch: { service_code: AmazonS3 }
  - provider: aws
    recipe: aws_dynamodb_table
    offer: .cache/ddb.json
    fetch: { service_code: AmazonDynamoDB }
  # EC2 + EBS come from the ~450 MB-per-region AmazonEC2 offer, so their fetch
  # blocks carry `families` (+ `keep_attrs` for the huge Compute Instance family)
  # — fetch_offers stream-filters each region's offer with ijson to a small
  # compact subset at flat RAM, then merges all regions. The per-region download
  # is cached within a run, so each region's 450 MB is pulled once and reused
  # across every EC2-derived recipe.
  - provider: aws
    recipe: aws_instance
    offer: .cache/ec2-instance.json
    fetch:
      service_code: AmazonEC2
      families: [Compute Instance]
      keep_attrs:
        operatingSystem: [Linux, Windows]
        tenancy: [Shared]
        capacitystatus: [Used]
        marketoption: [OnDemand]
        preInstalledSw: ["NA"]
        licenseModel: ["No License required"]
  - provider: aws
    recipe: aws_ebs_volume
    offer: .cache/ec2-ebs.json
    fetch:
      service_code: AmazonEC2
      families: [Storage, System Operation]
  - provider: aws
    recipe: aws_nat_gateway
    offer: .cache/ec2-nat.json
    fetch:
      service_code: AmazonEC2
      families: [NAT Gateway]
  - provider: aws
    recipe: aws_eip
    offer: .cache/vpc.json
    fetch: { service_code: AmazonVPC }
  - provider: aws
    recipe: aws_lb
    offer: .cache/ec2-lb.json
    fetch:
      service_code: AmazonEC2
      families: [Load Balancer-Application, Load Balancer-Network]
  - provider: aws
    recipe: aws_elb
    offer: .cache/ec2-elb.json
    fetch:
      service_code: AmazonEC2
      families: [Load Balancer]
  - provider: aws
    recipe: aws_ebs_snapshot
    offer: .cache/ec2-snapshot.json
    fetch:
      service_code: AmazonEC2
      families: [Storage Snapshot]
  - provider: aws
    recipe: aws_efs_file_system
    offer: .cache/efs.json
    fetch: { service_code: AmazonEFS }
  - provider: aws
    recipe: aws_rds_cluster_instance
    offer: .cache/rds.json
    fetch: { service_code: AmazonRDS }
  - provider: aws
    recipe: aws_kms_key
    offer: .cache/kms.json
    fetch: { service_code: awskms }
  - provider: aws
    recipe: aws_secretsmanager_secret
    offer: .cache/secretsmanager.json
    fetch: { service_code: AWSSecretsManager }
  - provider: aws
    recipe: aws_sns_topic
    offer: .cache/sns.json
    fetch: { service_code: AmazonSNS }
  - provider: aws
    recipe: aws_api_gateway_rest_api
    offer: .cache/apigw.json
    fetch: { service_code: AmazonApiGateway }
  - provider: aws
    recipe: aws_apigatewayv2_api
    offer: .cache/apigw.json
    fetch: { service_code: AmazonApiGateway }
  - provider: aws
    recipe: aws_elasticache_cluster
    offer: .cache/elasticache.json
    fetch: { service_code: AmazonElastiCache }
  - provider: aws
    recipe: aws_kinesis_stream
    offer: .cache/kinesis.json
    fetch: { service_code: AmazonKinesis }
  - provider: aws
    recipe: aws_vpc_endpoint
    offer: .cache/vpc.json
    fetch: { service_code: AmazonVPC }
  - provider: aws
    recipe: aws_route53_zone
    offer: .cache/route53.json
    fetch: { service_code: AmazonRoute53, global: true }
  - provider: aws
    recipe: aws_cloudfront_distribution
    offer: .cache/cloudfront.json
    fetch: { service_code: AmazonCloudFront, global: true }
  - provider: aws
    recipe: aws_ecr_repository
    offer: .cache/ecr.json
    fetch: { service_code: AmazonECR }

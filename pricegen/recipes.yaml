# The set of recipes the published Terrapod pricesheet includes (#893).
#
# Each entry names a provider, a recipe, the offer file it reads, and a `fetch:`
# block describing how to download that offer from the official cloud pricing
# API. `python -m pricegen.fetch_offers` populates the offers (from the API); the
# `publish` generator then runs every entry through the engine, combines the rows
# into one gzipped-YAML pricesheet, and aggregates the per-recipe drift manifests.
# Locally the offers live in the gitignored `.cache/`; in CI the scheduled
# pricesheet workflow fetches them fresh each run.
recipes:
  - provider: aws
    recipe: aws_db_instance
    offer: .cache/rds-us-east-1.json
    fetch: { service_code: AmazonRDS, region: us-east-1 }
  - provider: azure
    recipe: azurerm_linux_virtual_machine
    offer: .cache/azure-vm-eastus.json
    fetch: { service_name: "Virtual Machines", region: eastus }
  - provider: gcp
    recipe: google_compute_instance
    offer: .cache/gcp-compute.json
    fetch: { service_id: "6F81-5844-456A" } # Compute Engine
  - provider: aws
    recipe: aws_sqs_queue
    offer: .cache/sqs-us-east-1.json
    fetch: { service_code: AWSQueueService, region: us-east-1 }
  - provider: aws
    recipe: aws_lambda_function
    offer: .cache/lambda-us-east-1.json
    fetch: { service_code: AWSLambda, region: us-east-1 }
  - provider: aws
    recipe: aws_s3_bucket
    offer: .cache/s3-us-east-1.json
    fetch: { service_code: AmazonS3, region: us-east-1 }
  - provider: aws
    recipe: aws_dynamodb_table
    offer: .cache/ddb-us-east-1.json
    fetch: { service_code: AmazonDynamoDB, region: us-east-1 }
  # EC2 + EBS come from the ~450 MB AmazonEC2 offer, so their fetch blocks carry
  # `families` (+ `keep_attrs` for the huge Compute Instance family) — fetch_offers
  # stream-filters the offer with ijson to a small compact offer at flat RAM, and
  # the shared download is cached so the 450 MB is pulled once for both.
  - provider: aws
    recipe: aws_instance
    offer: .cache/ec2-instance-us-east-1.json
    fetch:
      service_code: AmazonEC2
      region: us-east-1
      families: [Compute Instance]
      keep_attrs:
        operatingSystem: [Linux, Windows]
        tenancy: [Shared]
        capacitystatus: [Used]
        marketoption: [OnDemand]
        preInstalledSw: ["NA"]
        licenseModel: ["No License required"]
  - provider: aws
    recipe: aws_ebs_volume
    offer: .cache/ec2-ebs-us-east-1.json
    fetch:
      service_code: AmazonEC2
      region: us-east-1
      families: [Storage, System Operation]
  - provider: aws
    recipe: aws_nat_gateway
    offer: .cache/ec2-nat-us-east-1.json
    fetch:
      service_code: AmazonEC2
      region: us-east-1
      families: [NAT Gateway]
  - provider: aws
    recipe: aws_eip
    offer: .cache/vpc-us-east-1.json
    fetch: { service_code: AmazonVPC, region: us-east-1 }
  - provider: aws
    recipe: aws_lb
    offer: .cache/ec2-lb-us-east-1.json
    fetch:
      service_code: AmazonEC2
      region: us-east-1
      families: [Load Balancer-Application, Load Balancer-Network]
  - provider: aws
    recipe: aws_elb
    offer: .cache/ec2-elb-us-east-1.json
    fetch:
      service_code: AmazonEC2
      region: us-east-1
      families: [Load Balancer]
  - provider: aws
    recipe: aws_ebs_snapshot
    offer: .cache/ec2-snapshot-us-east-1.json
    fetch:
      service_code: AmazonEC2
      region: us-east-1
      families: [Storage Snapshot]
  - provider: aws
    recipe: aws_efs_file_system
    offer: .cache/efs-us-east-1.json
    fetch: { service_code: AmazonEFS, region: us-east-1 }
  - provider: aws
    recipe: aws_rds_cluster_instance
    offer: .cache/rds-us-east-1.json
    fetch: { service_code: AmazonRDS, region: us-east-1 }
  - provider: aws
    recipe: aws_kms_key
    offer: .cache/kms-us-east-1.json
    fetch: { service_code: awskms, region: us-east-1 }
  - provider: aws
    recipe: aws_secretsmanager_secret
    offer: .cache/secretsmanager-us-east-1.json
    fetch: { service_code: AWSSecretsManager, region: us-east-1 }
  - provider: aws
    recipe: aws_sns_topic
    offer: .cache/sns-us-east-1.json
    fetch: { service_code: AmazonSNS, region: us-east-1 }

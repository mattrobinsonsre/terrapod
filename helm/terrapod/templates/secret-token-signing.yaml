{{- /*
A generated token signing key, for FRESH INSTALLS ONLY (GHSA-hc47-q72v-4vcm).

The key signs four stateless token families — runner tokens, run-task callback
tokens, download tickets and Slack link tokens. Without one it is derived from
`sha256(database_url)`, so anyone who learns the database URL can mint all four.
A database URL is the wrong material for this: it is a credential for another
system, handed to every client of that database, to backup and migration jobs,
and to a DBA who has no business forging platform tokens.

**Generated on install, never on upgrade, and that asymmetry is the whole point.**
A new key invalidates every token already in flight, and those tokens are what
running plans and applies authenticate with — so generating one during an upgrade
would kill live runs. A fresh install has nothing in flight, so there is nothing
to invalidate and no reason to ship it weak.

So:

  install, no key configured   -> generate, and the fallback is never used
  upgrade, secret already here -> reuse it verbatim
  upgrade, no secret           -> emit nothing; the API keeps its existing
                                  derivation and warns at startup

The last case is the one to be careful about. It looks like somewhere to be
helpful, and it is exactly where being helpful breaks a running deployment.
Operators upgrading into the fix set `api.config.require_strong_secrets` once
they have supplied a key of their own.

An operator-supplied `api.tokenSigningKey.existingSecret` always wins: this
template does not render when one is named.
*/ -}}
{{- if not .Values.api.tokenSigningKey.existingSecret }}
{{- $name := printf "%s-token-signing" (include "terrapod.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := "" }}
{{- if and $existing $existing.data (hasKey $existing.data "token_signing_key") }}
{{- $key = index $existing.data "token_signing_key" | b64dec }}
{{- else if .Release.IsInstall }}
{{- $key = randAlphaNum 43 }}
{{- end }}
{{- if $key }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "terrapod.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    # Kept across upgrades on purpose: deleting it would rotate the key and
    # invalidate every token in flight.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  token_signing_key: {{ $key | quote }}
{{- end }}
{{- end }}

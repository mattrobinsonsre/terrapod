{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "terrapod.fullname" . }}-runner
  namespace: {{ include "terrapod.runnerNamespace" . }}
  labels:
    {{- include "terrapod.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: terrapod-runner
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # API server (presigned URLs, status reporting).
    #
    # `namespaceSelector: {}` is every namespace, and that breadth is
    # deliberate rather than an oversight. Runner Jobs are in their own
    # namespace, so the API is never a same-namespace peer; and a listener-only
    # release reaches an API that belongs to a different release in a different
    # namespace entirely. Pinning this to the release namespace would deny that
    # topology, while narrowing it to the runner namespace would deny every
    # topology. The peer is still scoped by the two API pod labels, so this is
    # "an api pod of a terrapod release", not "anything".
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "terrapod.name" . }}
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 8000
    # HTTPS (cloud provider APIs, provider downloads)
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Explicitly deny Postgres and Redis access from runners
    # (handled by the absence of those ports in the egress rules above)
{{- end }}

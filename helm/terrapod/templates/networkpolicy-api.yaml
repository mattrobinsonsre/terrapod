{{- if and .Values.networkPolicies.enabled (ne .Values.api.enabled false) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "terrapod.fullname" . }}-api
  labels:
    {{- include "terrapod.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "terrapod.name" . }}
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from web frontend, listener, and runner pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "terrapod.name" . }}
              app.kubernetes.io/component: web
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "terrapod.name" . }}
              app.kubernetes.io/component: listener
        {{- if include "terrapod.runnerNamespaceIsSeparate" . }}
        # Runner Jobs are in a namespace of their own (GHSA-p8xx-7rwg-9f72).
        # A bare podSelector matches only pods in THIS namespace, so without
        # the namespaceSelector this rule silently denies every run's calls to
        # the API -- in the separated topology we recommend. The two selectors
        # are one peer, so they AND: pods carrying the runner label, in that
        # namespace, and nothing else. `kubernetes.io/metadata.name` is set on
        # every Namespace by the API server, so it needs nothing of ours.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "terrapod.runnerNamespace" . }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: terrapod-runner
        {{- else }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: terrapod-runner
        {{- end }}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # PostgreSQL
    - to: []
      ports:
        - protocol: TCP
          port: 5432
    # Redis
    - to: []
      ports:
        - protocol: TCP
          port: 6379
    # HTTPS (VCS providers, OIDC issuers, upstream registries)
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}

{{- /*
The listener's join token, when supplied in values (GHSA-93m3-v3h4-4qvw).

`listener.joinToken` was rendered as a literal env value on the listener
Deployment, so anyone with `get` on Deployments in the namespace -- or running
`helm get values` -- read it. A join token lets a listener register itself in the
pool, and a listener in the pool claims runs and receives every variable those
runs resolve, including the sensitive ones. It is one of the most valuable
credentials in the deployment and it was sitting in a Deployment spec.

It now reaches the pod by `secretKeyRef`. An operator already using
`listener.existingSecret` is unaffected: this does not render then, and that
remains the recommended path because a token supplied in values still passes
through the release's own stored values.

**NOT a hook, unlike the sibling bootstrap and database-URL Secrets.** Its only
consumer is an ordinary Deployment, and Helm's install order places Secret well
before Deployment, so a plain resource is correct here -- and better: it is
tracked in the release manifest, shows up in a `helm diff`, and is removed by
`helm uninstall`.

Gated on `listener.enabled`, matching deployment-listener.yaml. An API-only
release has no listener to join a pool and must not render a token for one --
and, pointed at a namespace a listener-only release also targets, two releases
would each declare this object.
*/ -}}
{{- if and .Values.listener.enabled .Values.listener.joinToken (not .Values.listener.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "terrapod.listener.joinTokenSecretName" . }}
  labels:
    {{- include "terrapod.labels" . | nindent 4 }}
    app.kubernetes.io/component: listener
type: Opaque
stringData:
  join_token: {{ .Values.listener.joinToken | quote }}
{{- end }}

{{- if ne .Values.api.enabled false }}
{{- if and .Values.bootstrap (ne .Values.bootstrap.enabled false) }}
{{- if or (and .Values.bootstrap.adminEmail .Values.bootstrap.adminPassword) .Values.bootstrap.existingSecret }}
{{- $dbAuthMode := (.Values.api.config.database).auth_mode | default "password" }}
{{- $dbIam := or (eq $dbAuthMode "aws_iam") (eq $dbAuthMode "gcp_iam") (eq $dbAuthMode "azure_ad") }}
{{- $dbCa := or .Values.api.databaseCA.inline .Values.api.databaseCA.existingConfigMap }}
{{/*
  Agent pools to seed (#1411). A join token is a credential, so it reaches the
  Job by `secretKeyRef` and never appears in the Job spec — the same channel the
  admin password uses, and what the config contract asks for. Names are not
  secret and are passed as plain values, indexed to pair with their token.
*/}}
{{- if and .Values.bootstrap.pools .Values.bootstrap.poolName }}
{{- fail "bootstrap: set either `pools` or the single-pool `poolName`, not both. Silently ignoring one is how a pool goes missing." }}
{{- end }}
{{- $pools := .Values.bootstrap.pools | default list }}
{{- if and (not $pools) .Values.bootstrap.poolName .Values.bootstrap.poolTokenExistingSecret }}
{{/* The single-pool form, Secret-backed: the same path as a one-element list. */}}
{{- $pools = list (dict "name" .Values.bootstrap.poolName "existingSecret" .Values.bootstrap.poolTokenExistingSecret "tokenKey" .Values.bootstrap.poolTokenKey) }}
{{- end }}
{{- range $i, $p := $pools }}
{{- if not $p.name }}{{ fail (printf "bootstrap.pools[%d] has no name" $i) }}{{ end }}
{{- if not $p.existingSecret }}{{ fail (printf "bootstrap.pools[%d] (%s) has no existingSecret — a join token must come from a Secret, never from values" $i $p.name) }}{{ end }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "terrapod.fullname" . }}-bootstrap-{{ .Release.Revision }}
  labels:
    {{- include "terrapod.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
  annotations:
    # Hook phase/weight are configurable, defaulting to the historical
    # production behavior (post-install, weight 10) so production renders
    # IDENTICALLY unless explicitly overridden. The eval profile sets
    # `bootstrap.hook: "pre-install,pre-upgrade"` + `hookWeight: "-3"` so the
    # admin user AND the bootstrap-created agent pool exist BEFORE the main
    # resources roll out: with the runner listener enabled, the listener's
    # readiness probe only passes once it has JOINED the pool, so a post-install
    # pool would make `helm --wait` block on the listener (waiting for a pool
    # that doesn't exist yet) and deadlock. The bootstrap is DB-direct (needs
    # only the migrated schema at weight -5) and idempotent (skips an existing
    # admin/pool — never resets a changed password), so running it pre-install
    # at weight -3 is safe for profiles that opt in.
    "helm.sh/hook": {{ .Values.bootstrap.hook | default "post-install" | quote }}
    "helm.sh/hook-weight": {{ .Values.bootstrap.hookWeight | default "10" | quote }}
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "terrapod.labels" . | nindent 8 }}
        app.kubernetes.io/component: bootstrap
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $dbIam }}
      # Cloud-IAM DB auth: run under the API's IRSA/workload-identity SA so the
      # Job can mint a DB token (the cloud identity webhook projects its own token).
      serviceAccountName: {{ include "terrapod.serviceAccountName" . }}
      {{- end }}
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      containers:
        - name: bootstrap
          image: {{ include "terrapod.api.image" . }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command:
            - python
            - -m
            - terrapod.cli.bootstrap
          env:
            {{- $pgSecret := include "terrapod.postgresql.secretName" . }}
            {{- if $pgSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $pgSecret }}
                  key: {{ include "terrapod.postgresql.secretKey" . }}
            {{- else if .Values.postgresql.url }}
            - name: DATABASE_URL
              value: {{ .Values.postgresql.url | quote }}
            {{- end }}
            {{- if .Values.bootstrap.existingSecret }}
            - name: TERRAPOD_BOOTSTRAP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bootstrap.existingSecret }}
                  key: {{ .Values.bootstrap.emailKey | default "email" }}
            - name: TERRAPOD_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bootstrap.existingSecret }}
                  key: {{ .Values.bootstrap.passwordKey | default "password" }}
            {{- else }}
            - name: TERRAPOD_BOOTSTRAP_ADMIN_EMAIL
              value: {{ .Values.bootstrap.adminEmail | quote }}
            - name: TERRAPOD_BOOTSTRAP_ADMIN_PASSWORD
              value: {{ .Values.bootstrap.adminPassword | quote }}
            {{- end }}
            {{- if $pools }}
            {{/* The count is declared so a hand-written Job cannot leave a gap
                 in the indices and silently drop a pool; the CLI insists on
                 finding exactly this many. */}}
            - name: TERRAPOD_BOOTSTRAP_POOL_COUNT
              value: {{ len $pools | quote }}
            {{- range $i, $p := $pools }}
            - name: {{ printf "TERRAPOD_BOOTSTRAP_POOL_%d_NAME" $i }}
              value: {{ $p.name | quote }}
            - name: {{ printf "TERRAPOD_BOOTSTRAP_POOL_%d_TOKEN" $i }}
              valueFrom:
                secretKeyRef:
                  name: {{ $p.existingSecret | quote }}
                  key: {{ $p.tokenKey | default "join_token" | quote }}
            {{- end }}
            {{- else }}
            {{- if .Values.bootstrap.poolName }}
            - name: TERRAPOD_BOOTSTRAP_POOL_NAME
              value: {{ .Values.bootstrap.poolName | quote }}
            {{- end }}
            {{- if .Values.bootstrap.poolToken }}
            {{/* Legacy inline token: kept working, but it renders into the Job
                 spec. Prefer `pools` (or poolTokenExistingSecret), which do not. */}}
            - name: TERRAPOD_BOOTSTRAP_POOL_TOKEN
              value: {{ .Values.bootstrap.poolToken | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.bootstrap.sampleWorkspace }}
            - name: TERRAPOD_BOOTSTRAP_SAMPLE_WORKSPACE
              value: "true"
            {{- if .Values.bootstrap.sampleWorkspaceName }}
            - name: TERRAPOD_BOOTSTRAP_SAMPLE_WORKSPACE_NAME
              value: {{ .Values.bootstrap.sampleWorkspaceName | quote }}
            {{- end }}
            {{- end }}
            {{- if $dbIam }}
            - name: TP_DB_AUTH_MODE
              value: {{ $dbAuthMode | quote }}
            - name: TP_DB_AWS_IAM_REGION
              value: {{ (.Values.api.config.database).aws_iam_region | default "" | quote }}
            - name: TP_DB_SSL_MODE
              value: {{ (.Values.api.config.database).ssl_mode | default "" | quote }}
            - name: TP_DB_SSL_ROOT_CERT
              {{- if $dbCa }}
              value: {{ printf "/etc/terrapod/db-ca/%s" (.Values.api.databaseCA.key | default "ca.pem") | quote }}
              {{- else }}
              value: {{ (.Values.api.config.database).ssl_root_cert | default "" | quote }}
              {{- end }}
            {{- end }}
          {{- if and $dbIam $dbCa }}
          volumeMounts:
            - name: database-ca
              mountPath: /etc/terrapod/db-ca
              readOnly: true
          {{- end }}
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            {{- toYaml .Values.api.containerSecurityContext | nindent 12 }}
      {{- if and $dbIam $dbCa }}
      volumes:
        - name: database-ca
          configMap:
            name: {{ .Values.api.databaseCA.existingConfigMap | default (printf "%s-database-ca" (include "terrapod.fullname" .)) }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}

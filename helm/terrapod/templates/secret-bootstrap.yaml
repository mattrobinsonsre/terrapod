{{- /*
Bootstrap credentials supplied in values (GHSA-93m3-v3h4-4qvw).

The initial admin password and the legacy single-pool join token were rendered
into the bootstrap Job's env as literals. A Job spec is readable by anyone with
`get` on Jobs in the namespace, and the Job survives in the API server until its
`ttlSecondsAfterFinished` elapses -- so "it is only a one-shot Job" does not
bound who sees them. Both now reach the Job by `secretKeyRef`.

The admin password is the account that bootstraps a fresh install, and the join
token lets a listener join a pool and claim every run's variables, so neither
belongs in a manifest.

`bootstrap.adminEmail` and the pool NAMES stay plain values: they are
identifiers, not credentials, and `bootstrap.pools[].existingSecret` already
refuses to take a token from values at all -- which is the better path and the
one the docs point at. This covers the two forms that still accept one.

**A hook, at weight -25.** The bootstrap Job's own hook is configurable
(`post-install` weight 10 by default, `pre-install` weight -3 on the eval
profile), so this has to precede both; a pre-install hook resource is created
before ordinary resources and persists, so it is present for either. See
secret-database-url.yaml for the delete-policy reasoning, which is the same.
*/ -}}
{{- if ne .Values.api.enabled false }}
{{- if and .Values.bootstrap (ne .Values.bootstrap.enabled false) }}
{{- $password := "" }}
{{- if not .Values.bootstrap.existingSecret }}
{{- $password = .Values.bootstrap.adminPassword | default "" }}
{{- end }}
{{- $poolToken := .Values.bootstrap.poolToken | default "" }}
{{- if or $password $poolToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-bootstrap" (include "terrapod.fullname" .) }}
  labels:
    {{- include "terrapod.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-25"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{- if $password }}
  password: {{ $password | quote }}
  {{- end }}
  {{- if $poolToken }}
  pool_token: {{ $poolToken | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "terrapod.fullname" . }}-web
  labels:
    {{- include "terrapod.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.web.strategy.maxSurge }}
      maxUnavailable: {{ .Values.web.strategy.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "terrapod.web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.api.config.metrics.enabled .Values.web.podAnnotations }}
      annotations:
        {{- if .Values.api.config.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.web.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "terrapod.web.selectorLabels" . | nindent 8 }}
        {{- with .Values.web.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "terrapod.webServiceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.web.terminationGracePeriodSeconds }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if .Values.web.storageRewrite.enabled }}
        # The storage rewrite's destination is baked into
        # `.next/routes-manifest.json` at build time (a runtime `API_URL` in
        # next.config.js is ignored -- measured), so it ships as an unresolvable
        # placeholder and has to be pointed at the API before Next reads it.
        #
        # It happens HERE, in an init container writing into an emptyDir the web
        # container mounts over that one file, because `readOnlyRootFilesystem`
        # is true on the web container and patching in place is a write. Doing
        # it this way keeps that posture AND keeps the refusal: `--emit` exits
        # non-zero if the placeholder count is not what next.config.js declares,
        # so the pod never serves chunked responses to a client that requires a
        # Content-Length. See #2639.
        - name: storage-rewrite
          image: {{ include "terrapod.web.image" . }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          command:
            - node
            - server-entry.mjs
            - --emit
            - /storage-rewrite/routes-manifest.json
          env:
            - name: API_URL
              value: {{ include "terrapod.web.apiUrl" . | quote }}
          volumeMounts:
            - name: storage-rewrite
              mountPath: /storage-rewrite
          resources:
            {{- toYaml .Values.web.initResources | nindent 12 }}
          {{- with .Values.web.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- with .Values.web.extraInitContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: web
          image: {{ include "terrapod.web.image" . }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            {{- if .Values.api.config.metrics.enabled }}
            - name: metrics
              containerPort: 9091
              protocol: TCP
            {{- end }}
          env:
            - name: API_URL
              value: {{ include "terrapod.web.apiUrl" . | quote }}
            # HSTS (Strict-Transport-Security). When non-empty, the
            # web container sends this value on every response. Default
            # is `max-age=63072000` (2 years, no includeSubDomains, no
            # preload) — see values.yaml `web.hsts` for the rationale.
            # Set to "" to disable.
            - name: HSTS
              value: {{ .Values.web.hsts.value | quote }}
            {{- include "terrapod.proxyEnv" . | nindent 12 }}
            {{- include "terrapod.caBundle.envNode" . | nindent 12 }}
            {{- with .Values.web.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.web.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: {{ hasKey .Values.web.startupProbe "failureThreshold" | ternary .Values.web.startupProbe.failureThreshold 30 }}
            periodSeconds: {{ hasKey .Values.web.startupProbe "periodSeconds" | ternary .Values.web.startupProbe.periodSeconds 2 }}
            timeoutSeconds: {{ hasKey .Values.web.startupProbe "timeoutSeconds" | ternary .Values.web.startupProbe.timeoutSeconds 1 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ hasKey .Values.web.livenessProbe "initialDelaySeconds" | ternary .Values.web.livenessProbe.initialDelaySeconds 10 }}
            periodSeconds: {{ hasKey .Values.web.livenessProbe "periodSeconds" | ternary .Values.web.livenessProbe.periodSeconds 10 }}
            timeoutSeconds: {{ hasKey .Values.web.livenessProbe "timeoutSeconds" | ternary .Values.web.livenessProbe.timeoutSeconds 1 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ hasKey .Values.web.readinessProbe "initialDelaySeconds" | ternary .Values.web.readinessProbe.initialDelaySeconds 5 }}
            periodSeconds: {{ hasKey .Values.web.readinessProbe "periodSeconds" | ternary .Values.web.readinessProbe.periodSeconds 5 }}
            timeoutSeconds: {{ hasKey .Values.web.readinessProbe "timeoutSeconds" | ternary .Values.web.readinessProbe.timeoutSeconds 1 }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.web.preStopSleepSeconds | default 30 }}"]
          volumeMounts:
            {{- if .Values.web.storageRewrite.enabled }}
            # One file, via subPath, so the rest of `.next` stays exactly as the
            # image built it -- mounting the whole directory would mask the build.
            # readOnly because the web container only ever reads it; the init
            # container is the one that writes.
            - name: storage-rewrite
              mountPath: /app/.next/routes-manifest.json
              subPath: routes-manifest.json
              readOnly: true
            {{- end }}
            {{- include "terrapod.caBundle.volumeMountsNode" . | nindent 12 }}
            {{- with .Values.web.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          {{- with .Values.web.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- with .Values.web.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        {{- if .Values.web.storageRewrite.enabled }}
        # One routes manifest, written once by the init container and read by
        # Next at startup. Measured at ~15 KiB in the shipped image, so 16Mi is
        # about a thousandfold headroom and deliberately NOT a value: a knob
        # here would be surface nobody turns. If a future Next makes the
        # manifest genuinely large, raise this -- the init container fails
        # loudly on a full volume rather than starting a half-written one.
        - name: storage-rewrite
          emptyDir:
            sizeLimit: 16Mi
        {{- end }}
        {{- include "terrapod.caBundle.volumesNode" . | nindent 8 }}
        {{- with .Values.web.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "terrapod.podAntiAffinity" (dict "enabled" .Values.web.podAntiAffinity.enabled "affinity" .Values.web.affinity "labels" (include "terrapod.web.selectorLabels" .)) }}
      {{- $pc := include "terrapod.controlPlanePriorityClassName" (dict "explicit" .Values.web.priorityClassName "root" .) }}
      {{- if $pc }}
      priorityClassName: {{ $pc | quote }}
      {{- end }}
      {{- with .Values.web.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

{{- /*
The database URL, when an operator supplies one in values (GHSA-93m3-v3h4-4qvw).

A DSN carries the database password. Rendered into Deployment and Job env as a
literal it is readable by anyone with `get` on Deployments or Jobs in the
namespace, by anyone who can run `helm get values`, and by whatever stores the
rendered manifest -- a GitOps repository, a CI log, a Terraform state file. None
of those are the audience for a database credential.

It reaches every consumer by `secretKeyRef` instead, through
`terrapod.postgresql.secretName`, which is the channel `postgresql.existingSecret`
has always used. An operator who already supplies their own Secret is unaffected:
this does not render when `existingSecret` is set, and nor does it when the chart
deploys its own Postgres (that Secret is rendered by embedded-postgresql.yaml).

**A hook, and it has to be.** The earliest consumer is the migrations Job, a
`pre-install,pre-upgrade` hook at weight -5. Hook resources are created before
any ordinary resource, so a plain Secret would not exist yet and the Job would
fail to start. Weight -25 puts this before the embedded datastores at -20 as
well, so ordering holds however the two are combined. The same arrangement
already carries the embedded Postgres Secret.

`before-hook-creation` is the delete policy because it is also Helm's default for
a hook, and because this object is a pure function of its values -- deleting and
recreating it on each upgrade is how an edited `postgresql.url` takes effect.
Running pods are unaffected: env is read once at container start.

Gated on `api.enabled`, matching every consumer (the API Deployment and the
migrations, preflight, bootstrap and backup Jobs are all api-side). A
listener-only release holds no database credential and must not render one.
*/ -}}
{{- if and (ne .Values.api.enabled false) .Values.postgresql.url (not .Values.postgresql.existingSecret) (not .Values.postgresql.deploy) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-database-url" (include "terrapod.fullname" .) }}
  labels:
    {{- include "terrapod.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-25"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  url: {{ .Values.postgresql.url | quote }}
{{- end }}

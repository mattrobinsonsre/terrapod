{{- if and .Values.listener.enabled .Values.runners.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "terrapod.runnerServiceAccountName" . }}
  namespace: {{ include "terrapod.runnerNamespace" . }}
  labels:
    {{- include "terrapod.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
  {{- with .Values.runners.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.listener.enabled (.Values.runners.applyServiceAccount | default dict).create }}
---
# The APPLY phase's account (#2189). Its own annotations block is the whole
# point: annotations are how a ServiceAccount becomes a cloud principal, so an
# apply account without them would be a differently-named account with no cloud
# identity -- which would not weaken the plan, it would break the apply.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "terrapod.runnerApplyServiceAccountName" . }}
  namespace: {{ include "terrapod.runnerNamespace" . }}
  labels:
    {{- include "terrapod.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
  {{- with (.Values.runners.applyServiceAccount | default dict).annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.listener.enabled (.Values.runners.configureServiceAccount | default dict).create }}
---
# The CONFIGURE phase's account (#2190). Its own annotations block for the same
# reason as the apply one: annotations are how a ServiceAccount becomes a cloud
# principal, and a configure account without them has no cloud identity at all
# -- which does not weaken anything, it breaks the configure.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "terrapod.runnerConfigureServiceAccountName" . }}
  namespace: {{ include "terrapod.runnerNamespace" . }}
  labels:
    {{- include "terrapod.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
  {{- with (.Values.runners.configureServiceAccount | default dict).annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

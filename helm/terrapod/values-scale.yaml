# values-scale.yaml — HORIZONTAL-SCALE / HA PROFILE for local load testing (#1056)
#
# Layered ON TOP OF values.yaml + values-local.yaml (it does not stand alone):
#
#   tilt up -- --scale                         # the Tilt dev loop, scaled
#   helm template ./helm/terrapod \
#     -f helm/terrapod/values.yaml \
#     -f helm/terrapod/values-local.yaml \
#     -f helm/terrapod/values-scale.yaml       # render check
#
# Purpose: turn on API/web/listener autoscaling and give the embedded Postgres +
# Redis real headroom, so a load test (see loadtest/ + docs/scalability.md)
# exercises Terrapod's control-plane scaling — not an artificially throttled
# datastore. This is a DEV/EVAL profile for a single-node cluster; it is NOT a
# production topology (production runs a managed Postgres/Redis and sizes the
# API HPA to the real node pool).
#
# Sizing target: an 8-vCPU / 16 GiB single-node cluster. requests are kept low
# so several API replicas schedule alongside the datastores and a handful of
# runner Jobs; limits allow bursting.

# Single-node escape hatch: allow multiple API replicas on the filesystem PVC
# (RWO, shared because every replica lands on the one node). Production uses a
# cloud object-storage backend instead — never set this true there.
storage:
  filesystem:
    allowMultiReplica: true

api:
  # Horizontal scaling is the headline: multiple stateless replicas behind the
  # Service, no leader election. On a single-node cluster the filesystem PVC is
  # ReadWriteOnce = one node, and all replicas land on that one node, so they
  # share it fine. (In production, enable a cloud object-storage backend.)
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 60
  resources:
    requests:
      cpu: 300m       # low so up to 6 replicas fit next to PG/Redis/Jobs
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  config:
    log_level: info
    # Rate limiting OFF for load testing: the default authenticated cap is
    # 1000 req/min (~16.7 req/s), which would throttle the benchmark to the
    # limiter rather than measuring real API capacity. This profile is a test
    # rig, not production — production keeps the limiter on.
    rate_limit:
      enabled: false
    database:
      # Each replica keeps its own pool; sized so maxReplicas × (pool+overflow)
      # stays comfortably under the embedded PG max_connections raised below
      # (6 × 30 = 180 < 300).
      pool_size: 15
      max_overflow: 15
      pool_pre_ping: true

# The listener admits more concurrent run launches so the run queue can actually
# drain during the flood test (still ultimately bounded by node CPU + the
# per-workspace resource requests). Its own HPA is on too — multiple listeners
# in a pool compete for queued runs via SELECT … FOR UPDATE SKIP LOCKED (no
# leader election), so scaling listeners scales Job-launch throughput.
listener:
  maxConcurrent: 12
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3

# The web/BFF tier is stateless too; a small HPA demonstrates it scales with the
# API. (It is not the scaling focus — the API + scheduler are.)
web:
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3

# Embedded Postgres — sized so it is NOT the bottleneck (the user's explicit
# ask). More connections for the replica pools, bigger shared_buffers, and real
# CPU/memory. requests stay modest (reservations) with generous limits to burst.
postgresql:
  deploy: true
  embedded:
    extraArgs:
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "max_worker_processes=8"
    persistence:
      size: 4Gi
    resources:
      requests:
        cpu: "1"
        memory: 768Mi
      limits:
        cpu: "3"
        memory: 2Gi

# Embedded Redis — headroom for sessions, the distributed scheduler, SSE
# channels, and job-status keys under load.
redis:
  deploy: true
  embedded:
    extraArgs:
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    resources:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 768Mi

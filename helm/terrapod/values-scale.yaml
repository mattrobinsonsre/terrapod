# values-scale.yaml — HORIZONTAL-SCALE / HA PROFILE for local load testing (#1056)
#
# Layered ON TOP OF values.yaml + values-local.yaml (it does not stand alone):
#
#   tilt up -- --scale                         # the Tilt dev loop, scaled
#   helm template ./helm/terrapod \
#     -f helm/terrapod/values.yaml \
#     -f helm/terrapod/values-local.yaml \
#     -f helm/terrapod/values-scale.yaml       # render check
#
# Purpose: turn on API/web/listener autoscaling and give the embedded Postgres +
# Redis real headroom, so a load test (see loadtest/ + docs/scalability.md)
# exercises Terrapod's control-plane scaling — not an artificially throttled
# datastore. This is a DEV/EVAL profile for a single-node cluster; it is NOT a
# production topology (production runs a managed Postgres/Redis and sizes the
# API HPA to the real node pool).
#
# Sizing target: an 8-vCPU / 16 GiB single-node cluster. requests are kept low
# so several API replicas schedule alongside the datastores and a handful of
# runner Jobs; limits allow bursting.

# Single-node escape hatch: allow multiple API replicas on the filesystem PVC
# (RWO, shared because every replica lands on the one node). Production uses a
# cloud object-storage backend instead — never set this true there.
storage:
  filesystem:
    allowMultiReplica: true

api:
  # Horizontal scaling is the headline: multiple stateless replicas behind the
  # Service, no leader election. On a single-node cluster the filesystem PVC is
  # ReadWriteOnce = one node, and all replicas land on that one node, so they
  # share it fine. (In production, enable a cloud object-storage backend.)
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 60
  resources:
    requests:
      cpu: 300m       # low so up to 6 replicas fit next to PG/Redis/Jobs
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  config:
    log_level: info
    # Rate limiting OFF for load testing: the default authenticated cap is
    # 1000 req/min (~16.7 req/s), which would throttle the benchmark to the
    # limiter rather than measuring real API capacity. This profile is a test
    # rig, not production — production keeps the limiter on.
    rate_limit:
      enabled: false
    database:
      # Each replica keeps its own pool; sized so maxReplicas × (pool+overflow)
      # stays comfortably under the embedded PG max_connections raised below
      # (6 × 30 = 180 < 300).
      pool_size: 15
      max_overflow: 15
      pool_pre_ping: true

# PriorityClasses so the ephemeral runner Jobs rank BELOW every long-lived
# deployment pod. This is a cluster SCHEDULING choice (see the priority-class note
# in docs/scalability.md's troubleshooting section), and it's worth turning on
# when runner Jobs share a cluster/node with the control plane: it makes the
# scheduler place control-plane replicas AHEAD of runner Jobs and reap runner Jobs
# FIRST under node MEMORY pressure. #751's chart mechanism creates the classes and
# auto-wires api/listener/web to the higher one; runner.value is NEGATIVE here so
# runner Jobs sit under even the un-classed embedded Postgres/Redis + metrics-server.
#
# IMPORTANT (measured, do not overclaim): PriorityClass governs scheduling /
# preemption / eviction — it does NOT change runtime CPU CFS shares. So it does
# NOT, on its own, stop a burst of `tofu` processes from CPU-starving a CO-LOCATED
# control plane. In the load test, at ~48 concurrent Jobs the node hit ~98% CPU and
# the (co-located, CPU-throttled) listener's liveness probe still timed out →
# SIGKILL/restart → in-flight runs re-queued, EVEN WITH these priority classes. The
# genuine fixes for CPU starvation are (1) TOPOLOGY — run runner Jobs on their own
# nodes, the standard production layout, where there's no contention to begin with;
# and (2) not over-subscribing the node (keep concurrency within its CPU). Priority
# classes remain the right call for the memory/scheduling axis; they're just not a
# CPU-starvation fix.
priorityClasses:
  create: true
  runner:
    enabled: true
    value: -10000

# maxConcurrent is the per-listener launch cap; with the listener HPA below it
# multiplies across replicas. It's kept moderate — the goal is NOT to maximise
# concurrent Jobs on one node, but to keep the control plane healthy under load
# while excess runner Jobs back up (Pending/queued) as correct backpressure.
listener:
  maxConcurrent: 24
  # ALL control-plane tiers (api, listener, web) autoscale AND outrank runner Jobs
  # (priorityClasses above). Under load the listener scales OUT — more aggregate CPU
  # share + redundancy — so a single CPU-starved replica can't take the tier down and
  # re-queue everything (that was the failure when it was pinned to 1 replica).
  # minReplicas: 2 gives baseline redundancy; on a real multi-node deployment the
  # added listeners land on fresh runner-node compute and add real launch throughput.
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4

# The web/BFF tier is stateless too; a small HPA demonstrates it scales with the
# API. (It is not the scaling focus — the API + scheduler are.)
web:
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
  # Scale mode runs the PRODUCTION web image (standalone `node server.js`), which
  # has the built `.next` baked in. values-local mounts a dev `next-cache`
  # emptyDir at /app/.next (for `next dev` hot reload) — that empty dir would
  # SHADOW the production build and make the standalone server report "no
  # production build". Null the dev volumes out so the real /app/.next is used.
  extraVolumeMounts: []
  extraVolumes: []

# Embedded Postgres — sized so it is NOT the bottleneck (the user's explicit
# ask). More connections for the replica pools, bigger shared_buffers, and real
# CPU/memory. requests stay modest (reservations) with generous limits to burst.
postgresql:
  deploy: true
  embedded:
    extraArgs:
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "max_worker_processes=8"
    persistence:
      size: 4Gi
    resources:
      requests:
        cpu: "1"
        memory: 768Mi
      limits:
        cpu: "3"
        memory: 2Gi

# Embedded Redis — headroom for sessions, the distributed scheduler, SSE
# channels, and job-status keys under load.
redis:
  deploy: true
  embedded:
    extraArgs:
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    resources:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 768Mi

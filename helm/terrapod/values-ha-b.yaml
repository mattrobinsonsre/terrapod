# Node B of a local two-node HA pair (#960).
#
# Deployed alongside the Tilt stack (node A, namespace `terrapod`) as an
# ordinary Helm release in its own namespace, with its own Postgres and Redis —
# two nodes means two of everything, which is the point.
#
# The peer link runs over in-cluster Service DNS rather than an ingress. That is
# not a shortcut: `ha.peer.url` must be the peer's DIRECT per-node address, and a
# Service name is exactly that. The shared name resolves to whichever node
# currently leads, which may be this one.
#
# Roles are set explicitly rather than probed. Running a pair on explicit
# leader/follower is a supported mode, not a degraded one, and it lets the
# verification exercise replication without also depending on DNS behaviour it
# cannot control locally. Reversal is exercised by swapping the two values.

nameOverride: ""
fullnameOverride: "terrapod-b"

postgresql:
  deploy: true
redis:
  deploy: true

storage:
  filesystem:
    persistence:
      enabled: true
      size: 1Gi

ingress:
  enabled: false

web:
  enabled: false
# A real execution fleet on each node. Without it the pair can prove that
# settings and artifacts replicate, but not that a RUN survives a cutover —
# which is the part of the gate a two-API-node pair could not reach (#1188).
#
# Per-node fleets: each listener points at its OWN node, so nothing crosses the
# boundary and each side's capacity is exercised while that side leads. The
# shared-fleet topology is exercised separately by re-pointing at the shared
# Service the harness creates.
listener:
  enabled: true
  # Same single-node deadlock the API notes below: the default required
  # anti-affinity stops a rolling update replacing the listener, because the
  # new pod cannot schedule until the old one goes and the old one waits for
  # the new one. It resolves eventually, but it makes every `helm upgrade`
  # here take minutes. A real pair on real nodes leaves it on.
  podAntiAffinity:
    enabled: false
  name: ha-b-listener
  joinToken: "ha-smoke-join-token-b-not-for-real-use"
  image:
    # Built locally by the harness; never pulled.
    repository: terrapod-listener
    tag: local
    pullPolicy: Never

runners:
  image:
    # Same reasoning as the API and migrations images: the pair runs a tag it
    # owns, re-tagged from what Tilt built, so a rebuild in the dev stack cannot
    # leave a runner Job in ErrImageNeverPull. `ha-smoke.sh up` does the
    # re-tagging; `tilt trigger build-runner-image` is what produces the source.
    repository: terrapod-runner
    tag: ha
    pullPolicy: Never

# Pre-install so the pool exists before the listener rolls out — otherwise
# `helm --wait` deadlocks on a listener whose readiness gates on joining a pool
# that does not exist yet. Same reasoning as the eval profile.
bootstrap:
  hook: "pre-install,pre-upgrade"
  hookWeight: "-3"
  adminEmail: admin
  adminPassword: terrapod
  poolName: ha-b-pool
  poolToken: "ha-smoke-join-token-b-not-for-real-use"

api:
  replicas: 1
  # Both nodes of the pair land on the same single-node local cluster, so the
  # default required anti-affinity deadlocks a rolling update: the new replica
  # cannot schedule until the old one goes, and the old one will not go until
  # the new one is ready. The chart documents this case; a real pair on real
  # nodes leaves it on.
  podAntiAffinity:
    enabled: false
  image:
    pullPolicy: Never
  config:
    external_url: "http://terrapod-b-api:8000"
    storage:
      # Node B's own store. The follower copies objects into it; asserting they
      # arrive is the object-store half of the exercise (#1114).
      filesystem:
        base_url: "http://terrapod-b-api:8000"
    # The pair re-joins its fleets repeatedly — every table run flips roles at
    # least twice, and the shared-fleet row deliberately forces a re-join. Two
    # uses (the shipped default) is right for a real install bootstrapping once;
    # here it would exhaust on the second run and report a fleet failure that is
    # really a rig artefact.
    agent_pools:
      default_join_token_max_uses: 200
      default_join_token_ttl_seconds: 604800
    ha:
      role: follower
      node_name: node-b
      peer:
        # Node A's direct address — never the shared name.
        url: "http://terrapod-a-api.terrapod-a.svc.cluster.local:8000"
        client_id: b-to-a
        existingSecret: terrapod-peer-b-to-a
        inbound:
          client_id: a-to-b
          name: "Node A"
          existingSecret: terrapod-peer-a-to-b
      replication:
        enabled: true
        interval_seconds: 5
      blobs:
        mode: copy
        interval_seconds: 30
